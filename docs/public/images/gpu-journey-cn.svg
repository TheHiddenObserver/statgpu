<svg xmlns="http://www.w3.org/2000/svg" width="600" height="924" viewBox="0 0 600 924" lang="zh-Hans" role="img" aria-labelledby="title desc">
  <title id="title">数据的 GPU 之旅</title>
  <desc id="desc">概念流程：CPU 准备数据，数据传至 GPU，在支持时复用 GPU 上的数据进行拟合、预测及重复计算，再返回所需结果。数据传输和启动计算都有开销，值得用足够多的计算工作来摊薄。具体方法还可能在内部额外分配内存或传输数据。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#3f6fca" stroke-width="1.5" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="1" y="1" width="598" height="922" rx="24" fill="#fbfcff" stroke="#d7e1ef"/>
  <g font-family="Inter, Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#203453">
<text x="32" y="54" font-size="32" font-weight="650" fill="#203453" text-anchor="start">数据的 GPU 之旅</text>
<text x="32" y="87" font-size="24" font-weight="400" fill="#51647f" text-anchor="start">计算收益，要考虑整段旅程</text>
<rect x="32" y="116" width="536" height="100" rx="16" fill="#ffffff" stroke="#d7e1ef"/>
<rect x="52" y="136" width="70" height="60" rx="12" fill="#edf3ff" stroke="none"/>
<text x="87" y="176" font-size="22" font-weight="650" fill="#3f6fca" text-anchor="middle">CPU</text>
<text x="146" y="158" font-size="28" font-weight="600" fill="#203453" text-anchor="start">准备数据</text>
<text x="146" y="193" font-size="24" font-weight="400" fill="#51647f" text-anchor="start">清理与整理</text>
<path d="M 87 217 V 286" fill="none" stroke="#3f6fca" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="122" y="256" font-size="25" font-weight="550" fill="#3f6fca" text-anchor="start">传至 GPU</text>
<rect x="32" y="300" width="536" height="282" rx="16" fill="#eaf6f4" stroke="#b5d9d6"/>
<rect x="52" y="320" width="70" height="60" rx="12" fill="#ffffff" stroke="#c6e4df"/>
<text x="87" y="360" font-size="22" font-weight="650" fill="#187d83" text-anchor="middle">GPU</text>
<text x="146" y="346" font-size="25" font-weight="600" fill="#187d83" text-anchor="start">在支持时复用数据</text>
<text x="146" y="378" font-size="23" font-weight="400" fill="#51647f" text-anchor="start">数据尽量留在 GPU 上</text>
<rect x="92" y="409" width="416" height="99" rx="18" fill="#ffffff" stroke="#b5d9d6"/>
<text x="300" y="449" font-size="29" font-weight="650" fill="#187d83" text-anchor="middle">拟合 · 预测</text>
<text x="300" y="484" font-size="25" font-weight="400" fill="#51647f" text-anchor="middle">重复计算</text>
<path d="M 512 441 H 531 V 537 H 69 V 441 H 87" fill="none" stroke="#187d83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 78 434 L 87 441 L 78 448" fill="none" stroke="#187d83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="300" y="559" font-size="22" font-weight="400" fill="#187d83" text-anchor="middle">GPU 上的数据可以重复使用</text>
<path d="M 87 583 V 652" fill="none" stroke="#3f6fca" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="122" y="623" font-size="25" font-weight="550" fill="#3f6fca" text-anchor="start">返回需要的结果</text>
<rect x="32" y="666" width="536" height="79" rx="16" fill="#ffffff" stroke="#d7e1ef"/>
<rect x="52" y="681" width="70" height="49" rx="10" fill="#f1edfa" stroke="none"/>
<path d="M 65 715 L 76 703 L 86 709 L 108 691" fill="none" stroke="#7961b4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="146" y="714" font-size="28" font-weight="600" fill="#203453" text-anchor="start">查看与报告结果</text>
<text x="32" y="790" font-size="25" font-weight="550" fill="#203453" text-anchor="start">传输与启动计算都有开销。</text>
<text x="32" y="824" font-size="24" font-weight="400" fill="#51647f" text-anchor="start">要比较这些开销与实际计算收益。</text>
<text x="32" y="868" font-size="22" font-weight="400" fill="#51647f" text-anchor="start">概念流程；具体方法在内部可能还有</text>
<text x="32" y="896" font-size="22" font-weight="400" fill="#51647f" text-anchor="start">额外的内存分配和数据传输。</text>
  </g>
</svg>
