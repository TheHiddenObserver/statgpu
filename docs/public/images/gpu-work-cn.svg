<svg xmlns="http://www.w3.org/2000/svg" width="600" height="684" viewBox="0 0 600 684" lang="zh-Hans" role="img" aria-labelledby="title desc">
  <title id="title">一次计算，许多行数据</title>
  <desc id="desc">概念示意：对许多行或数据块执行相同的统计计算。CPU 可以并行工作，通常使用较少而灵活的工作单元。GPU 适合同时执行许多相似的运算。图中单元不代表实际核心数量，也不代表运行时间。</desc>
