<svg xmlns="http://www.w3.org/2000/svg" width="600" height="684" viewBox="0 0 600 684" lang="en" role="img" aria-labelledby="title desc">
  <title id="title">One operation. Many rows.</title>
  <desc id="desc">Conceptual comparison: the same statistical operation is applied to many rows or chunks. CPUs can work in parallel with fewer flexible workers. GPUs are suited to many similar operations. Drawn groups do not represent hardware core counts or execution time.</desc>
