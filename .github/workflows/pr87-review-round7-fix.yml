name: PR87 review round 7 fix

on:
  push:
    branches: [agent/maintenance-0.2.4-0.2.5]
    paths: [.github/workflows/pr87-review-round7-fix.yml]

permissions:
  contents: write

jobs:
  fix-test-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply constructor, penalty-matrix, and Lipschitz fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one anchor, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Constructor must not silently coerce invalid public types.
          replace_once(
              'statgpu/linear_model/wrappers/_logistic.py',
              '''        self.compute_inference = compute_inference\n        self.cov_type = cov_type.lower()\n        if self.cov_type not in ("nonrobust", "hc0", "hc1", "hc2", "hc3", "hac"):\n            raise ValueError(\n                "cov_type must be one of: 'nonrobust', 'hc0', 'hc1', 'hc2', 'hc3', 'hac'"\n            )\n        if hac_maxlags is not None and int(hac_maxlags) < 0:\n            raise ValueError("hac_maxlags must be a non-negative integer or None")\n        self.hac_maxlags = None if hac_maxlags is None else int(hac_maxlags)\n        self.gpu_memory_cleanup = bool(gpu_memory_cleanup)\n''',
              '''        self.compute_inference = compute_inference\n        if not isinstance(cov_type, str):\n            raise ValueError("cov_type must be a string")\n        self.cov_type = cov_type.lower()\n        if self.cov_type not in ("nonrobust", "hc0", "hc1", "hc2", "hc3", "hac"):\n            raise ValueError(\n                "cov_type must be one of: 'nonrobust', 'hc0', 'hc1', 'hc2', 'hc3', 'hac'"\n            )\n        if hac_maxlags is not None and (\n            isinstance(hac_maxlags, bool)\n            or not isinstance(hac_maxlags, Integral)\n            or int(hac_maxlags) < 0\n        ):\n            raise ValueError("hac_maxlags must be a non-negative integer or None")\n        if not isinstance(gpu_memory_cleanup, (bool, np.bool_)):\n            raise ValueError("gpu_memory_cleanup must be boolean")\n        self.hac_maxlags = None if hac_maxlags is None else int(hac_maxlags)\n        self.gpu_memory_cleanup = bool(gpu_memory_cleanup)\n''',
          )

          # A quadratic penalty must match the matrix used in the normal equations.
          replace_once(
              'statgpu/glm_core/_irls.py',
              '''    penalty_matrix_work = (\n        _to_backend(penalty_matrix, backend, X)\n        if penalty_matrix is not None else None\n    )\n    if penalty_matrix_work is not None and tuple(penalty_matrix_work.shape) != (\n        n_features, n_features\n    ):\n        raise ValueError(\n            "penalty_matrix must have shape (X.shape[1], X.shape[1])"\n        )\n''',
              '''    penalty_matrix_validated = (\n        validate_glm_design_matrix(penalty_matrix, name="penalty_matrix")\n        if penalty_matrix is not None else None\n    )\n    if penalty_matrix_validated is not None and tuple(\n        penalty_matrix_validated.shape\n    ) != (n_features, n_features):\n        raise ValueError(\n            "penalty_matrix must have shape (X.shape[1], X.shape[1])"\n        )\n    penalty_matrix_work = (\n        _to_backend(penalty_matrix_validated, backend, X)\n        if penalty_matrix_validated is not None else None\n    )\n    if penalty_matrix_work is not None:\n        if backend == "torch":\n            import torch\n\n            symmetric = bool(torch.allclose(\n                penalty_matrix_work, penalty_matrix_work.T, rtol=1e-10, atol=1e-12\n            ))\n            min_eig = float(torch.linalg.eigvalsh(penalty_matrix_work).min().item())\n            scale = max(1.0, float(torch.max(torch.abs(penalty_matrix_work)).item()))\n        elif backend == "cupy":\n            import cupy as cp\n\n            symmetric = bool(cp.allclose(\n                penalty_matrix_work, penalty_matrix_work.T, rtol=1e-10, atol=1e-12\n            ).item())\n            min_eig = float(cp.linalg.eigvalsh(penalty_matrix_work).min().item())\n            scale = max(1.0, float(cp.max(cp.abs(penalty_matrix_work)).item()))\n        else:\n            symmetric = bool(np.allclose(\n                penalty_matrix_work, penalty_matrix_work.T, rtol=1e-10, atol=1e-12\n            ))\n            min_eig = float(np.linalg.eigvalsh(penalty_matrix_work).min())\n            scale = max(1.0, float(np.max(np.abs(penalty_matrix_work))))\n        if not symmetric:\n            raise ValueError("penalty_matrix must be symmetric")\n        if min_eig < -1e-10 * scale:\n            raise ValueError("penalty_matrix must be positive semidefinite")\n''',
          )

          # Optional Lipschitz fallback must never hide programming errors.
          replace_once(
              'statgpu/linear_model/penalized/_penalized_cv.py',
              '''def _cv_lipschitz_failure_is_recoverable(exc) -> bool:\n    """Return whether an optional Lipschitz hint may defer to the solver."""\n    return isinstance(\n        exc,\n        (NotImplementedError, ValueError, FloatingPointError, OverflowError),\n    ) or _linalg_exception_is_rank_failure(exc)\n''',
              '''def _cv_lipschitz_failure_is_recoverable(exc) -> bool:\n    """Return whether an optional Lipschitz hint may defer to the solver."""\n    return isinstance(\n        exc,\n        (NotImplementedError, FloatingPointError, OverflowError, np.linalg.LinAlgError),\n    ) or _linalg_exception_is_rank_failure(exc)\n''',
          )
          replace_once(
              'statgpu/linear_model/penalized/_penalized_cv.py',
              '''            if not np.isfinite(lipschitz_L) or lipschitz_L <= 0.0:\n                lipschitz_L = None\n        except Exception as exc:\n            if not _cv_lipschitz_failure_is_recoverable(exc):\n                raise\n            # A solver may estimate L internally when the optional closed-form\n            # Lipschitz hint is unavailable or numerically invalid.  The shared\n            # classifier includes NumPy, CuPy, and Torch rank failures without\n            # treating OOM/device errors as recoverable.\n            lipschitz_L = None\n''',
              '''            if not np.isfinite(lipschitz_L) or lipschitz_L <= 0.0:\n                warnings.warn(\n                    "The optional closed-form Lipschitz hint was non-finite or "\n                    "non-positive; the solver will estimate its step size.",\n                    RuntimeWarning,\n                    stacklevel=2,\n                )\n                lipschitz_L = None\n        except Exception as exc:\n            if not _cv_lipschitz_failure_is_recoverable(exc):\n                raise\n            warnings.warn(\n                f"The optional closed-form Lipschitz hint was unavailable "\n                f"({exc}); the solver will estimate its step size.",\n                RuntimeWarning,\n                stacklevel=2,\n            )\n            lipschitz_L = None\n''',
          )

          test_path = Path('dev/tests/test_pr87_code_review_fix_cycle.py')
          text = test_path.read_text(encoding='utf-8')
          text += '''\n\n@pytest.mark.parametrize(\n    "kwargs, message",\n    [\n        ({"cov_type": 1}, "cov_type"),\n        ({"hac_maxlags": 1.5}, "hac_maxlags"),\n        ({"hac_maxlags": True}, "hac_maxlags"),\n        ({"gpu_memory_cleanup": "False"}, "gpu_memory_cleanup"),\n    ],\n)\ndef test_logistic_constructor_rejects_silently_coerced_types(kwargs, message):\n    from statgpu.linear_model import LogisticRegression\n\n    with pytest.raises(ValueError, match=message):\n        LogisticRegression(**kwargs)\n\n\ndef test_irls_penalty_matrix_matches_quadratic_contract():\n    from statgpu.glm_core._family import Gaussian\n    from statgpu.glm_core._irls import IRLSSolver\n\n    X = np.column_stack([np.ones(6), np.linspace(-1.0, 1.0, 6)])\n    y = 0.4 + 1.2 * X[:, 1]\n    penalty = np.diag([0.0, 0.5])\n    params, _ = IRLSSolver(Gaussian(), max_iter=10, tol=1e-12).fit(\n        X, y, penalty_matrix=penalty\n    )\n    expected = np.linalg.solve(X.T @ X + penalty, X.T @ y)\n    np.testing.assert_allclose(params, expected, rtol=1e-12, atol=1e-12)\n\n\n@pytest.mark.parametrize(\n    "penalty, message",\n    [\n        (np.array([[0.0, 1.0], [0.0, 0.0]]), "symmetric"),\n        (np.diag([0.0, -1.0]), "positive semidefinite"),\n        (np.array([[0.0, np.nan], [np.nan, 1.0]]), "finite"),\n        (np.array([[0.0, 1.0j], [-1.0j, 1.0]]), "real numeric"),\n    ],\n)\ndef test_irls_rejects_invalid_quadratic_penalty_matrix(penalty, message):\n    from statgpu.glm_core._family import Gaussian\n    from statgpu.glm_core._irls import IRLSSolver\n\n    with pytest.raises(ValueError, match=message):\n        IRLSSolver(Gaussian()).fit(\n            np.ones((5, 2)), np.arange(5.0), penalty_matrix=penalty\n        )\n\n\ndef _patch_sparse_cv_loss(monkeypatch, loss):\n    import statgpu.linear_model.penalized._fit_mixin as fit_mixin\n\n    monkeypatch.setattr(\n        fit_mixin, '_resolve_loss_name', lambda *args, **kwargs: loss\n    )\n\n\ndef test_sparse_cv_lipschitz_programming_value_error_propagates(monkeypatch):\n    from statgpu.linear_model.penalized._penalized_cv import _glm_sparse_cv_path\n\n    class Loss:\n        _lipschitz_at_init = False\n\n        def lipschitz(self, *args, **kwargs):\n            raise ValueError('programming shape bug')\n\n    _patch_sparse_cv_loss(monkeypatch, Loss())\n    with pytest.raises(ValueError, match='programming shape bug'):\n        _glm_sparse_cv_path(\n            'logistic', np.ones((6, 1)), np.array([0, 0, 0, 1, 1, 1]),\n            np.array([0.1]), 'l1', 1.0, 5, 1e-4, 'cpu'\n        )\n\n\ndef test_sparse_cv_recoverable_lipschitz_fallback_is_visible(monkeypatch):\n    import statgpu.solvers as solvers\n    from statgpu.linear_model.penalized._penalized_cv import _glm_sparse_cv_path\n\n    class Loss:\n        _lipschitz_at_init = False\n\n        def lipschitz(self, *args, **kwargs):\n            raise NotImplementedError('no closed-form hint')\n\n    def fake_solver(loss, penalty, X, y, **kwargs):\n        assert 'lipschitz_L' not in kwargs\n        return np.zeros(X.shape[1]), 1\n\n    _patch_sparse_cv_loss(monkeypatch, Loss())\n    monkeypatch.setattr(solvers, 'fista_solver', fake_solver)\n    with pytest.warns(RuntimeWarning, match='solver will estimate'):\n        result = _glm_sparse_cv_path(\n            'logistic', np.ones((6, 1)), np.array([0, 0, 0, 1, 1, 1]),\n            np.array([0.1]), 'l1', 1.0, 5, 1e-4, 'cpu', return_path=True\n        )\n    assert result['n_iter'].tolist() == [1]\n    assert result['coef'].shape == (1, 1)\n\n\ndef test_sparse_cv_invalid_lipschitz_value_fallback_is_visible(monkeypatch):\n    import statgpu.solvers as solvers\n    from statgpu.linear_model.penalized._penalized_cv import _glm_sparse_cv_path\n\n    class Loss:\n        _lipschitz_at_init = False\n\n        def lipschitz(self, *args, **kwargs):\n            return np.nan\n\n    def fake_solver(loss, penalty, X, y, **kwargs):\n        assert 'lipschitz_L' not in kwargs\n        return np.zeros(X.shape[1]), 1\n\n    _patch_sparse_cv_loss(monkeypatch, Loss())\n    monkeypatch.setattr(solvers, 'fista_solver', fake_solver)\n    with pytest.warns(RuntimeWarning, match='non-finite or non-positive'):\n        result = _glm_sparse_cv_path(\n            'logistic', np.ones((6, 1)), np.array([0, 0, 0, 1, 1, 1]),\n            np.array([0.1]), 'l1', 1.0, 5, 1e-4, 'cpu', return_path=True\n        )\n    assert result['n_iter'].tolist() == [1]\n'''
          test_path.write_text(text, encoding='utf-8')
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation,formula]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run new review-fix suite
        run: python -m pytest -q dev/tests/test_pr87_code_review_fix_cycle.py
      - name: Run adjacent Logistic, IRLS, and CV tests
        run: |
          python -m pytest -q \
            dev/tests/test_logistic.py \
            dev/tests/test_loss_penalty_solver_matrix.py \
            dev/tests/test_maintenance_024_025.py \
            -k "logistic or irls or lipschitz or penalty_matrix or cv_path"
      - name: Static review gates
        run: |
          python -m compileall -q statgpu dev/tests/test_pr87_code_review_fix_cycle.py
          git diff --check
      - name: Commit fixes and self-delete
        shell: bash
        run: |
          rm .github/workflows/pr87-review-round7-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add statgpu dev/tests .github/workflows/pr87-review-round7-fix.yml
          git commit -m "fix: validate IRLS penalty and CV step hints"
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
