name: PR129 one-shot backend-contract fix

on:
  push:
    branches:
      - agent/post-v0.2.5-next-phase-plan
    paths:
      - '.github/workflows/pr129-one-shot-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/post-v0.2.5-next-phase-plan
          fetch-depth: 0
      - name: Apply reviewed final fixes
        run: |
          printf '%s' '' > /tmp/pr129_patch.b64
          printf '%s' '' >> /tmp/pr129_patch.b64
          base64 -d /tmp/pr129_patch.b64 | gzip -d > /tmp/pr129_patch.py
          python /tmp/pr129_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --check
          git diff --cached --quiet && { echo 'no changes produced'; exit 1; }
          git commit -m "fix(inference): close LinearRegression GPU provenance gap"
          git push origin HEAD:agent/post-v0.2.5-next-phase-plan
