name: PR126 guarded round8 formula token fix v2

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - '.github/workflows/pr126-round8-formula-token-fix-v2.yml'

permissions:
  contents: write

jobs:
  formula-token-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Guard exact checkpoint lineage
        run: |
          base='2f6b00f6759d2be7d16494fb9ac71587ef28f59d'
          actual="$(git diff --name-only "$base" HEAD | sort)"
          expected="$(printf '%s\n' .github/workflows/pr126-round8-formula-token-fix-v2.yml .github/workflows/pr126-round8-formula-token-fix.yml | sort)"
          test "$actual" = "$expected"
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pandas patsy
      - name: Apply exact formula token fix
        run: |
          printf '%s' '' | base64 -d > /tmp/pr126_round8_fix.py
          python /tmp/pr126_round8_fix.py
      - name: Run focused formula regressions
        run: |
          python -m pytest dev/tests/test_panel_formula.py dev/tests/test_panel_stage_c_final_review_fixes.py -q --tb=short
          python -m compileall -q statgpu/panel
      - name: Verify scope and commit without temporary workflows
        run: |
          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' dev/tests/test_panel_formula.py docs/cn/models/panel.md docs/en/models/panel.md statgpu/panel/_formula.py | sort)"
          test "$changed" = "$expected"
          git rm .github/workflows/pr126-round8-formula-token-fix.yml .github/workflows/pr126-round8-formula-token-fix-v2.yml
          git add statgpu/panel/_formula.py dev/tests/test_panel_formula.py docs/en/models/panel.md docs/cn/models/panel.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(panel): make formula effect tokens unambiguous'
          git push origin HEAD:agent/panel-p1-stage-c-covariance
