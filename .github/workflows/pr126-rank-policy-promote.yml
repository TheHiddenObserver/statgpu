name: PR126 rank-policy canonical promotion

on:
  push:
    branches: [agent/panel-p1-stage-c-covariance]
    paths:
      - '.github/workflows/pr126-rank-policy-promote.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply immutable promotion metadata and acceptance docs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          MEASUREMENT_SHA = '3dc7df19176f8fb881a8d37e9d75b4f75e71b058'
          RAW_COMMIT = 'be679c13357475b8d26db42661b557fbea2f327f'
          CORR_SHA = 'c67ada7ec59ff85d6a652714dc45cdae81efc67a4c13fe853c85d0712fc689ad'
          CORR_BLOB = '5de153023af751ff960969483c11fb77dc115456'
          PERF_SHA = 'f27bef0b7c55db8a8d31f0574e3133760649c28a9089b3c7d3cfcc121009e152'
          PERF_BLOB = '5e903cf0bd9a5f73e9273d9cc3488cb5e13219da'
          CORR_ID = 'panel-stage-c-rank-policy-validation-pr126-20260811-c67ada7ec59f'
          PERF_ID = 'panel-stage-c-rank-policy-performance-pr126-20260811-f27bef0b7c55'
          CORR_COMPARISON = 'panel-stage-c-pr126-rank-policy-validation-20260811'
          PERF_COMPARISON = 'panel-stage-c-pr126-rank-policy-performance-20260811'
          ENV = 'remote-p100-pr126-20260811'

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one replacement, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # Do not manufacture paired correctness metadata inside the performance parser.
          parser_path = Path('dev/benchmarks/frontend_data/parsers/panel_stage_c_rank_policy.py')
          parser = parser_path.read_text(encoding='utf-8')
          parser = parser.replace(
              '                    "working_tree_clean": True,\n'
              '                    "paired_validation_cupy_version": _EXPECTED_CUPY_VERSION,\n',
              '                    "working_tree_clean": True,\n',
          )
          parser = parser.replace(
              '                            {"metric": "median_matches_raw_samples", "status": "pass"},\n'
              '                            {"metric": "gpu_backend_identity_asserted_by_runner", "status": "pass"},\n',
              '                            {"metric": "median_matches_raw_samples", "status": "pass"},\n',
          )
          if 'paired_validation_cupy_version' in parser or 'gpu_backend_identity_asserted_by_runner' in parser:
              raise RuntimeError('performance parser still contains cross-source manufactured metadata')
          parser_path.write_text(parser, encoding='utf-8')

          test_path = Path('dev/tests/test_panel_stage_c_frontend_source.py')
          tests = test_path.read_text(encoding='utf-8')
          old = '''    assert all(\n        run["parameters"]["paired_validation_cupy_version"] == "13.6.0"\n        for run in runs\n    )\n'''
          if tests.count(old) != 1:
              raise RuntimeError('rank-policy frontend test paired provenance assertion drifted')
          tests = tests.replace(old, '')
          test_path.write_text(tests, encoding='utf-8')

          manifest_path = Path('dev/benchmarks/frontend_sources.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          comparisons = manifest['comparisons']
          if CORR_COMPARISON in comparisons or PERF_COMPARISON in comparisons:
              raise RuntimeError('rank-policy comparison IDs already registered')
          comparisons[CORR_COMPARISON] = {
              'label': 'Panel Stage C rank-policy physical validation — PR #126 — 2026-08-11',
              'env_id': ENV,
          }
          comparisons[PERF_COMPARISON] = {
              'label': 'Panel Stage C rank-policy synchronized performance — PR #126 — 2026-08-11',
              'env_id': ENV,
          }
          existing_ids = {source['source_id'] for source in manifest['sources']}
          if CORR_ID in existing_ids or PERF_ID in existing_ids:
              raise RuntimeError('rank-policy source IDs already registered')
          manifest['sources'].append({
              'source_id': CORR_ID,
              'comparison_id': CORR_COMPARISON,
              'path': 'results/pr126_p100/panel_stage_c_gpu_validation_3dc7df19.json',
              'sha256': CORR_SHA,
              'parser': 'panel_stage_c_rank_policy_physical_validation',
              'parser_version': '2.0',
              'env_id': ENV,
              'required': True,
              'allowed_issue_codes': [],
              'source_date': '2026-08-11',
              'measurement_git_sha': MEASUREMENT_SHA,
              'raw_git_sha': MEASUREMENT_SHA,
              'provenance_note': (
                  f'PR #126 final rank-policy exact-clean P100 correctness/backend-provenance evidence. '
                  f'Raw artifact commit {RAW_COMMIT}; Git blob {CORR_BLOB}; SHA-256 {CORR_SHA}. '
                  'CuPy 13.6.0 and Torch each pass 27 estimator integrations plus 12 direct public '
                  'covariance primitives (39/39 per backend), including PanelOLS numerical-rank-boundary '
                  'Driscoll-Kraay integration and nonrobust/HC0/HC2/HC3/cluster/DK rank-boundary primitives. '
                  'Every estimator/primitive records requested/executed backend identity, the measurement '
                  'tree is clean, and no numerical CPU fallback is accepted. Historical ec511f53 and '
                  'earlier Stage-C sources remain immutable and are not overwritten.'
              ),
          })
          manifest['sources'].append({
              'source_id': PERF_ID,
              'comparison_id': PERF_COMPARISON,
              'path': 'results/pr126_p100/panel_stage_c_performance_3dc7df19.json',
              'sha256': PERF_SHA,
              'parser': 'panel_stage_c_rank_policy_performance',
              'parser_version': '2.0',
              'env_id': ENV,
              'required': True,
              'allowed_issue_codes': [],
              'source_date': '2026-08-11',
              'measurement_git_sha': MEASUREMENT_SHA,
              'raw_git_sha': MEASUREMENT_SHA,
              'provenance_note': (
                  f'PR #126 final rank-policy exact-clean P100 synchronized timing evidence. '
                  f'Raw artifact commit {RAW_COMMIT}; Git blob {PERF_BLOB}; SHA-256 {PERF_SHA}. '
                  'All 58 synchronized end-to-end fit rows pass: 54 base rows over three maintained '
                  'scales plus four bounded N=10000, k=2, T=200 QS all-lag rows on CuPy/Torch. Every '
                  'sample is finite/positive and each stored median equals the median of its raw samples; '
                  'no speedup or CPU-baseline claim is encoded. This timing artifact records packages.cupy '
                  'as null because the performance runner queried the distribution name cupy while the '
                  'environment installs a CUDA-suffixed CuPy distribution. The paired required exact-head '
                  'correctness source independently records CuPy 13.6.0, and the timing runner imported '
                  'CuPy and failed closed unless each timed fit persisted the requested backend. This is '
                  'documented provenance, not a synthesized timing-artifact field.'
              ),
          })
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          coverage_path = Path('dev/benchmarks/benchmark_coverage_matrix.json')
          coverage = json.loads(coverage_path.read_text(encoding='utf-8'))
          panel = next(x for x in coverage['capabilities'] if x['capability_id'] == 'panel-estimation')
          for source_id in (CORR_ID, PERF_ID):
              if source_id in panel['source_ids']:
                  raise RuntimeError(f'coverage already contains {source_id}')
              panel['source_ids'].append(source_id)
          panel['disposition'] = (
              'June timing rows cover aligned PanelOLS and RandomEffects; PR #122 provides canonical '
              'Stage-B diagnostic/physical validation. PR #126 current Stage-C rank-policy acceptance is '
              'the exact-clean 3dc7df19 P100 source: CuPy and Torch each pass 27 estimator integrations '
              'plus 12 direct public primitives (39/39), including the numerical-rank boundary, with '
              'requested/executed backend identity. The paired current performance source contributes 58 '
              'synchronized rows over three base scales plus bounded N=10,000, k=2, T=200 QS all-lag '
              'cases. The older ec511f53, 5ed763be, aad53587, c151550a, and 9c0b3050 artifacts remain '
              'immutable historical evidence. No Stage-C speedup claim is made.'
          )
          coverage_path.write_text(json.dumps(coverage, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          en_intro_old = ('The earlier exact-clean Tesla P100 run at `ec511f53...` remains immutable historical evidence '
              '(26 estimator cases + 6 direct primitives per backend, 32/32, plus 58 synchronized performance rows), '
              'but it no longer constitutes current acceptance after the numerical-rank and FirstDifference chronology '
              'production fixes. The repaired implementation uses one backend-native SVD mask with cutoff '
              '`max(n,k) * eps64 * s_max` for both pseudoinverse and numerical rank, and FirstDifference preserves '
              'ordered-categorical time chronology. Fresh exact-head physical correctness is pending on the expanded '
              '27-estimator + 12-primitive matrix (**39/39 per backend**), together with a synchronized performance rerun.')
          en_intro_new = ('The repaired numerical-rank and FirstDifference chronology implementation is physically accepted '
              'on exact-clean Tesla P100 measurement `3dc7df19...`: CuPy 13.6.0 and Torch each pass 27 estimator '
              'integrations + 12 direct public primitives (**39/39 per backend**), including the numerical-rank boundary, '
              'and the paired synchronized performance artifact contains all 58 maintained rows. The implementation uses '
              'one backend-native SVD mask with cutoff `max(n,k) * eps64 * s_max` for pseudoinverse/rank decisions and '
              'preserves ordered-categorical FirstDifference chronology. The earlier `ec511f53...` 32/32 source remains '
              'immutable historical evidence and is not overwritten.')
          replace_once('docs/en/models/panel.md', en_intro_old, en_intro_new)
          en_status_old = ('The previous P100 source `ec511f53...` is retained only as historical evidence because the shared '
              'covariance implementation and FirstDifference chronology changed afterward. Maintained local/Torch-CPU gates '
              'now include the numerical-rank boundary, while current `remote-full` acceptance requires a fresh exact-head '
              'CuPy/Torch run of 26 estimator cases + 12 public primitives (**39/39 per backend**) and a synchronized '
              'performance rerun. Explicit GPU devices continue to forbid silent CPU fallback.')
          en_status_new = ('Current `remote-full` acceptance is the exact-clean `3dc7df19...` Tesla P100 run: CuPy and Torch '
              'each pass 27 estimator integrations + 12 public primitives (**39/39 per backend**) and the synchronized '
              'performance matrix contains 58/58 rows. The six new rank-boundary primitives and '
              '`panel_rank_boundary_dk` integration pass on both GPU backends with requested/executed backend identity. '
              'The older `ec511f53...` source is historical only. Explicit GPU devices continue to forbid silent CPU fallback.')
          replace_once('docs/en/models/panel.md', en_status_old, en_status_new)

          cn_intro_old = ('此前 exact-clean `ec511f53...` Tesla P100 运行继续作为不可变历史证据保留（每个 backend 26 个 '
              'estimator case + 6 个 direct primitive，共 32/32，以及 58 行同步 performance），但在 numerical-rank '
              '与 FirstDifference 时间顺序的 production 修复之后，它不再代表当前 acceptance。修复后的 covariance '
              '用同一个 backend-native SVD mask、cutoff `max(n,k) * eps64 * s_max` 同时定义 pseudoinverse 与 numerical '
              'rank；FirstDifference 也保留 ordered categorical 的显式时间顺序。当前 `remote-full` 仍需在新的 exact '
              'head 上重新完成扩展后的 27 estimator + 12 primitive（**每个 backend 39/39**）以及同步 performance。')
          cn_intro_new = ('修复后的 numerical-rank 与 FirstDifference chronology 实现已在 exact-clean `3dc7df19...` '
              'Tesla P100 上完成 physical acceptance：CuPy 13.6.0 与 Torch 各通过 27 个 estimator integration + 12 '
              '个 direct public primitive（**每个 backend 39/39**），包括 numerical-rank boundary；配套同步 performance '
              'artifact 也包含全部 58 个 maintained row。实现使用同一个 backend-native SVD mask、cutoff '
              '`max(n,k) * eps64 * s_max` 统一 pseudoinverse/rank 决策，并保留 ordered-categorical FirstDifference '
              'chronology。旧 `ec511f53...` 32/32 source 继续作为不可变历史证据保留，不会被覆盖。')
          replace_once('docs/cn/models/panel.md', cn_intro_old, cn_intro_new)
          cn_status_old = ('旧 P100 source `ec511f53...` 现在仅作为历史证据保留，因为其后共享 covariance 实现与 '
              'FirstDifference chronology 已发生 production 修改。maintained local/Torch-CPU gate 已覆盖 numerical-rank '
              'boundary；当前 `remote-full` acceptance 需要新的 exact-head CuPy/Torch 27 estimator + 12 public primitive'
              '（**每个 backend 39/39**）以及同步 performance rerun。显式 GPU device 仍禁止静默回退 CPU。')
          cn_status_new = ('当前 `remote-full` acceptance 来自 exact-clean `3dc7df19...` Tesla P100：CuPy 与 Torch '
              '各通过 27 个 estimator integration + 12 个 public primitive（**每个 backend 39/39**），同步 performance '
              'matrix 为 58/58 行。新增的六个 rank-boundary primitive 与 `panel_rank_boundary_dk` integration 均在两个 '
              'GPU backend 上通过，且 requested/executed backend 一致。旧 `ec511f53...` source 仅作为历史证据保留；'
              '显式 GPU device 仍禁止静默回退 CPU。')
          replace_once('docs/cn/models/panel.md', cn_status_old, cn_status_new)

          replace_once(
              'CHANGELOG.md',
              '- Retained the exact-clean `ec511f53...` Tesla P100 32/32-per-backend correctness and 58-row synchronized performance run as immutable historical evidence; subsequent numerical-rank and FirstDifference chronology fixes require fresh exact-head 39/39-per-backend correctness plus a performance rerun before current physical acceptance is restored.',
              '- Accepted the repaired numerical-rank/FirstDifference implementation on exact-clean `3dc7df19...` Tesla P100: CuPy 13.6.0 and Torch each pass 27 estimator integrations + 12 public primitives (39/39), including all new rank-boundary cases, and the paired synchronized performance source contains 58/58 rows. The older `ec511f53...` source remains immutable historical evidence and is not overwritten.'
          )
          replace_once(
              'docs/en/changelog.md',
              'The `ec511f53...` Tesla P100 32/32-per-backend correctness and 58-row performance run is retained as immutable historical evidence. Because later review fixed the shared numerical-rank cutoff and FirstDifference ordered-categorical chronology, current physical acceptance is pending a fresh exact-head 27-estimator + 12-primitive (**39/39 per backend**) correctness run and synchronized performance rerun.',
              'The repaired implementation is now physically accepted on exact-clean `3dc7df19...` Tesla P100: CuPy 13.6.0 and Torch each pass 27 estimator integrations + 12 direct public primitives (**39/39 per backend**), including the numerical-rank boundary, and the paired synchronized performance source contains all 58 maintained rows. The older `ec511f53...` run remains immutable historical evidence and is not overwritten.'
          )
          replace_once(
              'docs/cn/changelog.md',
              '`ec511f53...` Tesla P100 的每 backend 32/32 correctness 与 58 行 performance 继续作为不可变历史证据保留。后续 review 修复了共享 numerical-rank cutoff 与 FirstDifference ordered-categorical chronology，因此当前 physical acceptance 需要在新的 exact head 上重新完成 27 estimator + 12 primitive（**每个 backend 39/39**）correctness 与同步 performance。',
              '修复后的实现现已在 exact-clean `3dc7df19...` Tesla P100 上完成 physical acceptance：CuPy 13.6.0 与 Torch 各通过 27 个 estimator integration + 12 个 direct public primitive（**每个 backend 39/39**），包括 numerical-rank boundary，配套同步 performance source 也包含全部 58 个 maintained row。旧 `ec511f53...` 运行继续作为不可变历史证据保留，不会被覆盖。'
          )

          Path('dev/reviews/pr126_physical_gpu_validation.md').write_text(f'''# PR #126 Panel Stage C physical GPU validation\n\n## Current physical acceptance status\n\n**PHYSICAL_GPU_ACCEPTED / CANONICAL_PROMOTION / HOSTED_FINAL_PENDING**\n\nValidation tier: `remote-full`.\n\nThe current accepted numerical measurement is exact clean head `{MEASUREMENT_SHA}` on Tesla P100-SXM2-16GB. Raw evidence was committed in `{RAW_COMMIT}`; comparison from the measurement head to that raw commit changes only the two `results/pr126_p100/*_3dc7df19.json` artifacts. Promotion changes parser/source metadata, tests, docs/review records, and deterministic frontend benchmark assets only; it does not change `statgpu/panel/**` or either physical runner.\n\n## Current correctness and backend provenance\n\n- path: `results/pr126_p100/panel_stage_c_gpu_validation_3dc7df19.json`\n- measurement SHA: `{MEASUREMENT_SHA}`\n- raw artifact commit: `{RAW_COMMIT}`\n- Git blob: `{CORR_BLOB}`\n- SHA-256: `{CORR_SHA}`\n- GPU: Tesla P100-SXM2-16GB\n- CuPy package provenance: `13.6.0`\n- CuPy: **39/39** = 27 estimator integrations + 12 direct public primitives\n- Torch: **39/39** = 27 estimator integrations + 12 direct public primitives\n- rank-boundary primitives: `rank_boundary_nonrobust`, `rank_boundary_hc0`, `rank_boundary_hc2`, `rank_boundary_hc3`, `rank_boundary_cluster`, `rank_boundary_dk`\n- estimator integration: `panel_rank_boundary_dk` passes on both backends with numerical `design_rank=2`, `design_columns=3`, and `rank_deficient_extension=true`\n- every estimator/primitive records requested backend == executed backend; no numerical CPU fallback is accepted\n\n## Current synchronized performance\n\n- path: `results/pr126_p100/panel_stage_c_performance_3dc7df19.json`\n- measurement SHA: `{MEASUREMENT_SHA}`\n- raw artifact commit: `{RAW_COMMIT}`\n- Git blob: `{PERF_BLOB}`\n- SHA-256: `{PERF_SHA}`\n- GPU: Tesla P100-SXM2-16GB for both CuPy and Torch\n- rows: **58/58** = 54 base + 4 high-T QS\n- timing scope: synchronized end-to-end estimator fit\n- high-T matrix: CuPy/Torch × PooledOLS/PanelOLS QS at `N=10,000,k=2,T=200`\n- every timing sample is finite/positive and each stored median equals the median of its three raw samples\n- no speedup or CPU-baseline claim is made\n\nThe performance artifact has `environment.packages.cupy=null` because that runner queried the distribution name `cupy` while the host uses a CUDA-suffixed CuPy distribution. This is a metadata-only limitation: the paired required exact-head correctness artifact records CuPy `13.6.0`, and the timing runner could only produce CuPy rows after importing CuPy and additionally failed closed unless every timed fit persisted the requested backend. The canonical parser does not synthesize a CuPy version into the timing rows; this cross-artifact fact is retained only as provenance.\n\n## New immutable canonical identities\n\n- correctness source: `{CORR_ID}`\n- performance source: `{PERF_ID}`\n- parser generation: v2 rank-policy parser identities, separate from the frozen historical v1 `ec511f53...` parsers\n- environment: `{ENV}`\n- source date: `2026-08-11`\n\n## Historical evidence\n\nThe prior canonical sources remain registered and immutable but are historical for current acceptance:\n\n- `panel-stage-c-validation-pr126-20260811-af2227efe3cd` (`ec511f53...`, 32/32 per backend)\n- `panel-stage-c-performance-pr126-20260811-409974070022` (`ec511f53...`, 58 rows)\n\nThe earlier `5ed763be...`, `aad53587...`, `c151550a...`, and `9c0b3050...` raw artifacts also remain audit history. None is overwritten.\n\n## Remaining lifecycle gate\n\nPhysical evidence is accepted. The remaining gate is canonical promotion validation, all permanent hosted workflows on the post-promotion checkpoint, and one final `.claude/skills/code-review.md` re-review. PR #126 remains Draft and unmerged; Ready-for-review or merge requires explicit user instruction.\n''', encoding='utf-8')
          PY
      - name: Validate and regenerate canonical benchmark bundle
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e . pytest 'jsonschema[format]'
          python dev/benchmarks/generate_benchmark_data.py \
            --out frontend/public/data/benchmark_data.json \
            --report frontend/public/data/parse_report.json \
            --inventory-out frontend/public/data/source_inventory.json \
            --deterministic --strict-sources
          pytest \
            dev/tests/test_panel_stage_c_frontend_source.py \
            dev/tests/test_benchmark_frontend_data.py \
            dev/tests/test_benchmark_catalog.py \
            dev/tests/test_benchmark_inventory_v2.py \
            dev/tests/test_frontend_domain_coverage.py -q
          python dev/benchmarks/generate_benchmark_data.py --check --strict-sources
          git diff --check
      - name: Build benchmark frontend
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npm ci
          npm run typecheck
          npm run build
      - name: Enforce exact-source applicability and commit promotion
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git diff --name-only 3dc7df19176f8fb881a8d37e9d75b4f75e71b058 -- 'statgpu/panel/**' 'dev/benchmarks/validate_panel_stage_c_gpu.py' 'dev/benchmarks/benchmark_panel_stage_c_covariance.py')"
          if [ -n "$forbidden" ]; then
            echo "Promotion changed numerical source or physical runners:" >&2
            printf '%s\n' "$forbidden" >&2
            exit 1
          fi
          rm -f .github/workflows/pr126-rank-policy-raw-audit.yml
          rm -f .github/workflows/pr126-rank-policy-promote.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "benchmark: promote PR126 rank-policy P100 evidence"
          git push origin HEAD:agent/panel-p1-stage-c-covariance
