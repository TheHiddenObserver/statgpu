name: PR87 review round 9 likelihood

on:
  push:
    branches: [agent/maintenance-0.2.4-0.2.5]
    paths: [.github/workflows/pr87-review-round9-loglik.yml]

permissions:
  contents: write

jobs:
  review-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reuse the registered logistic objective for diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one anchor, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = 'statgpu/linear_model/wrappers/_logistic.py'
          replace_once(
              path,
              '''from statgpu.glm_core._validation import (\n    validate_binary_response,\n    validate_glm_design_matrix,\n    validate_glm_sample_weight,\n)\n''',
              '''from statgpu.glm_core._logistic import LogisticLoss\nfrom statgpu.glm_core._validation import (\n    validate_binary_response,\n    validate_glm_design_matrix,\n    validate_glm_sample_weight,\n)\n''',
          )
          replace_once(
              path,
              '''        eta_diag = self._X_design @ params\n        p_diag = np.clip(self._sigmoid(eta_diag), 1e-15, 1.0 - 1e-15)\n        loglik_i = y * np.log(p_diag) + (1.0 - y) * np.log(1.0 - p_diag)\n''',
              '''        eta_diag = self._X_design @ params\n        loglik_i = -LogisticLoss().per_sample_value(eta_diag, y)\n''',
          )
          replace_once(
              path,
              '''        # Compute log-likelihood on GPU\n        eta = X_design @ params\n        p = 1 / (1 + cp.exp(-cp.clip(eta, -500, 500)))\n        loglik_i = y * cp.log(p + 1e-10) + (1 - y) * cp.log(1 - p + 1e-10)\n        loglik = cp.sum(loglik_i if sw_work is None else sw_work * loglik_i)\n''',
              '''        # Compute the same registered Bernoulli objective on CuPy.\n        eta = X_design @ params\n        p = 1 / (1 + cp.exp(-cp.clip(eta, -500, 500)))\n        loglik_i = -LogisticLoss().per_sample_value(eta, y)\n        loglik = cp.sum(loglik_i if sw_work is None else sw_work * loglik_i)\n''',
          )
          replace_once(
              path,
              '''        # Compute log-likelihood on GPU\n        eta = X_design @ params\n        p = 1 / (1 + torch.exp(-torch.clamp(eta, -500, 500)))\n        loglik_i = y * torch.log(p + 1e-10) + (1 - y) * torch.log(1 - p + 1e-10)\n        loglik = torch.sum(loglik_i if sw_work is None else sw_work * loglik_i)\n''',
              '''        # Compute the same registered Bernoulli objective on Torch.\n        eta = X_design @ params\n        p = 1 / (1 + torch.exp(-torch.clamp(eta, -500, 500)))\n        loglik_i = -LogisticLoss().per_sample_value(eta, y)\n        loglik = torch.sum(loglik_i if sw_work is None else sw_work * loglik_i)\n''',
          )

          test_path = Path('dev/tests/test_pr87_code_review_fix_cycle.py')
          text = test_path.read_text(encoding='utf-8')
          text += '''\n\ndef test_logistic_wrapper_reuses_registered_objective_on_all_backends():\n    import inspect\n    import statgpu.linear_model.wrappers._logistic as module\n\n    source = inspect.getsource(module.LogisticRegression)\n    assert source.count("LogisticLoss().per_sample_value") == 3\n    assert "log(p + 1e-10)" not in source\n    assert "log(1 - p + 1e-10)" not in source\n\n\ndef test_logistic_cpu_likelihood_matches_stable_registered_objective():\n    from statgpu.glm_core._logistic import LogisticLoss\n    from statgpu.linear_model import LogisticRegression\n\n    X = np.array([[-30.0], [-10.0], [10.0], [30.0]], dtype=float)\n    y = np.array([0.0, 0.0, 1.0, 1.0])\n    weights = np.array([1.0, 2.0, 3.0, 4.0])\n    model = LogisticRegression(\n        C=0.5, max_iter=200, tol=1e-10, device="cpu",\n        compute_inference=False,\n    ).fit(X, y, sample_weight=weights)\n    eta = model.intercept_ + X @ model.coef_\n    expected = -np.sum(\n        weights * LogisticLoss().per_sample_value(eta, y)\n    )\n    assert model.loglikelihood == pytest.approx(expected, rel=1e-13, abs=1e-13)\n\n\ndef test_logistic_private_torch_path_matches_registered_objective(monkeypatch):\n    torch = pytest.importorskip("torch")\n    import statgpu.linear_model.wrappers._logistic as module\n    from statgpu.glm_core._logistic import LogisticLoss\n\n    monkeypatch.setattr(module, "_get_torch_device_str", lambda: "cpu")\n    X = torch.tensor([[-8.0], [-2.0], [2.0], [8.0]], dtype=torch.float64)\n    y = torch.tensor([0.0, 0.0, 1.0, 1.0], dtype=torch.float64)\n    weights = torch.tensor([1.0, 2.0, 3.0, 4.0], dtype=torch.float64)\n    model = module.LogisticRegression(\n        C=1.0, max_iter=200, tol=1e-10, device="torch",\n        compute_inference=False,\n    )\n    model._validate_fit_controls()\n    model._fit_torch(X, y, sample_weight=weights)\n    params = torch.as_tensor(model._params, dtype=torch.float64)\n    design = torch.cat([torch.ones((X.shape[0], 1), dtype=X.dtype), X], dim=1)\n    eta = design @ params\n    expected = -torch.sum(\n        weights * LogisticLoss().per_sample_value(eta, y)\n    ).item()\n    assert model._loglik == pytest.approx(expected, rel=1e-13, abs=1e-13)\n'''
          test_path.write_text(text, encoding='utf-8')

          for path, marker in (
              ('docs/en/changelog.md', '- Corrected arbitrary-link Binomial IRLS'),
              ('docs/cn/changelog.md', '- 修正任意 link 的 Binomial IRLS'),
          ):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if marker not in text:
                  raise RuntimeError(f'{path}: review-cycle changelog marker missing')
              if path.startswith('docs/en'):
                  addition = (\n                      '- Unified CPU, CuPy, and Torch fitted log-likelihood diagnostics with '\n                      'the registered numerically stable LogisticLoss objective.\\n\\n'\n                  )
              else:
                  addition = (\n                      '- 统一 CPU、CuPy 与 Torch 的拟合对数似然诊断，全部复用数值稳定的 '\n                      'LogisticLoss 注册目标。\\n\\n'\n                  )
              text = text.replace(marker, addition + marker, 1)
              p.write_text(text, encoding='utf-8')
          PY
      - name: Install validation and Torch CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation,formula]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ruff
      - name: Run likelihood and Logistic contracts
        run: |
          python -m pytest -q \
            dev/tests/test_pr87_code_review_fix_cycle.py \
            dev/tests/test_logistic.py \
            -k "logistic or likelihood or loglik"
      - name: Run complete CPU test tree
        run: python -m pytest dev/tests -q --tb=short
      - name: Run documentation and static gates
        shell: bash
        run: |
          python dev/validation/fix_docs_links.py --check
          python dev/validation/check_docs_contracts.py
          python -m compileall -q statgpu dev/validation dev/benchmarks
          ruff check \
            statgpu/linear_model/wrappers/_logistic.py \
            dev/tests/test_pr87_code_review_fix_cycle.py \
            --select F821,E9,F63,F7,F82
          git diff --check
          python -m pytest --collect-only -q >/dev/null
      - name: Commit reviewed fix and self-delete
        shell: bash
        run: |
          rm .github/workflows/pr87-review-round9-loglik.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add statgpu dev/tests docs .github/workflows/pr87-review-round9-loglik.yml
          git commit -m "fix: unify logistic likelihood diagnostics"
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
