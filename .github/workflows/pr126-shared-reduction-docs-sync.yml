name: PR126 shared reduction docs sync

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: pr126-shared-reduction-docs-sync
  cancel-in-progress: true

jobs:
  apply-validate-commit:
    if: github.event.pull_request.head.ref == 'agent/panel-p1-stage-c-covariance'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation,formula]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Apply documentation sync
        run: python dev/validation/pr126_shared_reduction_docs_once.py
      - name: Recheck shared reduction regressions and docs contracts
        run: |
          python -m pytest \
            dev/tests/test_panel_diagnostic_cancellation_precision.py \
            dev/tests/test_fama_macbeth_inference_matrix.py \
            dev/tests/test_fama_macbeth_review_fixes.py \
            dev/tests/test_panel_stage_c_physical_runner_contract.py \
            -q --tb=short
          python -m compileall -q statgpu/panel
          git diff --check
      - name: Remove staging artifacts
        run: |
          rm -f dev/validation/pr126_shared_reduction_docs_once.py
          rm -f .github/workflows/pr126-shared-reduction-docs-sync.yml
      - name: Commit validated documentation sync
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: describe shared cancellation-safe panel reductions"
          git push origin HEAD:agent/panel-p1-stage-c-covariance
