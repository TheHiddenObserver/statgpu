name: PR126 row-fallback scope

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  apply-validate-commit:
    if: github.event.pull_request.number == 126
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install maintained Torch CPU environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" pytest
          python -m pip install "torch==2.0.1+cpu" --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Apply row-fallback scope fix
        run: python dev/validation/pr126_limit_row_fallback.py
      - name: Run precision and backend regressions
        run: |
          python -m pytest dev/tests/test_panel_stage_b_torch_cpu.py -q --tb=short
          python -m pytest \
            dev/tests/test_panel_stage_c_covariance.py \
            dev/tests/test_panel_stage_c_torch_cpu.py \
            dev/tests/test_panel_stage_c_physical_runner_contract.py \
            -q --tb=short
          python -m compileall -q statgpu dev/benchmarks dev/tests
          git diff --check
      - name: Remove temporary review scaffolding
        run: |
          rm -f dev/validation/pr126_limit_row_fallback.py
          rm -f .github/workflows/pr126-row-fallback-scope.yml
          git diff --check
      - name: Commit validated scope fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "perf: scope two-way precision fallback"
          git push origin HEAD:agent/panel-p1-stage-c-covariance
