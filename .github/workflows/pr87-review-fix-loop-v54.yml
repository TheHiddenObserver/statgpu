name: PR87 review fix batch v54

on:
  push:
    branches:
      - agent/maintenance-0.2.4-0.2.5

permissions:
  contents: write

concurrency:
  group: pr87-review-fix-v54
  cancel-in-progress: false

jobs:
  apply-review-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply statistical and failure-semantics fixes
        run: |
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path
          payload = "".join(
              Path(f"pr87_patch_v54.part{i}").read_text(encoding="utf-8")
              for i in range(8)
          )
          source = gzip.decompress(base64.b64decode(payload, validate=True))
          exec(compile(source, "pr87_patch_v54.py", "exec"))
          PY
      - name: Adapt Torch parity test for CPU-only runner
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("dev/tests/test_maintenance_024_025.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("def test_weighted_logistic_torch_matches_cpu():")
          end = text.index("\n\n@pytest.mark.parametrize(", start)
          replacement = '''def test_weighted_logistic_torch_matches_cpu(monkeypatch):
              torch = pytest.importorskip("torch")
              import statgpu.linear_model.wrappers._logistic as logistic_mod
              from statgpu.linear_model.wrappers._logistic import LogisticRegression

              X, y, weight = _weighted_logistic_fixture()
              cpu = LogisticRegression(
                  C=2.5, max_iter=300, tol=1e-11, device="cpu", compute_inference=True
              ).fit(X, y, sample_weight=weight)

              # Exercise the Torch implementation on a CPU-only hosted runner
              # without weakening the public explicit-Torch CUDA contract.
              monkeypatch.setattr(logistic_mod, "_get_torch_device_str", lambda: "cpu")
              torch_model = LogisticRegression(
                  C=2.5, max_iter=300, tol=1e-11, device="cpu", compute_inference=True
              )
              torch_model._y = y.astype(float)
              torch_model._sample_weight = weight.astype(float)
              torch_model._weight_sum = float(np.sum(weight))
              torch_model._fit_torch(
                  torch.as_tensor(X, dtype=torch.float64),
                  torch.as_tensor(y, dtype=torch.float64),
                  torch.as_tensor(weight, dtype=torch.float64),
              )

              np.testing.assert_allclose(
                  torch_model.intercept_, cpu.intercept_, rtol=1e-8, atol=1e-9
              )
              np.testing.assert_allclose(
                  torch_model.coef_, cpu.coef_, rtol=1e-8, atol=1e-9
              )
              np.testing.assert_allclose(
                  torch_model._bse, cpu._bse, rtol=1e-8, atol=1e-9
              )
              np.testing.assert_allclose(
                  torch_model._loglik, cpu._loglik, rtol=1e-9, atol=1e-9
              )
          '''
          replacement = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in replacement.splitlines()
          )
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY
      - name: Install validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation,formula]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile changed modules
        run: |
          python -m py_compile statgpu/linear_model/wrappers/_logistic.py statgpu/linear_model/penalized/_penalized_cv.py statgpu/linear_model/penalized/_fit_mixin.py dev/tests/test_maintenance_024_025.py
      - name: Run targeted statistical and exception tests
        run: |
          python -m pytest dev/tests/test_maintenance_024_025.py::test_weighted_logistic_cpu_matches_integer_row_replication dev/tests/test_maintenance_024_025.py::test_weighted_logistic_torch_matches_cpu dev/tests/test_maintenance_024_025.py::test_weighted_logistic_validates_weights_before_irls dev/tests/test_maintenance_024_025.py::test_alpha_grid_fallback_classifier_is_narrow dev/tests/test_maintenance_024_025.py::test_exact_cupy_ridge_does_not_mask_cuda_oom -q --tb=short
      - name: Run full CPU and documentation validation
        run: |
          python -m pytest dev/tests -q --tb=short
          python dev/validation/fix_docs_links.py --check
          python dev/validation/check_docs_contracts.py
      - name: Commit reviewed source fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f pr87_patch_v54.part0 pr87_patch_v54.part1 pr87_patch_v54.part2 pr87_patch_v54.part3 pr87_patch_v54.part4 pr87_patch_v54.part5 pr87_patch_v54.part6 pr87_patch_v54.part7 .github/workflows/pr87-review-fix-loop-v54.yml
          git add statgpu/linear_model/wrappers/_logistic.py statgpu/linear_model/penalized/_penalized_cv.py statgpu/linear_model/penalized/_fit_mixin.py dev/tests/test_maintenance_024_025.py CHANGELOG.md docs/en/changelog.md docs/cn/changelog.md
          git commit -m "fix: correct weighted logistic and fallback semantics"
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5