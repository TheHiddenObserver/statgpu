name: PR87 review round 2 validation

on:
  push:
    branches: [agent/maintenance-0.2.4-0.2.5]
    paths: [.github/workflows/pr87-review-round2-validation.yml]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation,formula]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run every new review-fix test
        run: python -m pytest -q dev/tests/test_pr87_code_review_fix_cycle.py
      - name: Run adjacent IRLS, logistic, CV, and validation regressions
        run: |
          python -m pytest -q \
            dev/tests/test_logistic.py \
            dev/tests/test_loss_penalty_solver_matrix.py \
            dev/tests/test_maintenance_024_025.py \
            -k "irls or logistic or binary or sample_weight or infrastructure or alpha_grid or overflow"
      - name: Static checks
        run: |
          python -m compileall -q statgpu dev/tests/test_pr87_code_review_fix_cycle.py
          git diff --check
      - name: Self-delete after success
        shell: bash
        run: |
          rm .github/workflows/pr87-review-round2-validation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/pr87-review-round2-validation.yml
          git commit -m "test: validate PR87 code review fixes"
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
