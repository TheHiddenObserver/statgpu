name: Review fix final follow-up

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply-final-follow-up:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply final follow-up
        run: |
          python .github/review_fix_final_followup.py
          python .github/review_fix_final_followup_v2.py
      - name: Install validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[validation,formula]' pytest packaging
      - name: Run focused regression contracts
        run: |
          python -m pytest -q --tb=short \
            dev/tests/test_maintenance_024_025.py \
            dev/tests/test_pr80_cox_cv_split_lifecycle_contract.py::test_set_params_invalidates_private_generator_snapshot \
            dev/tests/test_legacy_sklearn_integration.py \
            dev/tests/test_second_full_review.py::TestEstimatorCloneAndFeatureSelectionBackend::test_all_default_public_estimators_clone
      - name: Commit final follow-up
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add statgpu/_base.py statgpu/backends/_torch_compile.py dev/tests/test_maintenance_024_025.py
          git commit -m 'fix: close remaining review contracts'
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
