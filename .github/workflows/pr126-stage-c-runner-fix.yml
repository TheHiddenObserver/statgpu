name: PR126 Stage C runner metadata patch

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - '.github/workflows/pr126-stage-c-runner-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest
      - run: python dev/benchmarks/_pr126_patch_stage_c_runner_metadata.py
      - run: python -m pytest dev/tests/test_panel_stage_c_physical_runner_contract.py -q --tb=short
      - run: git diff --check
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dev/benchmarks/validate_panel_stage_c_gpu.py
          git commit -m 'fix: compare Stage C physical metadata with numeric tolerance'
          git push origin HEAD:agent/panel-p1-stage-c-covariance
