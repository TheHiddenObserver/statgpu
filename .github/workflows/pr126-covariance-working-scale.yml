name: PR126 final cleanup gate

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - 'dev/validation/pr126_fresh_review_trigger.txt'

permissions:
  contents: write

jobs:
  cleanup-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install maintained review environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" pytest
          python -m pip install "torch==2.0.1+cpu" --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[validation,formula]"
      - name: Synchronize public changelog and remove temporary PR126 scaffolding
        run: |
          python dev/validation/pr126_final_cleanup_once.py
          git rm -f --ignore-unmatch \
            dev/validation/pr126_covariance_reduction_followup_once.py \
            dev/validation/pr126_covariance_working_scale_followup.py \
            dev/validation/pr126_covariance_working_scale_once.py \
            dev/validation/pr126_covariance_working_scale_result.txt \
            dev/validation/pr126_covariance_working_scale_trigger.txt \
            dev/validation/pr126_estimator_scale_fixups2_once.py \
            dev/validation/pr126_estimator_scale_fixups_once.py \
            dev/validation/pr126_estimator_scale_followup_once.py \
            dev/validation/pr126_fresh_review_closeout_once.py \
            dev/validation/pr126_fresh_review_followup_once.py \
            dev/validation/pr126_fresh_review_followup_fixup_once.py \
            dev/validation/pr126_fresh_review_trigger.txt \
            dev/validation/pr126_fresh_review_result.txt \
            dev/validation/pr126_solver_covariance_tail_once.py \
            dev/validation/pr126_subnormal_reduction_once.py \
            dev/validation/pr126_final_cleanup_once.py
          leftovers="$(find dev/validation -maxdepth 1 -type f -name 'pr126_*' -print)"
          if [ -n "$leftovers" ]; then
            echo "Unexpected PR126 review scaffolding remains:"
            echo "$leftovers"
            exit 1
          fi
      - name: Run clean-tree focused regressions and documentation gates
        run: |
          python -m pytest \
            dev/tests/test_panel_stage_c_final_review_fixes.py \
            dev/tests/test_panel_stage_c_physical_runner_contract.py \
            dev/tests/test_panel_stage_c_covariance.py \
            dev/tests/test_panel_stage_c_inference_guard.py \
            dev/tests/test_panel_stage_c_full_rank_conditioning.py \
            dev/tests/test_panel_stage_b_fit_statistics.py \
            dev/tests/test_panel_stage_b_review_regressions.py \
            dev/tests/test_panel_stage_b_torch_cpu.py \
            dev/tests/test_panel_two_way_demean_scale.py \
            dev/tests/test_benchmark_catalog.py \
            dev/tests/test_benchmark_frontend_data.py \
            dev/tests/test_benchmark_inventory_v2.py \
            -q --tb=short
          python dev/validation/fix_docs_links.py --check
          python dev/validation/check_docs_contracts.py
          python -m compileall -q statgpu/panel dev/benchmarks/validate_panel_stage_c_gpu.py
          git diff --check
      - name: Commit clean review tree
        run: |
          git config user.name "Ziqian Lin"
          git config user.email "51812297+TheHiddenObserver@users.noreply.github.com"
          git add -A docs/en/changelog.md docs/cn/changelog.md dev/validation
          git commit -m "chore: clean PR126 review scaffolding"
          git push origin HEAD:agent/panel-p1-stage-c-covariance
