name: PR126 fresh numerical review gate

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - 'dev/validation/pr126_fresh_review_trigger.txt'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install maintained Torch CPU review environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" pytest
          python -m pip install "torch==2.0.1+cpu" --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[validation,formula]"
      - name: Apply and diagnose fresh evidence followup
        run: |
          set +e
          python dev/validation/pr126_fresh_review_followup_once.py > /tmp/patch.log 2>&1
          main_patch_rc=$?
          if [ "$main_patch_rc" -eq 0 ]; then
            python dev/validation/pr126_fresh_review_followup_fixup_once.py >> /tmp/patch.log 2>&1
            fixup_rc=$?
          else
            fixup_rc=99
          fi
          if [ "$main_patch_rc" -eq 0 ] && [ "$fixup_rc" -eq 0 ]; then
            patch_rc=0
            python -m pytest \
              dev/tests/test_panel_stage_c_final_review_fixes.py \
              dev/tests/test_panel_stage_c_physical_runner_contract.py \
              dev/tests/test_panel_stage_c_covariance.py \
              dev/tests/test_panel_stage_c_inference_guard.py \
              dev/tests/test_panel_stage_b_review_regressions.py \
              dev/tests/test_panel_stage_b_torch_cpu.py \
              -q --tb=short > /tmp/pytest.log 2>&1
            pytest_rc=$?
            python dev/validation/fix_docs_links.py --check > /tmp/docs-links.log 2>&1
            docs_links_rc=$?
            python dev/validation/check_docs_contracts.py > /tmp/docs-contracts.log 2>&1
            docs_contracts_rc=$?
            python -m compileall -q statgpu/panel dev/benchmarks/validate_panel_stage_c_gpu.py dev/tests/test_panel_stage_c_final_review_fixes.py dev/tests/test_panel_stage_c_physical_runner_contract.py > /tmp/compile.log 2>&1
            compile_rc=$?
            git diff --check > /tmp/diff.log 2>&1
            diff_rc=$?
          else
            patch_rc=1
            pytest_rc=99
            docs_links_rc=99
            docs_contracts_rc=99
            compile_rc=99
            diff_rc=99
            echo "pytest skipped because patch failed" > /tmp/pytest.log
            echo "docs skipped because patch failed" > /tmp/docs-links.log
            echo "docs skipped because patch failed" > /tmp/docs-contracts.log
            echo "compile skipped because patch failed" > /tmp/compile.log
            echo "diff-check skipped because patch failed" > /tmp/diff.log
          fi
          {
            echo "main_patch_rc=$main_patch_rc"
            echo "fixup_rc=$fixup_rc"
            echo "patch_rc=$patch_rc"
            echo "pytest_rc=$pytest_rc"
            echo "docs_links_rc=$docs_links_rc"
            echo "docs_contracts_rc=$docs_contracts_rc"
            echo "compile_rc=$compile_rc"
            echo "diff_rc=$diff_rc"
            echo "--- patch log ---"
            cat /tmp/patch.log
            echo "--- pytest log ---"
            tail -420 /tmp/pytest.log
            echo "--- docs links ---"
            cat /tmp/docs-links.log
            echo "--- docs contracts ---"
            cat /tmp/docs-contracts.log
            echo "--- compile log ---"
            cat /tmp/compile.log
            echo "--- diff log ---"
            cat /tmp/diff.log
          } > dev/validation/pr126_fresh_review_result.txt
          tail -520 dev/validation/pr126_fresh_review_result.txt
          exit 0
      - name: Commit substantive followup or diagnostic
        run: |
          git config user.name "Ziqian Lin"
          git config user.email "51812297+TheHiddenObserver@users.noreply.github.com"
          if grep -q '^patch_rc=0$' dev/validation/pr126_fresh_review_result.txt \
             && grep -q '^pytest_rc=0$' dev/validation/pr126_fresh_review_result.txt \
             && grep -q '^docs_links_rc=0$' dev/validation/pr126_fresh_review_result.txt \
             && grep -q '^docs_contracts_rc=0$' dev/validation/pr126_fresh_review_result.txt \
             && grep -q '^compile_rc=0$' dev/validation/pr126_fresh_review_result.txt \
             && grep -q '^diff_rc=0$' dev/validation/pr126_fresh_review_result.txt; then
            git add \
              dev/benchmarks/validate_panel_stage_c_gpu.py \
              dev/tests/test_panel_stage_c_final_review_fixes.py \
              dev/tests/test_panel_stage_c_physical_runner_contract.py \
              docs/en/panel/diagnostics.md \
              docs/cn/panel/diagnostics.md \
              CHANGELOG.md \
              dev/reviews/pr126_final_review_2026-08-17.md
            git commit -m "test: extend panel extreme-scale acceptance"
            git push origin HEAD:agent/panel-p1-stage-c-covariance
          else
            git add dev/validation/pr126_fresh_review_result.txt
            git commit -m "ci: record PR126 fresh evidence followup failure"
            git push origin HEAD:agent/panel-p1-stage-c-covariance
          fi
