name: PR126 covariance working-scale review gate

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install maintained Torch CPU review environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" pytest
          python -m pip install "torch==2.0.1+cpu" --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Apply and diagnose estimator-scale follow-up
        run: |
          set +e
          python dev/validation/pr126_estimator_scale_followup_once.py > /tmp/patch.log 2>&1
          first_rc=$?
          if [ "$first_rc" -eq 0 ]; then
            python dev/validation/pr126_estimator_scale_fixups_once.py >> /tmp/patch.log 2>&1
            second_rc=$?
          else
            second_rc=99
          fi
          if [ "$first_rc" -eq 0 ] && [ "$second_rc" -eq 0 ]; then
            patch_rc=0
            python -m pytest \
              dev/tests/test_panel_stage_c_final_review_fixes.py \
              dev/tests/test_panel_stage_c_covariance.py \
              dev/tests/test_panel_stage_c_inference_guard.py \
              dev/tests/test_panel_stage_c_full_rank_conditioning.py \
              dev/tests/test_panel_stage_b_fit_statistics.py \
              dev/tests/test_panel_stage_b_review_regressions.py \
              dev/tests/test_panel_stage_b_torch_cpu.py \
              dev/tests/test_panel_stage_a_golden.py \
              -q --tb=short > /tmp/pytest.log 2>&1
            pytest_rc=$?
            python -m compileall -q statgpu/panel dev/tests/test_panel_stage_c_final_review_fixes.py > /tmp/compile.log 2>&1
            compile_rc=$?
            git diff --check > /tmp/diff.log 2>&1
            diff_rc=$?
          else
            patch_rc=1
            pytest_rc=99
            compile_rc=99
            diff_rc=99
            echo "pytest skipped because patch failed" > /tmp/pytest.log
            echo "compile skipped because patch failed" > /tmp/compile.log
            echo "diff-check skipped because patch failed" > /tmp/diff.log
          fi
          {
            echo "first_patch_rc=$first_rc"
            echo "second_patch_rc=$second_rc"
            echo "patch_rc=$patch_rc"
            echo "pytest_rc=$pytest_rc"
            echo "compile_rc=$compile_rc"
            echo "diff_rc=$diff_rc"
            echo "--- patch log ---"
            cat /tmp/patch.log
            echo "--- pytest log ---"
            tail -320 /tmp/pytest.log
            echo "--- compile log ---"
            cat /tmp/compile.log
            echo "--- diff log ---"
            cat /tmp/diff.log
          } > dev/validation/pr126_covariance_working_scale_result.txt
          tail -380 dev/validation/pr126_covariance_working_scale_result.txt
          exit 0
      - name: Commit substantive follow-up or diagnostic
        run: |
          git config user.name "Ziqian Lin"
          git config user.email "51812297+TheHiddenObserver@users.noreply.github.com"
          if grep -q '^patch_rc=0$' dev/validation/pr126_covariance_working_scale_result.txt \
             && grep -q '^pytest_rc=0$' dev/validation/pr126_covariance_working_scale_result.txt \
             && grep -q '^compile_rc=0$' dev/validation/pr126_covariance_working_scale_result.txt \
             && grep -q '^diff_rc=0$' dev/validation/pr126_covariance_working_scale_result.txt; then
            git add \
              statgpu/panel/_linalg.py \
              statgpu/panel/_utils.py \
              statgpu/panel/_diagnostics.py \
              statgpu/panel/_pooled.py \
              statgpu/panel/_between.py \
              statgpu/panel/_first_diff.py \
              statgpu/panel/_fixed_effects.py \
              statgpu/panel/_random_effects.py \
              dev/tests/test_panel_stage_c_final_review_fixes.py
            if ! git diff --cached --quiet; then
              git commit -m "fix: stabilize panel estimator scale reductions"
              git push origin HEAD:agent/panel-p1-stage-c-covariance
            fi
          else
            git add dev/validation/pr126_covariance_working_scale_result.txt
            git commit -m "ci: record PR126 estimator-scale failure"
            git push origin HEAD:agent/panel-p1-stage-c-covariance
          fi