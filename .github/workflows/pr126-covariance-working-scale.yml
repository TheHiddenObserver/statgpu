name: PR126 covariance working-scale review gate

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install maintained Torch CPU review environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" pytest
          python -m pip install "torch==2.0.1+cpu" --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Apply working-scale covariance patch
        run: python dev/validation/pr126_covariance_working_scale_once.py
      - name: Run focused covariance and diagnostics regressions
        run: |
          python -m pytest \
            dev/tests/test_panel_stage_c_final_review_fixes.py \
            dev/tests/test_panel_stage_c_covariance.py \
            dev/tests/test_panel_stage_c_inference_guard.py \
            dev/tests/test_panel_stage_b_fit_statistics.py \
            dev/tests/test_panel_stage_b_torch_cpu.py \
            -q --tb=short
          python -m compileall -q statgpu/panel dev/tests/test_panel_stage_c_final_review_fixes.py
          git diff --check
      - name: Commit substantive fix only
        run: |
          git config user.name "Ziqian Lin"
          git config user.email "51812297+TheHiddenObserver@users.noreply.github.com"
          git add \
            statgpu/panel/_linalg.py \
            statgpu/panel/_covariance.py \
            statgpu/panel/_diagnostics.py \
            dev/tests/test_panel_stage_c_final_review_fixes.py
          if git diff --cached --quiet; then
            echo "No substantive changes to commit"
          else
            git commit -m "fix: stabilize panel covariance working scale"
            git push origin HEAD:agent/panel-p1-stage-c-covariance
          fi
