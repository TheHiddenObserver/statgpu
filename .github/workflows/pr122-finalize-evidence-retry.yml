name: PR122 retry evidence contract

on:
  push:
    branches: [agent/panel-p1-stage-b-diagnostics]
    paths:
      - '.github/workflows/pr122-finalize-evidence-retry.yml'

permissions:
  contents: write

jobs:
  update-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update Stage-B domain coverage contract
        env:
          REPLACEMENT_B64: 
        run: |
          python - <<'PY'
          import base64
          import os
          import re
          from pathlib import Path
          path = Path('dev/tests/test_frontend_domain_coverage.py')
          text = path.read_text(encoding='utf-8')
          replacement = base64.b64decode(os.environ['REPLACEMENT_B64']).decode('utf-8')
          text, count = re.subn(
              r'def test_panel_stage_b_physical_validation_is_published_without_timing\(canonical_output\):\n.*?(?=\ndef test_unsupervised_exposes_complete_source_matrix)',
              replacement,
              text,
              flags=re.S,
          )
          assert count == 1, count
          old_count = 'assert len(output["runs"]) == 1860\n    assert report["runs_generated"] == 1860'
          new_count = 'assert len(output["runs"]) == 1862\n    assert report["runs_generated"] == 1862'
          assert old_count in text
          text = text.replace(old_count, new_count)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit only the domain contract
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dev/tests/test_frontend_domain_coverage.py
          git commit -m 'test: align PR122 final frontend coverage'
          git push origin HEAD:agent/panel-p1-stage-b-diagnostics
