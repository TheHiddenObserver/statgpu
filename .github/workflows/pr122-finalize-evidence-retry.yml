name: PR122 retry evidence finalization

on:
  push:
    branches: [agent/panel-p1-stage-b-diagnostics]
    paths:
      - '.github/workflows/pr122-finalize-evidence-retry.yml'

permissions:
  contents: write

jobs:
  prepare-retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update Stage-B domain coverage contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('dev/tests/test_frontend_domain_coverage.py')
          text = path.read_text(encoding='utf-8')
          replacement = '''def test_panel_stage_b_physical_validation_is_published_without_timing(canonical_output):
    output, _, _, _ = canonical_output
    rows = [
        run
        for run in output["runs"]
        if run["source"]["source_id"]
        == "panel-stage-b-pr122-20260809-2056f836bfe2"
    ]
    assert len(rows) == 44
    assert {run["backend"] for run in rows} == {"cupy", "torch"}
    assert {run["model_id"] for run in rows} == {
        "PooledOLS",
        "BetweenOLS",
        "FirstDifferenceOLS",
        "PanelOLS",
        "RandomEffects",
        "FamaMacBeth",
    }
    assert all(run["metrics"]["validation"]["status"] == "pass" for run in rows)
    assert all("timing" not in run["metrics"] for run in rows)
    assert all("speedup" not in run["metrics"] for run in rows)
    assert all(
        run["parameters"]["measurement_git_sha"]
        == "2701aa9feb3796c33c94e6480fcb78c80c6a809c"
        for run in rows
    )

    hausman = [run for run in rows if run["parameters"].get("diagnostic") == "hausman"]
    assert len(hausman) == 10
    applicable = [
        run
        for run in hausman
        if run["parameters"].get("diagnostic_fixture") == "nonzero-effect-applicable"
    ]
    assert len(applicable) == 2
    assert {run["backend"] for run in applicable} == {"cupy", "torch"}
    assert all(run["parameters"]["applicable"] is True for run in applicable)
    assert {run["parameters"]["df"] for run in applicable} == {1.0}
    assert all(run["parameters"]["statistic"] >= 0.0 for run in applicable)
    assert all(0.0 <= run["parameters"]["pvalue"] <= 1.0 for run in applicable)

    inapplicable = [run for run in hausman if run not in applicable]
    assert len(inapplicable) == 8
    assert all(run["parameters"]["applicable"] is False for run in inapplicable)
    assert {run["parameters"]["parameterization"] for run in hausman} == {
        "standard",
        "re-explicit-constant",
    }
    assert {run["variant"] for run in hausman} == {
        "hausman-balanced",
        "hausman-unbalanced",
        "hausman-re-explicit-constant-balanced",
        "hausman-re-explicit-constant-unbalanced",
        "hausman-applicable-nonzero-effect",
    }

'''
          text, count = re.subn(
              r'def test_panel_stage_b_physical_validation_is_published_without_timing\(canonical_output\):\n.*?(?=\ndef test_unsupervised_exposes_complete_source_matrix)',
              replacement,
              text,
              flags=re.S,
          )
          assert count == 1, count
          text = text.replace(
              'assert len(output["runs"]) == 1860\n    assert report["runs_generated"] == 1860',
              'assert len(output["runs"]) == 1862\n    assert report["runs_generated"] == 1862',
          )
          path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/pr122-finalize-evidence.yml')
          workflow.write_text(
              workflow.read_text(encoding='utf-8')
              + '\n# retry after final Stage-B domain coverage contract update\n',
              encoding='utf-8',
          )
          PY
      - name: Commit retry preparation and remove helper
        run: |
          rm .github/workflows/pr122-finalize-evidence-retry.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: align PR122 final frontend coverage'
          git push origin HEAD:agent/panel-p1-stage-b-diagnostics
