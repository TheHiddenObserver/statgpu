name: PR126 solver import cleanup once

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - .github/workflows/pr126-unused-import-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply cleanup
        run: python dev/validation/pr126_unused_import_cleanup_once.py

      - name: Validate cleanup
        run: |
          python -m compileall -q statgpu/panel
          python - <<'PY'
          from pathlib import Path
          for path in (
              'statgpu/panel/_fixed_effects.py',
              'statgpu/panel/_between.py',
              'statgpu/panel/_first_diff.py',
          ):
              text = Path(path).read_text()
              assert 'from statgpu.panel._linalg import panel_lstsq, panel_matrix_rank' not in text
          PY
          git diff --check

      - name: Commit cleanup and remove staging helpers
        run: |
          rm .github/workflows/pr126-unused-import-cleanup.yml
          rm dev/validation/pr126_unused_import_cleanup_once.py
          git config user.name "statgpu-review-fix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove obsolete panel rank imports"
          git push origin HEAD:agent/panel-p1-stage-c-covariance
