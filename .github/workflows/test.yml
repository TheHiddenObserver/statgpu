name: PR80 Atomic Review Fix

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  apply-atomic-review-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/survival-gpu-completion
          fetch-depth: 0
      - name: Apply reviewed source and test patches
        run: |
          python - <<'PY'
          from pathlib import Path

          cox_path = Path("statgpu/survival/_cox.py")
          text = cox_path.read_text(encoding="utf-8")
          old = '''        self._check_is_fitted()
          if event is None:
              target = np.asarray(self._to_numpy(time), dtype=np.float64)
              if target.ndim != 2 or target.shape[1] not in (2, 3):
                  raise ValueError("packed survival targets require [time, event] or [start, stop, event]")
              if target.shape[1] == 2:
                  time, event = target[:, 0], target[:, 1]
              else:
                  if start is not None:
                      raise ValueError("start is already present in the packed survival target")
                  start, time, event = target[:, 0], target[:, 1], target[:, 2]
          X_arr, backend, coef = self._prepare_prediction_X(X)
          xp = backend.xp
          n_samples = int(X_arr.shape[0])
  '''
          new = '''        self._check_is_fitted()
          X_arr, backend, coef = self._prepare_prediction_X(X)
          xp = backend.xp
          n_samples = int(X_arr.shape[0])
          if event is None:
              target = backend.asarray(time, dtype=backend.float64)
              if target.ndim != 2 or int(target.shape[1]) not in (2, 3):
                  raise ValueError("packed survival targets require [time, event] or [start, stop, event]")
              if int(target.shape[0]) != n_samples:
                  raise ValueError("X and packed survival target must contain the same number of rows")
              if int(target.shape[1]) == 2:
                  time, event = target[:, 0], target[:, 1]
              else:
                  if start is not None:
                      raise ValueError("start is already present in the packed survival target")
                  start, time, event = target[:, 0], target[:, 1], target[:, 2]
  '''
          if text.count(old) != 1:
              raise RuntimeError("expected one CoxPH.score packed-target block")
          cox_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          loss_path = Path("statgpu/losses/_cox_ph.py")
          text = loss_path.read_text(encoding="utf-8")
          old = '''    def _shared_objective(self, coef_dev, *, compute_derivatives: bool):
          """Use the audited three-backend risk-set implementation."""
          if self._n_events == 0:
              return self._zero_objective(compute_derivatives=compute_derivatives)
          return cox_counting_process_objective(
  '''
          new = '''    def _shared_objective(self, coef_dev, *, compute_derivatives: bool):
          """Use the audited three-backend risk-set implementation."""
          xp = _get_xp(self._X_sorted)
          n_features = int(self._X_sorted.shape[1])
          if int(coef_dev.shape[0]) != n_features:
              raise ValueError("coef must have shape (n_features,)")
          if _to_float_scalar(xp.sum(~xp.isfinite(coef_dev))) > 0:
              raise ValueError("coef must contain only finite values")
          if self._n_events == 0:
              return self._zero_objective(compute_derivatives=compute_derivatives)
          return cox_counting_process_objective(
  '''
          if text.count(old) != 1:
              raise RuntimeError("expected one shared Cox objective block")
          loss_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          test_path = Path("dev/tests/test_pr80_post_review_fixes.py")
          text = test_path.read_text(encoding="utf-8")
          addition = '''\n\ndef test_cox_score_packed_target_preserves_active_backend():
      import statgpu.survival._cox as cox_module

      source = inspect.getsource(cox_module.CoxPH.score)
      assert "np.asarray(self._to_numpy(time)" not in source
      assert "target = backend.asarray(time" in source


def test_all_censored_loss_hessian_validates_coefficient_shape():
      X = np.ones((4, 1), dtype=np.float64)
      y = np.column_stack(
          [np.arange(1.0, 5.0), np.zeros(4, dtype=np.float64)]
      )
      loss = CoxPartialLikelihoodLoss(ties="breslow")
      with pytest.raises(ValueError, match="coef must have shape"):
          loss.hessian(X, y, np.zeros(2, dtype=np.float64))
  '''
          marker = "def test_cox_score_packed_target_preserves_active_backend():"
          if marker not in text:
              test_path.write_text(text.rstrip() + addition + "\n", encoding="utf-8")
          PY
      - name: Restore read-only validation workflow
        run: git show a7aff89678803f97cfaadae8381eaae02067bc2b:.github/workflows/test.yml > .github/workflows/test.yml
      - name: Commit atomic review fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/test.yml statgpu/survival/_cox.py statgpu/losses/_cox_ph.py dev/tests/test_pr80_post_review_fixes.py
          git diff --cached --check
          git commit -m "fix(cox): preserve packed target backend"
          git push origin HEAD:codex/survival-gpu-completion
