name: Tests

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  apply-pr80-cpu-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/survival-gpu-completion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch distribution calls and line-search regression
        run: |
          python - <<'PY'
          from pathlib import Path

          cox_path = Path("statgpu/survival/_cox.py")
          text = cox_path.read_text(encoding="utf-8")
          replacements = {
              'self._lr_test_stat, int(Xb.shape[1])': 'self._lr_test_stat, df=int(Xb.shape[1])',
              'self._wald_test_stat, int(Xb.shape[1])': 'self._wald_test_stat, df=int(Xb.shape[1])',
              'self._score_test_stat, int(Xb.shape[1])': 'self._score_test_stat, df=int(Xb.shape[1])',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise RuntimeError(f"expected one Cox chi2 call for {old!r}")
              text = text.replace(old, new, 1)
          cox_path.write_text(text, encoding="utf-8")

          test_path = Path("dev/tests/test_pr80_post_review_fixes.py")
          text = test_path.read_text(encoding="utf-8")
          old = '"log_likelihood": np.asarray(-(beta_value**2)),'
          new = '"log_likelihood": np.asarray(0.0 if beta_value == 0.0 else -1.0),'
          if text.count(old) != 1:
              raise RuntimeError("expected one line-search test objective")
          test_path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Install and run focused tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation,formula]"
          python -m pytest dev/tests/test_cox.py dev/tests/test_pr80_post_review_fixes.py -q --tb=short
      - name: Commit code-only fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add statgpu/survival/_cox.py dev/tests/test_pr80_post_review_fixes.py
          git diff --cached --check
          git commit -m "fix(cox): align unified distribution calls"
          git push origin HEAD:codex/survival-gpu-completion
