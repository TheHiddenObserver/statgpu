name: Tests

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  apply-pr80-review-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/survival-gpu-completion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply review fixes
        id: apply
        continue-on-error: true
        run: python dev/_apply_pr80_review_fixes.py > pr80-apply.log 2>&1
      - name: Upload applicator diagnostics
        if: steps.apply.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pr80-applicator-diagnostics
          path: pr80-apply.log
          if-no-files-found: error
      - name: Surface applicator failure
        if: steps.apply.outcome == 'failure'
        run: |
          cat pr80-apply.log
          exit 1
      - name: Compile changed Python files
        if: steps.apply.outcome == 'success'
        run: >-
          python -m compileall -q
          statgpu/losses/_cox_ph.py
          statgpu/linear_model/penalized/_penalized_cox.py
          statgpu/survival/_cox.py
          statgpu/survival/_cox_cv.py
          statgpu/cross_validation/_base.py
          statgpu/survival/_cox_counting.py
          dev/tests/test_pr80_post_review_fixes.py
      - name: Commit atomic review fixes
        if: steps.apply.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(cox): address PR80 review findings"
          git push origin HEAD:codex/survival-gpu-completion
