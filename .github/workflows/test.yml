name: Tests

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  pr80-cpu-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation,formula]"
      - name: Run focused Cox diagnostics
        id: focused
        continue-on-error: true
        run: python -m pytest dev/tests/test_cox.py dev/tests/test_pr80_post_review_fixes.py -vv --tb=long > pr80-cpu-diagnostics.log 2>&1
      - name: Upload focused diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: pr80-cpu-diagnostics
          path: pr80-cpu-diagnostics.log
          if-no-files-found: error
      - name: Enforce focused result
        if: steps.focused.outcome == 'failure'
        run: |
          tail -n 200 pr80-cpu-diagnostics.log
          exit 1
