name: Tests

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  apply-pr80-all-censored-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/survival-gpu-completion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore all-censored loss semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("statgpu/losses/_cox_ph.py")
          text = path.read_text(encoding="utf-8")
          old = '''        if _to_float_scalar(xp.sum(event)) <= 0:
            raise ValueError("at least one observed event is required")

        self._x_reference = (
'''
          new = '''        self._x_reference = (
'''
          if text.count(old) != 1:
              raise RuntimeError("expected one all-censored preprocessing rejection")
          text = text.replace(old, new, 1)

          old = '''    def _shared_objective(self, coef_dev, *, compute_derivatives: bool):
        """Use the audited three-backend risk-set implementation."""
        return cox_counting_process_objective(
            coef_dev,
            self._X_sorted,
            self._time_sorted,
            self._event_sorted,
            ties=self.ties,
            compute_derivatives=compute_derivatives,
        )
'''
          new = '''    def _shared_objective(self, coef_dev, *, compute_derivatives: bool):
        """Use the audited three-backend risk-set implementation."""
        if self._n_events == 0:
            xp = _get_xp(self._X_sorted)
            n_features = int(self._X_sorted.shape[1])
            result = {
                "log_likelihood": _backend_zeros((), xp, self._X_sorted)
            }
            if compute_derivatives:
                result["score"] = _backend_zeros(
                    (n_features,), xp, self._X_sorted
                )
                result["information"] = _backend_zeros(
                    (n_features, n_features), xp, self._X_sorted
                )
            return result
        return cox_counting_process_objective(
            coef_dev,
            self._X_sorted,
            self._time_sorted,
            self._event_sorted,
            ties=self.ties,
            compute_derivatives=compute_derivatives,
        )
'''
          if text.count(old) != 1:
              raise RuntimeError("expected one shared Cox loss objective")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Install and test loss edge cases
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation,formula]"
          python -m pytest \
            dev/tests/test_losses.py::TestEdgeCases::test_cox_all_censored \
            dev/tests/test_penalized_cox_completion.py \
            dev/tests/test_pr80_post_review_fixes.py \
            -q --tb=short
      - name: Commit code-only fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add statgpu/losses/_cox_ph.py
          git diff --cached --check
          git commit -m "fix(cox): preserve all-censored loss contract"
          git push origin HEAD:codex/survival-gpu-completion
