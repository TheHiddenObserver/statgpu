name: Tests

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  pr80-full-cpu-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation,formula]"
      - name: Run full CPU diagnostics
        id: full
        continue-on-error: true
        run: python -m pytest dev/tests -q --tb=long > pr80-full-cpu.log 2>&1
      - name: Upload full CPU diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: pr80-full-cpu-diagnostics
          path: pr80-full-cpu.log
          if-no-files-found: error
      - name: Enforce result
        if: steps.full.outcome == 'failure'
        run: |
          tail -n 200 pr80-full-cpu.log
          exit 1
