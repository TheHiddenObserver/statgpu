name: PR122 final evidence promotion v3

on:
  push:
    branches: [agent/panel-p1-stage-b-diagnostics]
    paths:
      - '.github/workflows/pr122-finalize-evidence-v3.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: python -m pip install -U pip pytest 'jsonschema[format]'
      - name: Execute reviewed promotion step
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/pr122-finalize-evidence.yml').read_text(encoding='utf-8')
          start_marker = "      - name: Promote exact-head P100 evidence and contracts\n        run: |\n"
          end_marker = "\n      - name: Generate canonical frontend assets"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          block = source[start:end]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              elif line:
                  raise SystemExit(f'unexpected promotion indentation: {line!r}')
              else:
                  lines.append('')
          Path('/tmp/pr122-promote.sh').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          bash /tmp/pr122-promote.sh
      - name: Generate canonical frontend assets
        run: |
          python dev/benchmarks/generate_benchmark_data.py \
            --out frontend/public/data/benchmark_data.json \
            --report frontend/public/data/parse_report.json \
            --inventory-out frontend/public/data/source_inventory.json \
            --deterministic --strict-sources
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build docs mirror
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Run focused promotion gates
        run: |
          python -m pytest \
            dev/tests/test_panel_stage_b_frontend_source.py \
            dev/tests/test_panel_stage_b_applicable_hausman_parser.py \
            dev/tests/test_benchmark_frontend_data.py \
            dev/tests/test_benchmark_catalog.py \
            dev/tests/test_benchmark_inventory_v2.py \
            dev/tests/test_frontend_contracts.py \
            dev/tests/test_frontend_domain_coverage.py -q
          python dev/benchmarks/generate_benchmark_data.py --check --strict-sources
          git diff --check
      - name: Commit promoted evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          echo 'Promoted changed paths:'
          git status --short
          git add -A
          git commit -m 'benchmark: finalize PR122 Stage B physical evidence'
          git push origin HEAD:agent/panel-p1-stage-b-diagnostics
