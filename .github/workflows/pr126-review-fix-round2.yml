name: PR126 review-fix round 2

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - .github/workflows/pr126-review-fix-round2.yml

permissions:
  contents: write

jobs:
  apply-review-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact review fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one replacement target, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "statgpu/panel/_fixed_effects.py",
              '            "_backend_name",\n            "_predict_backend_name",\n',
              '            "_backend_name",\n            "_inference_backend_name",\n            "_predict_backend_name",\n',
          )

          replace_once(
              "dev/tests/test_panel_stage_c_final_review_fixes.py",
              '    assert model._conf_int is not None\n\n    with pytest.raises(ValueError, match="cluster length"):',
              '    assert model._conf_int is not None\n    assert model._inference_backend_name == model._backend_name\n\n    with pytest.raises(ValueError, match="cluster length"):',
          )
          replace_once(
              "dev/tests/test_panel_stage_c_final_review_fixes.py",
              '    assert model._backend_name is None\n    assert model._predict_backend_name is None\n',
              '    assert model._backend_name is None\n    assert model._inference_backend_name is None\n    assert model._predict_backend_name is None\n',
          )

          replace_once(
              "docs/en/panel/covariance.md",
              "Time order matters. Numeric and datetime labels use their natural order. Ordered pandas categoricals use the category order declared by the user.",
              "Time order matters. Numeric and datetime labels use their natural order. Ordered pandas categoricals use the category order declared by the user. Plain string/object labels use lexical order; when lexical order is not the intended chronology (for example, `t1, t2, t10`), supply a numeric/datetime key or an ordered categorical instead.",
          )
          replace_once(
              "docs/cn/panel/covariance.md",
              "time ordering 会影响 Driscoll-Kraay。numeric 和 datetime labels 使用自然顺序；ordered pandas categorical 使用用户声明的 category 顺序。",
              "time ordering 会影响 Driscoll-Kraay。numeric 和 datetime labels 使用自然顺序；ordered pandas categorical 使用用户声明的 category 顺序。普通 string/object labels 按字符串字典序排序；如果字典序不是实际 chronology（例如 `t1, t2, t10`），应改用 numeric/datetime key 或 ordered categorical。",
          )

          replace_once(
              "docs/en/panel/pooled-ols.md",
              "Numeric and datetime labels use their natural order. An ordered pandas categorical uses the category order declared by the user, so labels such as `t1, t2, t10` are not silently reinterpreted in lexical order.",
              "Numeric and datetime labels use their natural order. An ordered pandas categorical uses the category order declared by the user. Plain string/object labels use lexical order, so labels such as `t1, t2, t10` should be supplied as an ordered categorical (or a numeric/datetime key) when that lexical order is not the intended chronology.",
          )
          replace_once(
              "docs/cn/panel/pooled-ols.md",
              "numeric 与 datetime label 使用自然顺序；ordered pandas categorical 使用用户声明的 category order，因此 `t1, t2, t10` 这类标签不会被静默改成字符串词典序。",
              "numeric 与 datetime label 使用自然顺序；ordered pandas categorical 使用用户声明的 category order。普通 string/object label 按字符串字典序排序，因此 `t1, t2, t10` 这类标签若不应按字典序解释，需要改用 ordered categorical 或 numeric/datetime key。",
          )

          replace_once(
              "docs/en/panel/fama-macbeth.md",
              "The order of the retained coefficient series follows `time_ids`. Numeric and datetime labels use their natural order. Ordered pandas categoricals preserve the category order explicitly declared by the user; they are not converted to lexical string order before the Newey-West lag covariance is formed.",
              "The order of the retained coefficient series follows `time_ids`. Numeric and datetime labels use their natural order. Ordered pandas categoricals preserve the category order explicitly declared by the user. Plain string/object labels use lexical order, so semantic labels such as `t1, t2, t10` should be encoded as an ordered categorical (or numeric/datetime key) when lexical order is not the intended chronology before Newey-West lag covariance is formed.",
          )
          replace_once(
              "docs/cn/panel/fama-macbeth.md",
              "retained coefficient series 的顺序由 `time_ids` 决定。numeric 与 datetime labels 使用自然顺序；ordered pandas categorical 会保留用户明确声明的 category order，不会在形成 Newey-West lag covariance 之前被转换为字符串字典序。",
              "retained coefficient series 的顺序由 `time_ids` 决定。numeric 与 datetime labels 使用自然顺序；ordered pandas categorical 会保留用户明确声明的 category order。普通 string/object labels 按字符串字典序排序，因此 `t1, t2, t10` 这类语义标签若不应按字典序解释，应改用 ordered categorical 或 numeric/datetime key，再形成 Newey-West lag covariance。",
          )

          replace_once(
              "docs/en/panel/first-difference-ols.md",
              "`entity_ids` is required. Supplying `time_ids` lets statgpu put each entity's rows in chronological order; each `(entity_id, time_id)` pair must then be unique. Ordered categorical time labels use their declared category order.",
              "`entity_ids` is required. Supplying `time_ids` lets statgpu put each entity's rows in chronological order; each `(entity_id, time_id)` pair must then be unique. Numeric and datetime time labels use natural order, ordered categoricals use their declared category order, and plain string/object labels use lexical order. Use an ordered categorical or numeric/datetime key when lexical string order is not the intended chronology.",
          )
          replace_once(
              "docs/cn/panel/first-difference-ols.md",
              "`entity_ids` 必需。提供 `time_ids` 后，statgpu 会先按时间对每个 entity 的记录排序；此时每个 `(entity_id, time_id)` 组合必须唯一。若 `time_ids` 是 ordered categorical，则使用用户声明的 category 顺序。",
              "`entity_ids` 必需。提供 `time_ids` 后，statgpu 会先按时间对每个 entity 的记录排序；此时每个 `(entity_id, time_id)` 组合必须唯一。numeric/datetime `time_ids` 使用自然顺序，ordered categorical 使用用户声明的 category 顺序，普通 string/object labels 使用字符串字典序；若字典序不是实际 chronology，应改用 ordered categorical 或 numeric/datetime key。",
          )
          PY

          python -m compileall -q statgpu/panel/_fixed_effects.py
          git diff --check

      - name: Commit review fixes and remove this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr126-review-fix-round2.yml
          git add \
            statgpu/panel/_fixed_effects.py \
            dev/tests/test_panel_stage_c_final_review_fixes.py \
            docs/en/panel/covariance.md \
            docs/cn/panel/covariance.md \
            docs/en/panel/pooled-ols.md \
            docs/cn/panel/pooled-ols.md \
            docs/en/panel/fama-macbeth.md \
            docs/cn/panel/fama-macbeth.md \
            docs/en/panel/first-difference-ols.md \
            docs/cn/panel/first-difference-ols.md
          git diff --cached --check
          git commit -m 'fix: close PR126 review state and chronology gaps'
          git push origin HEAD:${GITHUB_REF_NAME}
