name: PR126 code-review fix pass

on:
  push:
    branches: [agent/panel-p1-stage-c-covariance]
    paths:
      - '.github/workflows/pr126-code-review-fix.yml'

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply strict code-review fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'marker not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # HIGH[FORMULA/INFER]: preserve Patsy term names in PanelOLS summaries,
          # while keeping historical x1/x2/... names for the array interface.
          replace_once(
              'statgpu/panel/_fixed_effects.py',
              '''    def summary(self):\n        \"\"\"Print and return the existing structured coefficient summary.\"\"\"\n        k = len(self._params)\n        return self._panel_summary(\n            model_type=\"PanelOLS\",\n            cov_type=self._cov_type,\n            rsquared_within=self.rsquared_within,\n            entity_effects=self.entity_effects,\n            time_effects=self.time_effects,\n            feature_names_override=[f\"x{i + 1}\" for i in range(k)],\n            print_result=True,\n        )\n''',
              '''    def summary(self):\n        \"\"\"Print and return the existing structured coefficient summary.\"\"\"\n        k = len(self._params)\n        feature_names_override = (\n            None\n            if self._feature_names is not None\n            else [f\"x{i + 1}\" for i in range(k)]\n        )\n        return self._panel_summary(\n            model_type=\"PanelOLS\",\n            cov_type=self._cov_type,\n            rsquared_within=self.rsquared_within,\n            entity_effects=self.entity_effects,\n            time_effects=self.time_effects,\n            feature_names_override=feature_names_override,\n            print_result=True,\n        )\n''',
          )

          test_path = Path('dev/tests/test_panel_stage_c_api_formula.py')
          test_text = test_path.read_text(encoding='utf-8')
          test_name = 'def test_panel_formula_summary_and_inference_preserve_patsy_term_names():'
          if test_name not in test_text:
              test_text += '''\n\n\ndef test_panel_formula_summary_and_inference_preserve_patsy_term_names():\n    data = _frame(128038)\n    data[\"group\"] = pd.Categorical(\n        np.where(\n            data[\"time\"].to_numpy() % 3 == 0,\n            \"base\",\n            np.where(data[\"time\"].to_numpy() % 3 == 1, \"mid\", \"high\"),\n        ),\n        categories=[\"base\", \"mid\", \"high\"],\n    )\n    main_formula = \"y ~ x * C(group) + I(z ** 2)\"\n    _y_design, X_design = patsy.dmatrices(\n        main_formula, data, return_type=\"dataframe\"\n    )\n\n    model = PanelOLS(cov_type=\"hc0\").fit(\n        formula=f\"{main_formula} | entity\",\n        data=data,\n    )\n    expected_names = [\n        name for name in X_design.design_info.column_names if name != \"Intercept\"\n    ]\n\n    summary = model.summary()\n    assert model._feature_names == expected_names\n    assert model._inference_result.feature_names == expected_names\n    assert summary.feature_names == expected_names\n    assert len(summary.feature_names) == len(summary.coef) == len(model.coef_)\n    assert \"C(group)[T.mid]\" in expected_names\n    assert \"C(group)[T.high]\" in expected_names\n    assert \"x:C(group)[T.mid]\" in expected_names\n    assert \"x:C(group)[T.high]\" in expected_names\n    assert \"I(z ** 2)\" in expected_names\n'''
              test_path.write_text(test_text, encoding='utf-8')

          # MEDIUM[PERF/MATRIX]: make the benchmark capability disposition and
          # memory acceptance contract explicit rather than leaving an unmet
          # peak-memory implication in the reviewed plan.
          replace_once(
              'dev/plans/panel_p1_stage_c_covariance_plan.md',
              '- **Benchmark/performance** — HC2/HC3 and Driscoll–Kraay add backend kernels/reductions; correctness precedes performance, but representative physical timing/memory evidence is required before Stage C is called complete.',
              '- **Benchmark/performance** — HC2/HC3 and Driscoll–Kraay add backend kernels/reductions; correctness precedes performance, and representative synchronized physical timing evidence is required before Stage C is called complete. Memory is an algorithmic/no-host-transfer gate rather than a separately sampled peak-memory metric: review forbids `n x n` hat matrices and full numerical host copies, bounds grouped-score working sets to `O(Gk)` / `O(Tk)`, and physical target-scale runs must complete without OOM.'
          )

          replace_once(
              'dev/plans/panel_p1_stage_c_covariance_plan.md',
              '''| Model | backend | inference | formula | covariance work in Stage C |\n| --- | --- | --- | --- | --- |\n| `PanelOLS` | three-backend | supported | supported | preserve nonrobust/HC1/clustered; add HC0/HC2/HC3 and Driscoll–Kraay; explicit one-/two-way cluster correction contract |\n| `RandomEffects` | three-backend | supported | supported | preserve nonrobust default; add HC0/HC1/HC2/HC3, one-/two-way clustered, and Driscoll–Kraay on quasi-demeaned GLS fit space |\n| `PooledOLS` | three-backend | supported | supported | preserve nonrobust/HC1/clustered/row-HAC; add HC0/HC2/HC3 and Driscoll–Kraay; explicit cluster correction contract |\n| `BetweenOLS` | three-backend | supported | supported | preserve nonrobust/HC1; add HC0/HC2/HC3 on entity-mean regression; no DK because the fit space has one row per entity rather than a time-indexed panel score process |\n| `FirstDifferenceOLS` | three-backend | supported | supported | preserve nonrobust/HC1; add HC0/HC2/HC3 on the retained first-difference regression; no Stage-C DK until a gap-aware differenced-time score contract is separately specified |\n| `FamaMacBeth` | three-backend | supported | supported | unchanged; beta-series covariance remains model-specific (`nonrobust` / `newey-west`) and is not routed through residual-OLS covariance |''',
              '''| Model | backend | inference | formula | benchmark | covariance work in Stage C |\n| --- | --- | --- | --- | --- | --- |\n| `PanelOLS` | three-backend | supported | supported | required | preserve nonrobust/HC1/clustered; add HC0/HC2/HC3 and Driscoll–Kraay; explicit one-/two-way cluster correction contract |\n| `RandomEffects` | three-backend | supported | supported | required | preserve nonrobust default; add HC0/HC1/HC2/HC3, one-/two-way clustered, and Driscoll–Kraay on quasi-demeaned GLS fit space |\n| `PooledOLS` | three-backend | supported | supported | required | preserve nonrobust/HC1/clustered/row-HAC; add HC0/HC2/HC3 and Driscoll–Kraay; explicit cluster correction contract |\n| `BetweenOLS` | three-backend | supported | supported | not-performance-sensitive | preserve nonrobust/HC1; add HC0/HC2/HC3 on entity-mean regression; no DK because the fit space has one row per entity rather than a time-indexed panel score process |\n| `FirstDifferenceOLS` | three-backend | supported | supported | not-performance-sensitive | preserve nonrobust/HC1; add HC0/HC2/HC3 on the retained first-difference regression; no Stage-C DK until a gap-aware differenced-time score contract is separately specified |\n| `FamaMacBeth` | three-backend | supported | supported | not-performance-sensitive | unchanged; beta-series covariance remains model-specific (`nonrobust` / `newey-west`) and is not routed through residual-OLS covariance |'''
          )
          replace_once(
              'dev/plans/panel_p1_stage_c_covariance_plan.md',
              'Validation target: `remote-full` before Stage C is called COMPLETE.',
              'Validation target/tier: `remote-full` before Stage C is called COMPLETE.'
          )

          review_path = Path('dev/reviews/pr126_physical_gpu_validation.md')
          review_text = review_path.read_text(encoding='utf-8')
          replace = '**PHYSICAL_GPU_ACCEPTED** for the final post-review numerical/validator contract.'
          replacement = '''**PARTIAL_REMOTE_PENDING** after the 2026-08-11 `.claude/skills/code-review.md` re-audit.\n\nValidation tier target: `remote-full`.\n\nThe previously accepted `5ed763be...` physical evidence remains immutable historical evidence, but it is no longer exact-source acceptance evidence after the re-audit changes `statgpu/panel/_fixed_effects.py` to repair formula/inference presentation. Fresh physical GPU correctness and synchronized performance evidence are required on the final review-fix source head before this record can return to `PHYSICAL_GPU_ACCEPTED`.'''
          if replace not in review_text:
              raise SystemExit('physical status marker not found')
          review_text = review_text.replace(replace, replacement, 1)
          old_boundary = '''The physical gate is closed. Merge readiness still requires all permanent hosted workflows to be green on the final promoted-head checkpoint and a final post-promotion review with no new CRITICAL/HIGH/relevant-MEDIUM finding. The PR remains Draft until an explicit Ready transition is requested.'''
          new_boundary = '''The previous physical gate is superseded by the current production-source review fix. Merge readiness now requires fresh physical GPU correctness/performance evidence on the final source head, canonical promotion of any replacement artifacts, permanent hosted workflows green on the resulting final checkpoint, and a final `.claude/skills/code-review.md` re-review with no unresolved CRITICAL/HIGH/relevant-MEDIUM finding. The PR remains Draft until an explicit Ready transition is requested.'''
          if old_boundary not in review_text:
              raise SystemExit('merge-readiness boundary marker not found')
          review_text = review_text.replace(old_boundary, new_boundary, 1)
          review_path.write_text(review_text, encoding='utf-8')
          PY

      - name: Install focused test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" scipy pytest pandas patsy
          python -m pip install -e .
      - name: Run focused formula and inference regressions
        run: |
          python -m pytest dev/tests/test_panel_stage_c_api_formula.py dev/tests/test_panel_formula.py dev/tests/test_panel_stage_c_inference_guard.py -q --tb=short
          git diff --check
      - name: Commit fixes and self-delete helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr126-code-review-fix.yml
          git add statgpu/panel/_fixed_effects.py dev/tests/test_panel_stage_c_api_formula.py dev/plans/panel_p1_stage_c_covariance_plan.md dev/reviews/pr126_physical_gpu_validation.md
          git commit -m "fix: close PR126 strict review findings"
          git push origin HEAD:agent/panel-p1-stage-c-covariance
