name: PR126 fit-space linalg autofix

on:
  push:
    branches: [agent/panel-p1-stage-c-covariance]
    paths:
      - .github/workflows/pr126-autofix-fit-space-linalg.yml

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply shared fit-space numerical policy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              p.write_text(text.replace(old, new))

          Path("statgpu/panel/_linalg.py").write_text('''"""Shared numerical linear algebra policy for panel fit spaces."""\n\nfrom __future__ import annotations\n\nimport numpy as np\n\nfrom statgpu.backends import _to_float_scalar\n\n\ndef panel_svd_pseudoinverse(X, xp):\n    """Return X+, (X'X)+, and rank from one explicit float64 SVD mask."""\n    U, singular_values, Vh = xp.linalg.svd(X, full_matrices=False)\n    if int(singular_values.shape[0]) == 0:\n        raise ValueError("panel design must contain at least one column")\n    s_max = _to_float_scalar(xp.max(singular_values))\n    cutoff = (\n        max(int(X.shape[0]), int(X.shape[1]))\n        * np.finfo(np.float64).eps\n        * float(s_max)\n    )\n    retained = singular_values > float(cutoff)\n    rank = int(_to_float_scalar(xp.sum(retained)))\n    safe_values = xp.where(\n        retained, singular_values, xp.ones_like(singular_values)\n    )\n    inverse_values = xp.where(\n        retained, 1.0 / safe_values, xp.zeros_like(singular_values)\n    )\n    X_pinv = (Vh.T * inverse_values) @ U.T\n    bread = X_pinv @ X_pinv.T\n    return X_pinv, bread, rank\n\n\ndef panel_lstsq(X, y, xp):\n    """Return the minimum-norm least-squares solution under the panel SVD policy."""\n    X_pinv, _bread, rank = panel_svd_pseudoinverse(X, xp)\n    return X_pinv @ y, rank\n\n\ndef panel_matrix_rank(X, xp):\n    """Return numerical rank using exactly the panel pseudoinverse cutoff."""\n    _X_pinv, _bread, rank = panel_svd_pseudoinverse(X, xp)\n    return rank\n''')

          # Covariance delegates its decomposition to the single shared policy.
          replace_once(
              "statgpu/panel/_covariance.py",
              '''from statgpu.panel._utils import factorize_panel_metadata\n''',
              '''from statgpu.panel._linalg import panel_svd_pseudoinverse\nfrom statgpu.panel._utils import factorize_panel_metadata\n'''
          )
          old = '''def _design_pseudoinverse(X, xp):\n    \"\"\"Return X+, (X'X)+ and rank from one explicit SVD cutoff.\n\n    Backend libraries use different defaults for ``pinv`` and ``matrix_rank``.\n    Near the numerical-rank boundary this can make the covariance bread retain\n    directions that the reported rank drops (or vice versa), and can disagree\n    across NumPy/CuPy/Torch.  Derive both quantities from the same SVD mask\n    using the standard ``max(m, n) * eps * s_max`` float64 threshold.\n    \"\"\"\n    U, singular_values, Vh = xp.linalg.svd(X, full_matrices=False)\n    if int(singular_values.shape[0]) == 0:\n        raise ValueError(\"covariance design must contain at least one column\")\n    s_max = _to_float_scalar(xp.max(singular_values))\n    cutoff = (\n        max(int(X.shape[0]), int(X.shape[1]))\n        * np.finfo(np.float64).eps\n        * float(s_max)\n    )\n    retained = singular_values > float(cutoff)\n    rank = int(_to_float_scalar(xp.sum(retained)))\n    safe_values = xp.where(\n        retained, singular_values, xp.ones_like(singular_values)\n    )\n    inverse_values = xp.where(\n        retained, 1.0 / safe_values, xp.zeros_like(singular_values)\n    )\n    X_pinv = (Vh.T * inverse_values) @ U.T\n    bread = X_pinv @ X_pinv.T\n    return X_pinv, bread, rank\n'''
          new = '''def _design_pseudoinverse(X, xp):\n    \"\"\"Compatibility wrapper around the shared panel SVD policy.\"\"\"\n    return panel_svd_pseudoinverse(X, xp)\n'''
          replace_once("statgpu/panel/_covariance.py", old, new)

          # Pooled OLS fit uses the same effective subspace as covariance.
          replace_once(
              "statgpu/panel/_pooled.py",
              '''from statgpu.backends import _to_float_scalar, _to_numpy, xp_asarray\nfrom statgpu.panel._base import BasePanelModel\n''',
              '''from statgpu.backends import _to_float_scalar, _to_numpy, xp_asarray\nfrom statgpu.panel._base import BasePanelModel\nfrom statgpu.panel._linalg import panel_lstsq\n'''
          )
          replace_once(
              "statgpu/panel/_pooled.py",
              '''def _panel_lstsq(X, y, xp):\n    \"\"\"Return least-squares coefficients and the effective design rank.\"\"\"\n    if getattr(xp, \"__name__\", \"\") == \"torch\":\n        params = xp.linalg.pinv(X) @ y\n        rank = int(_to_float_scalar(xp.linalg.matrix_rank(X)))\n        return params, rank\n    try:\n        result = xp.linalg.lstsq(X, y, rcond=None)\n        params = result[0]\n        rank = int(_to_float_scalar(result[2]))\n        return params, rank\n    except (TypeError, AttributeError, np.linalg.LinAlgError):\n        params = xp.linalg.pinv(X) @ y\n        rank = int(_to_float_scalar(xp.linalg.matrix_rank(X)))\n        return params, rank\n''',
              '''def _panel_lstsq(X, y, xp):\n    \"\"\"Return least-squares coefficients and rank under the shared panel policy.\"\"\"\n    return panel_lstsq(X, y, xp)\n'''
          )

          # PanelOLS fit-space coefficients and FE rank share the same SVD policy.
          replace_once(
              "statgpu/panel/_fixed_effects.py",
              '''from statgpu.backends import (\n    _LINALG_ERRORS,\n    _to_float_scalar,\n    _to_numpy,\n    xp_cholesky_solve,\n    xp_maximum,\n)\nfrom statgpu.panel._base import BasePanelModel\n''',
              '''from statgpu.backends import (\n    _to_float_scalar,\n    _to_numpy,\n    xp_maximum,\n)\nfrom statgpu.panel._base import BasePanelModel\nfrom statgpu.panel._linalg import panel_lstsq\n'''
          )
          replace_once(
              "statgpu/panel/_fixed_effects.py",
              '''        XtX = X_d.T @ X_d\n        Xty = X_d.T @ y_d\n        try:\n            coef = xp_cholesky_solve(XtX, Xty, xp)\n        except _LINALG_ERRORS:\n            coef = xp.linalg.solve(XtX, Xty)\n''',
              '''        coef, fit_rank = panel_lstsq(X_d, y_d, xp)\n'''
          )
          replace_once(
              "statgpu/panel/_fixed_effects.py",
              '''            time_codes=time_arr,\n        )\n''',
              '''            time_codes=time_arr,\n            rank_x=fit_rank,\n        )\n'''
          )

          # Between/FD use the same minimum-norm policy and reuse the fit rank in diagnostics.
          for path, design, response, params_name, rank_name in [
              ("statgpu/panel/_between.py", "X_mean", "y_mean", "params", "rank_mean"),
              ("statgpu/panel/_first_diff.py", "X_diff", "y_diff", "params", "rank_diff"),
          ]:
              replace_once(
                  path,
                  'from statgpu.panel._base import BasePanelModel\n',
                  'from statgpu.panel._base import BasePanelModel\nfrom statgpu.panel._linalg import panel_lstsq\n'
              )
              if path.endswith('_between.py'):
                  replace_once(
                      path,
                      '''        XtX = X_mean.T @ X_mean\n        Xty = X_mean.T @ y_mean\n        try:\n            params = xp.linalg.solve(XtX, Xty)\n        except _LINALG_ERRORS:\n            params = xp.linalg.pinv(X_mean) @ y_mean\n''',
                      '''        params, rank_mean = panel_lstsq(X_mean, y_mean, xp)\n'''
                  )
                  replace_once(
                      path,
                      '''        from statgpu.panel._diagnostics import _matrix_rank\n\n        rank_mean = _matrix_rank(X_mean, xp)\n''',
                      '''\n'''
                  )
              else:
                  replace_once(
                      path,
                      '''        XtX = X_diff.T @ X_diff\n        Xty = X_diff.T @ y_diff\n        try:\n            params = xp.linalg.solve(XtX, Xty)\n        except _LINALG_ERRORS:\n            params = xp.linalg.pinv(X_diff) @ y_diff\n''',
                      '''        params, rank_diff = panel_lstsq(X_diff, y_diff, xp)\n'''
                  )
                  replace_once(
                      path,
                      '''        from statgpu.panel._diagnostics import _matrix_rank\n\n        rank_diff = _matrix_rank(X_diff, xp)\n''',
                      '''\n'''
                  )

          # RandomEffects uses stable least-squares at every Swamy-Arora regression boundary.
          replace_once(
              "statgpu/panel/_random_effects.py",
              '''from statgpu.backends import (\n    _LINALG_ERRORS,\n    _to_float_scalar,\n    _to_numpy,\n    xp_asarray,\n    xp_cholesky_solve,\n    xp_zeros,\n)\nfrom statgpu.panel._base import BasePanelModel\n''',
              '''from statgpu.backends import (\n    _to_float_scalar,\n    _to_numpy,\n    xp_asarray,\n    xp_zeros,\n)\nfrom statgpu.panel._base import BasePanelModel\nfrom statgpu.panel._linalg import panel_lstsq\n'''
          )
          replace_once(
              "statgpu/panel/_random_effects.py",
              '''        XtX_b = X_bar_unique.T @ X_bar_unique\n        Xty_b = X_bar_unique.T @ y_bar_unique\n        try:\n            beta_between = xp.linalg.solve(XtX_b, Xty_b)\n        except _LINALG_ERRORS:\n            beta_between = xp.linalg.pinv(XtX_b) @ Xty_b\n''',
              '''        beta_between, _rank_between = panel_lstsq(\n            X_bar_unique, y_bar_unique, xp\n        )\n'''
          )
          replace_once(
              "statgpu/panel/_random_effects.py",
              '''                XtX_w = X_within_fit.T @ X_within_fit\n                Xty_w = X_within_fit.T @ y_within\n                beta_within = xp.linalg.pinv(XtX_w) @ Xty_w\n''',
              '''                beta_within, _rank_within = panel_lstsq(\n                    X_within_fit, y_within, xp\n                )\n'''
          )
          replace_once(
              "statgpu/panel/_random_effects.py",
              '''            XtX_w = X_within.T @ X_within\n            Xty_w = X_within.T @ y_within\n            try:\n                beta_within = xp.linalg.solve(XtX_w, Xty_w)\n            except _LINALG_ERRORS:\n                beta_within = xp.linalg.pinv(XtX_w) @ Xty_w\n''',
              '''            beta_within, _rank_within = panel_lstsq(\n                X_within, y_within, xp\n            )\n'''
          )
          replace_once(
              "statgpu/panel/_random_effects.py",
              '''        XtX_s = X_star.T @ X_star\n        Xty_s = X_star.T @ y_star\n        try:\n            beta_gls = xp_cholesky_solve(XtX_s, Xty_s, xp)\n        except _LINALG_ERRORS:\n            beta_gls = xp.linalg.solve(XtX_s, Xty_s)\n''',
              '''        beta_gls, rank_star = panel_lstsq(X_star, y_star, xp)\n'''
          )
          replace_once(
              "statgpu/panel/_random_effects.py",
              '''        from statgpu.panel._diagnostics import _matrix_rank\n\n        rank_star = _matrix_rank(X_star, xp)\n''',
              '''        from statgpu.panel._diagnostics import _matrix_rank\n\n'''
          )
          replace_once(
              "statgpu/panel/_random_effects.py",
              '''            restricted_rank = _matrix_rank(restricted_X, xp)\n            restricted_params = xp.linalg.pinv(restricted_X) @ y_star\n''',
              '''            restricted_params, restricted_rank = panel_lstsq(\n                restricted_X, y_star, xp\n            )\n'''
          )

          # Diagnostic rank and pooled nested regression use the same policy.
          replace_once(
              "statgpu/panel/_diagnostics.py",
              '''from statgpu.panel._results import PanelFitStatistics, PanelTestResult\n''',
              '''from statgpu.panel._linalg import panel_matrix_rank\nfrom statgpu.panel._results import PanelFitStatistics, PanelTestResult\n'''
          )
          replace_once(
              "statgpu/panel/_diagnostics.py",
              '''def _matrix_rank(X, xp) -> int:\n    return int(_to_float_scalar(xp.linalg.matrix_rank(X)))\n''',
              '''def _matrix_rank(X, xp) -> int:\n    return panel_matrix_rank(X, xp)\n'''
          )
          replace_once(
              "statgpu/panel/_diagnostic_context.py",
              '''from statgpu.panel._utils import group_means, group_sizes\n''',
              '''from statgpu.panel._linalg import panel_lstsq\nfrom statgpu.panel._utils import group_means, group_sizes\n'''
          )
          replace_once(
              "statgpu/panel/_diagnostic_context.py",
              '''    time_codes=None,\n):\n    \"\"\"Return rank-consistent Stage-B FE diagnostic df without changing legacy df.\"\"\"\n    rank_x = _matrix_rank(X_transformed, xp)\n''',
              '''    time_codes=None,\n    rank_x=None,\n):\n    \"\"\"Return rank-consistent Stage-B FE diagnostic df without changing legacy df.\"\"\"\n    if rank_x is None:\n        rank_x = _matrix_rank(X_transformed, xp)\n    rank_x = int(rank_x)\n'''
          )
          replace_once(
              "statgpu/panel/_diagnostic_context.py",
              '''    rank_pool = _matrix_rank(X_pool, xp)\n    beta_pool = xp.linalg.pinv(X_pool) @ y_pool\n''',
              '''    beta_pool, rank_pool = panel_lstsq(X_pool, y_pool, xp)\n'''
          )

          # Add an estimator-level rank-boundary physical case.
          runner = Path("dev/benchmarks/validate_panel_stage_c_gpu.py")
          text = runner.read_text()
          marker = '''    for cov in ("hc0", "hc2", "hc3"):\n        cases[f"between_{cov}"] = BetweenOLS(cov_type=cov, device=device).fit(\n            Xb, yb, entity_ids=eb\n        )\n        cases[f"first_difference_{cov}"] = FirstDifferenceOLS(\n            cov_type=cov, device=device\n        ).fit(Xb, yb, entity_ids=eb, time_ids=tb)\n\n    return cases\n'''
          replacement = '''    for cov in ("hc0", "hc2", "hc3"):\n        cases[f"between_{cov}"] = BetweenOLS(cov_type=cov, device=device).fit(\n            Xb, yb, entity_ids=eb\n        )\n        cases[f"first_difference_{cov}"] = FirstDifferenceOLS(\n            cov_type=cov, device=device\n        ).fit(Xb, yb, entity_ids=eb, time_ids=tb)\n\n    X_rank, y_rank, time_rank, _cluster_rank = _rank_boundary_inputs()\n    rank_entity = np.arange(len(y_rank), dtype=np.int64)\n    X_rank_b, y_rank_b, _rank_entity_b, time_rank_b = _to_backend(\n        X_rank, y_rank, rank_entity, time_rank, backend\n    )\n    cases["panel_rank_boundary_dk"] = PanelOLS(\n        cov_type="dk", bandwidth=2, device=device\n    ).fit(X_rank_b, y_rank_b, time_ids=time_rank_b)\n\n    return cases\n'''
          if text.count(marker) != 1:
              raise SystemExit("physical estimator insertion marker mismatch")
          text = text.replace(marker, replacement)
          text = text.replace(
              '''        "first_difference_hc0", "first_difference_hc2", "first_difference_hc3",\n    }\n''',
              '''        "first_difference_hc0", "first_difference_hc2", "first_difference_hc3",\n        "panel_rank_boundary_dk",\n    }\n''',
              1,
          )
          text = text.replace(
              '''    if len(reference) != 26:\n        raise AssertionError(f"expected 26 Stage-C physical cases, got {len(reference)}")\n''',
              '''    if len(reference) != 27:\n        raise AssertionError(f"expected 27 Stage-C physical cases, got {len(reference)}")\n''',
              1,
          )
          runner.write_text(text)

          # Maintained Torch CPU estimator-level rank-boundary integration.
          torch_test = Path("dev/tests/test_panel_stage_c_torch_cpu.py")
          text = torch_test.read_text()
          addition = '''\n\ndef test_panel_rank_boundary_fit_and_dk_torch_cpu_match_shared_policy():\n    X, y, time, _cluster = _rank_boundary_inputs(seed=12911)\n    U, singular_values, Vh = np.linalg.svd(X, full_matrices=False)\n    cutoff = max(X.shape) * np.finfo(np.float64).eps * singular_values[0]\n    inverse_values = np.zeros_like(singular_values)\n    retained = singular_values > cutoff\n    inverse_values[retained] = 1.0 / singular_values[retained]\n    expected_coef = ((Vh.T * inverse_values) @ U.T) @ y\n\n    expected = PanelOLS(cov_type="dk", bandwidth=2).fit(\n        X, y, time_ids=time\n    )\n    actual = PanelOLS(cov_type="dk", bandwidth=2).fit(\n        torch.as_tensor(X, dtype=torch.float64),\n        torch.as_tensor(y, dtype=torch.float64),\n        time_ids=torch.as_tensor(time, dtype=torch.int64),\n    )\n    assert_allclose(expected.coef_, expected_coef, rtol=5e-11, atol=5e-13)\n    _assert_inference(actual, expected, rtol=5e-9, atol=5e-11)\n    assert expected._covariance_metadata["design_rank"] == 2\n    assert actual._covariance_metadata["design_rank"] == 2\n    assert expected.fit_statistics_.metadata["diagnostic_df"]["rank_x"] == 2\n    assert actual.fit_statistics_.metadata["diagnostic_df"]["rank_x"] == 2\n'''
          if "test_panel_rank_boundary_fit_and_dk_torch_cpu_match_shared_policy" in text:
              raise SystemExit("estimator rank-boundary torch test already exists")
          torch_test.write_text(text + addition)

          # NumPy estimator-level regression independent of Torch availability.
          edge = Path("dev/tests/test_panel_stage_c_edge_contracts.py")
          text = edge.read_text()
          addition = '''\n\ndef test_panel_rank_boundary_fit_matches_explicit_svd_policy():\n    from statgpu.panel import PanelOLS\n\n    rng = np.random.default_rng(12954)\n    n, k = 100, 3\n    q_left, _ = np.linalg.qr(rng.normal(size=(n, k)))\n    q_right, _ = np.linalg.qr(rng.normal(size=(k, k)))\n    X = q_left @ np.diag([10.0, 1.0, 1.0e-13]) @ q_right.T\n    y = rng.normal(size=n)\n    time = np.tile(np.arange(10), 10)\n    U, singular_values, Vh = np.linalg.svd(X, full_matrices=False)\n    cutoff = max(X.shape) * np.finfo(np.float64).eps * singular_values[0]\n    retained = singular_values > cutoff\n    assert int(np.sum(retained)) == 2\n    inverse_values = np.zeros_like(singular_values)\n    inverse_values[retained] = 1.0 / singular_values[retained]\n    expected = ((Vh.T * inverse_values) @ U.T) @ y\n\n    model = PanelOLS(cov_type="dk", bandwidth=2).fit(X, y, time_ids=time)\n    np.testing.assert_allclose(model.coef_, expected, rtol=5e-11, atol=5e-13)\n    assert model._covariance_metadata["design_rank"] == 2\n    assert model.fit_statistics_.metadata["diagnostic_df"]["rank_x"] == 2\n'''
          if "test_panel_rank_boundary_fit_matches_explicit_svd_policy" in text:
              raise SystemExit("NumPy estimator rank-boundary test already exists")
          edge.write_text(text + addition)

          # Current remote target is now 27 estimator + 12 primitive = 39/backend.
          for path in [
              "CHANGELOG.md", "docs/en/changelog.md", "docs/cn/changelog.md",
              "docs/en/models/panel.md", "docs/cn/models/panel.md",
              "dev/reviews/pr126_physical_gpu_validation.md",
              "dev/reviews/pr126_rank_chronology_autofix_2026-08-11.md",
              "dev/reviews/pr126_rank_chronology_re_review_2026-08-11.md",
          ]:
              p = Path(path)
              text = p.read_text()
              text = text.replace("26 estimator + 12", "27 estimator + 12")
              text = text.replace("26-estimator + 12", "27-estimator + 12")
              text = text.replace("26+12", "27+12")
              text = text.replace("38/38", "39/39")
              p.write_text(text)
          PY
      - name: Install focused validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[formula,validation]' 'linearmodels==7.0' 'statsmodels==0.14.6' pytest
      - name: Run fit-space, external, formula and runner regressions
        run: |
          python -m pytest \
            dev/tests/test_panel_stage_c_covariance.py \
            dev/tests/test_panel_stage_c_edge_contracts.py \
            dev/tests/test_panel_stage_c_external.py \
            dev/tests/test_panel_stage_c_external_defaults.py \
            dev/tests/test_panel_stage_c_linearmodels_estimators.py \
            dev/tests/test_panel_stage_c_api_formula.py \
            dev/tests/test_panel_stage_c_physical_runner_contract.py \
            dev/tests/test_panel_stage_c_inference_guard.py \
            -q --tb=short
          python -m py_compile \
            statgpu/panel/_linalg.py \
            statgpu/panel/_covariance.py \
            statgpu/panel/_pooled.py \
            statgpu/panel/_fixed_effects.py \
            statgpu/panel/_between.py \
            statgpu/panel/_first_diff.py \
            statgpu/panel/_random_effects.py \
            statgpu/panel/_diagnostics.py \
            statgpu/panel/_diagnostic_context.py \
            dev/benchmarks/validate_panel_stage_c_gpu.py
          git diff --check
      - name: Commit reviewed fit-space fix and self-delete
        shell: bash
        run: |
          git config user.name 'TheHiddenObserver'
          git config user.email '51812297+TheHiddenObserver@users.noreply.github.com'
          git add \
            statgpu/panel/_linalg.py \
            statgpu/panel/_covariance.py \
            statgpu/panel/_pooled.py \
            statgpu/panel/_fixed_effects.py \
            statgpu/panel/_between.py \
            statgpu/panel/_first_diff.py \
            statgpu/panel/_random_effects.py \
            statgpu/panel/_diagnostics.py \
            statgpu/panel/_diagnostic_context.py \
            dev/benchmarks/validate_panel_stage_c_gpu.py \
            dev/tests/test_panel_stage_c_edge_contracts.py \
            dev/tests/test_panel_stage_c_torch_cpu.py \
            CHANGELOG.md docs/en/changelog.md docs/cn/changelog.md \
            docs/en/models/panel.md docs/cn/models/panel.md \
            dev/reviews/pr126_physical_gpu_validation.md \
            dev/reviews/pr126_rank_chronology_autofix_2026-08-11.md \
            dev/reviews/pr126_rank_chronology_re_review_2026-08-11.md
          git rm -f .github/workflows/pr126-autofix-fit-space-linalg.yml
          git commit -m 'fix(panel): unify fit-space numerical rank policy'
          git push origin HEAD:agent/panel-p1-stage-c-covariance
