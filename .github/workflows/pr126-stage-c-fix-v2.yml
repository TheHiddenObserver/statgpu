name: PR126 Stage C reviewed backend patch

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - '.github/workflows/pr126-stage-c-fix-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python dev/benchmarks/_pr126_apply_hc_backend_fix.py
      - run: python -m compileall -q statgpu/panel/_covariance.py
      - run: git diff --check
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add statgpu/panel/_covariance.py
          git commit -m 'fix: keep HC leverage backend-native'
          git push origin HEAD:agent/panel-p1-stage-c-covariance
