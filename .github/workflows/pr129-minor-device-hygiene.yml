name: PR129 minor device hygiene

on:
  push:
    branches:
      - agent/post-v0.2.5-next-phase-plan
    paths:
      - '.github/workflows/pr129-minor-device-hygiene.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/post-v0.2.5-next-phase-plan
          fetch-depth: 0
      - name: Apply final device hygiene
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/pr129_minor.py
          python /tmp/pr129_minor.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --check
          git diff --cached --quiet && { echo 'no changes produced'; exit 1; }
          git commit -m "fix(inference): bind CuPy diagnostics to executed device"
          git push origin HEAD:agent/post-v0.2.5-next-phase-plan
