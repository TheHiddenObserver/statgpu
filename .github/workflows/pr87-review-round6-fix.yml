name: PR87 review round 6 fix

on:
  push:
    branches: [agent/maintenance-0.2.4-0.2.5]
    paths: [.github/workflows/pr87-review-round6-fix.yml]

permissions:
  contents: write

jobs:
  fix-test-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply visible fallback and backend solve fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one anchor, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'statgpu/glm_core/_irls.py',
              'import numpy as np\n\n\ndef _infer_backend',
              'import numpy as np\n\nfrom statgpu.backends._array_ops import _linalg_exception_is_rank_failure\n\n\ndef _infer_backend',
          )
          replace_once(
              'statgpu/glm_core/_irls.py',
              '''        except RuntimeError as exc:\n            message = str(exc).lower()\n            singular_markers = (\n                "singular",\n                "not invertible",\n                "zero pivot",\n                "rank deficient",\n            )\n            if not any(marker in message for marker in singular_markers):\n                raise\n            sol = torch.linalg.lstsq(A, b_col).solution\n''',
              '''        except RuntimeError as exc:\n            if not _linalg_exception_is_rank_failure(exc):\n                raise\n            sol = torch.linalg.lstsq(A, b_col).solution\n''',
          )
          replace_once(
              'statgpu/glm_core/_irls.py',
              '''        try:\n            return cp.linalg.solve(A, b)\n        except np.linalg.LinAlgError:\n            return cp.linalg.lstsq(A, b)[0]\n''',
              '''        try:\n            return cp.linalg.solve(A, b)\n        except Exception as exc:\n            if not _linalg_exception_is_rank_failure(exc):\n                raise\n            return cp.linalg.lstsq(A, b)[0]\n''',
          )

          replace_once(
              'statgpu/linear_model/penalized/_penalized_cv.py',
              '''def _cv_path_failure_is_recoverable(exc) -> bool:\n    """Return whether an optimized path may fall back to a slower path."""\n    return isinstance(exc, NotImplementedError) or _cv_candidate_failure_is_recoverable(exc)\n\n\ndef _raise_unless_recoverable_cv_candidate_failure(exc) -> None:\n''',
              '''def _cv_path_failure_is_recoverable(exc) -> bool:\n    """Return whether an optimized path may fall back to a slower path."""\n    return isinstance(exc, NotImplementedError) or _cv_candidate_failure_is_recoverable(exc)\n\n\ndef _cv_loss_evaluation_failure_is_recoverable(exc) -> bool:\n    """Return whether validation scoring may try an equivalent evaluator."""\n    return isinstance(\n        exc,\n        (NotImplementedError, FloatingPointError, OverflowError, np.linalg.LinAlgError),\n    ) or _linalg_exception_is_rank_failure(exc)\n\n\ndef _raise_unless_recoverable_cv_loss_failure(exc) -> None:\n    if not _cv_loss_evaluation_failure_is_recoverable(exc):\n        raise exc\n\n\ndef _raise_unless_recoverable_cv_candidate_failure(exc) -> None:\n''',
          )
          replace_once(
              'statgpu/linear_model/penalized/_penalized_cv.py',
              '''        except Exception as primary_exc:\n            _raise_cv_infrastructure_failure(primary_exc)\n            # Preserve the declared objective by retrying through the generic\n            # loss interface, including analytic validation weights.\n            try:\n''',
              '''        except Exception as primary_exc:\n            _raise_cv_infrastructure_failure(primary_exc)\n            _raise_unless_recoverable_cv_loss_failure(primary_exc)\n            warnings.warn(\n                f"Optimized validation scoring for '{self.loss}' was unavailable "\n                "or numerically invalid; retrying the same declared objective "\n                "through the generic loss interface.",\n                RuntimeWarning,\n                stacklevel=2,\n            )\n            # Preserve the declared objective by retrying through the generic\n            # loss interface, including analytic validation weights.\n            try:\n''',
          )
          replace_once(
              'statgpu/linear_model/penalized/_penalized_cv.py',
              '''            except Exception as fallback_exc:\n                _raise_cv_infrastructure_failure(fallback_exc)\n                if not _is_squared_error_loss_name(self.loss):\n''',
              '''            except Exception as fallback_exc:\n                _raise_cv_infrastructure_failure(fallback_exc)\n                _raise_unless_recoverable_cv_loss_failure(fallback_exc)\n                if not _is_squared_error_loss_name(self.loss):\n''',
          )

          test_path = Path('dev/tests/test_pr87_code_review_fix_cycle.py')
          text = test_path.read_text(encoding='utf-8')
          text += '''\n\ndef _cv_evaluation_owner(loss_name):\n    from statgpu.linear_model.penalized._penalized_cv import PenalizedGLM_CV\n\n    owner = object.__new__(PenalizedGLM_CV)\n    owner.loss = loss_name\n    return owner\n\n\nclass _CVScoreModel:\n    fit_intercept = True\n    intercept_ = 0.25\n    coef_ = np.array([0.5])\n\n    def predict(self, X):\n        return self.intercept_ + np.asarray(X) @ self.coef_\n\n\ndef test_cv_primary_scoring_programming_error_is_not_silently_retried(monkeypatch):\n    import statgpu.linear_model.penalized._penalized_cv as cv_mod\n\n    class Loss:\n        def value(self, *args, **kwargs):\n            raise AssertionError("generic scorer must not run")\n\n    monkeypatch.setattr(\n        cv_mod, '_evaluate_loss_numpy',\n        lambda *args, **kwargs: (_ for _ in ()).throw(TypeError('bad scoring signature')),\n    )\n    with pytest.raises(TypeError, match='bad scoring signature'):\n        _cv_evaluation_owner('poisson')._evaluate_single(\n            _CVScoreModel(), np.ones((3, 1)), np.ones(3), loss_fn=Loss()\n        )\n\n\ndef test_cv_recoverable_primary_scoring_fallback_is_visible(monkeypatch):\n    import statgpu.linear_model.penalized._penalized_cv as cv_mod\n\n    calls = {'generic': 0}\n\n    class Loss:\n        def value(self, X, y, coef, sample_weight=None):\n            calls['generic'] += 1\n            return 2.75\n\n    monkeypatch.setattr(\n        cv_mod, '_evaluate_loss_numpy',\n        lambda *args, **kwargs: (_ for _ in ()).throw(\n            NotImplementedError('optimized scorer unavailable')\n        ),\n    )\n    with pytest.warns(RuntimeWarning, match='generic loss interface'):\n        value = _cv_evaluation_owner('poisson')._evaluate_single(\n            _CVScoreModel(), np.ones((3, 1)), np.ones(3), loss_fn=Loss()\n        )\n    assert value == pytest.approx(2.75)\n    assert calls == {'generic': 1}\n\n\ndef test_cv_generic_scoring_programming_error_is_not_converted_to_mse(monkeypatch):\n    import statgpu.linear_model.penalized._penalized_cv as cv_mod\n\n    class Loss:\n        def value(self, *args, **kwargs):\n            raise TypeError('generic scorer bug')\n\n    monkeypatch.setattr(\n        cv_mod, '_evaluate_loss_numpy',\n        lambda *args, **kwargs: (_ for _ in ()).throw(\n            NotImplementedError('optimized scorer unavailable')\n        ),\n    )\n    with pytest.warns(RuntimeWarning, match='generic loss interface'):\n        with pytest.raises(TypeError, match='generic scorer bug'):\n            _cv_evaluation_owner('squared_error')._evaluate_single(\n                _CVScoreModel(), np.ones((3, 1)), np.ones(3), loss_fn=Loss()\n            )\n\n\ndef test_cv_squared_error_numeric_failure_uses_visible_equivalent_mse(monkeypatch):\n    import statgpu.linear_model.penalized._penalized_cv as cv_mod\n\n    class Loss:\n        def value(self, *args, **kwargs):\n            raise FloatingPointError('generic non-finite score')\n\n    monkeypatch.setattr(\n        cv_mod, '_evaluate_loss_numpy',\n        lambda *args, **kwargs: (_ for _ in ()).throw(\n            FloatingPointError('optimized non-finite score')\n        ),\n    )\n    X = np.arange(3.0)[:, None]\n    y = np.array([0.0, 1.0, 2.0])\n    with pytest.warns(RuntimeWarning) as caught:\n        value = _cv_evaluation_owner('squared_error')._evaluate_single(\n            _CVScoreModel(), X, y, loss_fn=Loss()\n        )\n    assert len(caught) == 2\n    expected = np.mean((y - _CVScoreModel().predict(X)) ** 2)\n    assert value == pytest.approx(expected)\n\n\ndef test_irls_cupy_rank_failure_uses_lstsq_and_oom_propagates(monkeypatch):\n    import sys\n    import types\n    from statgpu.glm_core._irls import _solve\n\n    fake = types.ModuleType('cupy')\n    calls = {'lstsq': 0}\n\n    class Linalg:\n        @staticmethod\n        def solve(A, b):\n            raise RuntimeError('singular matrix')\n\n        @staticmethod\n        def lstsq(A, b):\n            calls['lstsq'] += 1\n            return (np.array([3.0]), None, None, None)\n\n    fake.linalg = Linalg()\n    monkeypatch.setitem(sys.modules, 'cupy', fake)\n    result = _solve(np.eye(1), np.ones(1), backend='cupy')\n    np.testing.assert_allclose(result, [3.0])\n    assert calls == {'lstsq': 1}\n\n    def oom(A, b):\n        raise RuntimeError('CUDA out of memory')\n\n    fake.linalg.solve = oom\n    with pytest.raises(RuntimeError, match='out of memory'):\n        _solve(np.eye(1), np.ones(1), backend='cupy')\n    assert calls == {'lstsq': 1}\n'''
          test_path.write_text(text, encoding='utf-8')
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation,formula]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run review-fix and CV fallback suites
        run: |
          python -m pytest -q \
            dev/tests/test_pr87_code_review_fix_cycle.py \
            dev/tests/test_maintenance_024_025.py \
            -k "cv_loss or scoring or evaluate_single or infrastructure or irls_cupy or irls_solve"
      - name: Run full new review-fix suite
        run: python -m pytest -q dev/tests/test_pr87_code_review_fix_cycle.py
      - name: Static review gates
        run: |
          python -m compileall -q statgpu dev/tests/test_pr87_code_review_fix_cycle.py
          git diff --check
      - name: Commit fixes and self-delete
        shell: bash
        run: |
          rm .github/workflows/pr87-review-round6-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add statgpu dev/tests .github/workflows/pr87-review-round6-fix.yml
          git commit -m "fix: make CV scoring fallbacks explicit"
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
