name: PR87 review round 8 retry

on:
  push:
    branches: [agent/maintenance-0.2.4-0.2.5]
    paths: [.github/workflows/pr87-review-round8-retry.yml]

permissions:
  contents: write

jobs:
  local-full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply reviewed round 8 closure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one anchor, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Reapply the documentation/reset closure from the failed full-gate run.
          old_workflow = Path('.github/workflows/pr87-review-round8-local-full.yml')
          lines = old_workflow.read_text(encoding='utf-8').splitlines()
          start = lines.index("          python - <<'PY'") + 1
          end = lines.index("          PY", start)
          exec(
              compile(dedent('\n'.join(lines[start:end])) + '\n', str(old_workflow), 'exec'),
              {'__name__': '__main__'},
          )

          # Public finite guard: successful estimators reset in their fit body;
          # rejected finite-input calls reset transactionally before re-raising.
          replace_once(
              'statgpu/_base.py',
              '''            def guarded(self, *args, **kwargs):\n                # A rejected refit must not leave stale fitted outputs usable.\n                # Prefer the general transactional lifecycle hook and retain the\n                # older CV-specific hook for estimators that have not migrated.\n                if method_name == "fit":\n                    reset_fit_state = getattr(self, "_reset_fit_state", None)\n                    if callable(reset_fit_state):\n                        reset_fit_state()\n                    else:\n                        reset_cv_state = getattr(self, "_reset_cv_fit_state", None)\n                        if callable(reset_cv_state):\n                            reset_cv_state()\n                try:\n                    bound = signature.bind(self, *args, **kwargs)\n                except TypeError:\n                    return original(self, *args, **kwargs)\n                loss_value = getattr(self, "loss", "")\n                loss_name = str(getattr(loss_value, "name", loss_value)).lower()\n                formula_active = bound.arguments.get("formula") is not None\n                for name, value in bound.arguments.items():\n                    if name == "y" and loss_name in {"cox", "coxph", "cox_ph"}:\n                        # Cox response matrices have stronger joint time/event\n                        # contracts. Preserve model-specific errors and validate\n                        # them before device selection inside the Cox estimator.\n                        continue\n                    formula_owned_pandas = formula_active or (\n                        method_name != "fit"\n                        and name == "X"\n                        and getattr(self, "_design_info", None) is not None\n                    )\n                    formula_owned_side_array = formula_active and name == "sample_weight"\n                    if formula_owned_side_array or (\n                        formula_owned_pandas\n                        and type(value).__module__.startswith("pandas")\n                    ):\n                        # Current formula calls own pandas row alignment and\n                        # sample-weight alignment. Model-specific formula code checks\n                        # the retained side array after Patsy has selected rows.\n                        # After a formula fit, only X passed to a prediction-like\n                        # method is transformed by stored design_info; direct refits\n                        # and unrelated side arrays still use the shared finite guard.\n                        continue\n                    if name in self._FINITE_PARAMETER_NAMES and value is not None:\n                        check_finite(value, name=name)\n                return original(self, *args, **kwargs)\n''',
              '''            def guarded(self, *args, **kwargs):\n                try:\n                    bound = signature.bind(self, *args, **kwargs)\n                except TypeError:\n                    return original(self, *args, **kwargs)\n                loss_value = getattr(self, "loss", "")\n                loss_name = str(getattr(loss_value, "name", loss_value)).lower()\n                formula_active = bound.arguments.get("formula") is not None\n                try:\n                    for name, value in bound.arguments.items():\n                        if name == "y" and loss_name in {"cox", "coxph", "cox_ph"}:\n                            # Cox response matrices have stronger joint time/event\n                            # contracts. Preserve model-specific errors and validate\n                            # them before device selection inside the Cox estimator.\n                            continue\n                        formula_owned_pandas = formula_active or (\n                            method_name != "fit"\n                            and name == "X"\n                            and getattr(self, "_design_info", None) is not None\n                        )\n                        formula_owned_side_array = (\n                            formula_active and name == "sample_weight"\n                        )\n                        if formula_owned_side_array or (\n                            formula_owned_pandas\n                            and type(value).__module__.startswith("pandas")\n                        ):\n                            # Formula code owns retained-row and side-array alignment.\n                            continue\n                        if name in self._FINITE_PARAMETER_NAMES and value is not None:\n                            check_finite(value, name=name)\n                except Exception:\n                    if method_name == "fit":\n                        reset_fit_state = getattr(self, "_reset_fit_state", None)\n                        if callable(reset_fit_state):\n                            reset_fit_state()\n                        else:\n                            reset_cv_state = getattr(\n                                self, "_reset_cv_fit_state", None\n                            )\n                            if callable(reset_cv_state):\n                                reset_cv_state()\n                    raise\n                return original(self, *args, **kwargs)\n''',
          )

          # Promote integral weights before the single backend reduction.
          replace_once(
              'statgpu/solvers/_utils.py',
              '''    try:\n        finite = xp.all(xp.isfinite(values))\n        negative = xp.any(values < 0)\n        if backend == "torch":\n            import torch\n\n            total_dev = torch.sum(values.to(dtype=torch.float64))\n        elif backend == "cupy":\n            import cupy as cp\n\n            total_dev = cp.sum(values, dtype=cp.float64)\n        else:\n            total_dev = np.sum(np.asarray(values), dtype=np.float64)\n        total = float(total_dev.item() if hasattr(total_dev, "item") else total_dev)\n''',
              '''    try:\n        finite = xp.all(xp.isfinite(values))\n        negative = xp.any(values < 0)\n        if backend == "torch":\n            import torch\n\n            if not torch.is_floating_point(values):\n                values = values.to(dtype=torch.float64)\n        elif getattr(values.dtype, "kind", "") in "biu":\n            values = values.astype(xp.float64, copy=False)\n        total_dev = xp.sum(values)\n        total = float(total_dev.item() if hasattr(total_dev, "item") else total_dev)\n''',
          )
          replace_once(
              'statgpu/solvers/_utils.py',
              '''    if backend == "torch":\n        import torch\n\n        if not torch.is_floating_point(values):\n            values = values.to(dtype=torch.float64)\n    elif getattr(values.dtype, "kind", "") in "biu":\n        values = values.astype(xp.float64, copy=False)\n    return backend, xp, values\n''',
              '''    return backend, xp, values\n''',
          )

          # A ValueError from an evaluator may retry the same declared objective;
          # programming exception classes remain non-recoverable.
          replace_once(
              'statgpu/linear_model/penalized/_penalized_cv.py',
              '''        (NotImplementedError, FloatingPointError, OverflowError, np.linalg.LinAlgError),\n''',
              '''        (\n            NotImplementedError,\n            ValueError,\n            FloatingPointError,\n            OverflowError,\n            np.linalg.LinAlgError,\n        ),\n''',
          )

          # Logistic owns its valid-fit reset exactly once and always publishes
          # likelihood diagnostics independently of inference computation.
          replace_once(
              'statgpu/linear_model/wrappers/_logistic.py',
              '''        self._validate_fit_controls()\n        self._train_pred_cache = None\n''',
              '''        self._reset_fit_state()\n        self._validate_fit_controls()\n        self._train_pred_cache = None\n''',
          )
          replace_once(
              'statgpu/linear_model/wrappers/_logistic.py',
              '''        # Degrees of freedom\n        self._df_resid = n_samples - (n_features + (1 if self._fit_intercept else 0))\n    \n    def _fit_gpu(self, X, y, sample_weight=None):\n''',
              '''        # Degrees of freedom\n        self._df_resid = n_samples - (n_features + (1 if self._fit_intercept else 0))\n\n        # Likelihood diagnostics are public fit outputs, not inference-only state.\n        eta_diag = self._X_design @ params\n        p_diag = np.clip(self._sigmoid(eta_diag), 1e-15, 1.0 - 1e-15)\n        loglik_i = y * np.log(p_diag) + (1.0 - y) * np.log(1.0 - p_diag)\n        weights_diag = (\n            None\n            if sample_weight is None\n            else np.asarray(sample_weight, dtype=np.float64).reshape(-1)\n        )\n        self._loglik = float(np.sum(\n            loglik_i if weights_diag is None else weights_diag * loglik_i\n        ))\n        y_mean = (\n            float(np.mean(y))\n            if weights_diag is None\n            else float(np.average(y, weights=weights_diag))\n        )\n        y_mean = float(np.clip(y_mean, 1e-15, 1.0 - 1e-15))\n        null_i = y * np.log(y_mean) + (1.0 - y) * np.log(1.0 - y_mean)\n        self._loglik_null = float(np.sum(\n            null_i if weights_diag is None else weights_diag * null_i\n        ))\n    \n    def _fit_gpu(self, X, y, sample_weight=None):\n''',
          )

          # Model documentation for the now-uniform diagnostics contract.
          for path, old_date, new_date in (
              ('docs/en/models/logistic-regression.md', 'Last updated: 2026-05-20', 'Last updated: 2026-08-06'),
              ('docs/cn/models/logistic-regression.md', '最后更新：2026-05-20', '最后更新：2026-08-06'),
          ):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              text = text.replace(old_date, new_date, 1)
              if path.startswith('docs/en'):
                  anchor = '- `compute_inference=True` is required for inference fields.\n'
                  addition = (
                      '- Likelihood, AIC, BIC, pseudo-R², and convergence status are '
                      'available regardless of `compute_inference`; only covariance-based '
                      'fields require inference.\n'
                  )
              else:
                  anchor = '- `compute_inference=True` 才会提供推断字段。\n'
                  if anchor not in text:
                      anchor = '## 参数\n'
                      addition = (
                          '似然、AIC、BIC、伪 R² 与收敛状态不依赖 `compute_inference`；'
                          '只有协方差相关推断字段需要开启推断。\n\n## 参数\n'
                      )
                  else:
                      addition = (
                          '- 似然、AIC、BIC、伪 R² 与收敛状态不依赖 '
                          '`compute_inference`；只有协方差相关字段需要开启推断。\n'
                      )
              if anchor not in text:
                  raise RuntimeError(f'{path}: documentation anchor missing')
              text = text.replace(anchor, anchor + addition, 1)
              p.write_text(text, encoding='utf-8')

          test_path = Path('dev/tests/test_pr87_code_review_fix_cycle.py')
          text = test_path.read_text(encoding='utf-8')
          text += '''\n\ndef test_logistic_cpu_likelihood_diagnostics_do_not_require_inference():\n    from statgpu.linear_model import LogisticRegression\n\n    X = np.array([[-1.5], [-0.5], [0.25], [1.0], [1.75]], dtype=float)\n    y = np.array([0.0, 0.0, 1.0, 1.0, 1.0])\n    weights = np.array([1.0, 2.0, 3.0, 1.5, 4.0])\n    model = LogisticRegression(\n        C=2.0, max_iter=200, tol=1e-10, device="cpu",\n        compute_inference=False,\n    ).fit(X, y, sample_weight=weights)\n\n    eta = model.intercept_ + X @ model.coef_\n    probability = np.clip(1.0 / (1.0 + np.exp(-eta)), 1e-15, 1.0 - 1e-15)\n    expected = np.sum(\n        weights * (y * np.log(probability) + (1.0 - y) * np.log(1.0 - probability))\n    )\n    y_mean = np.average(y, weights=weights)\n    expected_null = np.sum(\n        weights * (y * np.log(y_mean) + (1.0 - y) * np.log(1.0 - y_mean))\n    )\n    assert model.loglikelihood == pytest.approx(expected, rel=1e-12, abs=1e-12)\n    assert model.loglikelihood_null == pytest.approx(\n        expected_null, rel=1e-12, abs=1e-12\n    )\n    assert np.isfinite(model.aic)\n    assert np.isfinite(model.bic)\n    assert np.isfinite(model.pseudo_rsquared)\n    assert model._bse is None\n\n\ndef test_cv_valueerror_retry_is_visible_but_typeerror_stays_fatal(monkeypatch):\n    import statgpu.linear_model.penalized._penalized_cv as cv_mod\n\n    class Model:\n        coef_ = np.array([0.0])\n        intercept_ = 0.0\n        fit_intercept = True\n\n        def predict(self, X):\n            return np.zeros(len(X))\n\n    class Loss:\n        def value(self, *args, **kwargs):\n            return 1.25\n\n    owner = object.__new__(cv_mod.PenalizedGLM_CV)\n    owner.loss = "poisson"\n    monkeypatch.setattr(\n        cv_mod, '_evaluate_loss_numpy',\n        lambda *args, **kwargs: (_ for _ in ()).throw(ValueError('registered evaluator unavailable')),\n    )\n    with pytest.warns(RuntimeWarning, match='generic loss interface'):\n        assert owner._evaluate_single(\n            Model(), np.ones((2, 1)), np.ones(2), loss_fn=Loss()\n        ) == pytest.approx(1.25)\n\n    monkeypatch.setattr(\n        cv_mod, '_evaluate_loss_numpy',\n        lambda *args, **kwargs: (_ for _ in ()).throw(TypeError('programming bug')),\n    )\n    with pytest.raises(TypeError, match='programming bug'):\n        owner._evaluate_single(\n            Model(), np.ones((2, 1)), np.ones(2), loss_fn=Loss()\n        )\n'''
          test_path.write_text(text, encoding='utf-8')
          PY
      - name: Install full validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation,formula]"
          python -m pip install ruff
      - name: Re-run previously failing contracts
        run: |
          python -m pytest -q \
            dev/tests/test_maintenance_024_025.py::test_solver_weight_reduction_is_computed_once \
            dev/tests/test_maintenance_024_025.py::test_penalized_cv_does_not_substitute_mse_for_non_gaussian_loss \
            dev/tests/test_maintenance_024_025.py::test_penalized_cv_squared_error_emergency_fallback_preserves_weights \
            dev/tests/test_pr80_target_transfer_overflow_cache.py::test_successful_public_fit_resets_state_once \
            dev/tests/test_pr87_code_review_fix_cycle.py
      - name: Run complete CPU test tree
        run: python -m pytest dev/tests -q --tb=short
      - name: Run documentation contracts
        shell: bash
        run: |
          python dev/validation/fix_docs_links.py --check
          python dev/validation/check_docs_contracts.py
      - name: Run compile and high-signal static gates
        shell: bash
        run: |
          python -m compileall -q statgpu dev/validation dev/benchmarks
          ruff check \
            statgpu/_base.py \
            statgpu/glm_core/_irls.py \
            statgpu/glm_core/_family.py \
            statgpu/glm_core/_validation.py \
            statgpu/solvers/_utils.py \
            statgpu/linear_model/wrappers/_logistic.py \
            statgpu/linear_model/penalized/_penalized_cv.py \
            --select F821,E9,F63,F7,F82
          git diff --check
          python -m pytest --collect-only -q >/dev/null
      - name: Commit local-full closure and self-delete
        shell: bash
        run: |
          rm .github/workflows/pr87-review-round8-local-full.yml
          rm .github/workflows/pr87-review-round8-retry.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add statgpu dev/tests docs .github/workflows/pr87-review-round8-local-full.yml .github/workflows/pr87-review-round8-retry.yml
          git commit -m "fix: close PR87 local review gates"
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
