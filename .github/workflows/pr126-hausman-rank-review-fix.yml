name: PR126 Hausman rank review fix

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - .github/workflows/pr126-hausman-rank-review-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply Hausman rank-identifiability fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one target, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'statgpu/panel/_diagnostics.py',
              '''    if str(getattr(re_model, "_cov_type", "nonrobust")).lower() != "nonrobust":\n        return _inapplicable(\n            null=null,\n            alternative=alternative,\n            distribution="chi2",\n            reason="classical Hausman requires nonrobust RE covariance; robust auxiliary Hausman is not implemented in Stage C",\n        )\n\n    left_id = getattr(fe_model, "_panel_diagnostic_identity", None)\n''',
              '''    if str(getattr(re_model, "_cov_type", "nonrobust")).lower() != "nonrobust":\n        return _inapplicable(\n            null=null,\n            alternative=alternative,\n            distribution="chi2",\n            reason="classical Hausman requires nonrobust RE covariance; robust auxiliary Hausman is not implemented in Stage C",\n        )\n\n    unavailable = []\n    for label, model in (("FE", fe_model), ("RE", re_model)):\n        if not bool(getattr(model, "_coefficient_inference_available", True)):\n            model_reason = getattr(model, "_coefficient_inference_reason", None)\n            unavailable.append(\n                f"{label}: {model_reason or 'coefficient vector is not uniquely identified'}"\n            )\n    if unavailable:\n        return _inapplicable(\n            null=null,\n            alternative=alternative,\n            distribution="chi2",\n            reason=(\n                "classical Hausman requires uniquely identified coefficient vectors; "\n                + "; ".join(unavailable)\n            ),\n            metadata={"coefficient_inference_unavailable": tuple(unavailable)},\n        )\n\n    left_id = getattr(fe_model, "_panel_diagnostic_identity", None)\n'''
          )

          p = Path('dev/tests/test_panel_stage_c_inference_guard.py')
          text = p.read_text()
          text = text.replace(
              'from statgpu.panel import _covariance\n',
              'from statgpu.panel import PanelOLS, RandomEffects, _covariance\n',
              1,
          )
          addition = '''\n\ndef test_hausman_rejects_rank_deficient_nonunique_coefficients():\n    rng = np.random.default_rng(12988)\n    n_entities, n_times = 14, 5\n    entity = np.repeat(np.arange(n_entities), n_times)\n    x = rng.normal(size=entity.size)\n    X_slopes = np.column_stack([x, 2.0 * x])\n    alpha = np.repeat(rng.normal(scale=0.35, size=n_entities), n_times)\n    y = 0.55 * x + alpha + rng.normal(scale=0.2, size=entity.size)\n\n    fe = PanelOLS(entity_effects=True).fit(\n        X_slopes, y, entity_ids=entity\n    )\n    re = RandomEffects().fit(\n        np.column_stack([np.ones(len(y)), X_slopes]),\n        y,\n        entity_ids=entity,\n    )\n\n    assert fe._coefficient_inference_available is False\n    assert re._coefficient_inference_available is False\n    assert fe._panel_diagnostic_identity["fingerprint"]["content_digest"] == (\n        re._panel_diagnostic_identity["fingerprint"]["content_digest"]\n    )\n\n    result = fe.hausman_test(re)\n    assert result.applicable is False\n    assert result.statistic is None\n    assert result.pvalue is None\n    assert "uniquely identified coefficient vectors" in result.reason\n    assert "rank deficient" in result.reason\n    assert len(result.metadata["coefficient_inference_unavailable"]) == 2\n'''
          p.write_text(text + addition)

          replace_once(
              'docs/en/panel/diagnostics.md',
              '''> **Applicability:** `hausman_test()` implements the classical one-way entity FE-versus-RE comparison. Both models must use `cov_type="nonrobust"` and must be fitted to the same aligned sample and coefficient design. If these requirements are not met, the result is returned with `applicable=False` and a reason instead of silently switching to a different Hausman variant.\n''',
              '''> **Applicability:** `hausman_test()` implements the classical one-way entity FE-versus-RE comparison. Both models must use `cov_type="nonrobust"`, must be fitted to the same aligned sample and coefficient design, and must have uniquely identified coefficient vectors. If either fitted design is rank deficient, coefficient-level inference is unavailable and Hausman returns `applicable=False` rather than constructing a test from an arbitrary generalized-inverse coefficient representation. If these requirements are not met, the result is returned with `applicable=False` and a reason instead of silently switching to a different Hausman variant.\n'''
          )
          replace_once(
              'docs/cn/panel/diagnostics.md',
              '''> **适用性：** `hausman_test()` 实现经典 one-way entity FE-versus-RE 比较。两个模型都必须使用 `cov_type="nonrobust"`，并且必须基于相同的 aligned sample 和 coefficient design 拟合。如果这些条件不满足，结果会返回 `applicable=False` 以及明确 reason，而不会静默切换到另一种 Hausman 变体。\n''',
              '''> **适用性：** `hausman_test()` 实现经典 one-way entity FE-versus-RE 比较。两个模型都必须使用 `cov_type="nonrobust"`，必须基于相同的 aligned sample 和 coefficient design 拟合，而且 coefficient vector 必须唯一可识别。如果任一 fitted design rank deficient，coefficient-level inference 本身不可用，Hausman 会返回 `applicable=False`，而不会基于任意 generalized-inverse coefficient representation 构造检验。如果这些条件不满足，结果会返回 `applicable=False` 以及明确 reason，而不会静默切换到另一种 Hausman 变体。\n'''
          )
          replace_once(
              'CHANGELOG.md',
              '''rank-deficient inference, FirstDifference time validation,''',
              '''rank-deficient inference and Hausman applicability, FirstDifference time validation,'''
          )
          replace_once(
              'docs/en/changelog.md',
              '''The same review also strengthens rank-deficient coefficient identifiability, `FirstDifferenceOLS` duplicate/time semantics,''',
              '''The same review also strengthens rank-deficient coefficient identifiability and makes classical Hausman fail closed whenever either fitted coefficient vector is non-unique, plus `FirstDifferenceOLS` duplicate/time semantics,'''
          )
          replace_once(
              'docs/cn/changelog.md',
              '''其余强化还包括 rank-deficient coefficient identifiability、`FirstDifferenceOLS` duplicate/time 语义、''',
              '''其余强化还包括 rank-deficient coefficient identifiability，并让 classical Hausman 在任一 fitted coefficient vector 非唯一时 fail closed；此外还包括 `FirstDifferenceOLS` duplicate/time 语义、'''
          )
          PY
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas patsy pytest joblib scikit-learn
          python -m pip install -e . --no-deps
      - name: Run focused inference and diagnostic regressions
        run: |
          python -m compileall -q statgpu
          pytest -q dev/tests/test_panel_stage_c_inference_guard.py dev/tests/test_panel_stage_c_covariance.py dev/tests/test_panel_stage_c_api_formula.py
          git diff --check
      - name: Commit fix and self-delete
        shell: bash
        run: |
          rm -f .github/workflows/pr126-hausman-rank-review-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: reject Hausman on nonidentified coefficients"
          git push origin HEAD:agent/panel-p1-stage-c-covariance
