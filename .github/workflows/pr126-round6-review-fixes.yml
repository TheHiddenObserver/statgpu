name: PR126 guarded round6 review fixes

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - '.github/workflows/pr126-round6-review-fixes.yml'

permissions:
  contents: write

jobs:
  round6-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pandas patsy
      - name: Apply exact reviewed fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected}, found {count}: {old!r}')
              p.write_text(text.replace(old, new, expected), encoding='utf-8')

          replace_exact(
              'statgpu/panel/_fixed_effects.py',
              '''        if fe_entity_effects:\n            self.entity_effects = True\n        if fe_time_effects:\n            self.time_effects = True\n        entity_ids = aligned["entity_ids"]\n''',
              '''        # Formula effects are fit-time requests, not persistent constructor\n        # mutations.  Rebuild the effective FE configuration from the captured\n        # constructor parameters on every fit so a formula-enabled FE fit cannot\n        # leak into a later array/no-FE refit of the same estimator.\n        configured = getattr(self, "_constructor_params_raw", {})\n        configured_entity_effects = bool(\n            configured.get("entity_effects", self.entity_effects)\n        )\n        configured_time_effects = bool(\n            configured.get("time_effects", self.time_effects)\n        )\n        self.entity_effects = configured_entity_effects or bool(fe_entity_effects)\n        self.time_effects = configured_time_effects or bool(fe_time_effects)\n        entity_ids = aligned["entity_ids"]\n''',
          )

          replace_exact(
              'statgpu/panel/_fixed_effects.py',
              '''        def _effect_values(ids_np, mapping):\n            if not mapping or ids_np is None:\n                return None\n            values = np.fromiter(\n                (float(mapping.get(value, 0.0)) for value in ids_np),\n                dtype=np.float64,\n                count=ids_np.shape[0],\n            )\n            return xp_asarray(\n                values, dtype=xp.float64, xp=xp, ref_arr=prediction\n            )\n\n        entity_effect = _effect_values(entity_ids_np, self._entity_effects_map)\n        if entity_effect is not None:\n            prediction = prediction + entity_effect\n        time_effect = _effect_values(time_ids_np, self._time_effects_map)\n        if time_effect is not None:\n            prediction = prediction + time_effect\n\n        return np.asarray(_to_numpy(prediction), dtype=np.float64)\n''',
              '''        n_rows = int(prediction.shape[0])\n        uses_fitted_effect = np.zeros(n_rows, dtype=bool)\n\n        def _effect_values(ids_np, mapping):\n            if not mapping or ids_np is None:\n                return None, None\n            known = np.fromiter(\n                (value in mapping for value in ids_np),\n                dtype=bool,\n                count=ids_np.shape[0],\n            )\n            values = np.fromiter(\n                (float(mapping.get(value, 0.0)) for value in ids_np),\n                dtype=np.float64,\n                count=ids_np.shape[0],\n            )\n            return (\n                xp_asarray(values, dtype=xp.float64, xp=xp, ref_arr=prediction),\n                known,\n            )\n\n        entity_effect, entity_known = _effect_values(\n            entity_ids_np, self._entity_effects_map\n        )\n        if entity_effect is not None:\n            prediction = prediction + entity_effect\n            uses_fitted_effect |= entity_known\n        time_effect, time_known = _effect_values(\n            time_ids_np, self._time_effects_map\n        )\n        if time_effect is not None:\n            prediction = prediction + time_effect\n            uses_fitted_effect |= time_known\n\n        # Fixed-effect maps are recovered after centering the level residual by\n        # its grand mean.  Whenever a row actually uses a stored fitted effect,\n        # restore that common level component exactly once.  Rows whose labels\n        # are wholly unseen preserve the documented linear-only fallback.\n        if np.any(uses_fitted_effect):\n            grand_mean = xp_asarray(\n                uses_fitted_effect.astype(np.float64) * float(self._grand_mean),\n                dtype=xp.float64,\n                xp=xp,\n                ref_arr=prediction,\n            )\n            prediction = prediction + grand_mean\n\n        return np.asarray(_to_numpy(prediction), dtype=np.float64)\n''',
          )

          replace_exact(
              'statgpu/panel/_formula.py',
              '''    entity_ids = None\n    time_ids = None\n\n    if fe_vars:\n''',
              '''    entity_ids = None\n    time_ids = None\n\n    if len(fe_vars) > 2:\n        raise ValueError(\n            "Panel formula fixed effects support at most two variables "\n            "(entity and time); high-dimensional FE (>2) is not supported"\n        )\n\n    if fe_vars:\n''',
          )
          replace_exact(
              'statgpu/panel/_formula.py',
              '''        if len(fe_vars) > 2:\n            # For >2 FE vars, we still extract entity and time\n            # but warn that high-dim FE is not yet supported\n            import warnings\n            warnings.warn(\n                f"Formula has {len(fe_vars)} fixed effect variables. "\n                f"Only the first two are used as entity/time effects. "\n                f"High-dimensional FE (>2) is not yet supported.",\n                UserWarning,\n                stacklevel=3,\n            )\n''',
              '',
          )

          test_path = 'dev/tests/test_panel_stage_c_final_review_fixes.py'
          marker = '''\ndef test_unbalanced_two_way_prediction_uses_joint_fixed_effect_solution():\n'''
          additions = '''\ndef test_one_way_fixed_effect_prediction_restores_grand_mean_only_for_known_labels():\n    rng = np.random.default_rng(2026082101)\n    entity = np.repeat(np.arange(8), 5)\n    X = rng.normal(size=(entity.size, 2))\n    alpha = rng.normal(loc=1.4, scale=0.3, size=8)\n    y = 0.7 * X[:, 0] - 0.25 * X[:, 1] + alpha[entity]\n    model = PanelOLS(entity_effects=True).fit(X, y, entity_ids=entity)\n\n    known = model.predict(X, entity_ids=entity)\n    dummies = np.column_stack(\n        [(entity == level).astype(np.float64) for level in np.unique(entity)]\n    )\n    design = np.column_stack([X, dummies])\n    reference = design @ np.linalg.lstsq(design, y, rcond=None)[0]\n    assert_allclose(known, reference, rtol=0, atol=2e-9)\n\n    # Unknown FE labels retain the documented linear-only fallback; the grand\n    # mean is restored only for rows that actually use a fitted FE value.\n    unknown = model.predict(X[:4], entity_ids=np.full(4, 999))\n    assert_allclose(unknown, X[:4] @ model.coef_, rtol=0, atol=3e-12)\n\n\ndef test_formula_enabled_effects_do_not_leak_into_later_refit():\n    pd = pytest.importorskip("pandas")\n    pytest.importorskip("patsy")\n    rng = np.random.default_rng(2026082102)\n    entity = np.repeat(np.arange(8), 4)\n    time = np.tile(np.arange(4), 8)\n    x = rng.normal(size=entity.size)\n    y = 0.8 * x + rng.normal(scale=0.1, size=entity.size)\n    data = pd.DataFrame({"y": y, "x": x, "entity": entity, "time": time})\n\n    model = PanelOLS()\n    model.fit(formula="y ~ x | entity + time", data=data)\n    assert model.entity_effects is True\n    assert model.time_effects is True\n\n    model.fit(X=x[:, None], y=y)\n    assert model.entity_effects is False\n    assert model.time_effects is False\n    assert model.coef_ is not None\n\n\ndef test_formula_more_than_two_fixed_effects_fails_closed():\n    pd = pytest.importorskip("pandas")\n    pytest.importorskip("patsy")\n    rng = np.random.default_rng(2026082103)\n    n = 24\n    data = pd.DataFrame(\n        {\n            "y": rng.normal(size=n),\n            "x": rng.normal(size=n),\n            "entity": np.repeat(np.arange(6), 4),\n            "time": np.tile(np.arange(4), 6),\n            "industry": np.repeat(np.arange(3), 8),\n        }\n    )\n    with pytest.raises(ValueError, match="at most two"):\n        PanelOLS().fit(\n            formula="y ~ x | entity + time + industry",\n            data=data,\n        )\n\n'''
          replace_exact(test_path, marker, additions + marker)

          replace_exact(
              test_path,
              '''    # PanelOLS historically excludes the separately stored grand mean from\n    # predict().  After adding it back, fitted values must equal the joint\n    # least-squares projection on X plus the two fixed-effect dummy spaces.\n''',
              '''    # Level prediction must equal the joint least-squares projection on X\n    # plus the two fixed-effect dummy spaces, including the common grand mean.\n''',
          )
          replace_exact(
              test_path,
              '''    assert_allclose(\n        prediction + model._grand_mean,\n        reference,\n        rtol=0,\n        atol=2e-9,\n    )\n\n    residual = y - model._grand_mean - prediction\n''',
              '''    assert_allclose(prediction, reference, rtol=0, atol=2e-9)\n\n    residual = y - prediction\n''',
          )

          replace_exact(
              'dev/tests/test_panel_stage_a_golden.py',
              '''    # Current prediction adds the stored entity effect to X beta, but not the\n    # separately stored grand mean. Freeze that behavior rather than changing\n    # it as part of the Stage-A architecture refactor.\n    assert_allclose(\n        model.predict(X[:4], entity_ids=entity[:4]),\n        [-1.17565613, -1.55218831, 0.49083732, 1.84934445],\n        rtol=RTOL,\n        atol=ATOL,\n    )\n''',
              '''    # Full level prediction restores the separately stored grand mean when\n    # a fitted entity effect is used.\n    assert_allclose(\n        model.predict(X[:4], entity_ids=entity[:4]),\n        np.array([-1.17565613, -1.55218831, 0.49083732, 1.84934445])\n        + model._grand_mean,\n        rtol=RTOL,\n        atol=ATOL,\n    )\n''',
          )

          replace_exact(
              'docs/en/models/panel.md',
              '''Formula input can also request effects through the existing pipe syntax, for example `"y ~ x1 + x2 | entity"`. Formula row filtering aligns side arrays to the retained estimation sample. For two-way fixed effects, `demean_max_iter` and `demean_tol` control the fail-closed backend-native projection solver; convergence is checked against residual entity and time means rather than only adjacent-iterate changes. Group codes are factorized once and reused across iterations. Fitted two-way effects are recovered jointly on unbalanced panels. If the observed entity-time incidence graph is disconnected, a prediction that uses a stored fixed effect is identified only when both entity and time labels are known and belong to the same component; cross-component pairs and one-sided/known-plus-unknown effect combinations raise instead of exposing arbitrary component normalizations. If both labels are unseen, the historical zero-effect fallback remains the linear-only prediction.\n''',
              '''Formula input can also request one-way or two-way effects through the existing pipe syntax, for example `"y ~ x1 + x2 | entity"`; formulas requesting more than two fixed-effect variables fail closed rather than silently dropping additional effects. Formula row filtering aligns side arrays to the retained estimation sample, and formula-enabled effects apply only to that fit rather than leaking into a later refit of the same estimator. For two-way fixed effects, `demean_max_iter` and `demean_tol` control the fail-closed backend-native projection solver; convergence is checked against residual entity and time means rather than only adjacent-iterate changes. Group codes are factorized once and reused across iterations. Fitted one-way/two-way level predictions restore the common grand-mean component whenever a stored fixed effect is used, so known-label fitted predictions match the corresponding fixed-effect least-squares projection. Fitted two-way effects are recovered jointly on unbalanced panels. If the observed entity-time incidence graph is disconnected, a prediction that uses a stored fixed effect is identified only when both entity and time labels are known and belong to the same component; cross-component pairs and one-sided/known-plus-unknown effect combinations raise instead of exposing arbitrary component normalizations. If all supplied fixed-effect labels are unseen, the historical zero-effect fallback remains the linear-only prediction.\n''',
          )
          replace_exact(
              'docs/cn/models/panel.md',
              '''formula 输入也可使用已有 pipe syntax，例如 `"y ~ x1 + x2 | entity"`。formula 的 missing-row filtering 会同步对齐 observation-level side arrays。对于 two-way fixed effects，`demean_max_iter` 与 `demean_tol` 控制 fail-closed、backend-native 的 projection solver；收敛判据直接检查残余 entity/time group mean，而不是只比较相邻 iterate。group code 只在迭代前 factorize 一次并反复复用。unbalanced panel 的 two-way fixed effects 会联合恢复；若已观察 entity-time incidence graph 不连通，只要 prediction 使用了已拟合 fixed effect，就要求 entity/time 两侧都为已知 label 且属于同一 component；跨 component、单边 label、或“已知一侧 + 未知另一侧”的组合都会明确报错，避免暴露任意 component normalization。若两侧 label 都未见过，则仍保留历史 zero-effect fallback，仅返回 linear prediction。\n''',
              '''formula 输入可通过已有 pipe syntax 请求 one-way 或 two-way effects，例如 `"y ~ x1 + x2 | entity"`；若请求超过两个 fixed-effect 变量会 fail closed，而不会静默丢弃后续 effect。formula 的 missing-row filtering 会同步对齐 observation-level side arrays，并且 formula 临时启用的 effect 只作用于该次 fit，不会泄漏到同一 estimator 后续的 refit。对于 two-way fixed effects，`demean_max_iter` 与 `demean_tol` 控制 fail-closed、backend-native 的 projection solver；收敛判据直接检查残余 entity/time group mean，而不是只比较相邻 iterate。group code 只在迭代前 factorize 一次并反复复用。one-way/two-way 的 level prediction 在实际使用已拟合 fixed effect 时会恢复公共 grand-mean 分量，因此已知 label 的 fitted prediction 与对应 fixed-effect least-squares projection 一致。unbalanced panel 的 two-way fixed effects 会联合恢复；若已观察 entity-time incidence graph 不连通，只要 prediction 使用了已拟合 fixed effect，就要求 entity/time 两侧都为已知 label 且属于同一 component；跨 component、单边 label、或“已知一侧 + 未知另一侧”的组合都会明确报错，避免暴露任意 component normalization。若所提供的 fixed-effect label 全部未见过，则仍保留历史 zero-effect fallback，仅返回 linear prediction。\n''',
          )
          PY
      - name: Run focused review regressions
        run: |
          python -m pytest \
            dev/tests/test_panel_stage_c_final_review_fixes.py \
            dev/tests/test_panel_stage_a_golden.py \
            dev/tests/test_panel_formula.py \
            -q --tb=short
      - name: Verify scope and commit without temporary workflow
        run: |
          git rm .github/workflows/pr126-round6-review-fixes.yml
          python - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/pr126-round6-review-fixes.yml',
              'statgpu/panel/_fixed_effects.py',
              'statgpu/panel/_formula.py',
              'dev/tests/test_panel_stage_c_final_review_fixes.py',
              'dev/tests/test_panel_stage_a_golden.py',
              'docs/en/models/panel.md',
              'docs/cn/models/panel.md',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'HEAD'], text=True).splitlines())
          if changed != allowed:
              raise SystemExit(f'unexpected round6 scope: {sorted(changed)}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(panel): correct fixed-effect prediction and formula refits'
          git push origin HEAD:agent/panel-p1-stage-c-covariance
