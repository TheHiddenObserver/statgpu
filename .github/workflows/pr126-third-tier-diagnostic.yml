name: PR126 Torch third-tier diagnostic

on:
  push:
    branches: [agent/panel-p1-stage-c-covariance]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install maintained Torch CPU environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2"
          python -m pip install "torch==2.0.1+cpu" --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Run third-tier diagnostic
        run: python dev/validation/pr126_third_tier_torch_diagnostic.py
