name: PR87 review fix batch v17

on:
  push:
    branches: [agent/maintenance-0.2.4-0.2.5]
    paths:
      - .github/workflows/pr87-review-fix-loop-v17.yml

permissions:
  contents: write

jobs:
  apply-review-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply reviewed fixes
        run: python pr87_patch_v17.py
      - name: Install validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" scipy pytest packaging "scikit-learn==1.3.2" pandas patsy statsmodels joblib
          python -m pip install -e . --no-deps
      - name: Run targeted validation
        run: |
          python -m py_compile \
            statgpu/core/formula/_alignment.py \
            statgpu/linear_model/_glm_base.py \
            statgpu/linear_model/penalized/_fit_mixin.py \
            statgpu/linear_model/wrappers/_linear.py
          python -m pytest \
            dev/tests/test_maintenance_024_025.py \
            dev/tests/test_core_contracts.py::test_set_params_rejects_unknown_and_supports_nested_estimators \
            -q --tb=short
      - name: Commit source fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f pr87_patch_v16.py pr87_patch_v17.py
          git add \
            statgpu/core/formula/_alignment.py \
            statgpu/core/formula/__init__.py \
            statgpu/_base.py \
            statgpu/linear_model/wrappers/_linear.py \
            statgpu/linear_model/_glm_base.py \
            statgpu/linear_model/penalized/_fit_mixin.py \
            dev/tests/test_maintenance_024_025.py
          git commit -m "fix: validate formula sample weights after alignment"
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
