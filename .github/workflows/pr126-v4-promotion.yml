name: PR126 v4 canonical promotion

on:
  push:
    branches: [agent/panel-p1-stage-c-covariance]
    paths:
      - 'dev/pr126_v4_promote.py'
      - '.github/workflows/pr126-v4-promotion.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Normalize temporary promotion helper anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('dev/pr126_v4_promote.py')
          text = p.read_text()
          old = '''    text = replace_once(
                  text,
                  'if int(data.get("schema_version", -1)) != 1:',
                  'if int(data.get("schema_version", -1)) != 2:',
                  "correctness schema",
              )
              text = replace_once(
                  text,
                  'requires schema_version=1',
                  'requires schema_version=2',
                  "correctness schema message",
              )
              text = replace_once(
                  text,
                  'if int(data.get("schema_version", -1)) != 2:',
                  'if int(data.get("schema_version", -1)) != 3:',
                  "performance schema",
              )
              text = replace_once(
                  text,
                  'performance requires schema_version=2',
                  'performance requires schema_version=3',
                  "performance schema message",
              )'''
          new = '''    text = replace_once(
                  text,
                  'if int(data.get("schema_version", -1)) != 2:',
                  'if int(data.get("schema_version", -1)) != 3:',
                  "performance schema",
              )
              text = replace_once(
                  text,
                  'performance requires schema_version=2',
                  'performance requires schema_version=3',
                  "performance schema message",
              )
              text = replace_once(
                  text,
                  'if int(data.get("schema_version", -1)) != 1:',
                  'if int(data.get("schema_version", -1)) != 2:',
                  "correctness schema",
              )
              text = replace_once(
                  text,
                  'requires schema_version=1',
                  'requires schema_version=2',
                  "correctness schema message",
              )'''
          if text.count(old) != 1:
              raise SystemExit(f'schema helper anchor drifted: {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Apply immutable v4 promotion
        run: python dev/pr126_v4_promote.py
      - name: Install benchmark validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest 'jsonschema[format]'
      - name: Run v4 parser and maintained frontend source matrix
        run: |
          python -m pytest -q \
            dev/tests/test_panel_stage_c_identifiability_frontend_source.py \
            dev/tests/test_benchmark_frontend_data.py \
            dev/tests/test_benchmark_catalog.py \
            dev/tests/test_benchmark_inventory_v2.py \
            dev/tests/test_frontend_contracts.py \
            dev/tests/test_frontend_domain_coverage.py \
            dev/tests/test_panel_stage_c_frontend_source.py
      - name: Generate canonical benchmark bundle
        run: |
          python dev/benchmarks/generate_benchmark_data.py \
            --out frontend/public/data/benchmark_data.json \
            --report frontend/public/data/parse_report.json \
            --inventory-out frontend/public/data/source_inventory.json \
            --deterministic --strict-sources
          python dev/benchmarks/generate_benchmark_data.py --check --strict-sources
      - name: Re-run frontend source tests against generated state
        run: |
          python -m pytest -q \
            dev/tests/test_panel_stage_c_identifiability_frontend_source.py \
            dev/tests/test_benchmark_frontend_data.py \
            dev/tests/test_benchmark_catalog.py \
            dev/tests/test_benchmark_inventory_v2.py \
            dev/tests/test_frontend_contracts.py \
            dev/tests/test_frontend_domain_coverage.py \
            dev/tests/test_panel_stage_c_frontend_source.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Frontend typecheck and build
        run: |
          cd frontend
          npm ci
          npm run typecheck
          npm run build
      - name: Static and exact-source applicability gates
        run: |
          python -m compileall -q dev/benchmarks/frontend_data dev/tests/test_panel_stage_c_identifiability_frontend_source.py
          git diff --check
          changed="$(git diff --name-only a99726e19c535dfcd0a94711bbc8be6aac437584...HEAD; git diff --name-only)"
          if printf '%s\n' "$changed" | grep -E '^(statgpu/panel/|dev/benchmarks/validate_panel_stage_c_gpu.py$|dev/benchmarks/benchmark_panel_stage_c_covariance.py$)' ; then
            echo 'Exact-source applicability violated: numerical source/runner changed after measurement.'
            exit 1
          fi
      - name: Commit validated v4 promotion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr126-v4-promotion.yml dev/pr126_v4_promote.py
          git add \
            dev/benchmarks/frontend_data/parsers/panel_stage_c_identifiability.py \
            dev/benchmarks/frontend_data/parsers/__init__.py \
            dev/benchmarks/frontend_data/registry.py \
            dev/benchmarks/frontend_sources.json \
            dev/benchmarks/benchmark_coverage_matrix.json \
            dev/tests/test_panel_stage_c_identifiability_frontend_source.py \
            dev/reviews/pr126_round4_autofix_review_2026-08-12.md \
            dev/plans/panel_p1_stage_c_covariance_plan.md \
            frontend/public/data \
            docs/assets/benchmarks
          git diff --cached --check
          git commit -m 'bench: promote PR126 identifiability P100 evidence v4'
          git push origin HEAD:agent/panel-p1-stage-c-covariance
