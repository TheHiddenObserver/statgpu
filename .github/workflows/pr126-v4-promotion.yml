name: PR126 v4 canonical promotion

on:
  push:
    branches: [agent/panel-p1-stage-c-covariance]
    paths:
      - 'dev/pr126_v4_promote.py'
      - '.github/workflows/pr126-v4-promotion.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Normalize temporary promotion helper anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('dev/pr126_v4_promote.py')
          text = p.read_text()
          old = '''    text = replace_once(
                  text,
                  'if int(data.get("schema_version", -1)) != 1:',
                  'if int(data.get("schema_version", -1)) != 2:',
                  "correctness schema",
              )
              text = replace_once(
                  text,
                  'requires schema_version=1',
                  'requires schema_version=2',
                  "correctness schema message",
              )
              text = replace_once(
                  text,
                  'if int(data.get("schema_version", -1)) != 2:',
                  'if int(data.get("schema_version", -1)) != 3:',
                  "performance schema",
              )
              text = replace_once(
                  text,
                  'performance requires schema_version=2',
                  'performance requires schema_version=3',
                  "performance schema message",
              )'''
          new = '''    text = replace_once(
                  text,
                  'if int(data.get("schema_version", -1)) != 2:',
                  'if int(data.get("schema_version", -1)) != 3:',
                  "performance schema",
              )
              text = replace_once(
                  text,
                  'performance requires schema_version=2',
                  'performance requires schema_version=3',
                  "performance schema message",
              )
              text = replace_once(
                  text,
                  'if int(data.get("schema_version", -1)) != 1:',
                  'if int(data.get("schema_version", -1)) != 2:',
                  "correctness schema",
              )
              text = replace_once(
                  text,
                  'requires schema_version=1',
                  'requires schema_version=2',
                  "correctness schema message",
              )'''
          if text.count(old) != 1:
              raise SystemExit(f'schema helper anchor drifted: {text.count(old)}')
          text = text.replace(old, new, 1)

          function_anchor = '''def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one replacement target, found {count}")
              return text.replace(old, new, 1)
          '''
          function_replacement = function_anchor + '''
          def replace_first(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count < 1:
                  raise RuntimeError(f"{label}: replacement target is missing")
              return text.replace(old, new, 1)
          '''
          if text.count(function_anchor) != 1:
              raise SystemExit('replace_once helper anchor drifted')
          text = text.replace(function_anchor, function_replacement, 1)

          case_call = '''    text = replace_once(
                  text,
                  ''' + "'''" + '''                _bool_check("recorded_numpy_difference_finite", diff_ok),\\n            ]''' + "'''" + ''','''
          if text.count(case_call) != 1:
              raise SystemExit(f'case transform call anchor drifted: {text.count(case_call)}')
          text = text.replace(case_call, case_call.replace('replace_once', 'replace_first', 1), 1)
          p.write_text(text)
          PY
      - name: Apply immutable v4 promotion
        run: python dev/pr126_v4_promote.py
      - name: Synchronize maintained exact canonical fixtures
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences of {old!r}, found {count}')
              p.write_text(text.replace(old, new))

          p = 'dev/tests/test_benchmark_frontend_data.py'
          replace(p, 'assert len(manifest["sources"]) == 17', 'assert len(manifest["sources"]) == 19')
          replace(p, 'assert report["files_seen"] == 17', 'assert report["files_seen"] == 19')
          replace(p, 'assert report["files_parsed"] == 17', 'assert report["files_parsed"] == 19')
          replace(p, 'assert inventory["registered_sources"] == 17', 'assert inventory["registered_sources"] == 19')
          replace(p, 'assert inventory["available_sources"] == 17', 'assert inventory["available_sources"] == 19')
          replace(p, 'assert inventory["parsed_sources"] == 17', 'assert inventory["parsed_sources"] == 19')

          p = 'dev/tests/test_benchmark_catalog.py'
          old_list_tail = '''        "panel-stage-c-rank-df-validation-pr126-20260812-0b4eb5810ad0",
              "panel-stage-c-rank-df-performance-pr126-20260812-09337cc62c94",
          ]'''
          new_list_tail = '''        "panel-stage-c-rank-df-validation-pr126-20260812-0b4eb5810ad0",
              "panel-stage-c-rank-df-performance-pr126-20260812-09337cc62c94",
              "panel-stage-c-identifiability-validation-pr126-20260812-2d929bccf1c7",
              "panel-stage-c-identifiability-performance-pr126-20260812-2238002d491f",
          ]'''
          replace(p, old_list_tail, new_list_tail)
          replace(p, 'assert inventory["registered_sources"] == len(manifest["sources"]) == 17', 'assert inventory["registered_sources"] == len(manifest["sources"]) == 19')
          replace(p, 'assert inventory["available_registered_sources"] == 17', 'assert inventory["available_registered_sources"] == 19')
          replace(p, 'assert inventory["parsed_registered_sources"] == 17', 'assert inventory["parsed_registered_sources"] == 19')

          p = 'dev/tests/test_benchmark_inventory_v2.py'
          replace(p, 'assert len(registered) == inventory["registered_sources"] == 17', 'assert len(registered) == inventory["registered_sources"] == 19')
          replace(p, 'assert serialized["available_registered_sources"] == 17', 'assert serialized["available_registered_sources"] == 19')
          replace(p, 'assert serialized["parsed_registered_sources"] == 17', 'assert serialized["parsed_registered_sources"] == 19')
          replace(p, 'assert inventory["available_sources"] == 17', 'assert inventory["available_sources"] == 19')
          replace(p, 'assert inventory["parsed_sources"] == 17', 'assert inventory["parsed_sources"] == 19')

          p = 'dev/tests/test_frontend_domain_coverage.py'
          replace(p, 'assert len(manifest["sources"]) == 17', 'assert len(manifest["sources"]) == 19')
          replace(p, 'assert len(output["runs"]) == 2272', 'assert len(output["runs"]) == 2426')
          replace(p, 'assert report["runs_generated"] == 2272', 'assert report["runs_generated"] == 2426')
          PY
      - name: Install benchmark validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest 'jsonschema[format]'
      - name: Run v4 parser and maintained frontend source matrix
        run: |
          python -m pytest -q \
            dev/tests/test_panel_stage_c_identifiability_frontend_source.py \
            dev/tests/test_benchmark_frontend_data.py \
            dev/tests/test_benchmark_catalog.py \
            dev/tests/test_benchmark_inventory_v2.py \
            dev/tests/test_frontend_contracts.py \
            dev/tests/test_frontend_domain_coverage.py \
            dev/tests/test_panel_stage_c_frontend_source.py
      - name: Generate canonical benchmark bundle
        run: |
          python dev/benchmarks/generate_benchmark_data.py \
            --out frontend/public/data/benchmark_data.json \
            --report frontend/public/data/parse_report.json \
            --inventory-out frontend/public/data/source_inventory.json \
            --deterministic --strict-sources
          python dev/benchmarks/generate_benchmark_data.py --check --strict-sources
      - name: Re-run frontend source tests against generated state
        run: |
          python -m pytest -q \
            dev/tests/test_panel_stage_c_identifiability_frontend_source.py \
            dev/tests/test_benchmark_frontend_data.py \
            dev/tests/test_benchmark_catalog.py \
            dev/tests/test_benchmark_inventory_v2.py \
            dev/tests/test_frontend_contracts.py \
            dev/tests/test_frontend_domain_coverage.py \
            dev/tests/test_panel_stage_c_frontend_source.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Frontend typecheck and build
        run: |
          cd frontend
          npm ci
          npm run typecheck
          npm run build
      - name: Static and exact-source applicability gates
        run: |
          python -m compileall -q dev/benchmarks/frontend_data dev/tests/test_panel_stage_c_identifiability_frontend_source.py
          git diff --check
          changed="$(git diff --name-only a99726e19c535dfcd0a94711bbc8be6aac437584...HEAD; git diff --name-only)"
          if printf '%s\n' "$changed" | grep -E '^(statgpu/panel/|dev/benchmarks/validate_panel_stage_c_gpu.py$|dev/benchmarks/benchmark_panel_stage_c_covariance.py$)' ; then
            echo 'Exact-source applicability violated: numerical source/runner changed after measurement.'
            exit 1
          fi
      - name: Commit validated v4 promotion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr126-v4-promotion.yml dev/pr126_v4_promote.py
          git add \
            dev/benchmarks/frontend_data/parsers/panel_stage_c_identifiability.py \
            dev/benchmarks/frontend_data/parsers/__init__.py \
            dev/benchmarks/frontend_data/registry.py \
            dev/benchmarks/frontend_sources.json \
            dev/benchmarks/benchmark_coverage_matrix.json \
            dev/tests/test_panel_stage_c_identifiability_frontend_source.py \
            dev/tests/test_benchmark_frontend_data.py \
            dev/tests/test_benchmark_catalog.py \
            dev/tests/test_benchmark_inventory_v2.py \
            dev/tests/test_frontend_domain_coverage.py \
            dev/reviews/pr126_round4_autofix_review_2026-08-12.md \
            dev/plans/panel_p1_stage_c_covariance_plan.md \
            frontend/public/data \
            docs/assets/benchmarks
          git diff --cached --check
          git commit -m 'bench: promote PR126 identifiability P100 evidence v4'
          git push origin HEAD:agent/panel-p1-stage-c-covariance
