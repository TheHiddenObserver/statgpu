name: PR126 fix formula intercept metadata

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - '.github/workflows/pr126-fix-formula-intercept-metadata.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install targeted dependencies
        run: |
          python -m pip install -e .
          python -m pip install pytest pandas patsy
      - name: Restore implicit-intercept feature metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              path = Path(path)
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise RuntimeError(f'{path}: expected 1 match, found {text.count(old)}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          pooled_marker = '''        entity_ids = aligned["entity_ids"]\n\n        backend, xp, X_arr, y_arr = self._panel_prepare_numeric(X_data, y_data)\n'''
          pooled_replacement = '''        entity_ids = aligned["entity_ids"]\n        if formula is not None and bool(self._formula_has_intercept):\n            self._feature_names = [\n                "Intercept",\n                *list(self._feature_names or []),\n            ]\n\n        backend, xp, X_arr, y_arr = self._panel_prepare_numeric(X_data, y_data)\n'''
          replace_once('statgpu/panel/_pooled.py', pooled_marker, pooled_replacement)

          between_marker = '''        entity_ids = aligned["entity_ids"]\n\n        backend, xp, X_arr, y_arr = self._panel_prepare_numeric(X_data, y_data)\n'''
          between_replacement = '''        entity_ids = aligned["entity_ids"]\n        if formula is not None and bool(self._formula_has_intercept):\n            self._feature_names = [\n                "Intercept",\n                *list(self._feature_names or []),\n            ]\n\n        backend, xp, X_arr, y_arr = self._panel_prepare_numeric(X_data, y_data)\n'''
          replace_once('statgpu/panel/_between.py', between_marker, between_replacement)

          test_path = Path('dev/tests/test_panel_stage_c_api_formula.py')
          text = test_path.read_text(encoding='utf-8')
          old_import = 'from statgpu.panel import PanelOLS, PooledOLS, RandomEffects'
          new_import = 'from statgpu.panel import BetweenOLS, PanelOLS, PooledOLS, RandomEffects'
          if text.count(old_import) != 1:
              raise RuntimeError('unexpected panel import contract')
          text = text.replace(old_import, new_import, 1)
          marker = '''\n\ndef test_random_effects_formula_matches_patsy_categorical_interaction_transform_matrix():\n'''
          if text.count(marker) != 1:
              raise RuntimeError('formula insertion marker drifted')
          tests = '''\n\n@pytest.mark.parametrize("estimator", [PooledOLS, BetweenOLS])\ndef test_formula_added_constant_keeps_intercept_in_summary_and_inference_names(estimator):\n    data = _frame(128035)\n    kwargs = {}\n    if estimator is BetweenOLS:\n        kwargs["entity_ids"] = data["entity"].to_numpy()\n    model = estimator(cov_type="hc0").fit(\n        formula="y ~ x + z",\n        data=data,\n        **kwargs,\n    )\n\n    expected_names = ["Intercept", "x", "z"]\n    summary = model.summary()\n    assert summary.feature_names == expected_names\n    assert len(summary.feature_names) == len(summary.coef) == len(model.coef_)\n    assert model._feature_names == expected_names\n    assert model._inference_result.feature_names == expected_names\n    assert list(model._inference_result.as_table()["feature"]) == expected_names\n\n'''
          text = text.replace(marker, tests + marker, 1)
          test_path.write_text(text, encoding='utf-8')
          PY
      - name: Run focused formula/inference regressions
        run: |
          python -m pytest \
            dev/tests/test_panel_stage_c_api_formula.py \
            dev/tests/test_panel_formula.py \
            dev/tests/test_panel_stage_a_golden.py \
            -q --tb=short
      - name: Commit fix and self-delete helper
        shell: bash
        run: |
          git config user.name 'Ziqian Lin'
          git config user.email '51812297+TheHiddenObserver@users.noreply.github.com'
          git rm .github/workflows/pr126-fix-formula-intercept-metadata.yml
          git add statgpu/panel/_pooled.py statgpu/panel/_between.py \
                  dev/tests/test_panel_stage_c_api_formula.py
          git commit -m 'fix: preserve panel formula intercept names'
          git push origin HEAD:agent/panel-p1-stage-c-covariance
