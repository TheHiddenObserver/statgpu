name: Review audit round 1

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[validation,formula]'
      - name: Run structural audit
        run: python .github/review_audit_round1.py
