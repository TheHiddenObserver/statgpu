name: Agent maintenance PR bootstrap v5

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'agent/maintenance-0.2.4-0.2.5' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('.github/workflows/agent-maintenance-pr-bootstrap-v3.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Install targeted validation environment"
          block = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in block.splitlines()
          )
          exec(compile(script, '<maintenance-bootstrap-v3>', 'exec'), {'__name__': '__main__'})

          validation_path = Path('statgpu/backends/_validation.py')
          text = validation_path.read_text(encoding='utf-8')
          pattern = re.compile(r'(    if value is None:\n        return value\n)')
          insertion = (
              r'\1\n'
              '    if isinstance(value, (list, tuple)):\n'
              '        for index, item in enumerate(value):\n'
              '            check_finite(item, name=f"{name}[{index}]")\n'
              '        return value\n'
          )
          text, count = pattern.subn(insertion, text, count=1)
          if count != 1:
              raise RuntimeError(f'expected one validation None block, got {count}')
          validation_path.write_text(text, encoding='utf-8')

          panel_paths = [
              'statgpu/panel/_fixed_effects.py',
              'statgpu/panel/_pooled.py',
              'statgpu/panel/_between.py',
              'statgpu/panel/_first_diff.py',
              'statgpu/panel/_fama_macbeth.py',
          ]
          method_pattern = re.compile(
              r'\n    def get_params\(self, deep=True\):.*?'
              r'\n    def set_params\(self, \*\*params\):.*?'
              r'\n        return self\n',
              re.DOTALL,
          )
          replacement_methods = (
              '\n    def get_params(self, deep=True):\n'
              '        """Return the shared exact-constructor parameter contract."""\n'
              '        return super().get_params(deep)\n\n'
              '    def set_params(self, **params):\n'
              '        """Delegate parameter updates to the shared estimator contract."""\n'
              '        return super().set_params(**params)\n'
          )
          for raw_path in panel_paths:
              path = Path(raw_path)
              source_text = path.read_text(encoding='utf-8')
              source_text, count = method_pattern.subn(replacement_methods, source_text, count=1)
              if count != 1:
                  raise RuntimeError(f'expected one panel parameter override in {raw_path}, got {count}')
              path.write_text(source_text, encoding='utf-8')
          PY

      - name: Install targeted validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" scipy pytest packaging "scikit-learn==1.2.2"
          python -m pip install -e . --no-deps

      - name: Run targeted maintenance validation
        run: |
          python -m compileall -q statgpu dev/tests/test_maintenance_024_025.py
          python -m pytest -q \
            dev/tests/test_maintenance_024_025.py \
            dev/tests/test_second_full_review.py::TestEstimatorCloneAndFeatureSelectionBackend::test_all_default_public_estimators_clone

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add statgpu dev .gitignore CHANGELOG.md docs/en/changelog.md docs/cn/changelog.md
          git commit -m "fix: harden runtime and estimator contracts"
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
