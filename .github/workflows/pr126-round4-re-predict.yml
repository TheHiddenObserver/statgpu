name: PR126 round4 RandomEffects predict fix

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - .github/workflows/pr126-round4-re-predict.yml

permissions:
  contents: write

jobs:
  re-predict-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply fix
        run: python dev/pr126_round4_re_predict_fix.py
      - name: Install focused environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,validation,formula,torch]' 'linearmodels==7.0'
      - name: Run focused matrix
        run: |
          python -m pytest -q \
            dev/tests/test_panel_stage_c_review_round4.py \
            dev/tests/test_panel_stage_c_physical_runner_contract.py \
            dev/tests/test_panel_stage_c_rank_deficient_matrix.py \
            dev/tests/test_panel_stage_c_torch_cpu.py \
            dev/tests/test_panel_stage_c_api_formula.py \
            dev/tests/test_panel_stage_c_linearmodels_estimators.py
      - name: Static gates
        run: |
          python -m compileall -q statgpu/panel dev/benchmarks/validate_panel_stage_c_gpu.py
          git diff --check
      - name: Commit validated fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr126-round4-re-predict.yml dev/pr126_round4_re_predict_fix.py
          git add statgpu/panel/_random_effects.py dev/benchmarks/validate_panel_stage_c_gpu.py dev/tests/test_panel_stage_c_review_round4.py
          git diff --cached --check
          git commit -m 'fix: keep RandomEffects prediction on selected backend'
          git push origin HEAD:agent/panel-p1-stage-c-covariance
