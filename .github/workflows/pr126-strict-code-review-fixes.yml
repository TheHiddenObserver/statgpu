name: PR126 strict code-review fixes

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - '.github/workflows/pr126-strict-code-review-fixes.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install targeted review dependencies
        run: |
          python -m pip install -e .
          python -m pip install pytest pandas patsy 'statsmodels==0.14.6' 'linearmodels==7.0'
      - name: Apply matrix and documentation fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise RuntimeError(f'{path}: expected exactly one match, got {text.count(old)}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          api_test = Path('dev/tests/test_panel_stage_c_api_formula.py')
          replace_once(
              api_test,
              'pytest.importorskip("patsy")',
              'patsy = pytest.importorskip("patsy")',
          )
          marker = '''\n\n@pytest.mark.parametrize(\n    "column,expected_name",\n    [("entity", "entity_ids"), ("time", "time_ids")],\n)\ndef test_pipe_formula_rejects_missing_fixed_effect_labels(column, expected_name):\n'''
          formula_test = '''\n\ndef test_random_effects_formula_matches_patsy_categorical_interaction_transform_matrix():\n    data = _frame(128034)\n    data["group"] = pd.Categorical(\n        np.where(\n            data["time"].to_numpy() % 3 == 0,\n            "base",\n            np.where(data["time"].to_numpy() % 3 == 1, "mid", "high"),\n        ),\n        categories=["base", "mid", "high"],\n    )\n    main_formula = "y ~ x * C(group) + I(z ** 2)"\n    y_design, X_design = patsy.dmatrices(\n        main_formula, data, return_type="dataframe"\n    )\n\n    formula_model = RandomEffects().fit(\n        formula=f"{main_formula} | entity",\n        data=data,\n    )\n    array_model = RandomEffects().fit(\n        X_design.to_numpy(),\n        y_design.iloc[:, 0].to_numpy(),\n        entity_ids=data["entity"].to_numpy(),\n    )\n\n    expected_names = list(X_design.design_info.column_names)\n    assert formula_model._feature_names == expected_names\n    assert "Intercept" in expected_names\n    assert "C(group)[T.mid]" in expected_names\n    assert "C(group)[T.high]" in expected_names\n    assert "x:C(group)[T.mid]" in expected_names\n    assert "x:C(group)[T.high]" in expected_names\n    assert "I(z ** 2)" in expected_names\n    assert_allclose(formula_model.coef_, array_model.coef_, rtol=2e-12, atol=2e-13)\n    assert_allclose(formula_model.bse_, array_model.bse_, rtol=2e-11, atol=2e-13)\n    assert_allclose(formula_model.pvalues_, array_model.pvalues_, rtol=2e-11, atol=2e-13)\n\n    expected_prediction = X_design.to_numpy() @ np.asarray(formula_model.coef_)\n    assert_allclose(\n        formula_model.predict(data),\n        expected_prediction,\n        rtol=2e-12,\n        atol=2e-13,\n    )\n''' + marker
          replace_once(api_test, marker, formula_test)

          ext_test = Path('dev/tests/test_panel_stage_c_linearmodels_estimators.py')
          replace_once(
              ext_test,
              'from statgpu.panel import PanelOLS, PooledOLS, RandomEffects',
              'from statgpu.panel import BetweenOLS, FirstDifferenceOLS, PanelOLS, PooledOLS, RandomEffects',
          )
          with ext_test.open('a', encoding='utf-8') as fh:
              fh.write('''\n\n@pytest.mark.parametrize("cov_type", ["hc0", "hc2", "hc3"])\ndef test_between_hc_matches_statsmodels_on_entity_mean_fit_space(cov_type):\n    X, y, entity, _time = _panel(12729, unbalanced=True)\n    sg = BetweenOLS(cov_type=cov_type).fit(X, y, entity_ids=entity)\n\n    X_level = np.column_stack([np.ones(len(y)), X])\n    groups = np.unique(entity)\n    X_mean = np.stack([X_level[entity == group].mean(axis=0) for group in groups])\n    y_mean = np.asarray([y[entity == group].mean() for group in groups])\n    reference = (\n        statsmodels.OLS(y_mean, X_mean)\n        .fit()\n        .get_robustcov_results(cov_type=cov_type.upper())\n    )\n\n    assert_allclose(sg.coef_, reference.params, rtol=5e-10, atol=5e-12)\n    assert_allclose(\n        sg._panel_cov_params_raw, reference.cov_params(), rtol=5e-9, atol=5e-11\n    )\n    assert_allclose(sg.bse_, reference.bse, rtol=5e-9, atol=5e-11)\n\n\n@pytest.mark.parametrize("cov_type", ["hc0", "hc2", "hc3"])\ndef test_first_difference_hc_matches_statsmodels_on_differenced_fit_space(cov_type):\n    X, y, entity, time = _panel(12730, unbalanced=False)\n    sg = FirstDifferenceOLS(cov_type=cov_type).fit(\n        X, y, entity_ids=entity, time_ids=time\n    )\n\n    order = np.lexsort((time, entity))\n    X_sorted = X[order]\n    y_sorted = y[order]\n    entity_sorted = entity[order]\n    same_entity = entity_sorted[1:] == entity_sorted[:-1]\n    X_diff = (X_sorted[1:] - X_sorted[:-1])[same_entity]\n    y_diff = (y_sorted[1:] - y_sorted[:-1])[same_entity]\n    reference = (\n        statsmodels.OLS(y_diff, X_diff)\n        .fit()\n        .get_robustcov_results(cov_type=cov_type.upper())\n    )\n\n    assert_allclose(sg.coef_, reference.params, rtol=5e-10, atol=5e-12)\n    assert_allclose(\n        sg._panel_cov_params_raw, reference.cov_params(), rtol=5e-9, atol=5e-11\n    )\n    assert_allclose(sg.bse_, reference.bse, rtol=5e-9, atol=5e-11)\n''')

          en = Path('docs/en/models/panel.md')
          replace_once(
              en,
              'Hosted Stage-C tests pin HC2/HC3 against analytic/statsmodels fit-space calculations and cluster/Driscoll-Kraay definitions against `linearmodels==7.0`. Post-review exact-clean-head Tesla P100 acceptance is complete on `c151550a...`: CuPy and Torch each pass 26/26 estimator covariance cases plus 2/2 direct public covariance primitives with requested/executed backend identity and no CPU fallback. The synchronized performance rerun covers the three base scales and explicit `N=10,000`, `k=2`, `T=200` QS all-lag scenario; it records timing only and makes no speedup claim. The superseded `9c0b3050...` artifacts remain historical audit evidence.',
              'Hosted Stage-C tests pin HC2/HC3 against analytic/statsmodels fit-space calculations and cluster/Driscoll-Kraay definitions against `linearmodels==7.0`. Fresh exact-clean-head Tesla P100 acceptance is complete on `aad53587...`: CuPy and Torch each pass 26/26 estimator covariance cases plus 6/6 direct public covariance primitives (32/32 per backend), including the full-rank ill-conditioned HC0/HC2/HC3/DK regressions, with requested/executed backend identity and no CPU fallback. The synchronized performance rerun covers the three base scales and explicit `N=10,000`, `k=2`, `T=200` QS all-lag scenario; it records timing only and makes no speedup claim. The earlier `c151550a...` and `9c0b3050...` artifacts remain historical audit evidence.',
          )

          cn = Path('docs/cn/models/panel.md')
          replace_once(
              cn,
              'hosted Stage-C tests 已将 HC2/HC3 与 analytic/statsmodels fit-space 计算对齐，并将 cluster/Driscoll-Kraay definition 与 `linearmodels==7.0` 固定版本对齐。post-review exact-clean head `c151550a...` 的 Tesla P100 acceptance 已闭合：CuPy 与 Torch 每个 backend 均通过 26/26 estimator covariance case 与 2/2 direct public covariance primitive，requested/executed backend 一致且无 CPU fallback。同步 performance rerun 覆盖三个 base scale 以及显式 `N=10,000`、`k=2`、`T=200` QS all-lag 场景，只记录 timing，不声明 speedup；旧 `9c0b3050...` 产物继续作为历史审计证据。',
              'hosted Stage-C tests 已将 HC2/HC3 与 analytic/statsmodels fit-space 计算对齐，并将 cluster/Driscoll-Kraay definition 与 `linearmodels==7.0` 固定版本对齐。fresh exact-clean head `aad53587...` 的 Tesla P100 acceptance 已闭合：CuPy 与 Torch 每个 backend 均通过 26/26 estimator covariance case 与 6/6 direct public covariance primitive（每个 backend 32/32），包括 full-rank ill-conditioned HC0/HC2/HC3/DK regressions，requested/executed backend 一致且无 CPU fallback。同步 performance rerun 覆盖三个 base scale 以及显式 `N=10,000`、`k=2`、`T=200` QS all-lag 场景，只记录 timing，不声明 speedup；此前 `c151550a...` 与 `9c0b3050...` 产物继续作为历史审计证据。',
          )
          PY
      - name: Run strict-review targeted matrix tests
        run: |
          python -m pytest \
            dev/tests/test_panel_stage_c_api_formula.py \
            dev/tests/test_panel_stage_c_linearmodels_estimators.py \
            -q --tb=short
      - name: Commit fixes and self-delete helper
        shell: bash
        run: |
          git config user.name 'Ziqian Lin'
          git config user.email '51812297+TheHiddenObserver@users.noreply.github.com'
          git rm .github/workflows/pr126-strict-code-review-fixes.yml
          git add dev/tests/test_panel_stage_c_api_formula.py \
                  dev/tests/test_panel_stage_c_linearmodels_estimators.py \
                  docs/en/models/panel.md docs/cn/models/panel.md
          git commit -m 'test: close PR126 strict review matrix gaps'
          git push origin HEAD:agent/panel-p1-stage-c-covariance
