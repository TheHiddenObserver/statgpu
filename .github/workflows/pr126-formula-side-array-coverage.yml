name: PR126 formula side-array coverage

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - '.github/workflows/pr126-formula-side-array-coverage.yml'

permissions:
  contents: write

jobs:
  add-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Add behavioral coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('dev/tests/test_panel_stage_c_api_formula.py')
          text = path.read_text(encoding='utf-8')
          anchor = '''def test_formula_aligned_cluster_rejects_missing_labels():\n'''
          addition = '''def test_panel_formula_dropped_row_ignores_nonfinite_explicit_entity_time_metadata():\n    data = _frame(128040)\n    entity_ids = data["entity"].to_numpy(dtype=np.float64)\n    time_ids = data["time"].to_numpy(dtype=np.float64)\n    dropped = 6\n    data.loc[dropped, "x"] = np.nan\n    entity_ids[dropped] = np.nan\n    time_ids[dropped] = np.nan\n\n    formula_model = PanelOLS(\n        entity_effects=True,\n        time_effects=True,\n        cov_type="dk",\n        bandwidth=1,\n    ).fit(\n        formula="y ~ x + z",\n        data=data,\n        entity_ids=entity_ids,\n        time_ids=time_ids,\n    )\n\n    keep = data[["y", "x", "z"]].notna().all(axis=1).to_numpy()\n    array_model = PanelOLS(\n        entity_effects=True,\n        time_effects=True,\n        cov_type="dk",\n        bandwidth=1,\n    ).fit(\n        data.loc[keep, ["x", "z"]].to_numpy(),\n        data.loc[keep, "y"].to_numpy(),\n        entity_ids=entity_ids[keep],\n        time_ids=time_ids[keep],\n    )\n    assert_allclose(formula_model.coef_, array_model.coef_, rtol=2e-12, atol=2e-13)\n    assert_allclose(formula_model.bse_, array_model.bse_, rtol=2e-11, atol=2e-13)\n\n\ndef test_pooled_hac_formula_dropped_row_ignores_nonfinite_numpy_time_index():\n    data = _frame(128041)\n    time_index = data["time"].to_numpy(dtype=np.float64)\n    dropped = 9\n    data.loc[dropped, "z"] = np.nan\n    time_index[dropped] = np.nan\n\n    formula_model = PooledOLS(cov_type="hac", bandwidth=1).fit(\n        formula="y ~ x + z",\n        data=data,\n        time_index=time_index,\n    )\n\n    keep = data[["y", "x", "z"]].notna().all(axis=1).to_numpy()\n    array_model = PooledOLS(cov_type="hac", bandwidth=1).fit(\n        data.loc[keep, ["x", "z"]].to_numpy(),\n        data.loc[keep, "y"].to_numpy(),\n        time_index=time_index[keep],\n    )\n    assert_allclose(formula_model.coef_, array_model.coef_, rtol=2e-12, atol=2e-13)\n    assert_allclose(formula_model.bse_, array_model.bse_, rtol=2e-11, atol=2e-13)\n\n\n'''
          if text.count(anchor) != 1:
              raise RuntimeError(f'coverage anchor count={text.count(anchor)}')
          path.write_text(text.replace(anchor, addition + anchor, 1), encoding='utf-8')
          PY
          git diff --check
          python -m compileall -q dev/tests/test_panel_stage_c_api_formula.py
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pandas patsy scipy statsmodels
      - name: Run focused coverage
        run: |
          python -m pytest dev/tests/test_panel_stage_c_api_formula.py -q --tb=short
      - name: Commit coverage and self-delete
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr126-formula-side-array-coverage.yml
          git add dev/tests/test_panel_stage_c_api_formula.py
          git diff --cached --check
          git commit -m 'test: cover panel formula side-array alignment'
          git push origin HEAD:${GITHUB_REF_NAME}
