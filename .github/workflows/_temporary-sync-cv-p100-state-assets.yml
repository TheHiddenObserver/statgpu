name: Temporary sync CV P100 state assets

on:
  push:
    branches:
      - agent/canonical-cv-benchmark-source
    paths:
      - .github/workflows/_temporary-sync-cv-p100-state-assets.yml

permissions:
  actions: read
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/canonical-cv-benchmark-source
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-generated-assets
          path: _generated
          run-id: 31154399471
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy exact generated bundle
        run: |
          set -euo pipefail
          cp _generated/frontend/public/data/benchmark_data.json frontend/public/data/benchmark_data.json
          cp _generated/frontend/public/data/parse_report.json frontend/public/data/parse_report.json
          cp _generated/frontend/public/data/source_inventory.json frontend/public/data/source_inventory.json
          rm -rf docs/assets/benchmarks
          mkdir -p docs/assets/benchmarks
          cp -a _generated/docs/assets/benchmarks/. docs/assets/benchmarks/
      - name: Commit generated assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data docs/assets/benchmarks
          if git diff --cached --quiet; then
            echo "Generated assets already current"
            exit 0
          fi
          git commit -m "benchmark: refresh assets for P100 CV evidence state"
          git push origin HEAD:agent/canonical-cv-benchmark-source
