name: Temporary CV score alignment

on:
  push:
    branches:
      - agent/canonical-cv-benchmark-source
    paths:
      - .github/workflows/_temporary-cv-score-alignment.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/canonical-cv-benchmark-source
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch normalized statgpu scores
        run: |
          python - <<'PY'
          from pathlib import Path

          runner = Path('dev/benchmarks/benchmark_cv_models.py')
          text = runner.read_text(encoding='utf-8')

          score_start = text.index('def _score_model(')
          score_end = text.index('\n\ndef _selected_parameters', score_start)
          score_replacement = '''def _to_numpy(value):\n    import numpy as np\n\n    module = type(value).__module__.split(".")[0]\n    if module == "cupy":\n        import cupy as cp\n        return cp.asnumpy(value)\n    if module == "torch":\n        return value.detach().cpu().numpy()\n    return np.asarray(value)\n\n\ndef _score_model(model, spec: CaseSpec, X_test, target_test) -> float:\n    """Evaluate the source-declared score rather than estimator.score aliases."""\n    import numpy as np\n\n    if spec.task == "regression":\n        prediction = _to_numpy(model.predict(X_test)).reshape(-1)\n        target = _to_numpy(target_test).reshape(-1)\n        residual = prediction - target\n        return float(np.mean(residual * residual))\n\n    if spec.task == "classification":\n        target = _to_numpy(target_test).astype(int).reshape(-1)\n        if hasattr(model, "predict_proba"):\n            probability = _to_numpy(model.predict_proba(X_test))\n            if probability.ndim == 2:\n                probability = probability[:, 1]\n        else:\n            decision = _to_numpy(model.decision_function(X_test)).reshape(-1)\n            probability = 1.0 / (1.0 + np.exp(-decision))\n        probability = np.clip(\n            np.asarray(probability).reshape(-1), 1e-15, 1.0 - 1e-15\n        )\n        return float(\n            -np.mean(\n                target * np.log(probability)\n                + (1 - target) * np.log(1 - probability)\n            )\n        )\n\n    time_value, event = target_test\n    from statgpu.survival._cox_cv import _compute_partial_likelihood\n\n    return float(\n        _compute_partial_likelihood(\n            _to_numpy(X_test),\n            _to_numpy(time_value),\n            _to_numpy(event),\n            _to_numpy(model.coef_),\n            ties=str(spec.grid_parameters.get("ties", "breslow")),\n        )\n    )\n'''
          text = text[:score_start] + score_replacement + text[score_end:]

          best_start = text.index('def _best_score(')
          best_end = text.index('\n\ndef _clear_cv_caches', best_start)
          best_replacement = '''def _validation_score(model, spec: CaseSpec) -> float:\n    """Normalize internal CV scores to the declared direction and units."""\n    for name in ("best_score_", "best_cv_score_", "cv_score_"):\n        value = getattr(model, name, None)\n        if value is None:\n            continue\n        score = float(value)\n        if spec.scoring_direction == "minimize" and score < 0.0:\n            score = -score\n        return score\n    raise RuntimeError("fitted CV estimator did not expose a validation score")\n'''
          text = text[:best_start] + best_replacement + text[best_end:]

          old = '        "validation_score": _best_score(model),\n'
          new = '        "validation_score": _validation_score(model, spec),\n'
          if text.count(old) != 1:
              raise SystemExit(f'validation call marker mismatch: {text.count(old)}')
          text = text.replace(old, new)
          runner.write_text(text, encoding='utf-8')
          PY
      - name: Validate and commit
        run: |
          python -m py_compile dev/benchmarks/benchmark_cv_models.py dev/benchmarks/cv_external.py
          python -m pip install pytest 'jsonschema[format]'
          pytest dev/tests/test_benchmark_cv_source.py dev/tests/test_cv_runner_instrumentation.py -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/benchmarks/benchmark_cv_models.py
          git commit -m "benchmark: normalize canonical CV score semantics"
          git push origin HEAD:agent/canonical-cv-benchmark-source
