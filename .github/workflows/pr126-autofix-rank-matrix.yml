name: PR126 rank-deficient estimator matrix autofix

on:
  push:
    branches: [agent/panel-p1-stage-c-covariance]
    paths:
      - .github/workflows/pr126-autofix-rank-matrix.yml

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Add five-family rank-deficient backend matrix and document solver boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          torch_test = Path('dev/tests/test_panel_stage_c_torch_cpu.py')
          text = torch_test.read_text()
          addition = '''\n\ndef test_stage_c_exact_rank_deficient_estimator_matrix_torch_cpu_matches_numpy():\n    rng = np.random.default_rng(12912)\n    n_entities, n_times = 15, 4\n    entity = np.repeat(np.arange(n_entities), n_times)\n    time = np.tile(np.arange(n_times), n_entities)\n    x = rng.normal(size=entity.size)\n    X = np.column_stack([x, 2.0 * x])\n    alpha = np.repeat(rng.normal(scale=0.3, size=n_entities), n_times)\n    y = 0.6 * x + alpha + rng.normal(scale=0.2, size=entity.size)\n\n    X_t, y_t, entity_t, time_t = _torch_arrays(X, y, entity, time)\n    model_pairs = [\n        (\n            PooledOLS(cov_type=\"hc0\").fit(X, y, entity_ids=entity),\n            PooledOLS(cov_type=\"hc0\").fit(X_t, y_t, entity_ids=entity_t),\n        ),\n        (\n            PanelOLS(cov_type=\"hc0\").fit(X, y),\n            PanelOLS(cov_type=\"hc0\").fit(X_t, y_t),\n        ),\n        (\n            BetweenOLS(cov_type=\"hc0\").fit(X, y, entity_ids=entity),\n            BetweenOLS(cov_type=\"hc0\").fit(X_t, y_t, entity_ids=entity_t),\n        ),\n        (\n            FirstDifferenceOLS(cov_type=\"hc0\").fit(\n                X, y, entity_ids=entity, time_ids=time\n            ),\n            FirstDifferenceOLS(cov_type=\"hc0\").fit(\n                X_t, y_t, entity_ids=entity_t, time_ids=time_t\n            ),\n        ),\n    ]\n\n    X_re = np.column_stack([np.ones(entity.size), X])\n    X_re_t = torch.as_tensor(X_re, dtype=torch.float64)\n    model_pairs.append(\n        (\n            RandomEffects(cov_type=\"hc0\").fit(X_re, y, entity_ids=entity),\n            RandomEffects(cov_type=\"hc0\").fit(\n                X_re_t, y_t, entity_ids=entity_t\n            ),\n        )\n    )\n\n    for expected, actual in model_pairs:\n        _assert_inference(actual, expected, rtol=2e-7, atol=2e-9)\n        metadata = getattr(expected, \"_covariance_metadata\", {})\n        assert metadata[\"design_rank\"] < metadata[\"design_columns\"]\n        actual_meta = getattr(actual, \"_covariance_metadata\", {})\n        assert actual_meta[\"design_rank\"] == metadata[\"design_rank\"]\n        assert actual_meta[\"design_columns\"] == metadata[\"design_columns\"]\n'''
          if 'test_stage_c_exact_rank_deficient_estimator_matrix_torch_cpu_matches_numpy' in text:
              raise SystemExit('rank-deficient five-family matrix already exists')
          torch_test.write_text(text + addition)

          plan = Path('dev/plans/panel_p1_stage_c_covariance_plan.md')
          text = plan.read_text()
          needle = '- use pseudoinverse consistently for supported rank-deficient fit spaces; numerical rank and pseudoinverse must come from the same backend-native SVD mask with the explicit float64 cutoff `max(n,k) * eps * s_max`, never from independent backend defaults;\n'
          replacement = needle + '- preserve each estimator\'s historical full-column-rank coefficient solver; the shared SVD minimum-norm solve is entered only when the explicit rank policy reports `rank < k` or the historical full-rank solver raises a linear-algebra failure, and the resulting fit-space rank is reused by covariance/diagnostics;\n'
          if text.count(needle) != 1:
              raise SystemExit('plan numerical-rank policy marker mismatch')
          plan.write_text(text.replace(needle, replacement))

          for path in ['docs/en/models/panel.md', 'docs/cn/models/panel.md']:
              p = Path(path)
              text = p.read_text()
              marker = '`max(n,k) * eps64 * s_max`'
              idx = text.find(marker)
              if idx < 0:
                  raise SystemExit(f'{path}: numerical-rank marker missing')
              sentence = (\n                  ' Full-column-rank fits retain the estimator\'s historical coefficient solver; the shared SVD minimum-norm solve is used only for explicitly rank-deficient fit spaces or solver failure.'\n                  if path.startswith('docs/en')\n                  else ' 对 full-column-rank fit 仍保留各 estimator 的历史 coefficient solver；只有显式判定为 rank-deficient 或历史 solver 失败时才进入共享 SVD minimum-norm solve。'\n              )
              insert_at = text.find('.', idx)
              if insert_at < 0:
                  insert_at = idx + len(marker)
              else:
                  insert_at += 1
              if sentence.strip() not in text:
                  text = text[:insert_at] + sentence + text[insert_at:]
              p.write_text(text)
          PY
      - name: Install Torch/formula/validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[formula,validation,torch]' 'linearmodels==7.0' 'statsmodels==0.14.6' pytest
      - name: Run rank-deficient matrix and focused review suite
        run: |
          python -m pytest \
            dev/tests/test_panel_stage_c_torch_cpu.py \
            dev/tests/test_panel_stage_c_covariance.py \
            dev/tests/test_panel_stage_c_edge_contracts.py \
            dev/tests/test_panel_stage_c_external.py \
            dev/tests/test_panel_stage_c_external_defaults.py \
            dev/tests/test_panel_stage_c_linearmodels_estimators.py \
            dev/tests/test_panel_stage_c_api_formula.py \
            dev/tests/test_panel_stage_c_physical_runner_contract.py \
            dev/tests/test_panel_stage_c_inference_guard.py \
            -q --tb=short
          git diff --check
      - name: Commit matrix completion and self-delete
        shell: bash
        run: |
          git config user.name 'TheHiddenObserver'
          git config user.email '51812297+TheHiddenObserver@users.noreply.github.com'
          git add dev/tests/test_panel_stage_c_torch_cpu.py docs/en/models/panel.md docs/cn/models/panel.md
          git add -f dev/plans/panel_p1_stage_c_covariance_plan.md
          git rm -f .github/workflows/pr126-autofix-rank-matrix.yml
          git commit -m 'test(panel): cover rank-deficient estimator matrix'
          git push origin HEAD:agent/panel-p1-stage-c-covariance
