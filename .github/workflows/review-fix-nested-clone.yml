name: Review fix nested clone

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply nested clone repair
        run: python .github/review_fix_nested_clone.py
      - name: Install current environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[validation,formula]'
      - name: Run nested and public clone gates
        run: |
          python -m pytest -q --tb=short \
            dev/tests/test_core_contracts.py::test_sklearn_clone_recursively_clears_nested_fitted_state \
            dev/tests/test_legacy_sklearn_integration.py \
            dev/tests/test_maintenance_024_025.py \
            dev/tests/test_second_full_review.py::TestEstimatorCloneAndFeatureSelectionBackend
      - name: Commit nested clone repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add statgpu/_base.py dev/tests/test_core_contracts.py
          git commit -m 'fix: recursively clone nested estimators'
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
