name: PR126 guarded round7 transactional refit fix

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - '.github/workflows/pr126-round7-transactional-refit-fix.yml'

permissions:
  contents: write

jobs:
  transactional-refit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Guard exact checkpoint lineage
        run: |
          base='e9a8d315ce9cf07cdd366763c635ecb5991489c5'
          test "$(git diff --name-only "$base" HEAD)" = ".github/workflows/pr126-round7-transactional-refit-fix.yml"
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pandas patsy
      - name: Apply transactional refit fix
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected}, found {count}: {old!r}')
              p.write_text(text.replace(old, new, expected), encoding='utf-8')

          panel = 'statgpu/panel/_fixed_effects.py'
          old_fit = "\n".join([
              "    def fit(", "        self,", "        X=None,", "        y=None,",
              "        entity_ids=None,", "        time_ids=None,", "        cluster=None,",
              "        formula=None,", "        data=None,", "    ):",
              "        \"\"\"Fit the fixed effects model.\"\"\"",
              "        self._reset_fit_state()", "        (",
          ]) + "\n"
          new_fit = "\n".join([
              "    def fit(", "        self,", "        X=None,", "        y=None,",
              "        entity_ids=None,", "        time_ids=None,", "        cluster=None,",
              "        formula=None,", "        data=None,", "    ):",
              "        \"\"\"Fit the fixed effects model transactionally.\"\"\"",
              "        self._reset_fit_state()", "        try:",
              "            return self._fit_impl(", "                X=X,", "                y=y,",
              "                entity_ids=entity_ids,", "                time_ids=time_ids,",
              "                cluster=cluster,", "                formula=formula,",
              "                data=data,", "            )", "        except BaseException:",
              "            # A failed fit must not expose partially written state from",
              "            # either the previous result or the failed new request.",
              "            self._reset_fit_state()", "            raise", "",
              "    def _fit_impl(", "        self,", "        X=None,", "        y=None,",
              "        entity_ids=None,", "        time_ids=None,", "        cluster=None,",
              "        formula=None,", "        data=None,", "    ):",
              "        \"\"\"Internal implementation; :meth:`fit` owns state cleanup.\"\"\"",
              "        (",
          ]) + "\n"
          replace_exact(panel, old_fit, new_fit)
          replace_exact(
              panel,
              '    def summary(self):\n        """Print and return the existing structured coefficient summary."""\n        k = len(self._params)\n',
              '    def summary(self):\n        """Print and return the existing structured coefficient summary."""\n        self._check_is_fitted()\n        k = len(self._params)\n',
          )

          tests = 'dev/tests/test_panel_stage_c_final_review_fixes.py'
          replace_exact(
              tests,
              '    model = PanelOLS(entity_effects=True).fit(X, y, entity_ids=entity)\n',
              '    model = PanelOLS(entity_effects=True, cov_type="clustered").fit(\n        X, y, entity_ids=entity, cluster=entity\n    )\n',
              expected=2,
          )
          # Only the first occurrence belongs to the transactional-refit test; undo
          # the later one-way prediction fixture back to its original construction.
          text = Path(tests).read_text(encoding='utf-8')
          duplicated = '    model = PanelOLS(entity_effects=True, cov_type="clustered").fit(\n        X, y, entity_ids=entity, cluster=entity\n    )\n'
          first = text.find(duplicated)
          second = text.find(duplicated, first + 1)
          if first < 0 or second < 0:
              raise SystemExit('expected two temporarily replaced one-way PanelOLS fixtures')
          original = '    model = PanelOLS(entity_effects=True).fit(X, y, entity_ids=entity)\n'
          text = text[:second] + original + text[second + len(duplicated):]
          Path(tests).write_text(text, encoding='utf-8')

          replace_exact(
              tests,
              '    with pytest.raises(ValueError, match="entity_ids is required"):\n        model.fit(X, y)\n',
              '    with pytest.raises(ValueError, match="cluster length"):\n        model.fit(\n            X, y, entity_ids=entity, cluster=np.arange(entity.size - 1)\n        )\n',
          )
          replace_exact(
              tests,
              '    assert model._panel_cov_params_raw is None\n    assert model._covariance_metadata == {}\n    assert model.entity_effects is True  # constructor contract restored\n    with pytest.raises(RuntimeError, match="not fitted"):\n        model.predict(X[:3], entity_ids=entity[:3])\n',
              '    assert model._panel_cov_params_raw is None\n    assert model._covariance_metadata == {}\n    assert model._backend_name is None\n    assert model._predict_backend_name is None\n    assert model.nobs is None\n    assert model._panel_index_info is None\n    assert model._entity_effects_map == {}\n    assert model._time_effects_map == {}\n    assert model.entity_effects is True  # constructor contract restored\n    with pytest.raises(RuntimeError, match="not fitted"):\n        model.predict(X[:3], entity_ids=entity[:3])\n    with pytest.raises(RuntimeError, match="not fitted"):\n        model.summary()\n',
          )
          replace_exact(
              tests,
              '    with pytest.raises(ValueError, match="effects-only formulas are not supported"):\n        PanelOLS().fit(formula="y ~ 1 | entity", data=data)\n',
              '    model = PanelOLS().fit(np.linspace(-0.5, 0.5, n)[:, None], data["y"].to_numpy())\n    with pytest.raises(ValueError, match="effects-only formulas are not supported"):\n        model.fit(formula="y ~ 1 | entity", data=data)\n    assert model._fitted is False\n    assert model.entity_effects is False\n    assert model.time_effects is False\n    assert model.get_params()["entity_effects"] is False\n    assert model.get_params()["time_effects"] is False\n    assert model._backend_name is None\n    assert model.nobs is None\n    assert model._design_info is None\n',
          )
          PY
      - name: Run focused regressions
        run: |
          python -m pytest \
            dev/tests/test_panel_stage_c_final_review_fixes.py \
            dev/tests/test_panel_stage_a_golden.py \
            -q --tb=short
          python -m compileall -q statgpu/panel
      - name: Verify scope and commit without temporary workflow
        run: |
          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' \
            dev/tests/test_panel_stage_c_final_review_fixes.py \
            statgpu/panel/_fixed_effects.py | sort)"
          test "$changed" = "$expected"
          git rm .github/workflows/pr126-round7-transactional-refit-fix.yml
          git add statgpu/panel/_fixed_effects.py dev/tests/test_panel_stage_c_final_review_fixes.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(panel): make PanelOLS refits transactional'
          git push origin HEAD:agent/panel-p1-stage-c-covariance
