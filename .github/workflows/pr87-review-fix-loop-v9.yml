name: PR87 review fix batch v9

on:
  push:
    branches: [agent/maintenance-0.2.4-0.2.5]
    paths:
      - .github/workflows/pr87-review-fix-loop-v9.yml

permissions:
  contents: write

jobs:
  apply-review-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Patch knockoff selector transactions and add regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('statgpu/feature_selection/_knockoff.py')
          text = path.read_text(encoding='utf-8')

          old_knockoff = '''    def set_params(self, **params):\n        valid = self.get_params(deep=False)\n        for name, value in params.items():\n            if name not in valid:\n                raise ValueError(\n                    f"Invalid parameter {name!r} for KnockoffSelector. "\n                    f"Valid parameters are: {', '.join(sorted(valid))}."\n                )\n            setattr(self, name, value)\n        self.result_ = None\n        self.selected_features_ = None\n        return self\n'''
          new_knockoff = '''    def set_params(self, **params):\n        if not params:\n            return self\n        valid = self.get_params(deep=False)\n        unknown = [name for name in params if name not in valid]\n        if unknown:\n            name = unknown[0]\n            raise ValueError(\n                f"Invalid parameter {name!r} for KnockoffSelector. "\n                f"Valid parameters are: {', '.join(sorted(valid))}."\n            )\n        updated = dict(valid)\n        updated.update(params)\n        fresh = type(self)(**updated)\n        self.__dict__.clear()\n        self.__dict__.update(fresh.__dict__)\n        return self\n'''
          if old_knockoff not in text:
              raise RuntimeError('KnockoffSelector set_params anchor missing')
          text = text.replace(old_knockoff, new_knockoff, 1)

          old_fixed = '''    def set_params(self, **params):\n        valid = self.get_params(deep=False)\n        for name, value in params.items():\n            if name not in valid:\n                raise ValueError(\n                    f"Invalid parameter {name!r} for FixedXKnockoffSelector. "\n                    f"Valid parameters are: {', '.join(sorted(valid))}."\n                )\n            setattr(self, name, value)\n        self._selector = KnockoffSelector(\n            knockoff_type="fixed_x",\n            q=self.q,\n            method=self.method,\n            fdr_control=self.fdr_control,\n            random_state=self.random_state,\n            backend=self.backend,\n            compat_mode=self.compat_mode,\n            lasso_cv_impl=self.lasso_cv_impl,\n            lasso_fast_profile=self.lasso_fast_profile,\n        )\n        self.result_ = None\n        self.selected_features_ = None\n        return self\n'''
          new_fixed = '''    def set_params(self, **params):\n        if not params:\n            return self\n        valid = self.get_params(deep=False)\n        unknown = [name for name in params if name not in valid]\n        if unknown:\n            name = unknown[0]\n            raise ValueError(\n                f"Invalid parameter {name!r} for FixedXKnockoffSelector. "\n                f"Valid parameters are: {', '.join(sorted(valid))}."\n            )\n        updated = dict(valid)\n        updated.update(params)\n        fresh = type(self)(**updated)\n        self.__dict__.clear()\n        self.__dict__.update(fresh.__dict__)\n        return self\n'''
          if old_fixed not in text:
              raise RuntimeError('FixedXKnockoffSelector set_params anchor missing')
          text = text.replace(old_fixed, new_fixed, 1)
          path.write_text(text, encoding='utf-8')

          tests = Path('dev/tests/test_maintenance_024_025.py')
          test_text = tests.read_text(encoding='utf-8')
          marker = '# PR87_KNOCKOFF_SET_PARAMS_TRANSACTION_TESTS'
          if marker not in test_text:
              test_text += '''\n\n# PR87_KNOCKOFF_SET_PARAMS_TRANSACTION_TESTS\n@pytest.mark.parametrize("selector_name", ["KnockoffSelector", "FixedXKnockoffSelector"])\ndef test_knockoff_selector_set_params_is_transactional(selector_name):\n    import statgpu.feature_selection as feature_selection\n\n    selector = getattr(feature_selection, selector_name)(q=0.1)\n    sentinel_result = object()\n    sentinel_features = np.array([0], dtype=np.int64)\n    selector.result_ = sentinel_result\n    selector.selected_features_ = sentinel_features\n\n    with pytest.raises(ValueError, match="Invalid parameter"):\n        selector.set_params(q=0.2, unknown_parameter=1)\n    assert selector.q == 0.1\n    assert selector.result_ is sentinel_result\n    assert selector.selected_features_ is sentinel_features\n\n    selector.set_params(q=0.2)\n    assert selector.q == 0.2\n    assert selector.result_ is None\n    assert selector.selected_features_ is None\n'''
              tests.write_text(test_text, encoding='utf-8')
          PY

      - name: Install validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" scipy pytest packaging "scikit-learn==1.3.2" pandas patsy joblib
          python -m pip install -e . --no-deps

      - name: Run targeted maintenance tests
        run: |
          python -m pytest \
            dev/tests/test_maintenance_024_025.py \
            dev/tests/test_core_contracts.py::test_set_params_rejects_unknown_and_supports_nested_estimators \
            -q --tb=short

      - name: Commit source-only fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add statgpu/feature_selection/_knockoff.py dev/tests/test_maintenance_024_025.py
          git commit -m "fix: make knockoff parameter updates transactional"
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
