name: Review fix PR trigger

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply-review-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply atomic review patch v2
        run: python .github/review_fix_patch_v2.py
      - name: Install validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[validation]' pytest packaging
      - name: Run blocking regressions
        run: |
          python -m pytest -q --tb=short \
            dev/tests/test_maintenance_024_025.py \
            dev/tests/test_legacy_sklearn_integration.py \
            dev/tests/test_second_full_review.py::TestEstimatorCloneAndFeatureSelectionBackend::test_all_default_public_estimators_clone
      - name: Commit review fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add statgpu dev/tests dev/manual CHANGELOG.md docs
          git commit -m 'fix: address code review hard gates'
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
