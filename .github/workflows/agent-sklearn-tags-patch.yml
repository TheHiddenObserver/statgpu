name: Agent sklearn developer API patch

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/maintenance-0.2.4-0.2.5' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Add optional sklearn tag and fitted-state protocols
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("statgpu/_base.py")
          text = path.read_text(encoding="utf-8")
          if "def __sklearn_tags__(self):" not in text:
              marker = "    def __sklearn_clone__(self):\n"
              if marker not in text:
                  raise SystemExit("sklearn clone marker changed")
              methods = '''    def __sklearn_tags__(self):
                  """Return public estimator tags when sklearn >= 1.6 is installed.

                  scikit-learn remains an optional validation dependency.  The
                  import therefore occurs only when sklearn asks for tags.  Older
                  sklearn releases do not call this protocol and continue to use
                  the existing get_params/set_params estimator contract.
                  """
                  try:
                  from sklearn.utils import (
                      ClassifierTags,
                      RegressorTags,
                      Tags,
                      TargetTags,
                  )
              except ImportError:
                  return self._more_tags()

              estimator_type = getattr(self, "_estimator_type", None)
              if estimator_type not in {"classifier", "regressor"}:
                  estimator_type = None
              return Tags(
                  estimator_type=estimator_type,
                  target_tags=TargetTags(required=estimator_type is not None),
                  classifier_tags=(
                      ClassifierTags() if estimator_type == "classifier" else None
                  ),
                  regressor_tags=(
                      RegressorTags() if estimator_type == "regressor" else None
                  ),
                  requires_fit=True,
              )

              def _more_tags(self):
              """Legacy sklearn tag dictionary for releases before 1.6."""
              estimator_type = getattr(self, "_estimator_type", None)
              return {"requires_y": estimator_type in {"classifier", "regressor"}}

              def __sklearn_is_fitted__(self):
              """Expose statgpu's fitted-state transaction to sklearn meta-estimators."""
              return bool(getattr(self, "_fitted", False))

          '''
              # Normalize the embedded source independently from YAML indentation.
              import textwrap
              methods = textwrap.indent(textwrap.dedent(methods), "    ")
              text = text.replace(marker, methods + marker, 1)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Install current sklearn validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation,formula]"

      - name: Run sklearn integration regressions
        run: |
          python -m compileall -q statgpu
          python -m pytest -q --tb=short \
            dev/tests/test_legacy_sklearn_integration.py \
            dev/tests/test_maintenance_024_025.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add statgpu/_base.py
          git commit -m "fix: support current sklearn tag and fitted protocols"
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
