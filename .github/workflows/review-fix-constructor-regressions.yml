name: Review fix constructor regressions

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply constructor regression fixes
        run: python .github/review_fix_constructor_regressions.py
      - name: Install validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[validation,formula]'
      - name: Run focused regression set
        run: |
          python -m pytest -q --tb=short \
            dev/tests/test_core_contracts.py::test_set_params_rejects_unknown_and_supports_nested_estimators \
            dev/tests/test_cox_cv.py::test_coxphcv_public_fit_does_not_coerce_invalid_controls \
            dev/tests/test_inference_multiple_testing.py::TestModelWrapper \
            dev/tests/test_pr80_cv_fit_boundary.py::test_cv_controls_use_private_canonical_fit_snapshot \
            dev/tests/test_pr80_fit_boundary.py::test_mutated_controls_use_private_canonical_fit_snapshot \
            dev/tests/test_pr80_fit_boundary.py::test_set_params_truthy_boolean_string_is_rejected_at_fit \
            dev/tests/test_pr80_group_cv_list_input_contract.py \
            dev/tests/test_pr80_group_failed_refit_state_contract.py \
            dev/tests/test_pr80_group_input_contract.py \
            dev/tests/test_quantile_regression.py::TestQuantileRegression::test_fit_without_inference \
            dev/tests/test_maintenance_024_025.py \
            dev/tests/test_legacy_sklearn_integration.py
      - name: Run constructor mismatch audit
        run: python .github/review_constructor_map.py
      - name: Commit regression fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add statgpu/_base.py dev/tests
          git commit -m 'fix: preserve constructor runtime semantics'
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
