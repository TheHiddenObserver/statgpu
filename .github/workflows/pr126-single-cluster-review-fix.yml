name: PR126 single-cluster inference review fix

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - .github/workflows/pr126-single-cluster-review-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply single-cluster inference fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one target, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'statgpu/panel/_covariance.py',
              '''    n_clusters = int(len(labels))\n    grouped = _grouped_score_sums(\n''',
              '''    n_clusters = int(len(labels))\n    if n_clusters < 2:\n        raise ValueError(\n            "clustered covariance requires at least two distinct clusters"\n        )\n    grouped = _grouped_score_sums(\n'''
          )

          p = Path('dev/tests/test_panel_stage_c_covariance.py')
          text = p.read_text()
          anchor = '''def test_one_way_group_debias_is_exact_multiplicative_factor():\n'''
          addition = '''def test_clustered_covariance_rejects_single_cluster():\n    rng = np.random.default_rng(126020)\n    X = np.column_stack([np.ones(18), rng.normal(size=18)])\n    resid = rng.normal(size=18)\n    single_cluster = np.zeros(18, dtype=np.int64)\n    with pytest.raises(ValueError, match=r"at least two distinct clusters"):\n        clustered_covariance(X, resid, single_cluster)\n\n\ndef test_clustered_estimators_reject_single_cluster_inference():\n    X, y, entity, _time = _panel(seed=126021, unbalanced=True)\n    single_cluster = np.zeros(len(y), dtype=np.int64)\n\n    with pytest.raises(ValueError, match=r"at least two distinct clusters"):\n        PooledOLS(cov_type="clustered").fit(X, y, cluster=single_cluster)\n\n    with pytest.raises(ValueError, match=r"at least two distinct clusters"):\n        PanelOLS(cov_type="clustered").fit(X, y, cluster=single_cluster)\n\n    X_re = np.column_stack([np.ones(len(y)), X])\n    with pytest.raises(ValueError, match=r"at least two distinct clusters"):\n        RandomEffects(cov_type="clustered").fit(\n            X_re, y, entity_ids=entity, cluster=single_cluster\n        )\n\n\ndef test_two_way_clustered_rejects_single_marginal_cluster():\n    rng = np.random.default_rng(126022)\n    X = np.column_stack([np.ones(24), rng.normal(size=24)])\n    resid = rng.normal(size=24)\n    single = np.zeros(24, dtype=np.int64)\n    second = np.tile(np.arange(6), 4)\n    with pytest.raises(ValueError, match=r"at least two distinct clusters"):\n        two_way_clustered_covariance(X, resid, single, second)\n\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f'test anchor count={text.count(anchor)}')
          p.write_text(text.replace(anchor, addition + anchor, 1))

          replace_once(
              'docs/en/panel/covariance.md',
              '''$$\n\\widehat V_G=\\sum_g s_gs_g^\\top.\n$$\n\nWith `group_debias=True`, each cluster component is multiplied by the small-number-of-clusters correction\n''',
              '''$$\n\\widehat V_G=\\sum_g s_gs_g^\\top.\n$$\n\nClustered inference requires at least two distinct groups in every supplied clustering dimension. With only one cluster the grouped score collapses to the full-sample estimating-equation score, so the cluster-robust variance is not estimable; statgpu therefore raises an error even when `group_debias=False`.\n\nWith `group_debias=True`, each cluster component is multiplied by the small-number-of-clusters correction\n'''
          )
          replace_once(
              'docs/cn/panel/covariance.md',
              '''$$\n\\widehat V_G=\\sum_gs_gs_g^\\top.\n$$\n\n`group_debias=True` 时会应用 small-number-of-clusters correction：\n''',
              '''$$\n\\widehat V_G=\\sum_gs_gs_g^\\top.\n$$\n\nclustered inference 要求每个用户提供的 clustering dimension 至少包含两个不同 group。只有一个 cluster 时，grouped score 会退化为全样本 estimating-equation score，cluster-robust variance 无法被估计；因此即使 `group_debias=False`，statgpu 也会直接报错。\n\n`group_debias=True` 时会应用 small-number-of-clusters correction：\n'''
          )
          replace_once(
              'CHANGELOG.md',
              '''covariance numerical stability, and Fama-MacBeth chronology/formula/rank/inference behavior;''',
              '''covariance numerical stability (including fail-closed single-cluster inference), and Fama-MacBeth chronology/formula/rank/inference behavior;'''
          )
          replace_once(
              'docs/en/changelog.md',
              '''One-/two-way clustering supports opt-in `group_debias=True`, and `PooledOLS(cov_type="hac")` remains the legacy row-order Bartlett/Newey-West path.\n''',
              '''One-/two-way clustering supports opt-in `group_debias=True`; clustered inference now also fails closed when any supplied clustering dimension has fewer than two distinct groups, instead of returning the degenerate one-cluster sandwich. `PooledOLS(cov_type="hac")` remains the legacy row-order Bartlett/Newey-West path.\n'''
          )
          replace_once(
              'docs/cn/changelog.md',
              '''one-/two-way cluster 支持显式 `group_debias=True`，`PooledOLS(cov_type="hac")` 继续表示 legacy row-order Bartlett/Newey-West 路径。\n''',
              '''one-/two-way cluster 支持显式 `group_debias=True`；如果任一 clustering dimension 少于两个不同 group，clustered inference 现在会 fail closed，而不会返回退化的 single-cluster sandwich。`PooledOLS(cov_type="hac")` 继续表示 legacy row-order Bartlett/Newey-West 路径。\n'''
          )
          PY
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas patsy pytest joblib scikit-learn
          python -m pip install -e . --no-deps
      - name: Run focused panel inference regressions
        run: |
          python -m compileall -q statgpu
          pytest -q dev/tests/test_panel_stage_c_covariance.py dev/tests/test_panel_stage_c_edge_contracts.py dev/tests/test_panel_stage_c_api_formula.py
          git diff --check
      - name: Commit fix and self-delete
        shell: bash
        run: |
          rm -f .github/workflows/pr126-single-cluster-review-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: reject degenerate single-cluster inference"
          git push origin HEAD:agent/panel-p1-stage-c-covariance
