name: PR126 guarded round6 intercept fix

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - '.github/workflows/pr126-round6-intercept-fix.yml'

permissions:
  contents: write

jobs:
  round6-intercept:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pandas patsy
      - name: Apply exact intercept-contract fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected}, found {count}: {old!r}')
              p.write_text(text.replace(old, new, expected), encoding='utf-8')

          # PanelOLS formula: retain Patsy's intercept only when no FE space is
          # active.  With entity/time FE it remains absorbed and stripped.
          replace_exact(
              'statgpu/panel/_fixed_effects.py',
              '''        self.entity_effects = configured_entity_effects or bool(fe_entity_effects)\n        self.time_effects = configured_time_effects or bool(fe_time_effects)\n        entity_ids = aligned["entity_ids"]\n''',
              '''        self.entity_effects = configured_entity_effects or bool(fe_entity_effects)\n        self.time_effects = configured_time_effects or bool(fe_time_effects)\n\n        # Patsy/R formulas include an intercept by default.  Fixed-effect fits\n        # absorb that common intercept into the nuisance-effect space, but a\n        # no-FE PanelOLS fit is an ordinary level regression and must retain it.\n        if (\n            formula is not None\n            and bool(self._formula_has_intercept)\n            and not (self.entity_effects or self.time_effects)\n        ):\n            X_data = np.column_stack(\n                [np.ones(len(y_data), dtype=np.float64), np.asarray(X_data)]\n            )\n            self._feature_names = ["Intercept", *list(self._feature_names or [])]\n\n        entity_ids = aligned["entity_ids"]\n''',
          )

          replace_exact(
              'statgpu/panel/_fixed_effects.py',
              '''        constant_index = explicit_constant_column(X_arr, xp=xp)\n        self._predict_constant_index = constant_index\n        self._predict_constant_value = (\n            None\n            if constant_index is None\n            else _to_float_scalar(X_arr[0, int(constant_index)])\n        )\n\n        diagnostic_df = fixed_effect_diagnostic_df(\n''',
              '''        constant_index = explicit_constant_column(X_arr, xp=xp)\n        self._predict_constant_index = constant_index\n        self._predict_constant_value = (\n            None\n            if constant_index is None\n            else _to_float_scalar(X_arr[0, int(constant_index)])\n        )\n        # A level constant is identified only when no FE space absorbs it.\n        # FE-transformed constants are rank-zero columns and continue to use the\n        # historical/standard nuisance-rank conventions below.\n        has_level_constant = (\n            constant_index is not None\n            and not self.entity_effects\n            and not self.time_effects\n        )\n\n        diagnostic_df = fixed_effect_diagnostic_df(\n''',
          )
          replace_exact(
              'statgpu/panel/_fixed_effects.py',
              '''            time_effects=self.time_effects,\n            has_constant=False,\n            entity_codes=entity_arr,\n''',
              '''            time_effects=self.time_effects,\n            has_constant=has_level_constant,\n            entity_codes=entity_arr,\n''',
          )

          replace_exact(
              'statgpu/panel/_fixed_effects.py',
              '''        ss_tot_diag = _to_float_scalar(xp.sum(y_d * y_d))\n        self.fit_statistics_ = build_model_fit_statistics(\n''',
              '''        if has_level_constant:\n            y_d_centered = y_d - xp.mean(y_d)\n            ss_tot_diag = _to_float_scalar(xp.sum(y_d_centered * y_d_centered))\n        else:\n            ss_tot_diag = _to_float_scalar(xp.sum(y_d * y_d))\n        self.fit_statistics_ = build_model_fit_statistics(\n''',
          )
          replace_exact(
              'statgpu/panel/_fixed_effects.py',
              '''            entity_codes=entity_arr,\n            has_constant=False,\n            rss_fit=ss_res,\n''',
              '''            entity_codes=entity_arr,\n            has_constant=has_level_constant,\n            rss_fit=ss_res,\n''',
          )
          replace_exact(
              'statgpu/panel/_fixed_effects.py',
              '''            f_params=coef,\n            f_has_constant=False,\n            metadata={\n''',
              '''            f_params=coef,\n            f_has_constant=has_level_constant,\n            metadata={\n''',
          )

          # df_total for an identified level intercept is n-1.  Residual df is
          # already correct because rank_x includes that intercept.
          replace_exact(
              'statgpu/panel/_diagnostic_context.py',
              '''    df_resid = int(nobs) - int(rank_x) - int(effect_rank)\n    df_total = int(nobs) - int(effect_rank)\n''',
              '''    df_resid = int(nobs) - int(rank_x) - int(effect_rank)\n    level_constant_rank = int(\n        bool(has_constant) and not entity_effects and not time_effects\n    )\n    df_total = int(nobs) - int(effect_rank) - level_constant_rank\n''',
          )

          # Regression coverage: formula intercept/no-intercept and explicit
          # constant fit-stat parity with PooledOLS.
          test_path = 'dev/tests/test_panel_stage_c_final_review_fixes.py'
          replace_exact(
              test_path,
              'from statgpu.panel import PanelOLS, RandomEffects\n',
              'from statgpu.panel import PanelOLS, PooledOLS, RandomEffects\n',
          )
          marker = '''\ndef test_one_way_fixed_effect_prediction_restores_grand_mean_only_for_known_labels():\n'''
          additions = '''\ndef test_panel_formula_without_fixed_effects_preserves_patsy_intercept():\n    pd = pytest.importorskip("pandas")\n    pytest.importorskip("patsy")\n    rng = np.random.default_rng(2026082201)\n    x = rng.normal(size=90)\n    y = 1.35 + 0.72 * x + rng.normal(scale=0.12, size=x.size)\n    data = pd.DataFrame({"y": y, "x": x})\n\n    panel = PanelOLS(cov_type="nonrobust").fit(formula="y ~ x", data=data)\n    pooled = PooledOLS(cov_type="nonrobust").fit(formula="y ~ x", data=data)\n\n    assert panel._feature_names == ["Intercept", "x"]\n    assert panel._predict_constant_index == 0\n    assert_allclose(panel.coef_, pooled.coef_, rtol=0, atol=3e-12)\n    assert_allclose(panel.bse_, pooled.bse_, rtol=0, atol=3e-12)\n    assert_allclose(panel.predict(data.iloc[:12]), pooled.predict(data.iloc[:12]), rtol=0, atol=3e-12)\n    for field in ("rsquared_overall", "rsquared_adj", "f_statistic", "f_pvalue"):\n        assert_allclose(\n            getattr(panel.fit_statistics_, field),\n            getattr(pooled.fit_statistics_, field),\n            rtol=0,\n            atol=3e-12,\n        )\n    assert panel.fit_statistics_.f_df == pooled.fit_statistics_.f_df\n    assert panel.df_resid == pooled.df_resid\n    assert panel.fit_statistics_.metadata["diagnostic_df"]["df_total"] == x.size - 1\n\n\ndef test_panel_formula_explicit_no_intercept_remains_no_intercept():\n    pd = pytest.importorskip("pandas")\n    pytest.importorskip("patsy")\n    rng = np.random.default_rng(2026082202)\n    x = rng.normal(size=70)\n    y = 0.8 * x + rng.normal(scale=0.1, size=x.size)\n    data = pd.DataFrame({"y": y, "x": x})\n\n    formula_model = PanelOLS().fit(formula="y ~ 0 + x", data=data)\n    array_model = PanelOLS().fit(x[:, None], y)\n    assert formula_model._feature_names == ["x"]\n    assert formula_model._predict_constant_index is None\n    assert_allclose(formula_model.coef_, array_model.coef_, rtol=0, atol=3e-12)\n    assert_allclose(formula_model.predict(data.iloc[:10]), array_model.predict(x[:10, None]), rtol=0, atol=3e-12)\n\n\ndef test_panel_explicit_level_constant_fit_statistics_match_pooled():\n    rng = np.random.default_rng(2026082203)\n    x = rng.normal(size=84)\n    y = -0.9 + 0.55 * x + rng.normal(scale=0.14, size=x.size)\n    X_full = np.column_stack([np.ones(x.size), x])\n    panel = PanelOLS(cov_type="nonrobust").fit(X_full, y)\n    pooled = PooledOLS(cov_type="nonrobust").fit(x[:, None], y)\n\n    assert_allclose(panel.coef_, pooled.coef_, rtol=0, atol=3e-12)\n    assert_allclose(panel.bse_, pooled.bse_, rtol=0, atol=3e-12)\n    for field in ("rsquared_overall", "rsquared_adj", "f_statistic", "f_pvalue"):\n        assert_allclose(\n            getattr(panel.fit_statistics_, field),\n            getattr(pooled.fit_statistics_, field),\n            rtol=0,\n            atol=3e-12,\n        )\n    assert panel.fit_statistics_.f_df == pooled.fit_statistics_.f_df\n    assert panel.fit_statistics_.metadata["diagnostic_df"]["df_total"] == x.size - 1\n\n'''
          replace_exact(test_path, marker, additions + marker)

          # Physical runner: add a separate level-constant contract without
          # changing the 35+12 covariance matrix counts.
          runner = 'dev/benchmarks/validate_panel_stage_c_gpu.py'
          marker_runner = '''\ndef _disconnected_two_way_prediction_audit(backend):\n'''
          audit_fn = '''\ndef _level_constant_contract_audit(backend, *, rtol=5e-6, atol=5e-7):\n    """Audit no-FE PanelOLS level-intercept inference against PooledOLS."""\n    rng = np.random.default_rng(20260822)\n    n = 96\n    x = rng.normal(size=n).astype(np.float64)\n    y = (1.15 + 0.65 * x + rng.normal(scale=0.15, size=n)).astype(np.float64)\n    X_full = np.column_stack([np.ones(n), x]).astype(np.float64)\n    X_slope = x[:, None]\n    dummy_entity = np.arange(n, dtype=np.int64)\n    dummy_time = np.arange(n, dtype=np.int64)\n    X_full_b, yb, _eb, _tb = _to_backend(\n        X_full, y, dummy_entity, dummy_time, backend\n    )\n    X_slope_b, _yb2, _eb2, _tb2 = _to_backend(\n        X_slope, y, dummy_entity, dummy_time, backend\n    )\n    device = _device(backend)\n    panel = PanelOLS(cov_type="nonrobust", device=device).fit(X_full_b, yb)\n    pooled = PooledOLS(cov_type="nonrobust", device=device).fit(X_slope_b, yb)\n    if _backend_name(panel) != backend or _backend_name(pooled) != backend:\n        raise AssertionError("level-constant audit fit backend provenance drifted")\n\n    panel_prediction = panel.predict(X_full_b[:12])\n    pooled_prediction = pooled.predict(X_slope_b[:12])\n    if getattr(panel, "_predict_backend_name", None) != backend:\n        raise AssertionError("level-constant audit prediction backend provenance drifted")\n    if panel._predict_constant_index != 0 or float(panel._predict_constant_value) != 1.0:\n        raise AssertionError("level-constant audit did not retain the fitted constant")\n\n    numeric = {\n        "coef": (_array(panel.coef_), _array(pooled.coef_)),\n        "bse": (_array(panel.bse_), _array(pooled.bse_)),\n        "prediction": (_array(panel_prediction), _array(pooled_prediction)),\n    }\n    differences = {}\n    for field, (actual, expected) in numeric.items():\n        np.testing.assert_allclose(actual, expected, rtol=rtol, atol=atol, err_msg=field)\n        differences[field] = _max_abs(actual, expected)\n\n    panel_fit = panel.fit_statistics_\n    pooled_fit = pooled.fit_statistics_\n    for field in ("rsquared_overall", "rsquared_adj", "f_statistic", "f_pvalue"):\n        actual = getattr(panel_fit, field)\n        expected = getattr(pooled_fit, field)\n        differences[field] = _scalar_diff(\n            actual, expected, rtol=rtol, atol=atol, label=f"level_constant.{field}"\n        )\n    if panel_fit.f_df != pooled_fit.f_df:\n        raise AssertionError(f"level_constant.f_df: {panel_fit.f_df!r} != {pooled_fit.f_df!r}")\n    if int(panel.df_resid) != int(pooled.df_resid):\n        raise AssertionError("level_constant residual df differs from PooledOLS")\n    diagnostic_df = panel_fit.metadata.get("diagnostic_df", {})\n    if int(diagnostic_df.get("df_total", -1)) != n - 1:\n        raise AssertionError("level_constant adjusted-R2 total df did not account for intercept")\n\n    return {\n        "status": "success",\n        "executed_backend": backend,\n        "prediction_backend": getattr(panel, "_predict_backend_name", None),\n        "constant_index": int(panel._predict_constant_index),\n        "constant_value": float(panel._predict_constant_value),\n        "df_resid": int(panel.df_resid),\n        "f_df": list(panel_fit.f_df) if panel_fit.f_df is not None else None,\n        "max_abs_differences_vs_pooled": differences,\n    }\n\n'''
          replace_exact(runner, marker_runner, audit_fn + marker_runner)
          replace_exact(
              runner,
              '''    prediction_reference = _disconnected_two_way_prediction_audit("numpy")\n    primitive_reference = {\n''',
              '''    prediction_reference = _disconnected_two_way_prediction_audit("numpy")\n    level_constant_reference = _level_constant_contract_audit(\n        "numpy", rtol=args.rtol, atol=args.atol\n    )\n    primitive_reference = {\n''',
          )
          replace_exact(
              runner,
              '''            "prediction_contracts": {},\n        }\n''',
              '''            "prediction_contracts": {},\n            "level_constant_contract": {},\n        }\n''',
          )
          replace_exact(
              runner,
              '''        payload["prediction_contracts"]["two_way_disconnected"] = {\n            "status": "success",\n            "executed_backend": prediction_audit["executed_backend"],\n            "prediction_backend": prediction_audit["prediction_backend"],\n            "guards": dict(prediction_audit["guards"]),\n            "max_abs_differences": prediction_diffs,\n        }\n\n        primitive_values = _public_primitive_cases(\n''',
              '''        payload["prediction_contracts"]["two_way_disconnected"] = {\n            "status": "success",\n            "executed_backend": prediction_audit["executed_backend"],\n            "prediction_backend": prediction_audit["prediction_backend"],\n            "guards": dict(prediction_audit["guards"]),\n            "max_abs_differences": prediction_diffs,\n        }\n\n        level_constant_audit = _level_constant_contract_audit(\n            backend, rtol=args.rtol, atol=args.atol\n        )\n        if level_constant_audit["executed_backend"] != backend:\n            raise AssertionError("level-constant fit backend provenance drifted")\n        if level_constant_audit["prediction_backend"] != backend:\n            raise AssertionError("level-constant prediction backend provenance drifted")\n        if level_constant_audit["constant_index"] != level_constant_reference["constant_index"]:\n            raise AssertionError("level-constant fitted constant index drifted")\n        np.testing.assert_allclose(\n            level_constant_audit["constant_value"],\n            level_constant_reference["constant_value"],\n            rtol=0,\n            atol=0,\n        )\n        payload["level_constant_contract"] = level_constant_audit\n\n        primitive_values = _public_primitive_cases(\n''',
          )

          # Hosted test executes the same audit on NumPy before a P100 artifact
          # can be accepted.
          replace_exact(
              test_path,
              '''    audit = module._disconnected_two_way_prediction_audit("numpy")\n    assert audit["executed_backend"] == "numpy"\n''',
              '''    constant_audit = module._level_constant_contract_audit(\n        "numpy", rtol=0, atol=3e-12\n    )\n    assert constant_audit["status"] == "success"\n    assert constant_audit["executed_backend"] == "numpy"\n    assert constant_audit["prediction_backend"] == "numpy"\n    assert constant_audit["constant_index"] == 0\n    assert constant_audit["constant_value"] == 1.0\n\n    audit = module._disconnected_two_way_prediction_audit("numpy")\n    assert audit["executed_backend"] == "numpy"\n''',
          )

          # User-facing docs/changelog: stable model semantics in model pages;
          # lifecycle/history remains in changelog.
          replace_exact(
              'docs/en/models/panel.md',
              '''Formula input can also request one-way or two-way effects through the existing pipe syntax, for example `"y ~ x1 + x2 | entity"`; formulas requesting more than two fixed-effect variables fail closed rather than silently dropping additional effects. Formula row filtering aligns side arrays to the retained estimation sample, and formula-enabled effects apply only to that fit rather than leaking into a later refit of the same estimator. ''',
              '''Formula input follows Patsy/R intercept semantics: without fixed effects, the default formula intercept is retained, while `0 +` / `-1` requests a no-intercept level regression; with entity/time fixed effects, the common formula intercept is absorbed by the fixed-effect space. Formula input can also request one-way or two-way effects through the existing pipe syntax, for example `"y ~ x1 + x2 | entity"`; formulas requesting more than two fixed-effect variables fail closed rather than silently dropping additional effects. Formula row filtering aligns side arrays to the retained estimation sample, and formula-enabled effects apply only to that fit rather than leaking into a later refit of the same estimator. ''',
          )
          replace_exact(
              'docs/cn/models/panel.md',
              '''formula 输入可通过已有 pipe syntax 请求 one-way 或 two-way effects，例如 `"y ~ x1 + x2 | entity"`；若请求超过两个 fixed-effect 变量会 fail closed，而不会静默丢弃后续 effect。''',
              '''formula 输入遵循 Patsy/R 的 intercept 语义：没有 fixed effect 时保留默认 formula intercept，`0 +` / `-1` 表示 no-intercept level regression；存在 entity/time fixed effect 时，公共 formula intercept 由 fixed-effect space 吸收。formula 输入可通过已有 pipe syntax 请求 one-way 或 two-way effects，例如 `"y ~ x1 + x2 | entity"`；若请求超过两个 fixed-effect 变量会 fail closed，而不会静默丢弃后续 effect。''',
          )

          replace_exact(
              'CHANGELOG.md',
              '- Hardened two-way fixed-effect convergence, rank-deficient inference semantics, backend-native prediction, FirstDifference time validation, and covariance numerical stability.\n',
              '- Hardened fixed-effect convergence and level prediction, PanelOLS formula/refit/intercept semantics, rank-deficient inference, FirstDifference time validation, and covariance numerical stability.\n',
          )
          replace_exact(
              'docs/en/changelog.md',
              '''Prediction no longer guesses that every one-column-short matrix omitted an intercept, and an explicitly fitted non-unit constant is restored by value and position only on the compatible path. ''',
              '''Prediction no longer guesses that every one-column-short matrix omitted an intercept, and an explicitly fitted non-unit constant is restored by value and position only on the compatible path. Known fixed-effect labels now restore the centered level grand mean so `PanelOLS.predict()` returns the complete fixed-effect level projection; formula-enabled effects no longer leak across refits, formulas with more than two fixed-effect variables fail closed, and no-FE `PanelOLS` formulas preserve Patsy/R default-intercept semantics (with `0 +` / `-1` retaining the explicit no-intercept path). ''',
          )
          replace_exact(
              'docs/cn/changelog.md',
              '''prediction 也不再把任意少一列的矩阵猜成“省略 intercept”，只有与拟合设计一致时才按原位置和原数值恢复显式 non-unit constant。''',
              '''prediction 也不再把任意少一列的矩阵猜成“省略 intercept”，只有与拟合设计一致时才按原位置和原数值恢复显式 non-unit constant。已知 fixed-effect label 的预测现在会恢复 centered level grand mean，使 `PanelOLS.predict()` 返回完整的 fixed-effect level projection；formula 临时启用的 effect 不再泄漏到后续 refit，超过两个 fixed-effect 变量的 formula 会 fail closed，而无 FE 的 `PanelOLS` formula 会保留 Patsy/R 默认 intercept（`0 +` / `-1` 继续表示显式 no-intercept）。''',
          )
          PY
      - name: Run focused regressions
        run: |
          python -m pytest \
            dev/tests/test_panel_stage_c_final_review_fixes.py \
            dev/tests/test_panel_formula.py \
            dev/tests/test_panel_stage_b_diagnostics.py \
            dev/tests/test_panel_stage_b_review_regressions.py \
            -q --tb=short
      - name: Verify scope and commit without temporary workflow
        run: |
          git rm .github/workflows/pr126-round6-intercept-fix.yml
          python - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/pr126-round6-intercept-fix.yml',
              'statgpu/panel/_fixed_effects.py',
              'statgpu/panel/_diagnostic_context.py',
              'dev/benchmarks/validate_panel_stage_c_gpu.py',
              'dev/tests/test_panel_stage_c_final_review_fixes.py',
              'docs/en/models/panel.md',
              'docs/cn/models/panel.md',
              'CHANGELOG.md',
              'docs/en/changelog.md',
              'docs/cn/changelog.md',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'HEAD'], text=True).splitlines())
          if changed != allowed:
              raise SystemExit(f'unexpected round6 intercept scope: {sorted(changed)}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(panel): preserve level intercept semantics'
          git push origin HEAD:agent/panel-p1-stage-c-covariance
