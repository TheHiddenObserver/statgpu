name: Temporary integrate canonical CV source

on:
  push:
    branches:
      - agent/canonical-cv-benchmark-source
    paths:
      - .github/workflows/_temporary-integrate-cv-source.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/canonical-cv-benchmark-source
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install validation dependencies
        run: python -m pip install 'jsonschema[format]' pytest
      - name: Register audited source and close integration contracts
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          from pathlib import Path

          ROOT = Path('.')
          RAW = ROOT / 'results/cv_benchmark_candidate.json'
          CANON = ROOT / 'results/benchmark_frontend_sources/cv_benchmark_20260807.json'
          EXPECTED_SHA = '1347184c988d0f9648c8477d64752b646249282978cf28f65c165b391839bad2'
          SOURCE_ID = 'cv-benchmark-20260807-1347184c988d'
          ENV_ID = 'remote-p100-cv-20260807'
          COMPARISON_ID = 'cv-benchmark-20260807'
          MEASUREMENT_SHA = 'ad2cf88d1d443a53eeb5207c33c4ee4f25de2400'

          raw = RAW.read_bytes()
          actual = hashlib.sha256(raw).hexdigest()
          assert actual == EXPECTED_SHA, (actual, EXPECTED_SHA)
          CANON.parent.mkdir(parents=True, exist_ok=True)
          CANON.write_bytes(raw)
          assert hashlib.sha256(CANON.read_bytes()).hexdigest() == EXPECTED_SHA

          def write_json(path: Path, data: dict) -> None:
              path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          manifest_path = ROOT / 'dev/benchmarks/frontend_sources.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['environments'][ENV_ID] = {
              'label': 'Tesla P100 CV rerun — 2026-08-07',
              'gpu': 'Tesla P100-SXM2-16GB',
              'cpu': 'x86_64',
              'host': 'wE6lDe',
          }
          manifest['comparisons'][COMPARISON_ID] = {
              'label': 'Cross-validation benchmark — 2026-08-07',
              'env_id': ENV_ID,
          }
          new_source = {
              'source_id': SOURCE_ID,
              'comparison_id': COMPARISON_ID,
              'path': 'results/benchmark_frontend_sources/cv_benchmark_20260807.json',
              'original_path': 'results/cv_benchmark_candidate.json',
              'sha256': EXPECTED_SHA,
              'parser': 'cv_benchmark',
              'parser_version': '1.1',
              'env_id': ENV_ID,
              'required': True,
              'allowed_issue_codes': [],
              'source_date': '2026-08-07',
              'measurement_git_sha': MEASUREMENT_SHA,
              'raw_git_sha': 'unknown',
              'provenance_note': (
                  'The immutable P100 runner output could not resolve VCS metadata and therefore '
                  'records git_sha=unknown. The rerun was executed from the ad2cf88 benchmark '
                  'implementation tree; repository comparison confirms no file-level tree change '
                  'across the intervening diagnostic add/remove commits.'
              ),
          }
          manifest['sources'] = [s for s in manifest['sources'] if s['source_id'] != SOURCE_ID]
          manifest['sources'].append(new_source)
          write_json(manifest_path, manifest)

          catalog_path = ROOT / 'dev/benchmarks/benchmark_source_catalog.json'
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          rule_id = 'superseded-cv-benchmark-candidate'
          catalog['rules'] = [r for r in catalog['rules'] if r.get('rule_id') != rule_id]
          catalog['rules'].append({
              'rule_id': rule_id,
              'priority': 18,
              'path': 'results/cv_benchmark_candidate.json',
              'classification': 'superseded_or_duplicate',
              'canonical_eligible': False,
              'provenance_status': 'complete',
              'timing_protocol_status': 'accepted',
              'statistical_alignment_status': 'accepted',
              'superseded_by': 'results/benchmark_frontend_sources/cv_benchmark_20260807.json',
              'issue': '#91',
              'reason': (
                  'Immutable P100 candidate retained for audit; its byte-identical SHA-protected '
                  'canonical copy is registered in frontend_sources.json.'
              ),
          })
          catalog['rules'].sort(key=lambda r: (r.get('priority', 1000), r['rule_id']))
          write_json(catalog_path, catalog)

          coverage_path = ROOT / 'dev/benchmarks/benchmark_coverage_matrix.json'
          coverage = json.loads(coverage_path.read_text(encoding='utf-8'))
          rows = {row['capability_id']: row for row in coverage['capabilities']}
          for capability in ('ridge-cv', 'lasso-cv', 'elasticnet-cv', 'penalized-glm-cv', 'coxph-cv'):
              row = rows[capability]
              row['status'] = 'canonical_current'
              row['source_ids'] = [SOURCE_ID]
              row.pop('issue', None)
              row.pop('disposition', None)
          logistic = rows['logistic-regression-cv']
          logistic['status'] = 'partial_canonical'
          logistic['source_ids'] = [SOURCE_ID]
          logistic['issue'] = '#112'
          logistic['disposition'] = (
              'Current canonical P100 evidence records NumPy and CuPy success and the explicit '
              'Torch strict-CUDA failure without CPU fallback. The production Torch defect is '
              'tracked by #112.'
          )
          write_json(coverage_path, coverage)

          schema_path = ROOT / 'dev/benchmarks/benchmark_frontend_schema.json'
          schema = json.loads(schema_path.read_text(encoding='utf-8'))
          cv = schema['properties']['runs']['items']['properties']['metrics']['properties']['cross_validation']
          cv.clear()
          cv.update({
              'type': 'object',
              'additionalProperties': False,
              'required': [
                  'status', 'reason', 'scoring_name', 'scoring_direction',
                  'candidate_count', 'fold_count', 'quality', 'source_file'
              ],
              'properties': {
                  'status': {'type': 'string', 'enum': ['success', 'failed', 'unavailable', 'unsupported']},
                  'reason': {'type': ['string', 'null']},
                  'cv_evaluation_ms': {'type': 'number', 'exclusiveMinimum': 0},
                  'final_refit_ms': {'type': 'number', 'exclusiveMinimum': 0},
                  'total_fit_ms': {'type': 'number', 'exclusiveMinimum': 0},
                  'selected_parameters': {'type': 'object', 'minProperties': 1},
                  'validation_score': {'type': 'number'},
                  'final_score': {'type': 'number'},
                  'scoring_name': {'type': 'string', 'minLength': 1},
                  'scoring_direction': {'type': 'string', 'enum': ['minimize', 'maximize']},
                  'candidate_count': {'type': 'integer', 'minimum': 1},
                  'fold_count': {'type': 'integer', 'minimum': 2},
                  'failed_candidates': {'type': 'integer', 'minimum': 0},
                  'failed_folds': {'type': 'integer', 'minimum': 0},
                  'final_refit_converged': {'type': 'boolean'},
                  'quality': {'type': 'string', 'enum': ['measured', 'reported', 'computed', 'partial']},
                  'source_file': {'type': 'string'},
              },
              'allOf': [{
                  'if': {'properties': {'status': {'const': 'success'}}, 'required': ['status']},
                  'then': {
                      'required': [
                          'cv_evaluation_ms', 'final_refit_ms', 'total_fit_ms',
                          'selected_parameters', 'validation_score', 'final_score',
                          'failed_candidates', 'failed_folds', 'final_refit_converged'
                      ],
                      'properties': {'reason': {'type': 'null'}},
                  },
                  'else': {
                      'properties': {'reason': {'type': 'string', 'minLength': 1}},
                      'not': {'anyOf': [
                          {'required': ['cv_evaluation_ms']}, {'required': ['final_refit_ms']},
                          {'required': ['total_fit_ms']}, {'required': ['selected_parameters']},
                          {'required': ['validation_score']}, {'required': ['final_score']},
                          {'required': ['failed_candidates']}, {'required': ['failed_folds']},
                          {'required': ['final_refit_converged']}
                      ]},
                  },
              }],
          })
          write_json(schema_path, schema)

          def replace_once(path_str: str, old: str, new: str) -> None:
              path = ROOT / path_str
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              assert count == 1, f'{path_str}: expected one replacement, got {count}'
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'dev/benchmarks/benchmark_cv_models.py',
              '''def _git_sha() -> str:\n    try:\n        return subprocess.check_output(\n            ["git", "rev-parse", "HEAD"], cwd=REPO_ROOT, text=True\n        ).strip()\n    except (OSError, subprocess.CalledProcessError):\n        return "unknown"\n''',
              '''def _git_sha() -> str:\n    override = os.environ.get("STATGPU_BENCHMARK_GIT_SHA")\n    if override:\n        return override.strip()\n    try:\n        return subprocess.check_output(\n            ["git", "rev-parse", "HEAD"], cwd=REPO_ROOT, text=True\n        ).strip()\n    except (OSError, subprocess.CalledProcessError):\n        return "unknown"\n''',
          )

          test_path = ROOT / 'dev/tests/test_benchmark_cv_source.py'
          test_text = test_path.read_text(encoding='utf-8')
          old = '''    assert len(runs) == 12\n    assert len(models) == 6\n    assert len(warnings) == 12\n    assert {run["model_id"] for run in runs} == {model for model, _ in MODELS}\n    assert {run["backend"] for run in runs} == {"numpy", None}\n    assert all(model["supports_penalty"] is True for model in models)\n    assert all(run["parameters"]["metric_scope"] == "cross_validation" for run in runs)\n    assert all("cv_evaluation_ms" not in run["parameters"] for run in runs)\n    assert all(run["metrics"]["timing"]["fit_time_ms"] == 12.5 for run in runs)\n    assert all(run["metrics"]["cross_validation"]["cv_evaluation_ms"] == 10.0 for run in runs)\n    assert all(run["metrics"]["cross_validation"]["final_refit_ms"] == 2.0 for run in runs)\n    assert all(run["metrics"]["cross_validation"]["selected_parameters"] == {"alpha": 0.1} for run in runs)\n    assert all(run["case_id"].startswith("case-") for run in runs)\n    assert all(run["method_config_id"].startswith("method-") for run in runs)\n\n    dashboard_schema = json.loads(\n'''
          new = '''    assert len(runs) == 24\n    assert len(models) == 6\n    assert warnings == []\n    assert {run["model_id"] for run in runs} == {model for model, _ in MODELS}\n    assert {run["backend"] for run in runs} == {"numpy", "cupy", "torch", None}\n    assert all(model["supports_penalty"] is True for model in models)\n    assert all(run["parameters"]["metric_scope"] == "cross_validation" for run in runs)\n    assert all("cv_evaluation_ms" not in run["parameters"] for run in runs)\n    assert all(run["case_id"].startswith("case-") for run in runs)\n    assert all(run["method_config_id"].startswith("method-") for run in runs)\n\n    successful = [run for run in runs if run["metrics"]["cross_validation"]["status"] == "success"]\n    unavailable = [run for run in runs if run["metrics"]["cross_validation"]["status"] == "unavailable"]\n    assert len(successful) == 12\n    assert len(unavailable) == 12\n    assert all(run["metrics"]["timing"]["fit_time_ms"] == 12.5 for run in successful)\n    assert all(run["metrics"]["cross_validation"]["cv_evaluation_ms"] == 10.0 for run in successful)\n    assert all(run["metrics"]["cross_validation"]["final_refit_ms"] == 2.0 for run in successful)\n    assert all(run["metrics"]["cross_validation"]["selected_parameters"] == {"alpha": 0.1} for run in successful)\n    assert all("timing" not in run["metrics"] for run in unavailable)\n    assert all(run["metrics"]["cross_validation"]["reason"] for run in unavailable)\n    assert all("cv_evaluation_ms" not in run["metrics"]["cross_validation"] for run in unavailable)\n\n    dashboard_schema = json.loads(\n'''
          assert test_text.count(old) == 1
          test_text = test_text.replace(old, new, 1)
          test_text += '''\n\ndef test_repository_p100_source_is_immutable_and_registered() -> None:\n    from dev.benchmarks.cv_source import validate_cv_source\n    from dev.benchmarks.frontend_data.canonical import source_sha256\n    from dev.benchmarks.frontend_data.parsers.cv_package import parse_cv_benchmark\n    from dev.benchmarks.frontend_data.registry import load_manifest\n\n    raw_path = REPO_ROOT / "results" / "cv_benchmark_candidate.json"\n    canonical_path = REPO_ROOT / "results" / "benchmark_frontend_sources" / "cv_benchmark_20260807.json"\n    expected_sha = "1347184c988d0f9648c8477d64752b646249282978cf28f65c165b391839bad2"\n    assert raw_path.read_bytes() == canonical_path.read_bytes()\n    assert source_sha256(raw_path) == expected_sha\n    assert source_sha256(canonical_path) == expected_sha\n\n    source = json.loads(raw_path.read_text(encoding="utf-8"))\n    assert validate_cv_source(source) == []\n    assert source["git_sha"] == "unknown"\n    assert source["environment"]["gpu"] == "Tesla P100-SXM2-16GB"\n\n    runs, models, warnings = parse_cv_benchmark(canonical_path, "remote-p100-cv-20260807")\n    assert len(models) == 6\n    assert len(runs) == 22\n    assert warnings == []\n    failed = [run for run in runs if run["metrics"]["cross_validation"]["status"] == "failed"]\n    assert len(failed) == 1\n    assert failed[0]["model_id"] == "LogisticRegressionCV"\n    assert failed[0]["backend"] == "torch"\n    assert "CPU fallback is disabled" in failed[0]["metrics"]["cross_validation"]["reason"]\n    assert "timing" not in failed[0]["metrics"]\n\n    manifest = load_manifest(REPO_ROOT)\n    assert manifest is not None\n    entry = next(source for source in manifest["sources"] if source["source_id"] == "cv-benchmark-20260807-1347184c988d")\n    assert entry["sha256"] == expected_sha\n    assert entry["measurement_git_sha"] == "ad2cf88d1d443a53eeb5207c33c4ee4f25de2400"\n    assert entry["raw_git_sha"] == "unknown"\n'''
          test_path.write_text(test_text, encoding='utf-8')

          catalog_test = ROOT / 'dev/tests/test_benchmark_catalog.py'
          ct = catalog_test.read_text(encoding='utf-8')
          ct = ct.replace('assert rows["ridge-cv"]["issue"] == "#91"', 'assert rows["ridge-cv"]["status"] == "canonical_current"\n    assert rows["ridge-cv"]["source_ids"] == ["cv-benchmark-20260807-1347184c988d"]\n    assert rows["logistic-regression-cv"]["status"] == "partial_canonical"\n    assert rows["logistic-regression-cv"]["issue"] == "#112"')
          ct = ct.replace('assert inventory["registered_sources"] == len(manifest["sources"]) == 8', 'assert inventory["registered_sources"] == len(manifest["sources"]) == 9')
          ct = ct.replace('assert inventory["available_registered_sources"] == 8', 'assert inventory["available_registered_sources"] == 9')
          ct = ct.replace('assert inventory["parsed_registered_sources"] == 8', 'assert inventory["parsed_registered_sources"] == 9')
          catalog_test.write_text(ct, encoding='utf-8')

          e2e = ROOT / 'frontend/e2e/inventory.spec.ts'
          e2e_text = e2e.read_text(encoding='utf-8')
          e2e_text += '''\n\ntest.describe('Canonical cross-validation evidence', () => {\n  test.beforeEach(async ({ page }) => {\n    await page.goto('/');\n    await expect(page.locator('.header')).toBeVisible({ timeout: 15000 });\n  });\n\n  test('renders measured rows and preserves the explicit Torch failure', async ({ page }) => {\n    const response = await page.request.get('/data/benchmark_data.json');\n    expect(response.ok()).toBeTruthy();\n    const data = await response.json();\n    const cvRuns = data.runs.filter((run: { metrics?: { cross_validation?: unknown } }) => run.metrics?.cross_validation);\n    expect(cvRuns).toHaveLength(22);\n    const failed = cvRuns.filter((run: { metrics: { cross_validation: { status: string } } }) => run.metrics.cross_validation.status === 'failed');\n    expect(failed).toHaveLength(1);\n    expect(failed[0].model_id).toBe('LogisticRegressionCV');\n    expect(failed[0].backend).toBe('torch');\n    expect(failed[0].metrics.cross_validation.reason).toContain('CPU fallback is disabled');\n    expect(failed[0].metrics.timing).toBeUndefined();\n\n    const toggle = page.getByText(/Cross-validation Metrics \\(\\d+\\)/);\n    await expect(toggle).toBeVisible();\n    await toggle.click();\n    const panel = toggle.locator('..');\n    const failedRow = panel.locator('tr').filter({ hasText: 'LogisticRegressionCV' }).filter({ hasText: 'torch' });\n    await expect(failedRow).toHaveCount(1);\n    await expect(failedRow).toContainText('failed');\n    await expect(failedRow).toContainText('CPU fallback is disabled');\n  });\n});\n'''
          e2e.write_text(e2e_text, encoding='utf-8')

          doc_path = ROOT / 'docs/benchmark-dashboard/cv-source-contract.md'
          doc = doc_path.read_text(encoding='utf-8')
          marker = '## Registration sequence\n'
          assert marker in doc
          registration = '''## Registered P100 source — 2026-08-07\n\nThe initial six-family package is registered as `cv-benchmark-20260807-1347184c988d`. The canonical file is `results/benchmark_frontend_sources/cv_benchmark_20260807.json`; its SHA256 is `1347184c988d0f9648c8477d64752b646249282978cf28f65c165b391839bad2`, exactly matching the retained raw candidate at `results/cv_benchmark_candidate.json`.\n\nThe immutable raw output records `git_sha: "unknown"` because the remote execution environment could not resolve Git metadata. That field is intentionally not edited after measurement. The manifest attaches `measurement_git_sha: ad2cf88d1d443a53eeb5207c33c4ee4f25de2400`; the rerun provenance identifies that implementation commit, and repository comparison confirms that the intervening diagnostic add/remove commits produced no file-level tree change. Future remote canonical runs can set `STATGPU_BENCHMARK_GIT_SHA` so the runner records the intended commit directly.\n\nThe source contains 22 backend/framework dispositions: 21 successful measured rows and one explicit `LogisticRegressionCV` Torch strict-CUDA failure. The failed row is rendered in the dashboard with its reason and without timing, selection, score, or convergence measurements. The estimator defect remains owned by #112.\n\n'''
          doc_path.write_text(doc.replace(marker, registration + marker, 1), encoding='utf-8')

          print('registered_source_id=' + SOURCE_ID)
          print('canonical_sha256=' + EXPECTED_SHA)
          PY
      - name: Validate source, parser, catalog, and schema
        run: |
          python dev/benchmarks/cv_source.py results/benchmark_frontend_sources/cv_benchmark_20260807.json
          python -m pytest -q dev/tests/test_benchmark_cv_source.py dev/tests/test_benchmark_catalog.py dev/tests/test_benchmark_inventory_v2.py
          python dev/benchmarks/generate_benchmark_data.py \
            --out frontend/public/data/benchmark_data.json \
            --report frontend/public/data/parse_report.json \
            --inventory-out frontend/public/data/source_inventory.json \
            --deterministic --strict-sources
      - name: Typecheck and materialize dashboard assets
        run: |
          cd frontend
          npm ci
          npm run typecheck
          npm run build
      - name: Verify canonical bundle
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('frontend/public/data/benchmark_data.json').read_text())
          inventory = json.loads(Path('frontend/public/data/source_inventory.json').read_text())
          report = json.loads(Path('frontend/public/data/parse_report.json').read_text())
          cv = [r for r in data['runs'] if r.get('metrics', {}).get('cross_validation')]
          failed = [r for r in cv if r['metrics']['cross_validation']['status'] == 'failed']
          assert len(cv) == 22, len(cv)
          assert len(failed) == 1, len(failed)
          assert failed[0]['model_id'] == 'LogisticRegressionCV'
          assert failed[0]['backend'] == 'torch'
          assert 'timing' not in failed[0]['metrics']
          assert inventory['registered_sources'] == 9
          assert inventory['available_registered_sources'] == 9
          assert inventory['parsed_registered_sources'] == 9
          assert inventory['eligible_sources'] == 9
          assert inventory['unclassified_artifacts'] == 0
          assert inventory['coverage_status_counts'] == {
              'benchmark_data_gap': 3,
              'canonical_current': 7,
              'current_evidence_not_canonical_ready': 2,
              'partial_canonical': 8,
          }
          assert report['files_parsed'] == 9
          assert report['runs_generated'] == 1796
          print('cv_rows=22; failed_rows=1; registered_sources=9; runs_generated=1796')
          PY
      - name: Commit integration outputs
        run: |
          git config user.name 'Ziqian Lin'
          git config user.email '51812297+TheHiddenObserver@users.noreply.github.com'
          git add \
            results/benchmark_frontend_sources/cv_benchmark_20260807.json \
            dev/benchmarks/frontend_sources.json \
            dev/benchmarks/benchmark_source_catalog.json \
            dev/benchmarks/benchmark_coverage_matrix.json \
            dev/benchmarks/benchmark_frontend_schema.json \
            dev/benchmarks/benchmark_cv_models.py \
            dev/tests/test_benchmark_cv_source.py \
            dev/tests/test_benchmark_catalog.py \
            frontend/e2e/inventory.spec.ts \
            docs/benchmark-dashboard/cv-source-contract.md \
            frontend/public/data \
            docs/assets/benchmarks
          git diff --cached --check
          git commit -m 'benchmark: register canonical P100 CV evidence'
          git push origin HEAD:agent/canonical-cv-benchmark-source
