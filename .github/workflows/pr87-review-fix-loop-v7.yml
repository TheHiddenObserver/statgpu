name: PR87 review fix batch v7

on:
  push:
    branches: [agent/maintenance-0.2.4-0.2.5]
    paths:
      - .github/workflows/pr87-review-fix-loop-v7.yml

permissions:
  contents: write

jobs:
  apply-review-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Patch Stepwise transformer and set_params lifecycle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('statgpu/feature_selection/_stepwise.py')
          text = path.read_text(encoding='utf-8')

          predict_anchor = '''    def predict(self, X):\n        """Predict with the selected feature subset."""\n        self._check_is_fitted()\n        X = self._prepare_X(X)\n        return self.best_model_.predict(X[:, self.selected_features_])\n\n'''
          transform_block = '''    def transform(self, X):\n        """Return the columns retained by the fitted selector."""\n        self._check_is_fitted()\n        X = self._prepare_X(X)\n        return X[:, self.selected_features_]\n\n    def predict(self, X):\n        """Predict with the selected feature subset."""\n        self._check_is_fitted()\n        X_selected = self.transform(X)\n        return self.best_model_.predict(X_selected)\n\n'''
          if predict_anchor not in text:
              raise RuntimeError('Stepwise predict anchor missing')
          text = text.replace(predict_anchor, transform_block, 1)

          old_set = '''    def set_params(self, **params):\n        """Set selector or wrapped-model constructor parameters."""\n        selector_names = {\n            "model_class",\n            "criterion",\n            "direction",\n            "max_features",\n            "n_jobs",\n            "verbose",\n        }\n        for name, value in params.items():\n            if name in selector_names:\n                setattr(self, name, value)\n            else:\n                self.model_kwargs[name] = value\n        self._validate_constructor_params()\n        return self\n'''
          new_set = '''    def set_params(self, **params):\n        """Set parameters transactionally and clear fitted selection state."""\n        if not params:\n            return self\n\n        selector_values = {\n            "model_class": self.model_class,\n            "criterion": self.criterion,\n            "direction": self.direction,\n            "max_features": self.max_features,\n            "n_jobs": self.n_jobs,\n            "verbose": self.verbose,\n        }\n        model_kwargs = dict(self.model_kwargs)\n        for name, value in params.items():\n            if name in selector_values:\n                selector_values[name] = value\n            else:\n                model_kwargs[name] = value\n\n        fresh = type(self)(**selector_values, **model_kwargs)\n        self.__dict__.clear()\n        self.__dict__.update(fresh.__dict__)\n        return self\n'''
          if old_set not in text:
              raise RuntimeError('Stepwise set_params anchor missing')
          text = text.replace(old_set, new_set, 1)
          path.write_text(text, encoding='utf-8')

          tests = Path('dev/tests/test_maintenance_024_025.py')
          test_text = tests.read_text(encoding='utf-8')
          marker = '# PR87_STEPWISE_LIFECYCLE_TESTS'
          if marker not in test_text:
              test_text += '''\n\n# PR87_STEPWISE_LIFECYCLE_TESTS\ndef test_stepwise_transform_and_set_params_lifecycle():\n    from statgpu.feature_selection import StepwiseSelector\n    from statgpu.linear_model import LinearRegression\n\n    X = np.column_stack([np.arange(8.0), np.arange(8.0) ** 2])\n    y = 1.0 + 2.0 * X[:, 0]\n    selector = StepwiseSelector(\n        LinearRegression, max_features=1, device="cpu"\n    ).fit(X, y)\n\n    transformed = selector.transform(X)\n    assert transformed.shape == (X.shape[0], 1)\n    assert selector.__sklearn_is_fitted__() is True\n\n    selector.set_params(criterion="BIC")\n    assert selector.criterion == "BIC"\n    assert selector._criterion == "bic"\n    assert selector.__sklearn_is_fitted__() is False\n    with pytest.raises(RuntimeError, match="not been fitted"):\n        selector.predict(X)\n\n    before = selector.get_params(deep=False)\n    with pytest.raises(ValueError, match="criterion"):\n        selector.set_params(criterion="invalid")\n    assert selector.get_params(deep=False) == before\n'''
              tests.write_text(test_text, encoding='utf-8')
          PY

      - name: Install validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" scipy pytest packaging "scikit-learn==1.3.2" pandas patsy joblib
          python -m pip install -e . --no-deps

      - name: Run targeted maintenance tests
        run: |
          python -m pytest \
            dev/tests/test_maintenance_024_025.py \
            dev/tests/test_core_contracts.py::test_set_params_rejects_unknown_and_supports_nested_estimators \
            -q --tb=short

      - name: Commit source-only fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add statgpu/feature_selection/_stepwise.py dev/tests/test_maintenance_024_025.py
          git commit -m "fix: complete Stepwise sklearn lifecycle contract"
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
