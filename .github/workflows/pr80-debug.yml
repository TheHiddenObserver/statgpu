name: PR80 Cox Debug

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  cox-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip >/dev/null
          python -m pip install -e ".[validation,formula]" >/dev/null
      - name: Run focused Cox regression and capture output
        id: pytest
        shell: bash
        run: |
          set +e
          python -m pytest \
            dev/tests/test_cox.py \
            dev/tests/test_cox_cv.py \
            dev/tests/test_cox_core_completion.py \
            dev/tests/test_cox_phase1_completion.py \
            dev/tests/test_penalized_cox_completion.py \
            dev/tests/test_pr80_all_censored_loss.py \
            dev/tests/test_pr80_post_review_fixes.py \
            dev/tests/test_survival_risk_sets.py \
            dev/tests/test_pr79_complete_review_fixes.py \
            dev/tests/test_pr79_cox_full_matrix_contract.py \
            dev/tests/test_pr79_cox_parity_smoke.py \
            dev/tests/test_pr79_performance_followups.py \
            dev/tests/test_pr80_tie_residual_and_fit_boundary.py \
            -q --tb=short > pr80-debug.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 80 pr80-debug.log
          exit 0
      - name: Upload focused pytest log
        uses: actions/upload-artifact@v4
        with:
          name: pr80-cox-debug-log
          path: pr80-debug.log
          if-no-files-found: error
      - name: Enforce focused test result
        if: steps.pytest.outputs.status != '0'
        run: exit 1
