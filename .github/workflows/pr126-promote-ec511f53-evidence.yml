name: PR126 promote ec511f53 Stage C evidence

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - '.github/workflows/pr126-promote-ec511f53-evidence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install validation dependencies
        run: python -m pip install pytest 'jsonschema[format]'
      - name: Audit and promote physical evidence
        run: |
          python -m py_compile .github/scripts/pr126_promote_ec511.py
          python .github/scripts/pr126_promote_ec511.py
          git diff --check
      - name: Regenerate deterministic benchmark assets
        run: |
          python dev/benchmarks/generate_benchmark_data.py \
            --out frontend/public/data/benchmark_data.json \
            --report frontend/public/data/parse_report.json \
            --inventory-out frontend/public/data/source_inventory.json \
            --deterministic --strict-sources
          cd frontend
          npm ci
          npm run build
      - name: Validate promoted contracts
        run: |
          python -m pytest \
            dev/tests/test_panel_stage_c_frontend_source.py \
            dev/tests/test_benchmark_catalog.py \
            dev/tests/test_benchmark_inventory_v2.py \
            dev/tests/test_frontend_domain_coverage.py \
            dev/tests/test_benchmark_frontend_data.py \
            dev/tests/test_panel_stage_c_physical_runner_contract.py \
            dev/tests/test_panel_stage_c_performance_runner_contract.py \
            -q --tb=short
          python dev/benchmarks/generate_benchmark_data.py --check --strict-sources
          git diff --check
      - name: Commit promotion and self-delete helpers
        shell: bash
        run: |
          git rm .github/workflows/pr126-promote-ec511f53-evidence.yml
          git rm .github/scripts/pr126_promote_ec511.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          echo 'Promotion diff:'
          git status --short
          git diff --cached --check
          git commit -m 'chore: promote PR126 final ec511f53 physical evidence'
          git push origin HEAD:agent/panel-p1-stage-c-covariance
