name: PR126 FMB exact-period fix once

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - .github/workflows/pr126-fmb-exact-period-fix.yml

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Apply Fama-MacBeth exact-period fix
        run: python dev/validation/pr126_fmb_exact_period_fix_once.py
      - name: Install focused environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" pytest pandas "linearmodels==7.0"
          python -m pip install "torch==2.0.1+cpu" --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[validation,formula]"
      - name: Run focused Fama-MacBeth gates
        run: |
          python -m pytest \
            dev/tests/test_panel_pr126_fmb_exact_period.py \
            dev/tests/test_fama_macbeth_review_fixes.py \
            dev/tests/test_fama_macbeth_linearmodels_external.py \
            dev/tests/test_fama_macbeth_inference_matrix.py \
            -q --tb=short
          python -m compileall -q statgpu/panel dev/tests/test_panel_pr126_fmb_exact_period.py
          git diff --check
      - name: Commit fix and remove staging helpers
        run: |
          rm .github/workflows/pr126-fmb-exact-period-fix.yml
          rm dev/validation/pr126_fmb_exact_period_fix_once.py
          git config user.name "statgpu-review-fix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: retain exactly identified Fama-MacBeth periods"
          git push origin HEAD:agent/panel-p1-stage-c-covariance

# rerun after staging-anchor correction
