name: PR126 FE df metadata cleanup once

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - .github/workflows/pr126-fe-df-docs-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply metadata and docs cleanup
        run: python dev/validation/pr126_fe_df_docs_cleanup_once.py
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation,formula]"
      - name: Run focused cleanup gates
        run: |
          python -m compileall -q statgpu/panel
          python -m pytest -q dev/tests/test_panel_stage_c_fresh_df_rank_guard.py
          python dev/validation/check_docs_contracts.py
          git diff --check
      - name: Commit cleanup and remove staging helpers
        run: |
          rm .github/workflows/pr126-fe-df-docs-cleanup.yml
          rm dev/validation/pr126_fe_df_docs_cleanup_once.py
          git config user.name "statgpu-review-fix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "docs: align panel FE inference metadata"
          git push origin HEAD:agent/panel-p1-stage-c-covariance
