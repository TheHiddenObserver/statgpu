name: PR126 chronology wording fix

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - .github/workflows/pr126-review-fix-round2-doc.yml

permissions:
  contents: write

jobs:
  apply-doc-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Tighten chronology wording
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one replacement target, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "docs/en/panel/covariance.md",
              "Plain string/object labels use lexical order; when lexical order is not the intended chronology (for example, `t1, t2, t10`), supply a numeric/datetime key or an ordered categorical instead.",
              "Plain string labels use lexical order; other non-categorical object labels follow their sorted comparable-value order and are rejected if they are not mutually comparable. When lexical string order is not the intended chronology (for example, `t1, t2, t10`), supply a numeric/datetime key or an ordered categorical instead.",
          )
          replace_once(
              "docs/cn/panel/covariance.md",
              "普通 string/object labels 按字符串字典序排序；如果字典序不是实际 chronology（例如 `t1, t2, t10`），应改用 numeric/datetime key 或 ordered categorical。",
              "普通 string labels 按字符串字典序排序；其他非 categorical object labels 按其可比较值的排序顺序处理，若 labels 不能相互比较则直接报错。如果字符串字典序不是实际 chronology（例如 `t1, t2, t10`），应改用 numeric/datetime key 或 ordered categorical。",
          )
          replace_once(
              "docs/en/panel/pooled-ols.md",
              "Plain string/object labels use lexical order, so labels such as `t1, t2, t10` should be supplied as an ordered categorical (or a numeric/datetime key) when that lexical order is not the intended chronology.",
              "Plain string labels use lexical order; other non-categorical object labels follow their sorted comparable-value order and fail if they are not mutually comparable. Labels such as `t1, t2, t10` should therefore be supplied as an ordered categorical (or a numeric/datetime key) when lexical string order is not the intended chronology.",
          )
          replace_once(
              "docs/cn/panel/pooled-ols.md",
              "普通 string/object label 按字符串字典序排序，因此 `t1, t2, t10` 这类标签若不应按字典序解释，需要改用 ordered categorical 或 numeric/datetime key。",
              "普通 string label 按字符串字典序排序；其他非 categorical object label 按其可比较值排序，不能相互比较时会直接报错。因此 `t1, t2, t10` 这类字符串标签若不应按字典序解释，需要改用 ordered categorical 或 numeric/datetime key。",
          )
          replace_once(
              "docs/en/panel/fama-macbeth.md",
              "Plain string/object labels use lexical order, so semantic labels such as `t1, t2, t10` should be encoded as an ordered categorical (or numeric/datetime key) when lexical order is not the intended chronology before Newey-West lag covariance is formed.",
              "Plain string labels use lexical order; other non-categorical object labels follow their sorted comparable-value order and fail if they are not mutually comparable. Semantic strings such as `t1, t2, t10` should therefore be encoded as an ordered categorical (or numeric/datetime key) when lexical string order is not the intended chronology before Newey-West lag covariance is formed.",
          )
          replace_once(
              "docs/cn/panel/fama-macbeth.md",
              "普通 string/object labels 按字符串字典序排序，因此 `t1, t2, t10` 这类语义标签若不应按字典序解释，应改用 ordered categorical 或 numeric/datetime key，再形成 Newey-West lag covariance。",
              "普通 string labels 按字符串字典序排序；其他非 categorical object labels 按其可比较值排序，不能相互比较时会直接报错。因此 `t1, t2, t10` 这类字符串语义标签若不应按字典序解释，应改用 ordered categorical 或 numeric/datetime key，再形成 Newey-West lag covariance。",
          )
          replace_once(
              "docs/en/panel/first-difference-ols.md",
              "Numeric and datetime time labels use natural order, ordered categoricals use their declared category order, and plain string/object labels use lexical order. Use an ordered categorical or numeric/datetime key when lexical string order is not the intended chronology.",
              "Numeric and datetime time labels use natural order and ordered categoricals use their declared category order. Plain string labels use lexical order; other non-categorical object labels follow their sorted comparable-value order and fail if they are not mutually comparable. Use an ordered categorical or numeric/datetime key when lexical string order is not the intended chronology.",
          )
          replace_once(
              "docs/cn/panel/first-difference-ols.md",
              "numeric/datetime `time_ids` 使用自然顺序，ordered categorical 使用用户声明的 category 顺序，普通 string/object labels 使用字符串字典序；若字典序不是实际 chronology，应改用 ordered categorical 或 numeric/datetime key。",
              "numeric/datetime `time_ids` 使用自然顺序，ordered categorical 使用用户声明的 category 顺序。普通 string labels 使用字符串字典序；其他非 categorical object labels 按其可比较值排序，不能相互比较时会直接报错。若字符串字典序不是实际 chronology，应改用 ordered categorical 或 numeric/datetime key。",
          )
          PY
          git diff --check
      - name: Commit wording fix and remove this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr126-review-fix-round2-doc.yml
          git add docs/en/panel/covariance.md docs/cn/panel/covariance.md \
            docs/en/panel/pooled-ols.md docs/cn/panel/pooled-ols.md \
            docs/en/panel/fama-macbeth.md docs/cn/panel/fama-macbeth.md \
            docs/en/panel/first-difference-ols.md docs/cn/panel/first-difference-ols.md
          git diff --cached --check
          git commit -m 'docs: specify panel object-label chronology'
          git push origin HEAD:${GITHUB_REF_NAME}
