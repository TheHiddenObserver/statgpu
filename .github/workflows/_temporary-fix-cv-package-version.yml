name: Temporary fix CV package version provenance

on:
  push:
    branches:
      - agent/canonical-cv-benchmark-source
    paths:
      - .github/workflows/_temporary-fix-cv-package-version.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/canonical-cv-benchmark-source
          fetch-depth: 0
      - name: Patch provenance helper and regression
        run: |
          python - <<'PY'
          from pathlib import Path

          runner = Path('dev/benchmarks/benchmark_cv_models.py')
          text = runner.read_text(encoding='utf-8')
          old = '''def _package_version(name: str) -> str | None:\n    try:\n        return importlib.metadata.version(name)\n    except importlib.metadata.PackageNotFoundError:\n        return None\n'''
          new = '''def _package_version(name: str) -> str | None:\n    try:\n        return importlib.metadata.version(name)\n    except importlib.metadata.PackageNotFoundError:\n        module_name = {"scikit-learn": "sklearn"}.get(name, name.replace("-", "_"))\n        try:\n            module = importlib.import_module(module_name)\n        except (ImportError, ModuleNotFoundError):\n            return None\n        version = getattr(module, "__version__", None)\n        return None if version is None else str(version)\n'''
          assert text.count(old) == 1
          runner.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('dev/tests/test_cv_runner_instrumentation.py')
          t = test.read_text(encoding='utf-8')
          marker = '''def test_profiler_observes_selector_and_full_data_refit() -> None:\n'''
          addition = '''def test_package_version_falls_back_to_importable_module(monkeypatch) -> None:\n    import types\n\n    import dev.benchmarks.benchmark_cv_models as benchmark_cv_models\n\n    def missing_distribution(name: str) -> str:\n        raise benchmark_cv_models.importlib.metadata.PackageNotFoundError(name)\n\n    fake_cupy = types.SimpleNamespace(__version__="13.6.0")\n    monkeypatch.setattr(benchmark_cv_models.importlib.metadata, "version", missing_distribution)\n    monkeypatch.setattr(\n        benchmark_cv_models.importlib,\n        "import_module",\n        lambda name: fake_cupy if name == "cupy" else (_ for _ in ()).throw(ModuleNotFoundError(name)),\n    )\n    assert benchmark_cv_models._package_version("cupy") == "13.6.0"\n\n\n'''
          assert marker in t
          test.write_text(t.replace(marker, addition + marker, 1), encoding='utf-8')
          PY
          git rm .github/workflows/_temporary-fix-cv-package-version.yml
          git config user.name 'Ziqian Lin'
          git config user.email '51812297+TheHiddenObserver@users.noreply.github.com'
          git add dev/benchmarks/benchmark_cv_models.py dev/tests/test_cv_runner_instrumentation.py
          git diff --cached --check
          git commit -m 'benchmark: harden remote package provenance'
          git push origin HEAD:agent/canonical-cv-benchmark-source
