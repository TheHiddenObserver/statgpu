name: PR126 Rank DF Inference Autofix

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - '.github/workflows/pr126-rank-df-inference-autofix.yml'

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Apply source and test patch
        run: python dev/pr126_autofix_rank_df.py
      - name: Install focused validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" pytest pandas patsy "linearmodels==7.0" statsmodels
          python -m pip install "torch==2.0.1+cpu" --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Run focused review matrix
        run: |
          python -m pytest \
            dev/tests/test_panel_stage_c_rank_deficient_matrix.py \
            dev/tests/test_panel_stage_c_inference_guard.py \
            dev/tests/test_panel_stage_c_covariance.py \
            dev/tests/test_panel_stage_c_external.py \
            dev/tests/test_panel_stage_c_linearmodels_estimators.py \
            dev/tests/test_panel_stage_c_edge_contracts.py \
            -q --tb=short
          python -m compileall -q statgpu/panel dev/tests/test_panel_stage_c_rank_deficient_matrix.py dev/tests/test_panel_stage_c_inference_guard.py
          git diff --check
      - name: Commit validated fix
        run: |
          rm dev/pr126_autofix_rank_df.py
          rm .github/workflows/pr126-rank-df-inference-autofix.yml
          git config user.name "chatgpt-codex-connector"
          git config user.email "1144995+chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add statgpu/panel/_random_effects.py statgpu/panel/_between.py statgpu/panel/_first_diff.py statgpu/panel/_fixed_effects.py statgpu/panel/_base.py dev/tests/test_panel_stage_c_rank_deficient_matrix.py dev/tests/test_panel_stage_c_inference_guard.py
          git add -u dev/pr126_autofix_rank_df.py .github/workflows/pr126-rank-df-inference-autofix.yml
          git commit -m "fix: make panel rank-deficient inference rank-aware"
          git push origin HEAD:agent/panel-p1-stage-c-covariance
