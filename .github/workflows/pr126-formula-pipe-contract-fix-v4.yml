name: PR126 formula pipe contract fix v4

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - .github/workflows/pr126-formula-pipe-contract-fix-v4.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply reviewed formula fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          # Reuse the reviewed v2 patch verbatim.
          workflow = Path('.github/workflows/pr126-formula-pipe-contract-fix-v2.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if "python - <<'PY'" in line) + 1
          stop = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          exec(compile(textwrap.dedent('\n'.join(workflow[start:stop])), '<v2-patch>', 'exec'))

          # Pipe names are authoritative. Conventional entity/time fallback is
          # reserved for token syntax, where no column was named in the formula.
          p = Path('statgpu/panel/_formula.py')
          text = p.read_text()
          old = '''            # For linearmodels tokens, try to extract entity/time from DataFrame\n            if entity_effects and entity_ids is None and hasattr(data, 'columns'):\n                if 'entity' in data.columns:\n                    entity_ids = data['entity'].values\n            if time_effects and time_ids is None and hasattr(data, 'columns'):\n                if 'time' in data.columns:\n                    time_ids = data['time'].values\n'''
          new = '''            # Only effect-token syntax may use conventional entity/time\n            # column names.  A pipe formula names its metadata explicitly and\n            # must fail closed if that named column is absent.\n            _pipe_main, pipe_vars = _split_panel_formula(formula)\n            del _pipe_main\n            if not pipe_vars:\n                if entity_effects and entity_ids is None and hasattr(data, 'columns'):\n                    if 'entity' in data.columns:\n                        entity_ids = data['entity'].values\n                if time_effects and time_ids is None and hasattr(data, 'columns'):\n                    if 'time' in data.columns:\n                        time_ids = data['time'].values\n'''
          if text.count(old) != 1:
              raise SystemExit(f'_formula.py fallback target count={text.count(old)}')
          p.write_text(text.replace(old, new, 1))

          # Add the symmetric missing-time regression beside the missing-entity case.
          p = Path('dev/tests/test_panel_formula.py')
          text = p.read_text()
          anchor = '''    def test_effect_token_without_named_column_still_accepts_explicit_ids(self, panel_df):\n'''
          addition = '''    def test_missing_second_pipe_column_cannot_fall_back_to_default_time(self, panel_df):\n        with pytest.raises(ValueError, match=r"missing_time.*not found in data"):\n            PanelOLS().fit(\n                formula="y ~ x1 + x2 | entity + missing_time",\n                data=panel_df,\n            )\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f'test anchor count={text.count(anchor)}')
          p.write_text(text.replace(anchor, addition + anchor, 1))
          PY
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas patsy pytest joblib scikit-learn
          python -m pip install -e . --no-deps
      - name: Run focused formula regressions
        run: |
          python -m compileall -q statgpu
          pytest -q dev/tests/test_panel_formula.py dev/tests/test_panel_stage_c_api_formula.py
          git diff --check
      - name: Commit fix and self-delete
        shell: bash
        run: |
          rm -f .github/workflows/pr126-formula-pipe-contract-fix.yml
          rm -f .github/workflows/pr126-formula-pipe-contract-fix-v2.yml
          rm -f .github/workflows/pr126-formula-pipe-contract-fix-v3.yml
          rm -f .github/workflows/pr126-formula-pipe-contract-fix-v4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make panel formula pipe metadata authoritative"
          git push origin HEAD:agent/panel-p1-stage-c-covariance
