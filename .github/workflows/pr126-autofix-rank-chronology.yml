name: PR126 rank chronology autofix

on:
  push:
    branches: [agent/panel-p1-stage-c-covariance]
    paths:
      - .github/workflows/pr126-autofix-rank-chronology.yml

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply reviewed fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {text.count(old)}")
              p.write_text(text.replace(old, new))

          replace_once(
              "statgpu/panel/_covariance.py",
              '''def _matrix_rank(X, xp) -> int:\n    return int(_to_float_scalar(xp.linalg.matrix_rank(X)))\n\n\ndef _design_pseudoinverse(X, xp):\n    \"\"\"Return X+, (X'X)+ and numerical rank without forming X'X first.\"\"\"\n    X_pinv = xp.linalg.pinv(X)\n    bread = X_pinv @ X_pinv.T\n    return X_pinv, bread, _matrix_rank(X, xp)\n''',
              '''def _design_pseudoinverse(X, xp):\n    \"\"\"Return X+, (X'X)+ and rank from one explicit SVD cutoff.\n\n    Backend libraries use different defaults for ``pinv`` and ``matrix_rank``.\n    Near the numerical-rank boundary this can make the covariance bread retain\n    directions that the reported rank drops (or vice versa), and can disagree\n    across NumPy/CuPy/Torch.  Derive both quantities from the same SVD mask\n    using the standard ``max(m, n) * eps * s_max`` float64 threshold.\n    \"\"\"\n    U, singular_values, Vh = xp.linalg.svd(X, full_matrices=False)\n    if int(singular_values.shape[0]) == 0:\n        raise ValueError(\"covariance design must contain at least one column\")\n    s_max = _to_float_scalar(xp.max(singular_values))\n    cutoff = (\n        max(int(X.shape[0]), int(X.shape[1]))\n        * np.finfo(np.float64).eps\n        * float(s_max)\n    )\n    retained = singular_values > float(cutoff)\n    rank = int(_to_float_scalar(xp.sum(retained)))\n    safe_values = xp.where(\n        retained, singular_values, xp.ones_like(singular_values)\n    )\n    inverse_values = xp.where(\n        retained, 1.0 / safe_values, xp.zeros_like(singular_values)\n    )\n    X_pinv = (Vh.T * inverse_values) @ U.T\n    bread = X_pinv @ X_pinv.T\n    return X_pinv, bread, rank\n'''
          )

          replace_once(
              "statgpu/panel/_first_diff.py",
              '''from statgpu.panel._utils import factorize_panel_labels\n''',
              '''from statgpu.panel._utils import factorize_panel_labels, factorize_panel_metadata\n'''
          )
          replace_once(
              "statgpu/panel/_first_diff.py",
              '''    if time_ids is not None:\n        tids_np = np.asarray(_to_numpy(time_ids)).ravel()\n        if tids_np.shape[0] != eids_np.shape[0]:\n            raise ValueError(\"time_ids must have the same length as entity_ids\")\n        sort_idx_np = np.lexsort((tids_np, eids_np))\n    else:\n        sort_idx_np = np.argsort(eids_np, kind=\"stable\")\n''',
              '''    if time_ids is not None:\n        _time_labels, time_codes = factorize_panel_metadata(\n            time_ids, name=\"time_ids\", expected_n=eids_np.shape[0]\n        )\n        sort_idx_np = np.lexsort((time_codes, eids_np))\n    else:\n        sort_idx_np = np.argsort(eids_np, kind=\"stable\")\n'''
          )

          replace_once(
              "dev/benchmarks/validate_panel_stage_c_gpu.py",
              '''def _ill_conditioned_inputs(seed=20260814):\n    rng = np.random.default_rng(seed)\n    n = 50\n    x = rng.normal(size=n)\n    X = np.column_stack(\n        [np.ones(n), x, x + 1.0e-9 * rng.normal(size=n)]\n    )\n    y = X @ np.array([0.35, 0.8, -0.45]) + rng.normal(scale=0.2, size=n)\n    params = np.linalg.lstsq(X, y, rcond=None)[0]\n    resid = y - X @ params\n    time = np.tile(np.arange(10), 5)\n    if np.linalg.matrix_rank(X) != 3 or np.linalg.cond(X) <= 1.0e8:\n        raise AssertionError(\"ill-conditioned physical fixture lost full-rank contract\")\n    return X, resid, time\n''',
              '''def _ill_conditioned_inputs(seed=20260814):\n    rng = np.random.default_rng(seed)\n    n = 50\n    x = rng.normal(size=n)\n    X = np.column_stack(\n        [np.ones(n), x, x + 1.0e-9 * rng.normal(size=n)]\n    )\n    y = X @ np.array([0.35, 0.8, -0.45]) + rng.normal(scale=0.2, size=n)\n    params = np.linalg.lstsq(X, y, rcond=None)[0]\n    resid = y - X @ params\n    time = np.tile(np.arange(10), 5)\n    if np.linalg.matrix_rank(X) != 3 or np.linalg.cond(X) <= 1.0e8:\n        raise AssertionError(\"ill-conditioned physical fixture lost full-rank contract\")\n    return X, resid, time\n\n\ndef _rank_boundary_inputs(seed=20260815):\n    \"\"\"Return a controlled design just below the explicit numerical-rank cutoff.\"\"\"\n    rng = np.random.default_rng(seed)\n    n, k = 100, 3\n    q_left, _ = np.linalg.qr(rng.normal(size=(n, k)))\n    q_right, _ = np.linalg.qr(rng.normal(size=(k, k)))\n    singular_values = np.array([10.0, 1.0, 1.0e-13])\n    X = q_left @ np.diag(singular_values) @ q_right.T\n    resid = rng.normal(size=n)\n    time = np.tile(np.arange(10), 10)\n    clusters = np.repeat(np.arange(10), 10)\n    observed = np.linalg.svd(X, compute_uv=False)\n    cutoff = max(X.shape) * np.finfo(np.float64).eps * observed[0]\n    if not observed[-1] < cutoff < observed[-2]:\n        raise AssertionError(\"rank-boundary fixture no longer straddles the explicit cutoff\")\n    if np.linalg.matrix_rank(X) != 2:\n        raise AssertionError(\"rank-boundary fixture must have numerical rank two\")\n    return X, resid, time, clusters\n'''
          )

          replace_once(
              "dev/benchmarks/validate_panel_stage_c_gpu.py",
              '''    X_ill, resid_ill, time_ill = _ill_conditioned_inputs()\n    dummy_entity = np.arange(len(resid_ill), dtype=np.int64)\n    X_ill_b, resid_ill_b, _dummy_b, time_ill_b = _to_backend(\n        X_ill, resid_ill, dummy_entity, time_ill, backend\n    )\n    return {\n        \"cluster_group_debias\": clustered_covariance(\n            Xb, rb, clusters[:, 0], group_debias=True\n        ),\n        \"driscoll_kraay_qs\": driscoll_kraay_covariance(\n            Xb, rb, time, bandwidth=2, kernel=\"qs\"\n        ),\n        \"ill_conditioned_hc0\": ols_covariance(\n            X_ill_b, resid_ill_b, cov_type=\"hc0\"\n        ),\n        \"ill_conditioned_hc2\": ols_covariance(\n            X_ill_b, resid_ill_b, cov_type=\"hc2\"\n        ),\n        \"ill_conditioned_hc3\": ols_covariance(\n            X_ill_b, resid_ill_b, cov_type=\"hc3\"\n        ),\n        \"ill_conditioned_dk\": driscoll_kraay_covariance(\n            X_ill_b,\n            resid_ill_b,\n            time_ill_b,\n            bandwidth=2,\n            kernel=\"bartlett\",\n        ),\n    }\n''',
              '''    X_ill, resid_ill, time_ill = _ill_conditioned_inputs()\n    dummy_entity = np.arange(len(resid_ill), dtype=np.int64)\n    X_ill_b, resid_ill_b, _dummy_b, time_ill_b = _to_backend(\n        X_ill, resid_ill, dummy_entity, time_ill, backend\n    )\n    X_rank, resid_rank, time_rank, cluster_rank = _rank_boundary_inputs()\n    rank_entity = np.arange(len(resid_rank), dtype=np.int64)\n    X_rank_b, resid_rank_b, _rank_entity_b, time_rank_b = _to_backend(\n        X_rank, resid_rank, rank_entity, time_rank, backend\n    )\n    return {\n        \"cluster_group_debias\": clustered_covariance(\n            Xb, rb, clusters[:, 0], group_debias=True\n        ),\n        \"driscoll_kraay_qs\": driscoll_kraay_covariance(\n            Xb, rb, time, bandwidth=2, kernel=\"qs\"\n        ),\n        \"ill_conditioned_hc0\": ols_covariance(\n            X_ill_b, resid_ill_b, cov_type=\"hc0\"\n        ),\n        \"ill_conditioned_hc2\": ols_covariance(\n            X_ill_b, resid_ill_b, cov_type=\"hc2\"\n        ),\n        \"ill_conditioned_hc3\": ols_covariance(\n            X_ill_b, resid_ill_b, cov_type=\"hc3\"\n        ),\n        \"ill_conditioned_dk\": driscoll_kraay_covariance(\n            X_ill_b, resid_ill_b, time_ill_b, bandwidth=2, kernel=\"bartlett\"\n        ),\n        \"rank_boundary_nonrobust\": ols_covariance(\n            X_rank_b, resid_rank_b, cov_type=\"nonrobust\", scale=1.0\n        ),\n        \"rank_boundary_hc0\": ols_covariance(\n            X_rank_b, resid_rank_b, cov_type=\"hc0\"\n        ),\n        \"rank_boundary_hc2\": ols_covariance(\n            X_rank_b, resid_rank_b, cov_type=\"hc2\"\n        ),\n        \"rank_boundary_hc3\": ols_covariance(\n            X_rank_b, resid_rank_b, cov_type=\"hc3\"\n        ),\n        \"rank_boundary_cluster\": clustered_covariance(\n            X_rank_b, resid_rank_b, cluster_rank\n        ),\n        \"rank_boundary_dk\": driscoll_kraay_covariance(\n            X_rank_b, resid_rank_b, time_rank_b, bandwidth=2, kernel=\"bartlett\"\n        ),\n    }\n'''
          )

          replace_once(
              "dev/benchmarks/validate_panel_stage_c_gpu.py",
              '''    required_public_primitives = {\n        \"cluster_group_debias\",\n        \"driscoll_kraay_qs\",\n        \"ill_conditioned_hc0\",\n        \"ill_conditioned_hc2\",\n        \"ill_conditioned_hc3\",\n        \"ill_conditioned_dk\",\n    }\n''',
              '''    required_public_primitives = {\n        \"cluster_group_debias\",\n        \"driscoll_kraay_qs\",\n        \"ill_conditioned_hc0\",\n        \"ill_conditioned_hc2\",\n        \"ill_conditioned_hc3\",\n        \"ill_conditioned_dk\",\n        \"rank_boundary_nonrobust\",\n        \"rank_boundary_hc0\",\n        \"rank_boundary_hc2\",\n        \"rank_boundary_hc3\",\n        \"rank_boundary_cluster\",\n        \"rank_boundary_dk\",\n    }\n'''
          )

          replace_once(
              "dev/benchmarks/validate_panel_stage_c_gpu.py",
              '''            name: _version(name) for name in (\"statgpu\", \"numpy\", \"scipy\", \"cupy\", \"torch\")\n''',
              '''            name: (\n                _version(\"cupy\")\n                or _version(\"cupy-cuda11x\")\n                or _version(\"cupy-cuda12x\")\n                if name == \"cupy\"\n                else _version(name)\n            )\n            for name in (\"statgpu\", \"numpy\", \"scipy\", \"cupy\", \"torch\")\n'''
          )

          edge = Path("dev/tests/test_panel_stage_c_edge_contracts.py")
          text = edge.read_text()
          addition = '''\n\ndef test_first_difference_preserves_ordered_categorical_chronology():\n    pd = pytest.importorskip(\"pandas\")\n    from statgpu.panel import FirstDifferenceOLS\n\n    rng = np.random.default_rng(12953)\n    n_entities = 12\n    numeric_time = np.tile(np.arange(3), n_entities)\n    labels = np.tile(np.array([\"t1\", \"t2\", \"t10\"], dtype=object), n_entities)\n    ordered_time = pd.Categorical(\n        labels, categories=[\"t1\", \"t2\", \"t10\"], ordered=True\n    )\n    entity = np.repeat(np.arange(n_entities), 3)\n    X = rng.normal(size=(entity.size, 1))\n    y = (\n        0.8 * X[:, 0]\n        + np.tile(np.array([0.0, 0.35, -0.2]), n_entities)\n        + rng.normal(scale=0.15, size=entity.size)\n    )\n\n    numeric = FirstDifferenceOLS(cov_type=\"hc0\").fit(\n        X, y, entity_ids=entity, time_ids=numeric_time\n    )\n    categorical = FirstDifferenceOLS(cov_type=\"hc0\").fit(\n        X, y, entity_ids=entity, time_ids=ordered_time\n    )\n    np.testing.assert_allclose(categorical.coef_, numeric.coef_, rtol=0.0, atol=0.0)\n    np.testing.assert_allclose(categorical.bse_, numeric.bse_, rtol=2e-13, atol=2e-15)\n'''
          if "test_first_difference_preserves_ordered_categorical_chronology" in text:
              raise SystemExit("edge chronology test already exists")
          edge.write_text(text + addition)

          torch_test = Path("dev/tests/test_panel_stage_c_torch_cpu.py")
          text = torch_test.read_text()
          addition = '''\n\ndef _rank_boundary_inputs(seed=12910):\n    rng = np.random.default_rng(seed)\n    n, k = 100, 3\n    q_left, _ = np.linalg.qr(rng.normal(size=(n, k)))\n    q_right, _ = np.linalg.qr(rng.normal(size=(k, k)))\n    X = q_left @ np.diag([10.0, 1.0, 1.0e-13]) @ q_right.T\n    resid = rng.normal(size=n)\n    time = np.tile(np.arange(10), 10)\n    cluster = np.repeat(np.arange(10), 10)\n    cutoff = max(X.shape) * np.finfo(np.float64).eps * np.linalg.svd(X, compute_uv=False)[0]\n    assert np.linalg.svd(X, compute_uv=False)[-1] < cutoff\n    assert np.linalg.matrix_rank(X) == 2\n    return X, resid, time, cluster\n\n\ndef test_stage_c_rank_boundary_covariance_torch_cpu_matches_numpy():\n    X, resid, time, cluster = _rank_boundary_inputs()\n    X_t = torch.as_tensor(X, dtype=torch.float64)\n    resid_t = torch.as_tensor(resid, dtype=torch.float64)\n\n    cases = [\n        (\"nonrobust\", dict(scale=1.0)),\n        (\"hc0\", {}),\n        (\"hc2\", {}),\n        (\"hc3\", {}),\n        (\"clustered\", dict(cluster=cluster)),\n        (\"driscoll-kraay\", dict(time_ids=time, bandwidth=2)),\n    ]\n    for cov_type, kwargs in cases:\n        meta_np = {}\n        meta_t = {}\n        expected = ols_covariance(\n            X, resid, cov_type=cov_type, xp=np, metadata=meta_np, **kwargs\n        )\n        actual = ols_covariance(\n            X_t, resid_t, cov_type=cov_type, metadata=meta_t, **kwargs\n        )\n        assert torch.is_tensor(actual)\n        assert_allclose(\n            actual.detach().cpu().numpy(), expected, rtol=5e-10, atol=5e-12\n        )\n        assert np.all(np.isfinite(expected))\n        if cov_type in {\"hc0\", \"hc2\", \"hc3\", \"driscoll-kraay\"}:\n            assert meta_np[\"design_rank\"] == 2\n            assert meta_t[\"design_rank\"] == 2\n'''
          if "test_stage_c_rank_boundary_covariance_torch_cpu_matches_numpy" in text:
              raise SystemExit("rank boundary torch test already exists")
          torch_test.write_text(text + addition)

          contract = Path("dev/tests/test_panel_stage_c_physical_runner_contract.py")
          text = contract.read_text()
          old = '''    assert set(values) == {\n        \"cluster_group_debias\",\n        \"driscoll_kraay_qs\",\n        \"ill_conditioned_hc0\",\n        \"ill_conditioned_hc2\",\n        \"ill_conditioned_hc3\",\n        \"ill_conditioned_dk\",\n    }\n'''
          new = '''    assert set(values) == {\n        \"cluster_group_debias\",\n        \"driscoll_kraay_qs\",\n        \"ill_conditioned_hc0\",\n        \"ill_conditioned_hc2\",\n        \"ill_conditioned_hc3\",\n        \"ill_conditioned_dk\",\n        \"rank_boundary_nonrobust\",\n        \"rank_boundary_hc0\",\n        \"rank_boundary_hc2\",\n        \"rank_boundary_hc3\",\n        \"rank_boundary_cluster\",\n        \"rank_boundary_dk\",\n    }\n'''
          if text.count(old) != 1:
              raise SystemExit("physical runner contract set replacement mismatch")
          text = text.replace(old, new)
          text += '''\n\ndef test_stage_c_runner_rank_boundary_is_explicitly_rank_two():\n    X, resid, time, _cluster = _MOD._rank_boundary_inputs()\n    meta = {}\n    cov = _MOD.ols_covariance(\n        X, resid, cov_type=\"driscoll-kraay\", time_ids=time, bandwidth=2, metadata=meta\n    )\n    assert np.all(np.isfinite(cov))\n    assert meta[\"design_rank\"] == 2\n    assert meta[\"design_columns\"] == 3\n    assert meta[\"rank_deficient_extension\"] is True\n'''
          contract.write_text(text)
          PY
      - name: Install focused test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[formula,validation]' pytest
      - name: Run focused regressions
        run: |
          pytest -q \
            dev/tests/test_panel_stage_c_covariance.py \
            dev/tests/test_panel_stage_c_edge_contracts.py \
            dev/tests/test_panel_stage_c_physical_runner_contract.py \
            dev/tests/test_panel_stage_c_api_formula.py \
            dev/tests/test_panel_stage_c_inference_guard.py
          python -m py_compile \
            statgpu/panel/_covariance.py \
            statgpu/panel/_first_diff.py \
            dev/benchmarks/validate_panel_stage_c_gpu.py
          git diff --check
      - name: Commit reviewed fixes and self-delete
        shell: bash
        run: |
          git config user.name 'TheHiddenObserver'
          git config user.email '51812297+TheHiddenObserver@users.noreply.github.com'
          git add \
            statgpu/panel/_covariance.py \
            statgpu/panel/_first_diff.py \
            dev/benchmarks/validate_panel_stage_c_gpu.py \
            dev/tests/test_panel_stage_c_edge_contracts.py \
            dev/tests/test_panel_stage_c_torch_cpu.py \
            dev/tests/test_panel_stage_c_physical_runner_contract.py
          git rm -f .github/workflows/pr126-autofix-rank-chronology.yml
          git commit -m 'fix(panel): align rank cutoff and FD chronology'
          git push origin HEAD:agent/panel-p1-stage-c-covariance
