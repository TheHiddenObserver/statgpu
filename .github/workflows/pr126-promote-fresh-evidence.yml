name: PR126 promote fresh Stage C evidence

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - '.github/workflows/pr126-promote-fresh-evidence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install promotion validation dependencies
        run: python -m pip install pytest 'jsonschema[format]'
      - name: Promote aad53587 physical evidence contracts
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          from pathlib import Path

          ROOT = Path.cwd()
          MEASUREMENT = "aad53587c9611da0e71a676e86ef32d9f6403f5c"
          ARTIFACT_COMMIT = "fdf88e8990b30502958cc357099342d271792ec2"
          OLD_MEASUREMENT = "c151550ab17bd9533a51599f86b6a4ea12a292e9"
          OLD_VALIDATION_ID = "panel-stage-c-validation-pr126-20260810-91e9ec53b6ee"
          OLD_PERFORMANCE_ID = "panel-stage-c-performance-pr126-20260810-1861fc4f1817"
          VALIDATION_PATH = ROOT / "results/pr126_p100/panel_stage_c_gpu_validation_aad53587.json"
          PERFORMANCE_PATH = ROOT / "results/pr126_p100/panel_stage_c_performance_aad53587.json"

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def blob(path: Path) -> str:
              return subprocess.check_output(["git", "hash-object", str(path)], text=True).strip()

          def write_json(path: Path, obj) -> None:
              path.write_text(json.dumps(obj, indent=2) + "\n", encoding="utf-8")

          def replace_required(path: Path, old: str, new: str, *, count: int | None = None) -> None:
              text = path.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual == 0:
                  raise RuntimeError(f"expected text not found in {path}: {old[:120]!r}")
              if count is not None and actual != count:
                  raise RuntimeError(f"unexpected replacement count in {path}: {actual} != {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          validation = json.loads(VALIDATION_PATH.read_text(encoding="utf-8"))
          performance = json.loads(PERFORMANCE_PATH.read_text(encoding="utf-8"))
          assert validation["git_sha"] == MEASUREMENT
          assert validation["working_tree_clean"] is True
          assert validation["status"] == "success"
          assert validation["case_count_per_backend"] == 26
          assert validation["public_primitive_count_per_backend"] == 6
          assert set(validation["backends"]) == {"cupy", "torch"}
          expected_primitives = {
              "cluster_group_debias",
              "driscoll_kraay_qs",
              "ill_conditioned_hc0",
              "ill_conditioned_hc2",
              "ill_conditioned_hc3",
              "ill_conditioned_dk",
          }
          for backend in ("cupy", "torch"):
              payload = validation["backends"][backend]
              assert payload["status"] == "success"
              assert payload["requested_backend"] == backend
              assert len(payload["cases"]) == 26
              assert set(payload["public_primitives"]) == expected_primitives
              assert all(item["executed_backend"] == backend for item in payload["cases"].values())
              assert all(item["executed_backend"] == backend for item in payload["public_primitives"].values())
          assert performance["git_sha"] == MEASUREMENT
          assert performance["working_tree_clean"] is True
          assert performance["benchmark"] == "panel_stage_c_covariance_fit_overhead"
          assert performance["high_t_scale"] == "10000x2x200"
          assert len(performance["rows"]) == 58
          assert {row["backend"] for row in performance["rows"]} == {"cupy", "torch"}

          validation_sha = sha256(VALIDATION_PATH)
          performance_sha = sha256(PERFORMANCE_PATH)
          validation_blob = blob(VALIDATION_PATH)
          performance_blob = blob(PERFORMANCE_PATH)
          validation_id = f"panel-stage-c-validation-pr126-20260810-{validation_sha[:12]}"
          performance_id = f"panel-stage-c-performance-pr126-20260810-{performance_sha[:12]}"

          parser = ROOT / "dev/benchmarks/frontend_data/parsers/panel_stage_c.py"
          replace_required(
              parser,
              f'_MEASUREMENT_SHA = "{OLD_MEASUREMENT}"',
              f'_MEASUREMENT_SHA = "{MEASUREMENT}"',
              count=1,
          )
          replace_required(
              parser,
              '_EXPECTED_PRIMITIVES = {"cluster_group_debias", "driscoll_kraay_qs"}',
              '_EXPECTED_PRIMITIVES = {\n'
              '    "cluster_group_debias", "driscoll_kraay_qs",\n'
              '    "ill_conditioned_hc0", "ill_conditioned_hc2",\n'
              '    "ill_conditioned_hc3", "ill_conditioned_dk",\n'
              '}',
              count=1,
          )
          replace_required(parser, "if len(runs) != 56:", "if len(runs) != 64:", count=1)
          replace_required(parser, "expected 56 rows", "expected 64 rows", count=1)

          manifest_path = ROOT / "dev/benchmarks/frontend_sources.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          stage_c_sources = {
              source["parser"]: source
              for source in manifest["sources"]
              if source["parser"] in {"panel_stage_c_physical_validation", "panel_stage_c_performance"}
          }
          assert set(stage_c_sources) == {"panel_stage_c_physical_validation", "panel_stage_c_performance"}
          vsrc = stage_c_sources["panel_stage_c_physical_validation"]
          psrc = stage_c_sources["panel_stage_c_performance"]
          assert vsrc["source_id"] == OLD_VALIDATION_ID
          assert psrc["source_id"] == OLD_PERFORMANCE_ID
          vsrc.update({
              "source_id": validation_id,
              "path": "results/pr126_p100/panel_stage_c_gpu_validation_aad53587.json",
              "sha256": validation_sha,
              "measurement_git_sha": MEASUREMENT,
              "raw_git_sha": MEASUREMENT,
              "provenance_note": (
                  "Current PR #126 Stage-C repaired exact-clean-head P100 correctness/backend-provenance evidence. "
                  f"Artifact repository commit {ARTIFACT_COMMIT}; Git blob {validation_blob}; "
                  "26 estimator cases plus six direct public covariance primitives per CuPy/Torch backend, "
                  "including full-rank ill-conditioned HC0/HC2/HC3/Driscoll-Kraay, with requested/executed "
                  "backend identity and no numerical CPU fallback. The older c151550a and 9c0b3050 "
                  "measurements remain immutable historical evidence."
              ),
          })
          psrc.update({
              "source_id": performance_id,
              "path": "results/pr126_p100/panel_stage_c_performance_aad53587.json",
              "sha256": performance_sha,
              "measurement_git_sha": MEASUREMENT,
              "raw_git_sha": MEASUREMENT,
              "provenance_note": (
                  "Current PR #126 Stage-C repaired synchronized end-to-end P100 timing evidence. "
                  f"Artifact repository commit {ARTIFACT_COMMIT}; Git blob {performance_blob}; "
                  "58 synchronized rows cover three base scales plus the bounded N=10000, k=2, T=200 QS all-lag "
                  "scenario on both CuPy and Torch. No speedup claim or CPU baseline is encoded. The older "
                  "c151550a and 9c0b3050 timing artifacts remain immutable historical evidence."
              ),
          })
          write_json(manifest_path, manifest)

          coverage_path = ROOT / "dev/benchmarks/benchmark_coverage_matrix.json"
          coverage = json.loads(coverage_path.read_text(encoding="utf-8"))
          panel_row = next(row for row in coverage["capabilities"] if row["capability_id"] == "panel-estimation")
          panel_row["source_ids"] = [
              validation_id if source_id == OLD_VALIDATION_ID else
              performance_id if source_id == OLD_PERFORMANCE_ID else source_id
              for source_id in panel_row["source_ids"]
          ]
          panel_row["disposition"] = (
              "June timing rows cover aligned PanelOLS and RandomEffects; PR #122 provides canonical Stage-B "
              "diagnostic/physical validation. PR #126 repaired exact-clean P100 evidence at aad53587 adds "
              "canonical Stage-C CuPy/Torch correctness for 26 estimator covariance integrations plus six direct "
              "public primitives per backend, including ill-conditioned HC0/HC2/HC3/DK, and synchronized timing "
              "for three base scales plus a bounded N=10,000, k=2, T=200 QS all-lag scenario. The c151550a and "
              "9c0b3050 artifacts are retained only as historical evidence. No Stage-C speedup claim is made."
          )
          write_json(coverage_path, coverage)

          frontend_test = ROOT / "dev/tests/test_panel_stage_c_frontend_source.py"
          replace_required(frontend_test, "panel_stage_c_gpu_validation_c151550a.json", "panel_stage_c_gpu_validation_aad53587.json", count=1)
          replace_required(frontend_test, "panel_stage_c_performance_c151550a.json", "panel_stage_c_performance_aad53587.json", count=1)
          replace_required(frontend_test, "assert len(runs) == 56", "assert len(runs) == 64", count=1)
          replace_required(
              frontend_test,
              'assert sum(run["model_id"] == "PanelCovariancePrimitive" for run in runs) == 4',
              'assert sum(run["model_id"] == "PanelCovariancePrimitive" for run in runs) == 12',
              count=1,
          )

          catalog_test = ROOT / "dev/tests/test_benchmark_catalog.py"
          replace_required(catalog_test, "panel_stage_c_gpu_validation_c151550a.json", "panel_stage_c_gpu_validation_aad53587.json", count=1)
          replace_required(catalog_test, "panel_stage_c_performance_c151550a.json", "panel_stage_c_performance_aad53587.json", count=1)
          replace_required(catalog_test, OLD_VALIDATION_ID, validation_id)
          replace_required(catalog_test, OLD_PERFORMANCE_ID, performance_id)
          text = catalog_test.read_text(encoding="utf-8")
          marker = '    assert old_performance["registered"] is False\n'
          if marker not in text:
              raise RuntimeError("Stage-C historical artifact test marker not found")
          extra = (
              marker
              + '\n    prior_validation = next(\n'
              + '        entry for entry in entries\n'
              + '        if entry["path"] == "results/pr126_p100/panel_stage_c_gpu_validation_c151550a.json"\n'
              + '    )\n'
              + '    prior_performance = next(\n'
              + '        entry for entry in entries\n'
              + '        if entry["path"] == "results/pr126_p100/panel_stage_c_performance_c151550a.json"\n'
              + '    )\n'
              + '    assert prior_validation["classification"] == "historical_or_excluded"\n'
              + '    assert prior_validation["registered"] is False\n'
              + '    assert prior_performance["classification"] == "historical_or_excluded"\n'
              + '    assert prior_performance["registered"] is False\n'
          )
          catalog_test.write_text(text.replace(marker, extra, 1), encoding="utf-8")

          # The canonical bundle gains eight rows: four newly promoted direct primitives x two backends.
          for path in (ROOT / "dev/tests").rglob("*.py"):
              text = path.read_text(encoding="utf-8")
              if "1976" in text:
                  path.write_text(text.replace("1976", "1984"), encoding="utf-8")

          root_changelog = ROOT / "CHANGELOG.md"
          text = root_changelog.read_text(encoding="utf-8")
          start = text.index("## 2026-08-09")
          end = text.index("## 2026-08-08", start)
          section = f'''## 2026-08-09\n\n### PR #126 — Complete Panel Tier-1 Stage C covariance\n- Added HC0/HC2/HC3, robust RandomEffects inference, cluster group debiasing, and Driscoll-Kraay covariance with NumPy/CuPy/Torch-native accumulation.\n- Preserved historical HC1 (`robust`), Pooled row-HAC, default clustered covariance, coefficient estimates, and Stage-B diagnostics.\n- Hardened covariance numerics around the design pseudoinverse, stable HC2/HC3 leverage, metadata validation, backend-native CuPy scatter-add, unified inference storage, RandomEffects formula intercept/name semantics, and small-argument QS weights; pinned Python and R external alignment remains green.\n- Fresh Tesla P100 acceptance on exact clean implementation head `{MEASUREMENT}` passes all 26 estimator covariance cases plus 6 direct public primitives on each of CuPy and Torch (32/32 per backend), including ill-conditioned HC0/HC2/HC3/DK and persisted executed-backend provenance. Synchronized performance evidence covers the maintained base scales and bounded `N=10,000`, `k=2`, `T=200` QS all-lag scenario without making a speedup claim. Earlier `c151550a...` and `9c0b3050...` artifacts remain immutable historical evidence.\n\n'''
          root_changelog.write_text(text[:start] + section + text[end:], encoding="utf-8")

          en_changelog = ROOT / "docs/en/changelog.md"
          text = en_changelog.read_text(encoding="utf-8")
          start = text.index("## 2026-08-09 — Panel Stage C covariance completion (PR #126)")
          end = text.index("## 2026-08-08", start)
          section = f'''## 2026-08-09 — Panel Stage C covariance completion (PR #126)\n\nStage C extends the Panel Tier-1 inference layer without changing estimator coefficients or the Stage-B diagnostic definitions. `robust` remains the historical HC1 contract; new `hc0`, `hc2`, and `hc3` use each estimator's actual transformed fit space. `RandomEffects` supports robust/HC, clustered, and Driscoll-Kraay covariance on the quasi-demeaned GLS scores. One-/two-way clustering has opt-in `group_debias=True`; the default clustered result is unchanged. `PooledOLS(cov_type="hac")` remains the legacy row-order Bartlett/Newey-West path.\n\nThe repaired covariance implementation derives bread and influence rows from the design pseudoinverse, computes HC2/HC3 leverage from `diag(X X+)`, validates entity/time/cluster metadata consistently, keeps CuPy group scatter-add backend-native, publishes the shared inference result contract, preserves RandomEffects formula intercept and feature names, and stabilizes quadratic-spectral weights for very large bandwidths. External definitions are checked against pinned `statsmodels`, `linearmodels`, and R `sandwich`/`plm` references.\n\nFresh physical CUDA acceptance completed on exact clean implementation head `{MEASUREMENT}` using Tesla P100-SXM2-16GB. CuPy and Torch each pass all 26 estimator covariance cases plus 6 direct public covariance primitives (32/32 per backend), including full-rank ill-conditioned HC0/HC2/HC3 and Driscoll-Kraay cases, with requested/executed backend identity and no numerical CPU fallback. The synchronized performance run retains the three base scales and bounded `N=10,000`, `k=2`, `T=200` QS all-lag scenario; it records timing only and makes no speedup claim. Earlier `c151550a...` and `9c0b3050...` artifacts are retained as immutable historical evidence.\n\n'''
          en_changelog.write_text(text[:start] + section + text[end:], encoding="utf-8")

          cn_changelog = ROOT / "docs/cn/changelog.md"
          text = cn_changelog.read_text(encoding="utf-8")
          start = text.index("## 2026-08-09 — Panel Stage C 协方差补齐（PR #126）")
          end = text.index("## 2026-08-08", start)
          section = f'''## 2026-08-09 — Panel Stage C 协方差补齐（PR #126）\n\nStage C 在不改变 estimator coefficient 与 Stage-B diagnostic definition 的前提下扩展 Panel Tier-1 inference。`robust` 继续表示历史 HC1；新增 `hc0`、`hc2`、`hc3` 按各 estimator 的实际 transformed fit space 计算。`RandomEffects` 支持 quasi-demeaned GLS score 上的 robust/HC、clustered 与 Driscoll-Kraay covariance；one-/two-way cluster 的 `group_debias=True` 为显式 opt-in，默认 clustered 结果保持不变。`PooledOLS(cov_type="hac")` 仍是历史 row-order Bartlett/Newey-West 路径。\n\n修复后的 covariance 实现从 design pseudoinverse 构造 bread 与 influence row，以 `diag(X X+)` 计算 HC2/HC3 leverage，统一验证 entity/time/cluster metadata，保持 CuPy group scatter-add 后端原生，发布共享 inference result contract，恢复 RandomEffects formula 的 intercept/feature-name 语义，并对超大 bandwidth 下的 quadratic-spectral weight 使用稳定的小参数展开。外部定义继续对齐固定版本的 `statsmodels`、`linearmodels` 以及 R `sandwich`/`plm`。\n\nFresh physical CUDA 验收已在精确且干净的实现提交 `{MEASUREMENT}` 上使用 Tesla P100-SXM2-16GB 完成。CuPy 与 Torch 各自通过 26 个 estimator covariance case 和 6 个 direct public covariance primitive（每个 backend 32/32），其中包括 full-rank ill-conditioned HC0/HC2/HC3 与 Driscoll-Kraay，并验证 requested/executed backend 一致且无数值 CPU fallback。同步 performance 仍覆盖三个基础规模及有界的 `N=10,000`、`k=2`、`T=200` QS all-lag 场景，只记录 timing，不声明 speedup。此前 `c151550a...` 与 `9c0b3050...` 产物继续作为不可变历史证据保留。\n\n'''
          cn_changelog.write_text(text[:start] + section + text[end:], encoding="utf-8")

          en_panel = ROOT / "docs/en/models/panel.md"
          replace_required(
              en_panel,
              "The Ready-triggered ordered-categorical chronology fix was revalidated on exact-clean head `c151550a...` using Tesla P100: CuPy and Torch each pass all 26 estimator covariance cases plus two direct public covariance primitives, and the synchronized performance rerun includes the bounded `N=10,000`, `k=2`, `T=200` QS scenario. The earlier `9c0b3050...` artifacts remain immutable historical evidence.",
              f"The repaired covariance/provenance implementation was revalidated on exact-clean head `{MEASUREMENT[:8]}...` using Tesla P100: CuPy and Torch each pass all 26 estimator covariance cases plus six direct public covariance primitives (32/32 per backend), including full-rank ill-conditioned HC0/HC2/HC3/DK, and the synchronized performance run includes the bounded `N=10,000`, `k=2`, `T=200` QS scenario. Earlier `c151550a...` and `9c0b3050...` artifacts remain immutable historical evidence.",
              count=1,
          )
          cn_panel = ROOT / "docs/cn/models/panel.md"
          replace_required(
              cn_panel,
              "Ready-triggered ordered-categorical chronology 修复已在 exact-clean head `c151550a...` 上重新完成 Tesla P100 验证：CuPy 与 Torch 各自通过全部 26 个 estimator covariance case 和 2 个 direct public covariance primitive，同步 performance rerun 也覆盖有界的 `N=10,000`、`k=2`、`T=200` QS 场景。此前 `9c0b3050...` 产物继续作为不可变历史证据保留。",
              f"修复后的 covariance/provenance 实现已在 exact-clean head `{MEASUREMENT[:8]}...` 上重新完成 Tesla P100 验证：CuPy 与 Torch 各自通过全部 26 个 estimator covariance case 和 6 个 direct public covariance primitive（每个 backend 32/32），包括 full-rank ill-conditioned HC0/HC2/HC3/DK；同步 performance 也覆盖有界的 `N=10,000`、`k=2`、`T=200` QS 场景。此前 `c151550a...` 与 `9c0b3050...` 产物继续作为不可变历史证据保留。",
              count=1,
          )

          review = ROOT / "dev/reviews/pr126_physical_gpu_validation.md"
          review.write_text(f'''# PR #126 Panel Stage C physical GPU validation\n\n## Current physical acceptance status\n\n**PHYSICAL_GPU_ACCEPTED** for the repaired numerical/validator contract.\n\nFresh Tesla P100 evidence was measured from exact clean implementation SHA `{MEASUREMENT}`. The subsequent artifact commit `{ARTIFACT_COMMIT}` adds only the two raw evidence files; the canonical-promotion commit changes parser/manifest/coverage/tests/docs/generated benchmark assets only. It does not change `statgpu/panel/**`, `dev/benchmarks/validate_panel_stage_c_gpu.py`, or `dev/benchmarks/benchmark_panel_stage_c_covariance.py`. Therefore the measurement remains applicable under `RELEASING.md`.\n\n## Correctness and backend-provenance evidence\n\n- path: `results/pr126_p100/panel_stage_c_gpu_validation_aad53587.json`\n- measurement SHA: `{MEASUREMENT}`\n- artifact repository commit: `{ARTIFACT_COMMIT}`\n- Git blob: `{validation_blob}`\n- SHA-256: `{validation_sha}`\n- GPU: Tesla P100-SXM2-16GB\n- result: CuPy 32/32 and Torch 32/32 = 26 estimator covariance cases + 6 direct public primitives per backend\n- direct primitives: `cluster_group_debias`, `driscoll_kraay_qs`, `ill_conditioned_hc0`, `ill_conditioned_hc2`, `ill_conditioned_hc3`, `ill_conditioned_dk`\n- requested backend equals the backend persisted at the numerical fit boundary; no numerical CPU fallback was observed\n\n## Synchronized performance evidence\n\n- path: `results/pr126_p100/panel_stage_c_performance_aad53587.json`\n- measurement SHA: `{MEASUREMENT}`\n- artifact repository commit: `{ARTIFACT_COMMIT}`\n- Git blob: `{performance_blob}`\n- SHA-256: `{performance_sha}`\n- GPU: Tesla P100-SXM2-16GB for both CuPy and Torch\n- rows: 58 = 54 base rows + 4 high-T QS rows\n- timing scope: synchronized end-to-end estimator fit\n- high-T scenario: `N=10,000`, `k=2`, `T=200`\n- no speedup claim or CPU-baseline claim is made\n\n## Superseded historical evidence\n\nThe prior `c151550a...` and `9c0b3050...` correctness/performance artifacts remain immutable audit history but are not current acceptance sources. The current canonical source contract is the fresh `aad53587...` measurement above.\n\n## Merge-readiness boundary\n\nThe physical gate is closed. Merge readiness still requires all permanent hosted workflows to be green on the final metadata/promotion head and a fresh review with no unresolved CRITICAL/HIGH/relevant-MEDIUM finding.\n''', encoding="utf-8")

          print("validation_sha256", validation_sha)
          print("performance_sha256", performance_sha)
          print("validation_source_id", validation_id)
          print("performance_source_id", performance_id)
          PY
      - name: Regenerate deterministic benchmark frontend assets
        run: |
          python dev/benchmarks/generate_benchmark_data.py \
            --out frontend/public/data/benchmark_data.json \
            --report frontend/public/data/parse_report.json \
            --inventory-out frontend/public/data/source_inventory.json \
            --deterministic --strict-sources
          cd frontend
          npm ci
          npm run build
      - name: Validate promoted canonical evidence
        run: |
          python -m pytest \
            dev/tests/test_panel_stage_c_frontend_source.py \
            dev/tests/test_benchmark_catalog.py \
            dev/tests/test_benchmark_inventory_v2.py \
            dev/tests/test_frontend_domain_coverage.py \
            dev/tests/test_benchmark_frontend_data.py -q --tb=short
          python dev/benchmarks/generate_benchmark_data.py --check --strict-sources
      - name: Commit promotion and self-delete helper
        run: |
          rm .github/workflows/pr126-promote-fresh-evidence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          echo 'Promotion diff:'
          git status --short
          if git diff --cached --quiet; then
            echo 'No promotion changes to commit'
            exit 1
          fi
          git commit -m 'chore: promote PR126 fresh physical evidence'
          git push origin HEAD:agent/panel-p1-stage-c-covariance
