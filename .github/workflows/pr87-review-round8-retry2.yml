name: PR87 review round 8 retry 2

on:
  push:
    branches: [agent/maintenance-0.2.4-0.2.5]
    paths: [.github/workflows/pr87-review-round8-retry2.yml]

permissions:
  contents: write

jobs:
  local-full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply reviewed round 8 closure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source_workflow = Path('.github/workflows/pr87-review-round8-retry.yml')
          lines = source_workflow.read_text(encoding='utf-8').splitlines()
          start = lines.index("          python - <<'PY'") + 1
          end = lines.index("          PY", start)
          script = dedent('\n'.join(lines[start:end])) + '\n'
          original = '''    if count != 1:\n        raise RuntimeError(f'{path}: expected one anchor, found {count}')\n'''
          replacement = '''    if count != 1:\n        scoring_tuple = (\n            path == 'statgpu/linear_model/penalized/_penalized_cv.py'\n            and count == 2\n            and 'NotImplementedError, FloatingPointError, OverflowError' in old\n        )\n        if not scoring_tuple:\n            raise RuntimeError(f'{path}: expected one anchor, found {count}')\n'''
          if script.count(original) != 1:
              raise RuntimeError('retry workflow replace_once definition changed')
          script = script.replace(original, replacement, 1)
          exec(compile(script, str(source_workflow), 'exec'), {'__name__': '__main__'})
          PY
      - name: Install full validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation,formula]"
          python -m pip install ruff
      - name: Re-run previously failing contracts
        run: |
          python -m pytest -q \
            dev/tests/test_maintenance_024_025.py::test_solver_weight_reduction_is_computed_once \
            dev/tests/test_maintenance_024_025.py::test_penalized_cv_does_not_substitute_mse_for_non_gaussian_loss \
            dev/tests/test_maintenance_024_025.py::test_penalized_cv_squared_error_emergency_fallback_preserves_weights \
            dev/tests/test_pr80_target_transfer_overflow_cache.py::test_successful_public_fit_resets_state_once \
            dev/tests/test_pr87_code_review_fix_cycle.py
      - name: Run complete CPU test tree
        run: python -m pytest dev/tests -q --tb=short
      - name: Run documentation contracts
        shell: bash
        run: |
          python dev/validation/fix_docs_links.py --check
          python dev/validation/check_docs_contracts.py
      - name: Run compile and high-signal static gates
        shell: bash
        run: |
          python -m compileall -q statgpu dev/validation dev/benchmarks
          ruff check \
            statgpu/_base.py \
            statgpu/glm_core/_irls.py \
            statgpu/glm_core/_family.py \
            statgpu/glm_core/_validation.py \
            statgpu/solvers/_utils.py \
            statgpu/linear_model/wrappers/_logistic.py \
            statgpu/linear_model/penalized/_penalized_cv.py \
            --select F821,E9,F63,F7,F82
          git diff --check
          python -m pytest --collect-only -q >/dev/null
      - name: Commit local-full closure and self-delete
        shell: bash
        run: |
          rm .github/workflows/pr87-review-round8-local-full.yml
          rm .github/workflows/pr87-review-round8-retry.yml
          rm .github/workflows/pr87-review-round8-retry2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add statgpu dev/tests docs .github/workflows/pr87-review-round8-local-full.yml .github/workflows/pr87-review-round8-retry.yml .github/workflows/pr87-review-round8-retry2.yml
          git commit -m "fix: close PR87 local review gates"
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
