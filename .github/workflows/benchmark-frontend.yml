name: Website and Benchmark Frontend

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/benchmark-frontend.yml'
      - '.node-version'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'docs/**'
      - 'frontend/**'
      - 'dev/benchmarks/**'
      - 'dev/tests/test_benchmark_frontend_data.py'
      - 'dev/tests/test_benchmark_catalog.py'
      - 'dev/tests/test_benchmark_inventory_v2.py'
      - 'dev/tests/test_benchmark_cv_source.py'
      - 'dev/tests/test_cv_runner_instrumentation.py'
      - 'dev/tests/test_frontend_contracts.py'
      - 'dev/tests/test_frontend_cv_determinism.py'
      - 'dev/tests/test_frontend_domain_coverage.py'
      - 'dev/tests/test_panel_stage_b_frontend_source.py'
      - 'dev/tests/test_panel_stage_b_applicable_hausman_parser.py'
      - 'dev/tests/test_panel_stage_c_frontend_source.py'
      - 'dev/tests/fixtures/benchmark_frontend/**'
      - 'results/**/*.json'
      - 'pyproject.toml'
  pull_request:
    paths:
      - '.github/workflows/benchmark-frontend.yml'
      - '.node-version'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'docs/**'
      - 'frontend/**'
      - 'dev/benchmarks/**'
      - 'dev/tests/test_*frontend*.py'
      - 'dev/tests/test_benchmark_*.py'
      - 'dev/tests/test_cv_runner_instrumentation.py'
      - 'dev/tests/test_panel_stage_*frontend_source.py'
      - 'dev/tests/fixtures/benchmark_frontend/**'
      - 'results/**/*.json'
      - 'pyproject.toml'
  workflow_dispatch:

concurrency:
  group: website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-data:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validation dependencies
        run: python -m pip install -U pip pytest 'jsonschema[format]'
      - name: Run generator and parser tests
        run: |
          pytest \
            dev/tests/test_benchmark_frontend_data.py \
            dev/tests/test_benchmark_catalog.py \
            dev/tests/test_benchmark_inventory_v2.py \
            dev/tests/test_benchmark_cv_source.py \
            dev/tests/test_cv_runner_instrumentation.py \
            dev/tests/test_frontend_contracts.py \
            dev/tests/test_frontend_cv_determinism.py \
            dev/tests/test_frontend_domain_coverage.py \
            dev/tests/test_panel_stage_b_frontend_source.py \
            dev/tests/test_panel_stage_b_applicable_hausman_parser.py \
            dev/tests/test_panel_stage_c_frontend_source.py -v
      - name: Validate canonical generator inputs
        run: python dev/benchmarks/generate_benchmark_data.py --check --strict-sources

  site:
    runs-on: ubuntu-latest
    needs: python-data
    permissions:
      contents: read
    env:
      STATGPU_SITE_BASE: /statgpu/
      STATGPU_SITE_URL: https://thehiddenobserver.github.io/statgpu/
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Verify pinned npm version
        run: test "$(npm --version)" = "11.6.2"
      - name: Install build dependencies
        run: |
          python -m pip install 'jsonschema[format]'
          npm ci
          npm ci --prefix frontend
      - name: Generate deployment benchmark bundle
        run: |
          python dev/benchmarks/generate_benchmark_data.py \
            --out frontend/public/data/benchmark_data.json \
            --report frontend/public/data/parse_report.json \
            --inventory-out frontend/public/data/source_inventory.json \
            --deterministic --strict-sources
      - name: Typecheck dashboard
        run: npm run typecheck --prefix frontend
      - name: Build and verify assembled site
        run: npm run site:build
      - name: Capture project-path build hash
        run: npm run --silent site:hash > "${RUNNER_TEMP}/site-hash-first"
      - name: Verify custom-domain root base
        env:
          STATGPU_SITE_BASE: /
          STATGPU_SITE_URL: https://statgpu.example/
        run: npm run site:build
      - name: Restore and verify reproducible project-path build
        run: |
          npm run site:build
          npm run --silent site:hash > "${RUNNER_TEMP}/site-hash-second"
          diff -u "${RUNNER_TEMP}/site-hash-first" "${RUNNER_TEMP}/site-hash-second"
      - name: Verify tracked tree remains clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Install browser engines
        run: npm exec --prefix frontend playwright install --with-deps chromium firefox webkit
      - name: Run dashboard regression suite
        run: npm run test:e2e --prefix frontend
      - name: Run assembled production QA
        run: npm run test:e2e:production --prefix frontend
      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-playwright-reports
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 30
      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .site-dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
