name: Benchmark Frontend CI

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/benchmark-frontend.yml'
      - 'dev/benchmarks/**'
      - 'dev/tests/test_benchmark_frontend_data.py'
      - 'dev/tests/test_benchmark_catalog.py'
      - 'dev/tests/test_benchmark_inventory_v2.py'
      - 'dev/tests/test_benchmark_cv_source.py'
      - 'dev/tests/test_cv_runner_instrumentation.py'
      - 'dev/tests/test_frontend_contracts.py'
      - 'dev/tests/test_frontend_cv_determinism.py'
      - 'dev/tests/test_frontend_domain_coverage.py'
      - 'dev/tests/test_panel_stage_b_frontend_source.py'
      - 'dev/tests/fixtures/benchmark_frontend/**'
      - 'frontend/**'
      - 'docs/assets/benchmarks/**'
      - 'results/benchmark_frontend_sources/**'
      - 'pyproject.toml'
  pull_request:
    paths:
      - '.github/workflows/benchmark-frontend.yml'
      - 'dev/benchmarks/**'
      - 'dev/tests/test_benchmark_frontend_data.py'
      - 'dev/tests/test_benchmark_catalog.py'
      - 'dev/tests/test_benchmark_inventory_v2.py'
      - 'dev/tests/test_benchmark_cv_source.py'
      - 'dev/tests/test_cv_runner_instrumentation.py'
      - 'dev/tests/test_frontend_contracts.py'
      - 'dev/tests/test_frontend_cv_determinism.py'
      - 'dev/tests/test_frontend_domain_coverage.py'
      - 'dev/tests/test_panel_stage_b_frontend_source.py'
      - 'dev/tests/fixtures/benchmark_frontend/**'
      - 'frontend/**'
      - 'docs/assets/benchmarks/**'
      - 'results/benchmark_frontend_sources/**'
      - 'pyproject.toml'

concurrency:
  group: benchmark-frontend-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-data:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -U pip pytest 'jsonschema[format]'
      - name: Run generator and parser tests
        run: |
          pytest \
            dev/tests/test_benchmark_frontend_data.py \
            dev/tests/test_benchmark_catalog.py \
            dev/tests/test_benchmark_inventory_v2.py \
            dev/tests/test_benchmark_cv_source.py \
            dev/tests/test_cv_runner_instrumentation.py \
            dev/tests/test_frontend_contracts.py \
            dev/tests/test_frontend_cv_determinism.py \
            dev/tests/test_frontend_domain_coverage.py \
            dev/tests/test_panel_stage_b_frontend_source.py -v
      - name: Validate generator output
        run: python dev/benchmarks/generate_benchmark_data.py --check --strict-sources

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Reject committed frontend artifacts
        run: |
          if git -C "$GITHUB_WORKSPACE" ls-files \
            'frontend/node_modules/**' \
            'frontend/test-results/**' \
            'frontend/playwright-report/**' | grep -q .; then
            echo "Generated frontend dependencies/test artifacts must not be committed."
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  staleness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install schema validation dependency
        run: python -m pip install 'jsonschema[format]'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate data (deterministic)
        run: |
          python dev/benchmarks/generate_benchmark_data.py \
            --out frontend/public/data/benchmark_data.json \
            --report frontend/public/data/parse_report.json \
            --inventory-out frontend/public/data/source_inventory.json \
            --deterministic --strict-sources
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Check staleness
        run: |
          changes="$(git status --porcelain -- frontend/public/data docs/assets/benchmarks)"
          if [ -n "$changes" ]; then
            echo "Generated benchmark assets are stale:"
            printf '%s\n' "$changes"
            git diff -- frontend/public/data docs/assets/benchmarks
            exit 1
          fi
          echo "OK — generated benchmark assets are current"
      - name: Upload generated bundle for stale-asset diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-generated-assets
          path: |
            frontend/public/data/
            docs/assets/benchmarks/
          retention-days: 7

  frontend-e2e:
    runs-on: ubuntu-latest
    needs: [frontend, staleness]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

  production-qa:
    runs-on: ubuntu-latest
    needs: [frontend, staleness]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Test committed docs deployment in Chromium, Firefox, and WebKit
        run: npm run test:e2e:production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-production-report
          path: frontend/playwright-report/
          retention-days: 30
