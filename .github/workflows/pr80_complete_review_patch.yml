name: PR80 Complete Review Patch

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'TheHiddenObserver/statgpu' && github.head_ref == 'codex/survival-gpu-completion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/survival-gpu-completion
      - name: Apply final review fixes
        run: python dev/reviews/pr80_apply_complete_review_patch.py
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Review fixes already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            statgpu/survival/_cox_score.py \
            statgpu/survival/_risk_sets.py \
            statgpu/survival/_cox_cv.py \
            statgpu/linear_model/penalized/_penalized_cox.py \
            dev/tests/test_pr80_complete_review_cycle.py
          git commit -m "Fix final Cox review findings"
          git push origin HEAD:codex/survival-gpu-completion
