name: PR126 promote 5ed763be Stage C evidence

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - '.github/workflows/pr126-promote-5ed763be-evidence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install promotion validation dependencies
        run: python -m pip install pytest 'jsonschema[format]'
      - name: Promote 5ed763be physical evidence contracts
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          from pathlib import Path

          ROOT = Path.cwd()
          MEASUREMENT = "5ed763be2a331e6dc988ac133e79f0484d4cdebd"
          ARTIFACT_COMMIT = "07ab76db7b9454e51683bbe4c1a2c2dc54ce58c2"
          OLD_MEASUREMENT = "aad53587c9611da0e71a676e86ef32d9f6403f5c"
          OLD_VALIDATION_ID = "panel-stage-c-validation-pr126-20260810-aab3ac61315b"
          OLD_PERFORMANCE_ID = "panel-stage-c-performance-pr126-20260810-99208f9276b9"
          VALIDATION_PATH = ROOT / "results/pr126_p100/panel_stage_c_gpu_validation_5ed763be.json"
          PERFORMANCE_PATH = ROOT / "results/pr126_p100/panel_stage_c_performance_5ed763be.json"
          OLD_VALIDATION_PATH = "results/pr126_p100/panel_stage_c_gpu_validation_aad53587.json"
          OLD_PERFORMANCE_PATH = "results/pr126_p100/panel_stage_c_performance_aad53587.json"
          NEW_VALIDATION_PATH = "results/pr126_p100/panel_stage_c_gpu_validation_5ed763be.json"
          NEW_PERFORMANCE_PATH = "results/pr126_p100/panel_stage_c_performance_5ed763be.json"

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def blob(path: Path) -> str:
              return subprocess.check_output(["git", "hash-object", str(path)], text=True).strip()

          def write_json(path: Path, obj) -> None:
              path.write_text(json.dumps(obj, indent=2) + "\n", encoding="utf-8")

          def replace_required(path: Path, old: str, new: str, *, count: int | None = None) -> None:
              text = path.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual == 0:
                  raise RuntimeError(f"expected text not found in {path}: {old[:120]!r}")
              if count is not None and actual != count:
                  raise RuntimeError(f"unexpected replacement count in {path}: {actual} != {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", f"{MEASUREMENT}..{ARTIFACT_COMMIT}"], text=True
          ).splitlines()
          assert changed == [NEW_PERFORMANCE_PATH, NEW_VALIDATION_PATH] or changed == [NEW_VALIDATION_PATH, NEW_PERFORMANCE_PATH], changed

          validation = json.loads(VALIDATION_PATH.read_text(encoding="utf-8"))
          performance = json.loads(PERFORMANCE_PATH.read_text(encoding="utf-8"))
          assert validation["git_sha"] == MEASUREMENT
          assert validation["working_tree_clean"] is True
          assert validation["status"] == "success"
          assert validation["case_count_per_backend"] == 26
          assert validation["public_primitive_count_per_backend"] == 6
          assert set(validation["backends"]) == {"cupy", "torch"}
          assert validation["environment"]["gpu"] == "Tesla P100-SXM2-16GB"
          expected_primitives = {
              "cluster_group_debias",
              "driscoll_kraay_qs",
              "ill_conditioned_hc0",
              "ill_conditioned_hc2",
              "ill_conditioned_hc3",
              "ill_conditioned_dk",
          }
          for backend in ("cupy", "torch"):
              payload = validation["backends"][backend]
              assert payload["status"] == "success"
              assert payload["requested_backend"] == backend
              assert len(payload["cases"]) == 26
              assert set(payload["public_primitives"]) == expected_primitives
              assert all(item["status"] == "success" for item in payload["cases"].values())
              assert all(item["status"] == "success" for item in payload["public_primitives"].values())
              assert all(item["executed_backend"] == backend for item in payload["cases"].values())
              assert all(item["executed_backend"] == backend for item in payload["public_primitives"].values())

          assert performance["git_sha"] == MEASUREMENT
          assert performance["working_tree_clean"] is True
          assert performance["benchmark"] == "panel_stage_c_covariance_fit_overhead"
          assert performance["timing_scope"] == "synchronized end-to-end estimator fit"
          assert performance["high_t_scale"] == "10000x2x200"
          assert len(performance["rows"]) == 58
          assert {row["backend"] for row in performance["rows"]} == {"cupy", "torch"}
          assert set(performance["environment"]["gpu_by_backend"].values()) == {"Tesla P100-SXM2-16GB"}
          base = [row for row in performance["rows"] if row["scenario"] == "base"]
          high_t = [row for row in performance["rows"] if row["scenario"] == "high_t_qs"]
          assert len(base) == 54
          assert len(high_t) == 4
          assert {(row["n_samples"], row["n_features"], row["n_times"]) for row in base} == {
              (10000, 2, 20), (100000, 2, 20), (100000, 10, 20)
          }
          assert {(row["n_samples"], row["n_features"], row["n_times"]) for row in high_t} == {(10000, 2, 200)}
          assert {row["case"] for row in high_t} == {"pooled_dk_qs", "panel_entity_dk_qs"}
          assert {row["backend"] for row in high_t} == {"cupy", "torch"}
          assert all(row["median_seconds"] > 0 for row in performance["rows"])

          validation_sha = sha256(VALIDATION_PATH)
          performance_sha = sha256(PERFORMANCE_PATH)
          validation_blob = blob(VALIDATION_PATH)
          performance_blob = blob(PERFORMANCE_PATH)
          validation_id = f"panel-stage-c-validation-pr126-20260810-{validation_sha[:12]}"
          performance_id = f"panel-stage-c-performance-pr126-20260810-{performance_sha[:12]}"

          parser = ROOT / "dev/benchmarks/frontend_data/parsers/panel_stage_c.py"
          replace_required(
              parser,
              f'_MEASUREMENT_SHA = "{OLD_MEASUREMENT}"',
              f'_MEASUREMENT_SHA = "{MEASUREMENT}"',
              count=1,
          )

          manifest_path = ROOT / "dev/benchmarks/frontend_sources.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          stage_c_sources = {
              source["parser"]: source
              for source in manifest["sources"]
              if source["parser"] in {"panel_stage_c_physical_validation", "panel_stage_c_performance"}
          }
          assert set(stage_c_sources) == {"panel_stage_c_physical_validation", "panel_stage_c_performance"}
          vsrc = stage_c_sources["panel_stage_c_physical_validation"]
          psrc = stage_c_sources["panel_stage_c_performance"]
          assert vsrc["source_id"] == OLD_VALIDATION_ID
          assert psrc["source_id"] == OLD_PERFORMANCE_ID
          assert vsrc["path"] == OLD_VALIDATION_PATH
          assert psrc["path"] == OLD_PERFORMANCE_PATH
          vsrc.update({
              "source_id": validation_id,
              "path": NEW_VALIDATION_PATH,
              "sha256": validation_sha,
              "measurement_git_sha": MEASUREMENT,
              "raw_git_sha": MEASUREMENT,
              "provenance_note": (
                  "Final PR #126 Stage-C post-review exact-clean-head P100 correctness/backend-provenance evidence. "
                  f"Artifact repository commit {ARTIFACT_COMMIT}; Git blob {validation_blob}; "
                  "26 estimator cases plus six direct public covariance primitives per CuPy/Torch backend "
                  "(32/32 each), including full-rank ill-conditioned HC0/HC2/HC3/Driscoll-Kraay, with "
                  "requested/executed backend identity and no numerical CPU fallback. The prior aad53587, "
                  "c151550a, and 9c0b3050 measurements remain immutable historical evidence."
              ),
          })
          psrc.update({
              "source_id": performance_id,
              "path": NEW_PERFORMANCE_PATH,
              "sha256": performance_sha,
              "measurement_git_sha": MEASUREMENT,
              "raw_git_sha": MEASUREMENT,
              "provenance_note": (
                  "Final PR #126 Stage-C post-review synchronized end-to-end P100 timing evidence. "
                  f"Artifact repository commit {ARTIFACT_COMMIT}; Git blob {performance_blob}; "
                  "58 synchronized rows cover three base scales plus the bounded N=10000, k=2, T=200 QS "
                  "all-lag scenario on both CuPy and Torch. No speedup claim or CPU baseline is encoded. "
                  "The prior aad53587, c151550a, and 9c0b3050 timing artifacts remain immutable historical evidence."
              ),
          })
          write_json(manifest_path, manifest)

          coverage_path = ROOT / "dev/benchmarks/benchmark_coverage_matrix.json"
          coverage = json.loads(coverage_path.read_text(encoding="utf-8"))
          panel_row = next(row for row in coverage["capabilities"] if row["capability_id"] == "panel-estimation")
          panel_row["source_ids"] = [
              validation_id if source_id == OLD_VALIDATION_ID else
              performance_id if source_id == OLD_PERFORMANCE_ID else source_id
              for source_id in panel_row["source_ids"]
          ]
          panel_row["disposition"] = (
              "June timing rows cover aligned PanelOLS and RandomEffects; PR #122 provides canonical Stage-B "
              "diagnostic/physical validation. PR #126 final post-review exact-clean P100 evidence at 5ed763be "
              "provides canonical Stage-C CuPy/Torch correctness for 26 estimator covariance integrations plus "
              "six direct public primitives per backend, including ill-conditioned HC0/HC2/HC3/DK, and "
              "synchronized timing for three base scales plus a bounded N=10,000, k=2, T=200 QS all-lag "
              "scenario. The aad53587, c151550a, and 9c0b3050 artifacts are retained only as historical "
              "evidence. No Stage-C speedup claim is made."
          )
          write_json(coverage_path, coverage)

          frontend_test = ROOT / "dev/tests/test_panel_stage_c_frontend_source.py"
          replace_required(frontend_test, OLD_VALIDATION_PATH.split("/")[-1], NEW_VALIDATION_PATH.split("/")[-1], count=1)
          replace_required(frontend_test, OLD_PERFORMANCE_PATH.split("/")[-1], NEW_PERFORMANCE_PATH.split("/")[-1], count=1)

          catalog_test = ROOT / "dev/tests/test_benchmark_catalog.py"
          replace_required(catalog_test, OLD_VALIDATION_PATH, NEW_VALIDATION_PATH, count=1)
          replace_required(catalog_test, OLD_PERFORMANCE_PATH, NEW_PERFORMANCE_PATH, count=1)
          replace_required(catalog_test, OLD_VALIDATION_ID, validation_id)
          replace_required(catalog_test, OLD_PERFORMANCE_ID, performance_id)
          text = catalog_test.read_text(encoding="utf-8")
          marker = '    assert prior_performance["registered"] is False\n'
          if text.count(marker) != 1:
              raise RuntimeError("Stage-C historical artifact marker drifted")
          extra = (
              marker
              + '\n    aad_validation = next(\n'
              + '        entry for entry in entries\n'
              + f'        if entry["path"] == "{OLD_VALIDATION_PATH}"\n'
              + '    )\n'
              + '    aad_performance = next(\n'
              + '        entry for entry in entries\n'
              + f'        if entry["path"] == "{OLD_PERFORMANCE_PATH}"\n'
              + '    )\n'
              + '    assert aad_validation["classification"] == "historical_or_excluded"\n'
              + '    assert aad_validation["registered"] is False\n'
              + '    assert aad_performance["classification"] == "historical_or_excluded"\n'
              + '    assert aad_performance["registered"] is False\n'
          )
          catalog_test.write_text(text.replace(marker, extra, 1), encoding="utf-8")

          for doc in (
              ROOT / "CHANGELOG.md",
              ROOT / "docs/en/changelog.md",
              ROOT / "docs/cn/changelog.md",
          ):
              text = doc.read_text(encoding="utf-8")
              if OLD_MEASUREMENT not in text:
                  raise RuntimeError(f"old Stage-C measurement missing from {doc}")
              text = text.replace(OLD_MEASUREMENT, MEASUREMENT)
              text = text.replace(
                  "Earlier `c151550a...` and `9c0b3050...`",
                  "Earlier `aad53587...`, `c151550a...`, and `9c0b3050...`",
              )
              text = text.replace(
                  "此前 `c151550a...` 与 `9c0b3050...`",
                  "此前 `aad53587...`、`c151550a...` 与 `9c0b3050...`",
              )
              doc.write_text(text, encoding="utf-8")

          for doc in (ROOT / "docs/en/models/panel.md", ROOT / "docs/cn/models/panel.md"):
              text = doc.read_text(encoding="utf-8")
              if "aad53587..." not in text:
                  raise RuntimeError(f"old Stage-C short measurement missing from {doc}")
              text = text.replace("aad53587...", "5ed763be...")
              text = text.replace(
                  "Earlier `c151550a...` and `9c0b3050...`",
                  "Earlier `aad53587...`, `c151550a...`, and `9c0b3050...`",
              )
              text = text.replace(
                  "此前 `c151550a...` 与 `9c0b3050...`",
                  "此前 `aad53587...`、`c151550a...` 与 `9c0b3050...`",
              )
              doc.write_text(text, encoding="utf-8")

          review = ROOT / "dev/reviews/pr126_physical_gpu_validation.md"
          review.write_text(f'''# PR #126 Panel Stage C physical GPU validation\n\n## Current physical acceptance status\n\n**PHYSICAL_GPU_ACCEPTED** for the final post-review numerical/validator contract.\n\nFresh Tesla P100 evidence was measured from exact clean review/status SHA `{MEASUREMENT}`. Its production-source parent checkpoint is `86bed6feb8f97ba80dbb58876238b972e60711f8`; the only commit between that production checkpoint and `{MEASUREMENT}` changes this review document. The artifact commit `{ARTIFACT_COMMIT}` adds only the two raw evidence files. The canonical-promotion commit changes frontend parser metadata, manifest/coverage/tests/docs/generated benchmark assets only; it does not change `statgpu/panel/**`, `dev/benchmarks/validate_panel_stage_c_gpu.py`, or `dev/benchmarks/benchmark_panel_stage_c_covariance.py`. Therefore the measurement remains applicable under `RELEASING.md`.\n\n## Correctness and backend-provenance evidence\n\n- path: `{NEW_VALIDATION_PATH}`\n- measurement SHA: `{MEASUREMENT}`\n- artifact repository commit: `{ARTIFACT_COMMIT}`\n- Git blob: `{validation_blob}`\n- SHA-256: `{validation_sha}`\n- GPU: Tesla P100-SXM2-16GB\n- result: CuPy 32/32 and Torch 32/32 = 26 estimator covariance cases + 6 direct public primitives per backend\n- direct primitives: `cluster_group_debias`, `driscoll_kraay_qs`, `ill_conditioned_hc0`, `ill_conditioned_hc2`, `ill_conditioned_hc3`, `ill_conditioned_dk`\n- requested backend equals the backend persisted at the numerical fit boundary for every correctness case; no numerical CPU fallback was observed\n- the runner's package metadata records `cupy: null`; this is the same pre-existing package-name discovery limitation present in the previously accepted `aad53587...` artifact and does not replace executed-backend provenance\n\n## Synchronized performance evidence\n\n- path: `{NEW_PERFORMANCE_PATH}`\n- measurement SHA: `{MEASUREMENT}`\n- artifact repository commit: `{ARTIFACT_COMMIT}`\n- Git blob: `{performance_blob}`\n- SHA-256: `{performance_sha}`\n- GPU: Tesla P100-SXM2-16GB for both CuPy and Torch\n- rows: 58 = 54 base rows + 4 high-T QS rows\n- timing scope: synchronized end-to-end estimator fit\n- high-T scenario: `N=10,000`, `k=2`, `T=200`\n- no speedup claim or CPU-baseline claim is made\n\n## Strict review status\n\nThe final production-source re-review found no unresolved CRITICAL, HIGH, or relevant MEDIUM issue in Stage-C scope. The last in-scope fixes covered RandomEffects formula matrix depth, transformed-fit-space external HC baselines, PooledOLS/BetweenOLS intercept metadata and explicit no-intercept rejection, documentation status, and robust-summary `z` labels. One older unresolved P2 inline thread about backend provenance is outdated because the implemented fit/runner contract now persists and validates the actually selected backend. A pre-existing FamaMacBeth formula-summary naming limitation remains outside Stage-C scope.\n\n## Superseded historical evidence\n\nThe prior `aad53587...`, `c151550a...`, and `9c0b3050...` correctness/performance artifacts remain immutable audit history but are not current acceptance sources. The current canonical source contract is the fresh `{MEASUREMENT[:8]}...` measurement above.\n\n## Merge-readiness boundary\n\nThe physical gate is closed. Merge readiness still requires all permanent hosted workflows to be green on the final promoted head and a final post-promotion review with no new CRITICAL/HIGH/relevant-MEDIUM finding. The PR remains Draft until an explicit Ready transition is requested.\n''', encoding="utf-8")

          print("validation_sha256", validation_sha)
          print("performance_sha256", performance_sha)
          print("validation_source_id", validation_id)
          print("performance_source_id", performance_id)
          print("validation_git_blob", validation_blob)
          print("performance_git_blob", performance_blob)
          PY
      - name: Regenerate deterministic benchmark frontend assets
        run: |
          python dev/benchmarks/generate_benchmark_data.py \
            --out frontend/public/data/benchmark_data.json \
            --report frontend/public/data/parse_report.json \
            --inventory-out frontend/public/data/source_inventory.json \
            --deterministic --strict-sources
          cd frontend
          npm ci
          npm run build
      - name: Validate promoted canonical evidence
        run: |
          python -m pytest \
            dev/tests/test_panel_stage_c_frontend_source.py \
            dev/tests/test_benchmark_catalog.py \
            dev/tests/test_benchmark_inventory_v2.py \
            dev/tests/test_frontend_domain_coverage.py \
            dev/tests/test_benchmark_frontend_data.py -q --tb=short
          python dev/benchmarks/generate_benchmark_data.py --check --strict-sources
      - name: Commit promotion and self-delete helper
        shell: bash
        run: |
          rm .github/workflows/pr126-promote-5ed763be-evidence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          echo 'Promotion diff:'
          git status --short
          if git diff --cached --quiet; then
            echo 'No promotion changes to commit'
            exit 1
          fi
          git commit -m 'chore: promote PR126 final 5ed763be physical evidence'
          git push origin HEAD:agent/panel-p1-stage-c-covariance
