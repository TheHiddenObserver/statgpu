name: PR126 currentness repair

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - '.github/workflows/pr126-currentness-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Guard lineage
        env:
          EXPECTED_PARENT: 1b20f7c43ee79088f6ca253ece9d16948e87b223
        run: |
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python validation dependency
        run: python -m pip install -U pytest 'jsonschema[format]'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Update canonical currentness snapshots
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('dev/tests/test_frontend_domain_coverage.py')
          text = path.read_text()
          replacements = {
              'assert len(manifest["sources"]) == 19': 'assert len(manifest["sources"]) == 21',
              'assert len(output["runs"]) == 2426': 'assert len(output["runs"]) == 2580',
              'assert report["runs_generated"] == 2426': 'assert report["runs_generated"] == 2580',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Regenerate deterministic benchmark data
        run: |
          python dev/benchmarks/generate_benchmark_data.py \
            --out frontend/public/data/benchmark_data.json \
            --report frontend/public/data/parse_report.json \
            --inventory-out frontend/public/data/source_inventory.json \
            --deterministic --strict-sources
      - name: Rebuild committed benchmark frontend
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Verify focused currentness contracts
        run: |
          python -m pytest \
            dev/tests/test_frontend_domain_coverage.py \
            dev/tests/test_panel_stage_c_frontend_source.py -q
          python dev/benchmarks/generate_benchmark_data.py --check --strict-sources
      - name: Guard frozen P100 evidence and change scope
        env:
          FROZEN_BASE: 1b20f7c43ee79088f6ca253ece9d16948e87b223
        run: |
          git diff --exit-code "$FROZEN_BASE" -- results/pr126_p100_fresh/
          python - <<'PY'
          import subprocess
          allowed = (
              'dev/tests/test_frontend_domain_coverage.py',
              'frontend/public/data/',
              'docs/assets/benchmarks/',
          )
          lines = subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines()
          changed = []
          for line in lines:
              path = line[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              if path == '.github/workflows/pr126-currentness-fix.yml':
                  continue
              changed.append(path)
              if not any(path == prefix or path.startswith(prefix) for prefix in allowed):
                  raise SystemExit(f'unexpected repair path: {path}')
          if 'dev/tests/test_frontend_domain_coverage.py' not in changed:
              raise SystemExit('expected domain-coverage snapshot update is missing')
          if not any(path.startswith('docs/assets/benchmarks/') for path in changed):
              raise SystemExit('expected docs benchmark rebuild is missing')
          print('validated repair paths:')
          print('\n'.join(changed))
          PY
      - name: Commit validated repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dev/tests/test_frontend_domain_coverage.py frontend/public/data docs/assets/benchmarks
          git diff --cached --check
          git commit -m 'test: synchronize PR126 benchmark promotion assets'
          git push origin HEAD:agent/panel-p1-stage-c-covariance
