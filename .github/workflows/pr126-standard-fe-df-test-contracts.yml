name: PR126 standard FE df test contracts once

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - .github/workflows/pr126-standard-fe-df-test-contracts.yml

permissions:
  contents: write

jobs:
  align-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Apply standard FE df test-contract cleanup
        run: python dev/validation/pr126_standard_fe_df_test_contracts_once.py
      - name: Install maintained focused environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" pytest statsmodels
          python -m pip install "torch==2.0.1+cpu" --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Run stale-contract regression gates
        run: |
          python -m pytest -q \
            dev/tests/test_panel_stage_b_diagnostics.py \
            dev/tests/test_panel_stage_b_fit_statistics.py \
            dev/tests/test_panel_stage_b_hausman_covariance.py \
            dev/tests/test_panel_stage_b_ready_review_regressions.py \
            dev/tests/test_panel_stage_b_torch_cpu.py \
            --tb=short
          python -m pytest -q dev/tests/test_panel_stage_c_fresh_df_rank_guard.py --tb=short
          git diff --check
      - name: Commit aligned tests and remove staging helpers
        run: |
          rm .github/workflows/pr126-standard-fe-df-test-contracts.yml
          rm dev/validation/pr126_standard_fe_df_test_contracts_once.py
          git config user.name "statgpu-review-fix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "test: align panel contracts with standard FE df"
          git push origin HEAD:agent/panel-p1-stage-c-covariance
