name: PR126 guarded round6 two-way prediction fix

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - '.github/workflows/pr126-round6-two-way-predict-fix.yml'

permissions:
  contents: write

jobs:
  two-way-predict:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pandas patsy
      - name: Apply exact two-way prediction identifiability fix
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected}, found {count}: {old!r}')
              p.write_text(text.replace(old, new, expected), encoding='utf-8')

          panel = 'statgpu/panel/_fixed_effects.py'
          old_guard = '''        if self._two_way_entity_components and self._two_way_time_components:\n            component_ids = set(self._two_way_entity_components.values()) | set(\n                self._two_way_time_components.values()\n            )\n            if len(component_ids) > 1:\n                n_rows = int(prediction.shape[0])\n                for row in range(n_rows):\n                    entity_value = None if entity_ids_np is None else entity_ids_np[row]\n                    time_value = None if time_ids_np is None else time_ids_np[row]\n                    entity_component = (\n                        None\n                        if entity_value is None\n                        else self._two_way_entity_components.get(entity_value)\n                    )\n                    time_component = (\n                        None\n                        if time_value is None\n                        else self._two_way_time_components.get(time_value)\n                    )\n                    # Both labels unknown preserves the historical zero-effect\n                    # fallback.  Once either stored FE is used, however, its\n                    # component-specific normalization is not identified unless\n                    # the other side is also known in the same component.\n                    if entity_component is None and time_component is None:\n                        continue\n                    if (\n                        entity_component is None\n                        or time_component is None\n                        or entity_component != time_component\n                    ):\n                        raise ValueError(\n                            "two-way fixed-effect prediction is not identified on a "\n                            "disconnected incidence graph unless known entity/time "\n                            "labels belong to the same component"\n                        )\n'''
          new_guard = '''        if self._two_way_entity_components and self._two_way_time_components:\n            n_rows = int(prediction.shape[0])\n            for row in range(n_rows):\n                entity_value = None if entity_ids_np is None else entity_ids_np[row]\n                time_value = None if time_ids_np is None else time_ids_np[row]\n                entity_component = (\n                    None\n                    if entity_value is None\n                    else self._two_way_entity_components.get(entity_value)\n                )\n                time_component = (\n                    None\n                    if time_value is None\n                    else self._two_way_time_components.get(time_value)\n                )\n                # The two-way decomposition is invariant to an opposite shift\n                # between entity and time effects, even when the incidence graph\n                # is connected.  Therefore an individual stored entity or time\n                # effect is not an identified prediction target.  A fitted FE\n                # contribution is usable only when both labels are known and the\n                # pair lies in one incidence component; if both are unseen, no\n                # fitted effect is used and the documented linear-only fallback\n                # remains available.\n                if entity_component is None and time_component is None:\n                    continue\n                if (\n                    entity_component is None\n                    or time_component is None\n                    or entity_component != time_component\n                ):\n                    raise ValueError(\n                        "two-way fixed-effect prediction is not identified unless "\n                        "both entity and time labels are known and belong to the "\n                        "same incidence component"\n                    )\n'''
          replace_exact(panel, old_guard, new_guard)

          test_path = 'dev/tests/test_panel_stage_c_final_review_fixes.py'
          # Update disconnected error expectation to the general two-way contract.
          text = Path(test_path).read_text(encoding='utf-8')
          old = 'match="not identified on a disconnected incidence graph"'
          count = text.count(old)
          if count != 5:
              raise SystemExit(f'expected 5 disconnected error matches, found {count}')
          Path(test_path).write_text(
              text.replace(old, 'match="both entity and time labels are known"'),
              encoding='utf-8',
          )

          marker = '''\ndef test_disconnected_two_way_prediction_rejects_cross_component_effect_sum():\n'''
          connected_test = '''\ndef test_connected_two_way_prediction_rejects_one_sided_or_known_unknown_effects():\n    rng = np.random.default_rng(2026082401)\n    # One connected cycle in the entity-time incidence graph.\n    entity = np.array([0, 0, 1, 1, 2, 2], dtype=np.int64)\n    time = np.array([0, 1, 1, 2, 2, 0], dtype=np.int64)\n    X = rng.normal(size=(entity.size, 1))\n    alpha = np.array([0.4, -0.3, 0.8])\n    tau = np.array([0.25, -0.15, 0.45])\n    y = 0.75 * X[:, 0] + alpha[entity] + tau[time]\n\n    model = PanelOLS(entity_effects=True, time_effects=True).fit(\n        X, y, entity_ids=entity, time_ids=time\n    )\n    assert model.fit_statistics_.metadata["diagnostic_df"]["incidence_components"] == 1\n    both_known = model.predict(\n        X[:1], entity_ids=np.array([0]), time_ids=np.array([1])\n    )\n    assert np.all(np.isfinite(both_known))\n\n    for kwargs in (\n        {"entity_ids": np.array([0])},\n        {"time_ids": np.array([0])},\n        {"entity_ids": np.array([0]), "time_ids": np.array([99])},\n        {"entity_ids": np.array([99]), "time_ids": np.array([0])},\n    ):\n        with pytest.raises(ValueError, match="both entity and time labels are known"):\n            model.predict(X[:1], **kwargs)\n\n    both_unseen = model.predict(\n        X[:1], entity_ids=np.array([98]), time_ids=np.array([99])\n    )\n    assert_allclose(both_unseen, X[:1] @ model.coef_, rtol=0, atol=3e-12)\n\n'''
          replace_exact(test_path, marker, connected_test + marker)

          runner = 'dev/benchmarks/validate_panel_stage_c_gpu.py'
          marker_runner = '''\ndef _disconnected_two_way_prediction_audit(backend):\n'''
          connected_audit = '''\ndef _connected_two_way_prediction_audit(backend):\n    """Audit two-way normalization guards on a connected incidence graph."""\n    rng = np.random.default_rng(20260824)\n    entity = np.array([0, 0, 1, 1, 2, 2], dtype=np.int64)\n    time = np.array([0, 1, 1, 2, 2, 0], dtype=np.int64)\n    X = rng.normal(size=(entity.size, 1)).astype(np.float64)\n    alpha = np.array([0.4, -0.3, 0.8], dtype=np.float64)\n    tau = np.array([0.25, -0.15, 0.45], dtype=np.float64)\n    y = (0.75 * X[:, 0] + alpha[entity] + tau[time]).astype(np.float64)\n    Xb, yb, eb, tb = _to_backend(X, y, entity, time, backend)\n    model = PanelOLS(\n        entity_effects=True, time_effects=True, cov_type="hc0", device=_device(backend)\n    ).fit(Xb, yb, entity_ids=eb, time_ids=tb)\n    if _backend_name(model) != backend:\n        raise AssertionError("connected prediction audit fit backend provenance drifted")\n    diagnostic = model.fit_statistics_.metadata.get("diagnostic_df", {})\n    if int(diagnostic.get("incidence_components", -1)) != 1:\n        raise AssertionError("connected prediction audit fixture is not connected")\n\n    both_known = model.predict(\n        Xb[:1], entity_ids=np.array([0]), time_ids=np.array([1])\n    )\n\n    def guarded(label, **kwargs):\n        try:\n            model.predict(Xb[:1], **kwargs)\n        except ValueError as exc:\n            if "both entity and time labels are known" not in str(exc):\n                raise AssertionError(\n                    f"{label}: wrong two-way prediction failure: {exc}"\n                ) from exc\n            return True\n        raise AssertionError(f"{label}: two-way partial-label prediction did not fail closed")\n\n    guards = {\n        "entity_only": guarded("entity_only", entity_ids=np.array([0])),\n        "time_only": guarded("time_only", time_ids=np.array([0])),\n        "known_entity_unknown_time": guarded(\n            "known_entity_unknown_time",\n            entity_ids=np.array([0]),\n            time_ids=np.array([99]),\n        ),\n        "unknown_entity_known_time": guarded(\n            "unknown_entity_known_time",\n            entity_ids=np.array([99]),\n            time_ids=np.array([0]),\n        ),\n    }\n    both_unseen = model.predict(\n        Xb[:1], entity_ids=np.array([98]), time_ids=np.array([99])\n    )\n    prediction_backend = getattr(model, "_predict_backend_name", None)\n    if prediction_backend != backend:\n        raise AssertionError("connected prediction audit backend provenance drifted")\n    return {\n        "status": "success",\n        "executed_backend": backend,\n        "prediction_backend": prediction_backend,\n        "both_known": _array(both_known),\n        "both_unseen": _array(both_unseen),\n        "guards": guards,\n    }\n\n'''
          replace_exact(runner, marker_runner, connected_audit + marker_runner)
          replace_exact(
              runner,
              '''    prediction_reference = _disconnected_two_way_prediction_audit("numpy")\n    level_constant_reference = _level_constant_contract_audit(\n''',
              '''    prediction_reference = _disconnected_two_way_prediction_audit("numpy")\n    connected_prediction_reference = _connected_two_way_prediction_audit("numpy")\n    level_constant_reference = _level_constant_contract_audit(\n''',
          )
          replace_exact(
              runner,
              '''        payload["prediction_contracts"]["two_way_disconnected"] = {\n            "status": "success",\n            "executed_backend": prediction_audit["executed_backend"],\n            "prediction_backend": prediction_audit["prediction_backend"],\n            "guards": dict(prediction_audit["guards"]),\n            "max_abs_differences": prediction_diffs,\n        }\n\n        level_constant_audit = _level_constant_contract_audit(\n''',
              '''        payload["prediction_contracts"]["two_way_disconnected"] = {\n            "status": "success",\n            "executed_backend": prediction_audit["executed_backend"],\n            "prediction_backend": prediction_audit["prediction_backend"],\n            "guards": dict(prediction_audit["guards"]),\n            "max_abs_differences": prediction_diffs,\n        }\n\n        connected_audit = _connected_two_way_prediction_audit(backend)\n        if connected_audit["executed_backend"] != backend:\n            raise AssertionError("connected prediction fit backend provenance drifted")\n        if connected_audit["prediction_backend"] != backend:\n            raise AssertionError("connected prediction backend provenance drifted")\n        if not all(connected_audit["guards"].values()):\n            raise AssertionError("connected prediction partial-label guards did not fail closed")\n        connected_diffs = {}\n        for field in ("both_known", "both_unseen"):\n            np.testing.assert_allclose(\n                connected_audit[field],\n                connected_prediction_reference[field],\n                rtol=args.rtol,\n                atol=args.atol,\n                err_msg=f"two_way_connected_prediction.{field}",\n            )\n            connected_diffs[field] = _max_abs(\n                connected_audit[field], connected_prediction_reference[field]\n            )\n        payload["prediction_contracts"]["two_way_connected_partial_labels"] = {\n            "status": "success",\n            "executed_backend": connected_audit["executed_backend"],\n            "prediction_backend": connected_audit["prediction_backend"],\n            "guards": dict(connected_audit["guards"]),\n            "max_abs_differences": connected_diffs,\n        }\n\n        level_constant_audit = _level_constant_contract_audit(\n''',
          )

          # Hosted test directly executes the connected audit too.
          replace_exact(
              test_path,
              '''    audit = module._disconnected_two_way_prediction_audit("numpy")\n    assert audit["executed_backend"] == "numpy"\n''',
              '''    connected_audit = module._connected_two_way_prediction_audit("numpy")\n    assert connected_audit["status"] == "success"\n    assert connected_audit["executed_backend"] == "numpy"\n    assert connected_audit["prediction_backend"] == "numpy"\n    assert all(connected_audit["guards"].values())\n    assert np.all(np.isfinite(connected_audit["both_known"]))\n    assert np.all(np.isfinite(connected_audit["both_unseen"]))\n\n    audit = module._disconnected_two_way_prediction_audit("numpy")\n    assert audit["executed_backend"] == "numpy"\n''',
          )

          # Stable user-facing contract; remove the misleading implication that
          # one-sided FE prediction is identified on connected graphs.
          en = 'docs/en/models/panel.md'
          replace_exact(
              en,
              '''If the observed entity-time incidence graph is disconnected, a prediction that uses a stored fixed effect is identified only when both entity and time labels are known and belong to the same component; cross-component pairs and one-sided/known-plus-unknown effect combinations raise instead of exposing arbitrary component normalizations. If all supplied fixed-effect labels are unseen, the historical zero-effect fallback remains the linear-only prediction.''',
              '''For any fitted two-way fixed-effect model, a prediction that uses stored fixed effects is identified only when both entity and time labels are known; the pair must also belong to the same incidence component. One-sided labels, known-plus-unknown pairs, and cross-component pairs fail closed rather than exposing arbitrary fixed-effect normalizations. If both fixed-effect labels are unseen, the historical zero-effect fallback remains the linear-only prediction.''',
          )
          cn = 'docs/cn/models/panel.md'
          replace_exact(
              cn,
              '''若已观察 entity-time incidence graph 不连通，只要 prediction 使用了已拟合 fixed effect，就要求 entity/time 两侧都为已知 label 且属于同一 component；跨 component、单边 label、或“已知一侧 + 未知另一侧”的组合都会明确报错，避免暴露任意 component normalization。若所提供的 fixed-effect label 全部未见过，则仍保留历史 zero-effect fallback，仅返回 linear prediction。''',
              '''对于任何已拟合的 two-way fixed-effect model，只要 prediction 使用 stored fixed effects，就要求 entity/time 两侧 label 都已知，并且二者属于同一 incidence component。单边 label、“已知一侧 + 未知另一侧”以及跨 component 组合都会 fail closed，避免暴露任意 fixed-effect normalization。若两侧 fixed-effect label 都未见过，则仍保留历史 zero-effect fallback，仅返回 linear prediction。''',
          )
          PY
      - name: Run focused prediction regressions
        run: |
          python -m pytest \
            dev/tests/test_panel_stage_c_final_review_fixes.py \
            dev/tests/test_panel_stage_a_golden.py \
            -q --tb=short
      - name: Verify scope and commit without temporary workflow
        run: |
          git rm .github/workflows/pr126-round6-two-way-predict-fix.yml
          python - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/pr126-round6-two-way-predict-fix.yml',
              'statgpu/panel/_fixed_effects.py',
              'dev/benchmarks/validate_panel_stage_c_gpu.py',
              'dev/tests/test_panel_stage_c_final_review_fixes.py',
              'docs/en/models/panel.md',
              'docs/cn/models/panel.md',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'HEAD'], text=True).splitlines())
          if changed != allowed:
              raise SystemExit(f'unexpected round6 two-way-predict scope: {sorted(changed)}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(panel): fail closed on unidentified two-way partial effects'
          git push origin HEAD:agent/panel-p1-stage-c-covariance
