name: PR126 panel final Fama-MacBeth wording gate

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Apply final wording cleanup
        run: python dev/validation/pr126_panel_docs_tail_once.py
      - name: Validate documentation
        run: |
          python dev/validation/fix_docs_links.py --check
          python dev/validation/check_docs_contracts.py
          git diff --check
      - name: Commit documentation only
        run: |
          git config user.name "Ziqian Lin"
          git config user.email "51812297+TheHiddenObserver@users.noreply.github.com"
          git add docs/en/panel/fama-macbeth.md docs/cn/panel/fama-macbeth.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: finalize PR126 backend wording"
            git push origin HEAD:agent/panel-p1-stage-c-covariance
          fi
