name: PR126 quoted pipe review fix

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - .github/workflows/pr126-formula-quoted-pipe-review-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply quote-aware pipe parsing fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('statgpu/panel/_formula.py')
          text = p.read_text()
          old = '''    # Find the top-level | (not inside parentheses)\n    depth = 0\n    pipe_pos = -1\n    for i, ch in enumerate(formula):\n        if ch == '(':\n            depth += 1\n        elif ch == ')':\n            depth -= 1\n        elif ch == '|' and depth == 0:\n            pipe_pos = i\n            break\n'''
          new = '''    # Find the top-level pipe separator without treating quoted column\n    # names or nested Patsy/Python expressions as fixed-effect syntax.\n    depth = 0\n    quote = None\n    escaped = False\n    pipe_pos = -1\n    for i, ch in enumerate(formula):\n        if quote is not None:\n            if escaped:\n                escaped = False\n            elif ch == "\\\\":\n                escaped = True\n            elif ch == quote:\n                quote = None\n            continue\n        if ch in {"'", '\"'}:\n            quote = ch\n            continue\n        if ch in "([{":\n            depth += 1\n        elif ch in ")]}":\n            depth = max(depth - 1, 0)\n        elif ch == '|' and depth == 0:\n            pipe_pos = i\n            break\n'''
          if text.count(old) != 1:
              raise SystemExit(f'_split_panel_formula target count={text.count(old)}')
          p.write_text(text.replace(old, new, 1))

          p = Path('dev/tests/test_panel_formula.py')
          text = p.read_text()
          anchor = '''    def test_whitespace_handling(self):\n        main, fe = _split_panel_formula("y~x1+x2|entity+time")\n        assert main == "y~x1+x2"\n        assert fe == ["entity", "time"]\n'''
          addition = '''\n    @pytest.mark.parametrize(\n        "formula",\n        [\n            'Q("y|raw") ~ x1 + x2',\n            'y ~ x1 + Q("x|raw")',\n            "Q('y|raw') ~ x1 + Q('x|raw')",\n        ],\n    )\n    def test_pipe_inside_quoted_name_is_not_panel_separator(self, formula):\n        main, fe = _split_panel_formula(formula)\n        assert main == formula\n        assert fe == []\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f'split-test anchor count={text.count(anchor)}')
          text = text.replace(anchor, anchor + addition, 1)

          class_anchor = '''    def test_magic_token_prefix_regressor_is_not_silently_rewritten(self, panel_df):\n'''
          full_test = '''    def test_quoted_pipe_column_names_remain_ordinary_patsy_terms(self, panel_df):\n        data = panel_df.copy()\n        data["y|raw"] = data["y"].to_numpy()\n        data["x|raw"] = data["x1"].to_numpy()\n        actual = PanelOLS().fit(\n            formula='Q("y|raw") ~ Q("x|raw")',\n            data=data,\n        )\n        expected_X = np.column_stack(\n            [np.ones(len(data)), data["x|raw"].to_numpy()]\n        )\n        expected = PanelOLS().fit(expected_X, data["y|raw"].to_numpy())\n        assert actual.entity_effects is False\n        assert actual.time_effects is False\n        assert_allclose(actual.coef_, expected.coef_, rtol=0, atol=3e-12)\n\n'''
          if text.count(class_anchor) != 1:
              raise SystemExit(f'PanelOLS quoted-pipe anchor count={text.count(class_anchor)}')
          p.write_text(text.replace(class_anchor, full_test + class_anchor, 1))
          PY
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas patsy pytest joblib scikit-learn
          python -m pip install -e . --no-deps
      - name: Run focused formula regressions
        run: |
          python -m compileall -q statgpu
          pytest -q dev/tests/test_panel_formula.py dev/tests/test_panel_stage_c_api_formula.py
          git diff --check
      - name: Commit fix and self-delete
        shell: bash
        run: |
          rm -f .github/workflows/pr126-formula-quoted-pipe-review-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep quoted pipes inside panel formulas"
          git push origin HEAD:agent/panel-p1-stage-c-covariance
