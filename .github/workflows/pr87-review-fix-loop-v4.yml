name: PR87 review fix batch v4

on:
  push:
    branches: [agent/maintenance-0.2.4-0.2.5]
    paths:
      - .github/workflows/pr87-review-fix-loop-v4.yml

permissions:
  contents: write

jobs:
  apply-review-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply non-workflow source and test fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          bootstrap = Path('.github/workflows/pr87-review-fix-loop.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          start = bootstrap.index(start_marker) + len(start_marker)
          end = bootstrap.index("\n          PY\n", start)
          exec(compile(textwrap.dedent(bootstrap[start:end]), '<pr87-bootstrap>', 'exec'), {})

          core = Path('dev/tests/test_core_contracts.py')
          core_text = core.read_text(encoding='utf-8')
          old = '''    assert parent.set_params(child__value=7) is parent\n    assert child.value == 7\n    assert parent.get_params(deep=True)["child__value"] == 7\n'''
          new = '''    assert parent.set_params(child__value=7) is parent\n    assert child.value == 1\n    assert parent.child is not child\n    assert parent.get_params(deep=True)["child__value"] == 7\n'''
          if old not in core_text:
              raise RuntimeError('core nested set_params test anchor missing')
          core.write_text(core_text.replace(old, new, 1), encoding='utf-8')

          tests = Path('dev/tests/test_maintenance_024_025.py')
          tests_text = tests.read_text(encoding='utf-8')
          old_coef = 'np.isfinite(np.asarray(model.coef_)).all()'
          if old_coef not in tests_text:
              raise RuntimeError('GPU coefficient assertion anchor missing')
          tests.write_text(
              tests_text.replace(old_coef, 'np.isfinite(np.asarray(_to_numpy(model.coef_))).all()', 1),
              encoding='utf-8',
          )

          compile(Path('dev/benchmarks/benchmark_torch_compile_maintenance.py').read_text(encoding='utf-8'),
                  'benchmark_torch_compile_maintenance.py', 'exec')
          PY

          # Workflow files are updated separately through the connected GitHub App.
          git checkout -- .github/workflows/maintenance-compatibility.yml

      - name: Install targeted validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" scipy pytest packaging "scikit-learn==1.3.2" pandas patsy joblib
          python -m pip install -e . --no-deps

      - name: Run targeted CPU review-fix tests
        run: |
          python -m pytest \
            dev/tests/test_maintenance_024_025.py \
            dev/tests/test_core_contracts.py::test_set_params_rejects_unknown_and_supports_nested_estimators \
            -q --tb=short

      - name: Commit and push non-workflow fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            statgpu/_base.py \
            statgpu/feature_selection/_stepwise.py \
            statgpu/feature_selection/_knockoff.py \
            dev/tests/test_core_contracts.py \
            dev/tests/test_maintenance_024_025.py \
            dev/benchmarks/benchmark_torch_compile_maintenance.py
          git commit -m "fix: address PR87 independent review findings"
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
