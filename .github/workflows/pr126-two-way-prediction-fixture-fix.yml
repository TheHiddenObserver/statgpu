name: PR126 two-way prediction fixture fix once

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - .github/workflows/pr126-two-way-prediction-fixture-fix.yml

permissions:
  contents: write

jobs:
  fix-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Apply prediction fixture fix
        run: python dev/validation/pr126_two_way_prediction_fixture_fix_once.py
      - name: Install maintained Torch CPU environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" pytest statsmodels
          python -m pip install "torch==2.0.1+cpu" --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Run focused Torch/prediction gates
        run: |
          python -m pytest dev/tests/test_panel_stage_c_final_review_fixes.py -q --tb=short
          python -m pytest dev/tests/test_panel_stage_c_fresh_df_rank_guard.py -q --tb=short
          git diff --check
      - name: Commit fixture fix and remove staging helpers
        run: |
          rm .github/workflows/pr126-two-way-prediction-fixture-fix.yml
          rm dev/validation/pr126_two_way_prediction_fixture_fix_once.py
          git config user.name "statgpu-review-fix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "test: unsaturate two-way prediction audit fixture"
          git push origin HEAD:agent/panel-p1-stage-c-covariance
