name: PR87 review round 4 fix

on:
  push:
    branches: [agent/maintenance-0.2.4-0.2.5]
    paths: [.github/workflows/pr87-review-round4-fix.yml]

permissions:
  contents: write

jobs:
  fix-test-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply transactional LogisticRegression fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one anchor, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "statgpu/_base.py",
              '''                # A rejected refit must not leave a previously fitted CV model\n                # usable.  Reset only estimators that explicitly expose the\n                # transactional CV lifecycle hook; other estimator families keep\n                # their existing validation behavior.\n                if method_name == "fit":\n                    reset_cv_state = getattr(self, "_reset_cv_fit_state", None)\n                    if callable(reset_cv_state):\n                        reset_cv_state()\n''',
              '''                # A rejected refit must not leave stale fitted outputs usable.\n                # Prefer the general transactional lifecycle hook and retain the\n                # older CV-specific hook for estimators that have not migrated.\n                if method_name == "fit":\n                    reset_fit_state = getattr(self, "_reset_fit_state", None)\n                    if callable(reset_fit_state):\n                        reset_fit_state()\n                    else:\n                        reset_cv_state = getattr(self, "_reset_cv_fit_state", None)\n                        if callable(reset_cv_state):\n                            reset_cv_state()\n''',
          )

          replace_once(
              "statgpu/linear_model/wrappers/_logistic.py",
              '''from statgpu.glm_core._validation import (\n    validate_binary_response,\n    validate_glm_sample_weight,\n)\n''',
              '''from statgpu.glm_core._validation import (\n    validate_binary_response,\n    validate_glm_design_matrix,\n    validate_glm_sample_weight,\n)\n''',
          )

          reset_method = '''\n    def _reset_fit_state(self):\n        """Clear every published and cached result before a new fit attempt."""\n        self._fitted = False\n        for name in (\n            "coef_",\n            "intercept_",\n            "n_iter_",\n            "_X_design",\n            "_y",\n            "_nobs",\n            "_df_resid",\n            "_params",\n            "_bse",\n            "_zvalues",\n            "_pvalues",\n            "_conf_int",\n            "_loglik",\n            "_loglik_null",\n            "_train_pred_cache",\n            "_train_eval_cache",\n            "_sample_weight",\n            "_bse_gpu",\n            "_zvalues_gpu",\n            "_pvalues_gpu",\n            "_conf_int_gpu",\n            "_loglik_gpu",\n            "_accuracy_gpu",\n        ):\n            setattr(self, name, None)\n\n'''
          replace_once(
              "statgpu/linear_model/wrappers/_logistic.py",
              '''        self._sample_weight = None\n\n    def _cleanup_cuda_memory(self):\n''',
              '''        self._sample_weight = None\n''' + reset_method + '''    def _cleanup_cuda_memory(self):\n''',
          )

          replace_once(
              "statgpu/linear_model/wrappers/_logistic.py",
              '''        # Get backend - support explicit torch backend selection\n        backend = self._get_backend(backend="auto")\n        backend_name = backend.name\n\n        X_arr = self._to_array(X, backend=backend_name)\n        y_validated = validate_binary_response(\n            y, X_arr.shape[0], context="LogisticRegression"\n        )\n''',
              '''        # Validate shape/domain before backend-specific unpacking.\n        X_validated = validate_glm_design_matrix(X)\n\n        # Get backend - support explicit torch backend selection.\n        backend = self._get_backend(backend="auto")\n        backend_name = backend.name\n\n        X_arr = self._to_array(X_validated, backend=backend_name)\n        y_validated = validate_binary_response(\n            y, X_validated.shape[0], context="LogisticRegression"\n        )\n''',
          )

          test_path = Path("dev/tests/test_pr87_code_review_fix_cycle.py")
          text = test_path.read_text(encoding="utf-8")
          text += '''\n\ndef _fitted_logistic_fixture():\n    from statgpu.linear_model import LogisticRegression\n\n    X = np.array(\n        [[-2.0], [-1.0], [-0.25], [0.25], [1.0], [2.0]], dtype=float\n    )\n    y = np.array([0.0, 0.0, 0.0, 1.0, 1.0, 1.0])\n    model = LogisticRegression(\n        device="cpu", max_iter=100, compute_inference=False\n    ).fit(X, y)\n    return model, X, y\n\n\ndef _assert_logistic_state_cleared(model):\n    assert model._fitted is False\n    assert model.coef_ is None\n    assert model.intercept_ is None\n    assert model.n_iter_ is None\n    assert model._params is None\n    assert model._X_design is None\n    assert model._y is None\n    with pytest.raises(RuntimeError, match="fitted"):\n        model.predict(np.zeros((1, 1)))\n\n\ndef test_logistic_invalid_binary_refit_clears_stale_state():\n    model, X, _ = _fitted_logistic_fixture()\n    with pytest.raises(ValueError, match="binary y"):\n        model.fit(X, np.array([0.0, 0.0, 0.5, 1.0, 1.0, 1.0]))\n    _assert_logistic_state_cleared(model)\n\n\ndef test_logistic_nonfinite_refit_clears_stale_state_before_shared_guard():\n    model, X, y = _fitted_logistic_fixture()\n    bad_y = y.copy()\n    bad_y[0] = np.nan\n    with pytest.raises(ValueError, match="finite"):\n        model.fit(X, bad_y)\n    _assert_logistic_state_cleared(model)\n\n\n@pytest.mark.parametrize(\n    "bad_X, message",\n    [\n        (np.asarray(1.0), "two-dimensional design matrix"),\n        (np.arange(6.0), "two-dimensional design matrix"),\n        (np.empty((0, 1)), "at least one observation"),\n    ],\n)\ndef test_logistic_design_boundary_has_public_error_and_clears_state(\n    bad_X, message\n):\n    model, _, _ = _fitted_logistic_fixture()\n    with pytest.raises(ValueError, match=message):\n        model.fit(bad_X, np.empty(0))\n    _assert_logistic_state_cleared(model)\n\n\ndef test_base_fit_guard_prefers_general_transaction_hook():\n    from statgpu._base import BaseEstimator\n\n    class TransactionalEstimator(BaseEstimator):\n        def __init__(self):\n            super().__init__(device="cpu")\n            self.reset_calls = 0\n            self.body_calls = 0\n\n        def _reset_fit_state(self):\n            self.reset_calls += 1\n            self._fitted = False\n\n        def fit(self, X, y=None):\n            self.body_calls += 1\n            self._fitted = True\n            return self\n\n        def predict(self, X):\n            return np.zeros(len(X))\n\n    model = TransactionalEstimator()\n    with pytest.raises(ValueError, match="finite"):\n        model.fit(np.array([[np.nan]]), np.array([0.0]))\n    assert model.reset_calls == 1\n    assert model.body_calls == 0\n    assert model._fitted is False\n'''
          test_path.write_text(text, encoding="utf-8")
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation,formula]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run review-fix and LogisticRegression suites
        run: |
          python -m pytest -q \
            dev/tests/test_pr87_code_review_fix_cycle.py \
            dev/tests/test_logistic.py
      - name: Run lifecycle regression suites
        run: |
          python -m pytest -q \
            dev/tests/test_maintenance_024_025.py \
            dev/tests/test_pr80_fit_boundary.py \
            -k "fit_state or stale or finite or logistic or binary or scalar_X or adapter_validation or public_method_guard"
      - name: Static review gates
        run: |
          python -m compileall -q statgpu dev/tests/test_pr87_code_review_fix_cycle.py
          git diff --check
      - name: Commit fixes and self-delete
        shell: bash
        run: |
          rm .github/workflows/pr87-review-round4-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add statgpu dev/tests .github/workflows/pr87-review-round4-fix.yml
          git commit -m "fix: make logistic refits transactional"
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
