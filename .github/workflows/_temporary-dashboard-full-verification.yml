name: Temporary dashboard paired optimization verification

on:
  push:
    branches:
      - agent/benchmark-dashboard-optimization-audit
    paths:
      - .github/workflows/_temporary-dashboard-full-verification.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Prepare baseline worktree
        run: |
          git worktree add --detach /tmp/dashboard-baseline 553f6b722a03b6d6870f8e2fe29b50bc11d38bfa
      - name: Serve optimized and baseline deployments
        run: |
          python3 -m http.server 4173 --directory . >/tmp/dashboard-optimized-http.log 2>&1 &
          python3 -m http.server 4174 --directory /tmp/dashboard-baseline >/tmp/dashboard-baseline-http.log 2>&1 &
          for port in 4173 4174; do
            ready=0
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:${port}/docs/assets/benchmarks/" >/dev/null; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              echo "server on port ${port} did not become ready"
              cat /tmp/dashboard-optimized-http.log || true
              cat /tmp/dashboard-baseline-http.log || true
              exit 1
            fi
          done
      - name: Run paired A/B production measurement
        working-directory: frontend
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { performance } from 'node:perf_hooks';
          import { chromium } from '@playwright/test';

          const urls = {
            optimized: 'http://127.0.0.1:4173/docs/assets/benchmarks/',
            baseline: 'http://127.0.0.1:4174/docs/assets/benchmarks/',
          };
          const rounds = 10;

          function stats(values) {
            const xs = [...values].sort((a, b) => a - b);
            const percentile = p => xs[Math.min(xs.length - 1, Math.max(0, Math.ceil(p * xs.length) - 1))];
            return {
              min: xs[0],
              median: xs[Math.floor(xs.length / 2)],
              p95: percentile(0.95),
              max: xs[xs.length - 1],
              mean: xs.reduce((a, b) => a + b, 0) / xs.length,
            };
          }

          async function twoFrames(page) {
            await page.evaluate(() => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve))));
          }

          async function measureOne(browser, url) {
            const context = await browser.newContext();
            const page = await context.newPage();

            const coldStart = performance.now();
            await page.goto(url, { waitUntil: 'load' });
            await page.locator('.header').waitFor({ state: 'visible', timeout: 15000 });
            await page.waitForFunction(() => document.querySelector('#timing-chart')?.dataset.timingDisplayed !== undefined);
            await twoFrames(page);
            const coldReadyMs = performance.now() - coldStart;

            let start = performance.now();
            await page.locator('[data-chart-view="full"]').click();
            await twoFrames(page);
            const fullMatrixMs = performance.now() - start;

            start = performance.now();
            await page.locator('[data-chart-view="focused"]').click();
            await twoFrames(page);
            const focusedReturnMs = performance.now() - start;

            const cvStart = performance.now();
            await page.locator('#env-select').selectOption('remote-p100-cv-20260807');
            await twoFrames(page);
            await page.getByRole('button', { name: 'None' }).click();
            await twoFrames(page);
            await page.locator('#cat-linear_models').check();
            await twoFrames(page);
            await page.locator('[data-metric-scope="cross_validation"]').click();
            await twoFrames(page);
            await page.getByLabel('Model', { exact: true }).selectOption('RidgeCV');
            await twoFrames(page);
            const variant = page.getByLabel('Variant', { exact: true });
            if (await variant.count()) {
              await variant.selectOption({ index: 1 });
              await twoFrames(page);
            }
            const penalty = page.getByLabel('Penalty', { exact: true });
            if (await penalty.count()) {
              await penalty.selectOption('l2');
              await twoFrames(page);
            }
            const solver = page.getByLabel('Solver', { exact: true });
            if (await solver.count()) {
              await solver.selectOption('cv');
              await twoFrames(page);
            }
            const scale = page.locator('.scale-chip').first();
            if (await scale.count()) {
              await scale.click();
              await twoFrames(page);
            }
            const cupy = page.locator('input[name="backend"][value="cupy"]');
            if (await cupy.count()) {
              await cupy.check();
              await twoFrames(page);
            }
            const cvCascadeMs = performance.now() - cvStart;

            const snapshot = await page.evaluate(() => ({
              nodes: document.querySelectorAll('*').length,
              timing_fallback_rows: document.querySelectorAll('#timing-chart-data tbody tr').length,
              speedup_fallback_rows: document.querySelectorAll('#speedup-chart-data tbody tr').length,
              overview_rows: document.querySelectorAll('.table-container tbody tr').length,
            }));

            await context.close();
            return {
              cold_ready_ms: coldReadyMs,
              full_matrix_ms: fullMatrixMs,
              focused_return_ms: focusedReturnMs,
              cv_cascade_ms: cvCascadeMs,
              snapshot,
            };
          }

          function pairedImprovement(base, opt) {
            return ((base - opt) / base) * 100;
          }

          const browser = await chromium.launch({ headless: true });
          const pairs = [];
          for (let round = 0; round < rounds; round += 1) {
            const order = round % 2 === 0 ? ['baseline', 'optimized'] : ['optimized', 'baseline'];
            const pair = { round, order, baseline: null, optimized: null };
            for (const variant of order) {
              pair[variant] = await measureOne(browser, urls[variant]);
            }
            pairs.push(pair);
          }
          await browser.close();

          const metrics = ['cold_ready_ms', 'full_matrix_ms', 'focused_return_ms', 'cv_cascade_ms'];
          const summary = {};
          for (const metric of metrics) {
            const baselineValues = pairs.map(pair => pair.baseline[metric]);
            const optimizedValues = pairs.map(pair => pair.optimized[metric]);
            const absoluteDeltas = pairs.map(pair => pair.baseline[metric] - pair.optimized[metric]);
            const pctImprovements = pairs.map(pair => pairedImprovement(pair.baseline[metric], pair.optimized[metric]));
            summary[metric] = {
              baseline: stats(baselineValues),
              optimized: stats(optimizedValues),
              paired_absolute_delta_ms: stats(absoluteDeltas),
              paired_improvement_pct: stats(pctImprovements),
            };
          }

          const report = {
            baseline_commit: '553f6b722a03b6d6870f8e2fe29b50bc11d38bfa',
            optimized_commit: process.env.GITHUB_SHA,
            runner: 'same ubuntu-latest runner / one Chromium process / fresh context per variant / alternating order',
            rounds,
            summary,
            pairs,
          };
          fs.writeFileSync('../dashboard-optimization-paired-ab.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-optimization-paired-ab
          path: dashboard-optimization-paired-ab.json
          if-no-files-found: error
