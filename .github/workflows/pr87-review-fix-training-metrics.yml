name: PR87 review-fix training metrics

on:
  push:
    branches:
      - agent/maintenance-0.2.4-0.2.5

permissions:
  contents: write

jobs:
  review-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply reviewed training-metric patch
        run: python dev/.pr87_training_metrics_patch.py

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation,formula]"
          python -m pip install ruff
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run training metric and adjacent contracts
        run: |
          python -m pytest \
            dev/tests/test_pr87_classifier_output_contracts.py \
            dev/tests/test_logistic.py \
            dev/tests/test_module_review_smoothing_splines_gam_metrics.py \
            -q --tb=short

      - name: Run complete CPU test tree
        run: python -m pytest dev/tests -q --tb=short

      - name: Run documentation and static gates
        run: |
          python dev/validation/fix_docs_links.py --check
          python dev/validation/check_docs_contracts.py
          python -m compileall -q statgpu dev/validation dev/benchmarks
          ruff check \
            statgpu/linear_model/wrappers/_logistic.py \
            dev/tests/test_pr87_classifier_output_contracts.py \
            --select F821,E9,F63,F7,F82
          git diff --check
          python -m pytest --collect-only -q

      - name: Commit reviewed fix and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            statgpu/linear_model/wrappers/_logistic.py \
            dev/tests/test_pr87_classifier_output_contracts.py \
            docs/en/changelog.md \
            docs/cn/changelog.md
          git rm \
            dev/.pr87_training_metrics_patch.py \
            .github/workflows/pr87-review-fix-training-metrics.yml
          git commit -m "fix: decouple logistic training metrics"
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
