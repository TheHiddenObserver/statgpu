name: PR126 RandomEffects token review fix

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - .github/workflows/pr126-random-effects-token-review-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reject fixed-effect tokens in RandomEffects formulas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: target count={text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'statgpu/panel/_random_effects.py',
              '''        """Fit the random effects model."""\n        (\n''',
              '''        """Fit the random effects model."""\n        if formula is not None:\n            from statgpu.panel._formula import (\n                _PANEL_TOKENS,\n                _split_panel_formula,\n                _top_level_panel_token_spans,\n            )\n\n            main_formula, _pipe_vars = _split_panel_formula(formula)\n            present_tokens = sorted(\n                token\n                for token in _PANEL_TOKENS\n                if _top_level_panel_token_spans(main_formula, token)\n            )\n            if present_tokens:\n                joined = ", ".join(present_tokens)\n                raise ValueError(\n                    "RandomEffects does not support fixed-effect formula tokens "\n                    f"({joined}); use '| entity' for entity grouping and "\n                    "'| entity + time' only with Driscoll-Kraay covariance"\n                )\n\n        (\n'''
          )

          p = Path('dev/tests/test_panel_formula.py')
          text = p.read_text()
          anchor = '''    def test_pipe_named_entity_rejects_conflicting_explicit_ids(self, panel_df):\n'''
          addition = '''    @pytest.mark.parametrize(\n        "token", ["EntityEffects", "FixedEffects", "TimeEffects"]\n    )\n    def test_random_effects_rejects_fixed_effect_magic_tokens(self, panel_df, token):\n        with pytest.raises(ValueError, match=r"does not support fixed-effect formula tokens"):\n            RandomEffects(cov_type="dk", bandwidth=1).fit(\n                formula=f"y ~ x1 + x2 + {token}",\n                data=panel_df,\n                entity_ids=panel_df["entity"].to_numpy(),\n                time_ids=panel_df["time"].to_numpy(),\n            )\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f'test anchor count={text.count(anchor)}')
          p.write_text(text.replace(anchor, addition + anchor, 1))

          replace_once(
              'docs/en/panel/random-effects.md',
              '''The first pipe variable is the entity grouping column. A second pipe variable is accepted only with `cov_type="driscoll-kraay"`, where it supplies `time_ids`; otherwise the fit fails clearly instead of silently ignoring that variable. If explicit `entity_ids`/`time_ids` are also supplied, they must match any pipe-named columns.\n''',
              '''The first pipe variable is the entity grouping column. A second pipe variable is accepted only with `cov_type="driscoll-kraay"`, where it supplies `time_ids`; otherwise the fit fails clearly instead of silently ignoring that variable. If explicit `entity_ids`/`time_ids` are also supplied, they must match any pipe-named columns. Fixed-effect magic tokens (`EntityEffects`, `TimeEffects`, `FixedEffects`) are rejected for `RandomEffects`; use the pipe syntax to provide grouping metadata instead.\n'''
          )
          replace_once(
              'docs/cn/panel/random-effects.md',
              '''pipe 的第一个变量表示 entity grouping column。只有在 `cov_type="driscoll-kraay"` 时才接受第二个 pipe 变量，并将其作为 `time_ids`；其他 covariance 下会明确报错，而不是静默忽略该变量。如果同时显式传入 `entity_ids`/`time_ids`，它们必须与 pipe 中命名的对应列一致。\n''',
              '''pipe 的第一个变量表示 entity grouping column。只有在 `cov_type="driscoll-kraay"` 时才接受第二个 pipe 变量，并将其作为 `time_ids`；其他 covariance 下会明确报错，而不是静默忽略该变量。如果同时显式传入 `entity_ids`/`time_ids`，它们必须与 pipe 中命名的对应列一致。`RandomEffects` 会拒绝 fixed-effect magic tokens（`EntityEffects`、`TimeEffects`、`FixedEffects`）；grouping metadata 应使用 pipe syntax 提供。\n'''
          )
          replace_once(
              'CHANGELOG.md',
              '''Panel formula/refit/intercept semantics (including fail-closed pipe metadata conflicts),''',
              '''Panel formula/refit/intercept semantics (including fail-closed pipe metadata conflicts and RandomEffects token rejection),'''
          )
          replace_once(
              'docs/en/changelog.md',
              '''and RandomEffects accepts a second pipe time variable only when Driscoll-Kraay covariance actually consumes it.''',
              '''RandomEffects accepts a second pipe time variable only when Driscoll-Kraay covariance actually consumes it, and fixed-effect magic tokens are rejected for RandomEffects rather than being reinterpreted as grouping metadata.'''
          )
          replace_once(
              'docs/cn/changelog.md',
              '''RandomEffects 的第二个 pipe time 变量也只在 Driscoll-Kraay covariance 实际使用时才允许。''',
              '''RandomEffects 的第二个 pipe time 变量也只在 Driscoll-Kraay covariance 实际使用时才允许，同时 fixed-effect magic tokens 会被拒绝，而不会被重新解释为 grouping metadata。'''
          )
          PY
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas patsy pytest joblib scikit-learn
          python -m pip install -e . --no-deps
      - name: Run focused formula regressions
        run: |
          python -m compileall -q statgpu
          pytest -q dev/tests/test_panel_formula.py dev/tests/test_panel_stage_c_api_formula.py
          git diff --check
      - name: Commit fix and self-delete
        shell: bash
        run: |
          rm -f .github/workflows/pr126-random-effects-token-review-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: reject fixed-effect tokens in RandomEffects formulas"
          git push origin HEAD:agent/panel-p1-stage-c-covariance
