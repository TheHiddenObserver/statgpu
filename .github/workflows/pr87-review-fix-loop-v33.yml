name: PR87 review fix batch v33

on:
  push:
    branches: [agent/maintenance-0.2.4-0.2.5]
    paths:
      - .github/workflows/pr87-review-fix-loop-v33.yml

permissions:
  contents: write

jobs:
  apply-review-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply scalar GLM shape fixes with list compatibility
        run: python pr87_patch_v33.py
      - name: Install validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation,formula]"
      - name: Run full CPU and documentation validation
        run: |
          python -m py_compile \
            statgpu/glm_core/_base.py \
            statgpu/glm_core/_irls.py \
            statgpu/linear_model/_glm_base.py \
            statgpu/linear_model/penalized/_fit_mixin.py \
            statgpu/linear_model/penalized/_penalized_cv.py \
            dev/tests/test_maintenance_024_025.py
          python -m pytest dev/tests -q --tb=short
          python dev/validation/fix_docs_links.py --check
          python dev/validation/check_docs_contracts.py
      - name: Commit source fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f pr87_patch_v32.py pr87_patch_v33.py
          git add \
            statgpu/glm_core/_base.py \
            statgpu/glm_core/_irls.py \
            statgpu/linear_model/_glm_base.py \
            statgpu/linear_model/penalized/_fit_mixin.py \
            statgpu/linear_model/penalized/_penalized_cv.py \
            dev/tests/test_maintenance_024_025.py \
            CHANGELOG.md docs/en/changelog.md docs/cn/changelog.md
          git commit -m "fix: enforce scalar GLM response shape"
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
