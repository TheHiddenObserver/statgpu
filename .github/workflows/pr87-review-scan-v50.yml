name: PR87 review scan v50

on:
  push:
    branches:
      - agent/maintenance-0.2.4-0.2.5

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan changed Python files for broad exception fallbacks
        run: python pr87_scan_v50.py
