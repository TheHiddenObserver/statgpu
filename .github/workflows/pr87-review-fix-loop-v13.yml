name: PR87 review fix batch v13

on:
  push:
    branches: [agent/maintenance-0.2.4-0.2.5]
    paths:
      - .github/workflows/pr87-review-fix-loop-v13.yml

permissions:
  contents: write

jobs:
  apply-review-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply reviewed fixes
        run: python dev/scripts/pr87_patch_v12.py

      - name: Install validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" scipy pytest packaging "scikit-learn==1.3.2" pandas patsy statsmodels joblib
          python -m pip install -e . --no-deps

      - name: Run targeted validation
        run: |
          python -m py_compile statgpu/linear_model/_glm_base.py dev/benchmarks/benchmark_torch_compile_maintenance.py
          python -m pytest \
            dev/tests/test_maintenance_024_025.py \
            dev/tests/test_core_contracts.py::test_set_params_rejects_unknown_and_supports_nested_estimators \
            -q --tb=short

      - name: Commit source fixes
        shell: bash
        run: |
          rm dev/scripts/pr87_patch_v12.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            statgpu/linear_model/_glm_base.py \
            dev/tests/test_maintenance_024_025.py \
            dev/benchmarks/benchmark_torch_compile_maintenance.py \
            dev/scripts/pr87_patch_v12.py
          git commit -m "fix: require formula and compile execution evidence"
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
