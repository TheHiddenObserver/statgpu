name: PR126 Stage C Hausman RE covariance patch

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - '.github/workflows/pr126-stage-c-hausman-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python dev/benchmarks/_pr126_patch_hausman_re_cov.py
      - run: python -m compileall -q statgpu/panel/_diagnostics.py
      - run: python -m pytest dev/tests/test_panel_stage_c_api_formula.py -q --tb=short
      - run: git diff --check
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add statgpu/panel/_diagnostics.py
          git commit -m 'fix: reject robust RE in classical Hausman explicitly'
          git push origin HEAD:agent/panel-p1-stage-c-covariance
