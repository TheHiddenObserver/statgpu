name: PR126 round4 final refinement

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - .github/workflows/pr126-round4-final-refinement.yml

permissions:
  contents: write

jobs:
  final-refinement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply final refinements
        run: python dev/pr126_round4_final_refinement_v2.py
      - name: Install focused environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,validation,formula,torch]' 'linearmodels==7.0'
      - name: Run focused review matrix
        run: |
          python -m pytest -q \
            dev/tests/test_panel_stage_c_review_round4.py \
            dev/tests/test_panel_stage_c_rank_deficient_matrix.py \
            dev/tests/test_panel_stage_c_torch_cpu.py \
            dev/tests/test_panel_stage_c_inference_guard.py \
            dev/tests/test_panel_stage_c_edge_contracts.py \
            dev/tests/test_panel_stage_c_linearmodels_estimators.py \
            dev/tests/test_panel_stage_c_physical_runner_contract.py \
            dev/tests/test_panel_formula.py \
            dev/tests/test_panel_stage_c_api_formula.py \
            dev/tests/test_module_review_covariance_panel.py
      - name: Documentation and static gates
        run: |
          python -m compileall -q statgpu/panel dev/benchmarks/validate_panel_stage_c_gpu.py
          python - <<'PY'
          from pathlib import Path
          en = Path('docs/en/models/panel.md').read_text(encoding='utf-8')
          cn = Path('docs/cn/models/panel.md').read_text(encoding='utf-8')
          assert 'coefficient-inference-unavailable' in en
          assert 'FirstDifference time semantics' in en
          assert 'coefficient-inference-unavailable' in cn
          assert 'FirstDifference 时间语义' in cn
          assert 'f1546476...' in en and 'f1546476...' in cn
          PY
          git diff --check
      - name: Commit validated refinements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr126-round4-final-refinement.yml dev/pr126_round4_final_refinement.py dev/pr126_round4_final_refinement_v2.py
          git add statgpu/panel dev/benchmarks/validate_panel_stage_c_gpu.py docs/en/models/panel.md docs/cn/models/panel.md
          git diff --cached --check
          git commit -m 'fix: finalize Panel Stage C review contracts'
          git push origin HEAD:agent/panel-p1-stage-c-covariance
