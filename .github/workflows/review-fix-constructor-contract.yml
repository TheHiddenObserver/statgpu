name: Review fix constructor contract

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[validation,formula]'
      - name: Apply constructor contract refactor
        run: python .github/review_fix_constructor_contract_v4.py
      - name: Import complete package
        run: python -c "import statgpu; import statgpu.linear_model; import statgpu.panel"
      - name: Run constructor and compatibility gates
        run: |
          python -m pytest -q --tb=short \
            dev/tests/test_maintenance_024_025.py \
            dev/tests/test_legacy_sklearn_integration.py \
            dev/tests/test_pr80_cox_cv_split_lifecycle_contract.py \
            dev/tests/test_second_full_review.py::TestEstimatorCloneAndFeatureSelectionBackend \
            dev/tests/test_panel_*.py
      - name: Run constructor mismatch audit
        run: python .github/review_constructor_map.py
      - name: Commit constructor contract refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add statgpu dev/tests/test_maintenance_024_025.py
          git commit -m 'refactor: preserve public constructor parameters'
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
