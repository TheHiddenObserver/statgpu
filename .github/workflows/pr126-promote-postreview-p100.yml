name: PR126 post-review P100 promotion

on:
  push:
    branches: [agent/panel-p1-stage-c-covariance]
    paths:
      - '.github/workflows/pr126-promote-postreview-p100.yml'
      - 'dev/benchmarks/_pr126_promote_postreview_p100.py'

permissions:
  contents: write

jobs:
  promote-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/panel-p1-stage-c-covariance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[formula]' pytest 'jsonschema[format]'
      - name: Apply evidence promotion
        run: python dev/benchmarks/_pr126_promote_postreview_p100.py
      - name: Align current and historical catalog contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('dev/tests/test_benchmark_catalog.py')
          text = p.read_text(encoding='utf-8')
          replacements = {
              'results/pr126_p100/panel_stage_c_gpu_validation_9c0b3050.json':
                  'results/pr126_p100/panel_stage_c_gpu_validation_c151550a.json',
              'results/pr126_p100/panel_stage_c_performance_9c0b3050.json':
                  'results/pr126_p100/panel_stage_c_performance_c151550a.json',
              'panel-stage-c-validation-pr126-20260810-a0d258f6d6b8':
                  'panel-stage-c-validation-pr126-20260810-91e9ec53b6ee',
              'panel-stage-c-performance-pr126-20260810-214284f02a5e':
                  'panel-stage-c-performance-pr126-20260810-1861fc4f1817',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing current-source test token: {old}')
              text = text.replace(old, new)
          text += '''\n\ndef test_stage_c_superseded_artifacts_remain_historical(entries):\n    old_validation = next(\n        entry for entry in entries\n        if entry["path"] == "results/pr126_p100/panel_stage_c_gpu_validation_9c0b3050.json"\n    )\n    old_performance = next(\n        entry for entry in entries\n        if entry["path"] == "results/pr126_p100/panel_stage_c_performance_9c0b3050.json"\n    )\n    assert old_validation["classification"] == "historical_or_excluded"\n    assert old_validation["registered"] is False\n    assert old_performance["classification"] == "historical_or_excluded"\n    assert old_performance["registered"] is False\n'''
          p.write_text(text, encoding='utf-8')
          PY
      - name: Focused promotion and review-fix contracts
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest \
            dev/tests/test_panel_stage_c_frontend_source.py \
            dev/tests/test_benchmark_frontend_data.py \
            dev/tests/test_benchmark_catalog.py \
            dev/tests/test_benchmark_inventory_v2.py \
            dev/tests/test_frontend_domain_coverage.py \
            dev/tests/test_panel_stage_c_edge_contracts.py \
            dev/tests/test_panel_stage_c_api_formula.py \
            -q --tb=short
      - name: Generate canonical assets
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python dev/benchmarks/generate_benchmark_data.py \
            --out frontend/public/data/benchmark_data.json \
            --report frontend/public/data/parse_report.json \
            --inventory-out frontend/public/data/source_inventory.json \
            --deterministic --strict-sources
          cp frontend/public/data/benchmark_data.json docs/assets/benchmarks/data/benchmark_data.json
          cp frontend/public/data/parse_report.json docs/assets/benchmarks/data/parse_report.json
          cp frontend/public/data/source_inventory.json docs/assets/benchmarks/data/source_inventory.json
          python dev/benchmarks/generate_benchmark_data.py --check --strict-sources
      - name: Check deterministic regeneration
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          sha256sum frontend/public/data/benchmark_data.json frontend/public/data/parse_report.json frontend/public/data/source_inventory.json > /tmp/before.sha
          python dev/benchmarks/generate_benchmark_data.py \
            --out frontend/public/data/benchmark_data.json \
            --report frontend/public/data/parse_report.json \
            --inventory-out frontend/public/data/source_inventory.json \
            --deterministic --strict-sources
          sha256sum frontend/public/data/benchmark_data.json frontend/public/data/parse_report.json frontend/public/data/source_inventory.json > /tmp/after.sha
          diff -u /tmp/before.sha /tmp/after.sha
          cmp frontend/public/data/benchmark_data.json docs/assets/benchmarks/data/benchmark_data.json
          cmp frontend/public/data/parse_report.json docs/assets/benchmarks/data/parse_report.json
          cmp frontend/public/data/source_inventory.json docs/assets/benchmarks/data/source_inventory.json
      - name: Frontend typecheck and build
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Diff hygiene
        run: git diff --check
      - name: Commit validated permanent promotion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            dev/benchmarks/frontend_data/parsers/panel_stage_c.py \
            dev/benchmarks/frontend_sources.json \
            dev/benchmarks/benchmark_coverage_matrix.json \
            dev/reviews/pr126_physical_gpu_validation.md \
            dev/tests/test_panel_stage_c_frontend_source.py \
            dev/tests/test_benchmark_catalog.py \
            CHANGELOG.md \
            docs/en/changelog.md docs/cn/changelog.md \
            docs/en/models/panel.md docs/cn/models/panel.md \
            frontend/public/data/benchmark_data.json \
            frontend/public/data/parse_report.json \
            frontend/public/data/source_inventory.json \
            docs/assets/benchmarks/data/benchmark_data.json \
            docs/assets/benchmarks/data/parse_report.json \
            docs/assets/benchmarks/data/source_inventory.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No permanent promotion changes to commit.'
            exit 1
          fi
          git commit -m 'bench: promote PR126 post-review P100 evidence'
          git push origin HEAD:agent/panel-p1-stage-c-covariance
