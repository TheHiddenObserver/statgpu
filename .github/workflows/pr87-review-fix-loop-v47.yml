name: PR87 review fix batch v47

on:
  push:
    branches: [agent/maintenance-0.2.4-0.2.5]
    paths:
      - .github/workflows/pr87-review-fix-loop-v47.yml

permissions:
  contents: write

jobs:
  apply-review-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply linear-solve exception fix
        run: python pr87_patch_v47.py
      - name: Install validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation,formula]"
      - name: Run targeted linear-solve tests
        run: |
          python -m py_compile statgpu/backends/_array_ops.py dev/tests/test_maintenance_024_025.py
          python -m pytest \
            dev/tests/test_maintenance_024_025.py::test_shared_linear_solve_does_not_mask_runtime_failures \
            dev/tests/test_maintenance_024_025.py::test_shared_linear_solve_retains_rank_failure_fallback \
            dev/tests/test_maintenance_024_025.py::test_shared_linear_solve_runtime_classifier_is_narrow \
            -q --tb=short
      - name: Run full CPU and documentation validation
        run: |
          python -m pytest dev/tests -q --tb=short
          python dev/validation/fix_docs_links.py --check
          python dev/validation/check_docs_contracts.py
      - name: Commit reviewed source fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f pr87_patch_v47.py .github/workflows/pr87-review-fix-loop-v47.yml
          git add \
            statgpu/backends/_array_ops.py \
            dev/tests/test_maintenance_024_025.py \
            CHANGELOG.md docs/en/changelog.md docs/cn/changelog.md
          git commit -m "fix: preserve backend linear-solve failures"
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
