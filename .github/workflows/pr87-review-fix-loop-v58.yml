name: PR87 review fix batch v58

on:
  push:
    branches:
      - agent/maintenance-0.2.4-0.2.5

permissions:
  contents: write

concurrency:
  group: pr87-review-fix-v58
  cancel-in-progress: false

jobs:
  apply-review-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply CV refit backend consistency fixes
        run: python pr87_patch_v58.py
      - name: Install validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation,formula]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile changed modules
        run: |
          python -m py_compile \
            statgpu/linear_model/cv/_device.py \
            statgpu/linear_model/cv/_ridge_cv.py \
            statgpu/linear_model/cv/_elasticnet_cv.py \
            statgpu/linear_model/cv/_logistic_cv.py \
            dev/tests/test_maintenance_024_025.py
      - name: Run targeted refit routing tests
        run: |
          python -m pytest \
            dev/tests/test_maintenance_024_025.py::test_cv_refit_device_pins_auto_to_selected_backend \
            dev/tests/test_maintenance_024_025.py::test_public_cv_auto_refit_uses_cv_selected_backend \
            dev/tests/test_maintenance_024_025.py::test_elasticnet_cv_auto_refit_uses_cv_selected_backend \
            -q --tb=short
      - name: Run full CPU and documentation validation
        run: |
          python -m pytest dev/tests -q --tb=short
          python dev/validation/fix_docs_links.py --check
          python dev/validation/check_docs_contracts.py
      - name: Commit reviewed source fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f \
            pr87_patch_v58.py \
            .github/workflows/pr87-review-fix-loop-v58.yml
          git add \
            statgpu/linear_model/cv/_device.py \
            statgpu/linear_model/cv/_ridge_cv.py \
            statgpu/linear_model/cv/_elasticnet_cv.py \
            statgpu/linear_model/cv/_logistic_cv.py \
            dev/tests/test_maintenance_024_025.py \
            CHANGELOG.md docs/en/changelog.md docs/cn/changelog.md
          git commit -m "fix: keep CV refit on selected backend"
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
