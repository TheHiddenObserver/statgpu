name: PR126 nonnested scale review

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/pr126-nonnested-scale-audit.yml'
      - 'dev/validation/pr126_nonnested_union_once.py'
      - 'dev/validation/pr126_nonnested_union_fixup_once.py'

permissions:
  contents: write

jobs:
  review-fix:
    if: github.event.pull_request.head.ref == 'agent/panel-p1-stage-c-covariance'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install maintained review environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" pytest
          python -m pip install "torch==2.0.1+cpu" --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[validation,formula]"
      - name: Apply nonnested union-score fix
        run: |
          python dev/validation/pr126_nonnested_union_once.py
          python dev/validation/pr126_nonnested_union_fixup_once.py
      - name: Run focused review matrix
        run: |
          python -m pytest \
            dev/tests/test_panel_stage_c_covariance.py \
            dev/tests/test_panel_stage_b_torch_cpu.py \
            dev/tests/test_panel_stage_c_physical_runner_contract.py \
            dev/tests/test_panel_stage_c_final_review_fixes.py \
            dev/tests/test_module_review_covariance_panel.py \
            dev/tests/test_panel_stage_c_external.py \
            -q --tb=short
          python -m compileall -q statgpu/panel dev/benchmarks/validate_panel_stage_c_gpu.py
          git diff --check
      - name: Commit validated fix
        run: |
          git config user.name "Ziqian Lin"
          git config user.email "51812297+TheHiddenObserver@users.noreply.github.com"
          git add \
            statgpu/panel/_covariance.py \
            dev/tests/test_panel_stage_c_covariance.py \
            dev/tests/test_panel_stage_b_torch_cpu.py \
            dev/tests/test_panel_stage_c_physical_runner_contract.py \
            dev/benchmarks/validate_panel_stage_c_gpu.py
          git commit -m "fix: preserve nonnested cluster cancellation"
          git push origin HEAD:agent/panel-p1-stage-c-covariance
