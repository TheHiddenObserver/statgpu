name: PR129 Torch CPU provenance fix

on:
  push:
    branches:
      - agent/post-v0.2.5-next-phase-plan
    paths:
      - '.github/workflows/pr129-torch-cpu-provenance-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/post-v0.2.5-next-phase-plan
          fetch-depth: 0
      - name: Apply reviewed backend-device provenance fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('statgpu/linear_model/penalized/_base.py')
          text = path.read_text()
          old = '''        selected_device = getattr(self, "_selected_backend_device", None)\n        if backend_name == "numpy":\n            selected_device = "cpu"\n        elif not str(selected_device or "").startswith("cuda:"):\n            raise RuntimeError(\n                "Gaussian inference is missing concrete executed-device provenance "\n                f"for backend={backend_name!r}: {selected_device!r}"\n            )\n'''
          new = '''        selected_device = getattr(self, "_selected_backend_device", None)\n        device_label = str(selected_device or "")\n        if backend_name == "numpy":\n            selected_device = "cpu"\n        elif backend_name == "cupy":\n            if not device_label.startswith("cuda:"):\n                raise RuntimeError(\n                    "Gaussian inference is missing concrete executed-device provenance "\n                    f"for backend={backend_name!r}: {selected_device!r}"\n                )\n        elif device_label != "cpu" and not device_label.startswith("cuda:"):\n            raise RuntimeError(\n                "Gaussian inference is missing concrete executed-device provenance "\n                f"for backend={backend_name!r}: {selected_device!r}"\n            )\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one provenance block, found {text.count(old)}')
          path.write_text(text.replace(old, new))

          workflow = Path('.github/workflows/pr129-torch-cpu-provenance-fix.yml')
          workflow.unlink()
          PY
          python -m compileall -q statgpu/linear_model/penalized/_base.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'no changes produced'; exit 1; }
          git commit -m "fix(inference): accept concrete Torch CPU provenance"
          git push origin HEAD:agent/post-v0.2.5-next-phase-plan
