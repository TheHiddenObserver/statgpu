name: PR87 opt-in torch compile policy

on:
  push:
    branches:
      - agent/maintenance-0.2.4-0.2.5

permissions:
  contents: write

jobs:
  update-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0

      - name: Apply exact policy and test updates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source_path = Path("statgpu/backends/_torch_compile.py")
          source = source_path.read_text(encoding="utf-8")

          old_doc = '''"""Safe, centralized policy for internal :func:`torch.compile` use.

          statgpu iterative solvers reuse tensors across calls. PyTorch's
          ``reduce-overhead`` mode enables CUDA Graphs and can therefore expose
          overwritten-output lifecycle errors on PyTorch 2.1 and newer. Internal
          iterative call sites use ``default`` mode unless a user explicitly opts
          into another mode through ``STATGPU_TORCH_COMPILE_MODE``.
          """'''
          new_doc = '''"""Safe, centralized policy for internal :func:`torch.compile` use.

          statgpu iterative solvers reuse tensors across calls. PyTorch's
          ``reduce-overhead`` mode enables CUDA Graphs and can therefore expose
          overwritten-output lifecycle errors on PyTorch 2.1 and newer. Internal
          kernels therefore remain eager by default. Users can explicitly opt in
          to ``default`` or ``reduce-overhead`` compilation through
          ``STATGPU_TORCH_COMPILE_MODE``.
          """'''
          assert source.count(old_doc) == 1
          source = source.replace(old_doc, new_doc)

          pattern = re.compile(
              r"def resolve_torch_compile_mode\(.*?\n\n\ndef torch_compile_available",
              re.S,
          )
          match = pattern.search(source)
          assert match is not None
          replacement = '''def resolve_torch_compile_mode(
              *,
              workload: str = "general",
              requested_mode: Optional[str] = None,
          ) -> Optional[str]:
              """Resolve an explicitly opted-in mode for a statgpu callable.

              ``auto`` is intentionally eager. ``workload`` and ``requested_mode``
              remain part of the internal call-site contract, but neither can
              silently enable compilation when the environment is unset or set to
              ``auto``.
              """
              configured = os.environ.get(_ENV_NAME, "auto").strip().lower()
              if configured not in _ALLOWED_MODES:
                  allowed = ", ".join(sorted(_ALLOWED_MODES))
                  raise ValueError(
                      f"{_ENV_NAME} must be one of {allowed}; got {configured!r}"
                  )
              if configured in {"auto", "disable"}:
                  return None
              return configured


          def torch_compile_available'''
          source = source[: match.start()] + replacement + source[match.end() :]
          source_path.write_text(source, encoding="utf-8")

          test_path = Path("dev/tests/test_maintenance_024_025.py")
          tests = test_path.read_text(encoding="utf-8")
          old_policy_test = '''def test_iterative_compile_policy_defaults_to_non_cudagraph_mode(monkeypatch):
              from statgpu.backends._torch_compile import resolve_torch_compile_mode

              monkeypatch.delenv("STATGPU_TORCH_COMPILE_MODE", raising=False)
              assert resolve_torch_compile_mode(workload="iterative") == "default"
              monkeypatch.setenv("STATGPU_TORCH_COMPILE_MODE", "disable")
              assert resolve_torch_compile_mode(workload="iterative") is None
              monkeypatch.setenv("STATGPU_TORCH_COMPILE_MODE", "reduce-overhead")
              assert resolve_torch_compile_mode(workload="iterative") == "reduce-overhead"
          '''
          new_policy_test = '''def test_iterative_compile_policy_defaults_to_eager_and_allows_opt_in(monkeypatch):
              from statgpu.backends._torch_compile import resolve_torch_compile_mode

              monkeypatch.delenv("STATGPU_TORCH_COMPILE_MODE", raising=False)
              assert resolve_torch_compile_mode(workload="iterative") is None
              assert resolve_torch_compile_mode(
                  workload="general", requested_mode="default"
              ) is None
              monkeypatch.setenv("STATGPU_TORCH_COMPILE_MODE", "auto")
              assert resolve_torch_compile_mode(workload="iterative") is None
              monkeypatch.setenv("STATGPU_TORCH_COMPILE_MODE", "disable")
              assert resolve_torch_compile_mode(workload="iterative") is None
              monkeypatch.setenv("STATGPU_TORCH_COMPILE_MODE", "default")
              assert resolve_torch_compile_mode(workload="iterative") == "default"
              monkeypatch.setenv("STATGPU_TORCH_COMPILE_MODE", "reduce-overhead")
              assert resolve_torch_compile_mode(workload="iterative") == "reduce-overhead"
          '''
          assert tests.count(old_policy_test) == 1
          tests = tests.replace(old_policy_test, new_policy_test)

          explicit_compile_tests = [
              "test_compile_runtime_cudagraph_failure_falls_back_once",
              "test_torch_lasso_py21_iterative_compile_smoke",
              "test_compile_construction_fallback_is_visible",
              "test_physical_cuda_compile_path_is_observable",
              "test_torch_penalty_compile_matrix_py21",
          ]
          for name in explicit_compile_tests:
              function_pattern = re.compile(
                  rf"(def {name}\(.*?)(?=\n\ndef |\Z)", re.S
              )
              function_match = function_pattern.search(tests)
              assert function_match is not None, name
              block = function_match.group(1)
              old = 'monkeypatch.delenv("STATGPU_TORCH_COMPILE_MODE", raising=False)'
              assert block.count(old) == 1, (name, block.count(old))
              block = block.replace(
                  old,
                  'monkeypatch.setenv("STATGPU_TORCH_COMPILE_MODE", "default")',
              )
              tests = (
                  tests[: function_match.start(1)]
                  + block
                  + tests[function_match.end(1) :]
              )
          test_path.write_text(tests, encoding="utf-8")

          new_test_path = Path("dev/tests/test_torch_compile_default_policy.py")
          assert not new_test_path.exists()
          new_test_path.write_text(
              '''"""Regression coverage for the opt-in torch.compile policy."""

          from __future__ import annotations


          def test_auto_mode_returns_observable_eager_wrapper(monkeypatch):
              from statgpu.backends._torch_compile import (
                  compile_torch,
                  get_torch_compile_diagnostics,
              )

              monkeypatch.delenv("STATGPU_TORCH_COMPILE_MODE", raising=False)
              get_torch_compile_diagnostics(clear=True)

              wrapped = compile_torch(lambda value: value + 1, workload="iterative")

              assert wrapped(2) == 3
              assert wrapped.__statgpu_compile_mode__ is None
              assert wrapped.__statgpu_compile_status__ == "disabled"
              events = get_torch_compile_diagnostics(clear=True)
              assert events[-1]["status"] == "disabled"
              assert events[-1]["mode"] is None


          def test_requested_mode_cannot_silently_override_auto(monkeypatch):
              from statgpu.backends._torch_compile import resolve_torch_compile_mode

              monkeypatch.setenv("STATGPU_TORCH_COMPILE_MODE", "auto")
              assert resolve_torch_compile_mode(
                  workload="general", requested_mode="default"
              ) is None
              assert resolve_torch_compile_mode(
                  workload="general", requested_mode="reduce-overhead"
              ) is None
          ''',
              encoding="utf-8",
          )
          PY

      - name: Validate syntax and targeted CPU policy tests
        shell: bash
        run: |
          python -m compileall -q statgpu/backends/_torch_compile.py \
            dev/tests/test_maintenance_024_025.py \
            dev/tests/test_torch_compile_default_policy.py
          python -m pip install -q -e .
          python -m pytest -q \
            dev/tests/test_maintenance_024_025.py::test_iterative_compile_policy_defaults_to_eager_and_allows_opt_in \
            dev/tests/test_maintenance_024_025.py::test_compile_runtime_cudagraph_failure_falls_back_once \
            dev/tests/test_maintenance_024_025.py::test_compile_construction_fallback_is_visible \
            dev/tests/test_torch_compile_default_policy.py \
            dev/tests/test_torch_compile_benchmark_contract.py

      - name: Audit policy references
        shell: bash
        run: |
          grep -RIn --exclude-dir=.git \
            "STATGPU_TORCH_COMPILE_MODE\|defaults_to_non_cudagraph\|use.*default.*unless" \
            statgpu dev docs README* pyproject.toml || true

      - name: Commit policy update and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/pr87-opt-in-compile-policy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add statgpu/backends/_torch_compile.py \
            dev/tests/test_maintenance_024_025.py \
            dev/tests/test_torch_compile_default_policy.py \
            .github/workflows/pr87-opt-in-compile-policy.yml
          git commit -m "fix: make torch compile explicitly opt-in"
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
