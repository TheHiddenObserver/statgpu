name: PR126 Strict Variance Guard Autofix

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - '.github/workflows/pr126-strict-negative-variance-autofix.yml'

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply strict variance and coverage patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: replacement count={count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'statgpu/panel/_base.py',
              '''        diag = xp.diag(cov_params)\n        cov_np = self._panel_cov_params_raw\n        diag_np = np.diag(cov_np).astype(np.float64, copy=False)\n        row_scale = np.max(np.abs(cov_np), axis=1)\n        col_scale = np.max(np.abs(cov_np), axis=0)\n        local_scale = np.maximum(row_scale, col_scale)\n        negative_tol = 4096.0 * np.finfo(np.float64).eps * local_scale\n        if np.any(diag_np < -negative_tol):\n''',
              '''        diag = xp.diag(cov_params)\n        diag_np = np.diag(self._panel_cov_params_raw).astype(\n            np.float64, copy=False\n        )\n        # A variance is invalid whenever it is strictly negative. There is no\n        # dimensionally valid generic tolerance that can distinguish a small\n        # negative variance from cancellation using only the final covariance:\n        # outcome and regressor rescaling transform covariance entries at\n        # different rates. IEEE negative zero compares equal to zero and is\n        # normalized below without weakening this fail-closed rule.\n        if np.any(diag_np < 0.0):\n''',
          )
          replace_once(
              'statgpu/panel/_base.py',
              '''        # Only suppress elementwise roundoff-scale negative zeros.  A material\n        # negative variance must fail closed before any historical diagonal floor\n        # is used, even when another coefficient has a much larger variance.\n''',
              '''        # Normalize signed zero before any historical diagonal floor is used.\n''',
          )

          p = Path('dev/tests/test_panel_stage_c_inference_guard.py')
          text = p.read_text(encoding='utf-8')
          start = text.index('def test_negative_variance_guard_is_scale_equivariant')
          replacement = '''def test_negative_variance_guard_is_scale_equivariant(monkeypatch):\n    \"\"\"Outcome/parameter rescaling cannot change covariance validity.\"\"\"\n    material = np.array([[4.0e-14, 0.0], [0.0, -1.0e-28]])\n    for multiplier in (1.0e-12, 1.0, 1.0e12):\n        with pytest.raises(ValueError, match=\"materially negative diagonal variance\"):\n            _store_with_mock_covariance(monkeypatch, material * multiplier)\n\n    # A large off-diagonal entry must never mask a negative variance. This also\n    # guards against row/column-norm tolerances that change units under regressor\n    # reparameterization.\n    indefinite = np.array([[1.0, 1.0e8], [1.0e8, -1.0e-20]])\n    with pytest.raises(ValueError, match=\"materially negative diagonal variance\"):\n        _store_with_mock_covariance(monkeypatch, indefinite)\n\n    signed_zero = np.array([[4.0e-14, 0.0], [0.0, -0.0]])\n    model = _store_with_mock_covariance(monkeypatch, signed_zero)\n    assert np.all(np.isfinite(model.bse_))\n    assert model.bse_[1] >= 0.0\n'''
          p.write_text(text[:start] + replacement, encoding='utf-8')

          p = Path('dev/tests/test_panel_stage_c_rank_deficient_matrix.py')
          text = p.read_text(encoding='utf-8')
          marker = '''    pairs = [\n        (PanelOLS(cov_type=cov_type).fit(X1, y),\n         PanelOLS(cov_type=cov_type).fit(X2, y), X1, X2),\n'''
          insert = '''    pairs = [\n        (PanelOLS(cov_type=cov_type).fit(X1, y),\n         PanelOLS(cov_type=cov_type).fit(X2, y), X1, X2),\n        (PanelOLS(entity_effects=True, cov_type=cov_type).fit(\n             X1, y, entity_ids=entity),\n         PanelOLS(entity_effects=True, cov_type=cov_type).fit(\n             X2, y, entity_ids=entity), X1, X2),\n'''
          if marker not in text:
              raise SystemExit('rank matrix insertion marker missing')
          p.write_text(text.replace(marker, insert, 1), encoding='utf-8')
          PY
      - name: Install focused environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" pytest pandas patsy "linearmodels==7.0" statsmodels
          python -m pip install "torch==2.0.1+cpu" --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Run re-review matrix
        run: |
          python -m pytest \
            dev/tests/test_panel_stage_c_rank_deficient_matrix.py \
            dev/tests/test_panel_stage_c_inference_guard.py \
            dev/tests/test_panel_stage_c_covariance.py \
            dev/tests/test_panel_stage_c_external.py \
            dev/tests/test_panel_stage_c_linearmodels_estimators.py \
            dev/tests/test_panel_stage_c_edge_contracts.py \
            -q --tb=short
          python -m compileall -q statgpu/panel
          git diff --check
      - name: Commit validated re-review fix
        run: |
          rm .github/workflows/pr126-strict-negative-variance-autofix.yml
          git config user.name "chatgpt-codex-connector"
          git config user.email "1144995+chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add statgpu/panel/_base.py dev/tests/test_panel_stage_c_inference_guard.py dev/tests/test_panel_stage_c_rank_deficient_matrix.py
          git add -u .github/workflows/pr126-strict-negative-variance-autofix.yml
          git commit -m "fix: make panel variance guard scale invariant"
          git push origin HEAD:agent/panel-p1-stage-c-covariance
