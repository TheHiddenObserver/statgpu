name: PR126 physical prediction follow-up

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - '.github/workflows/pr126-physical-prediction-followup.yml'

permissions:
  contents: write

jobs:
  followup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install targeted dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pandas patsy
      - name: Apply guarded physical prediction coverage patch
        run: python dev/pr126_expand_physical_prediction_gate.py
      - name: Run focused regression coverage
        run: |
          python -m pytest \
            dev/tests/test_panel_stage_c_final_review_fixes.py \
            -q --tb=short
      - name: Verify scope, remove temporary machinery, and commit
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              'dev/benchmarks/validate_panel_stage_c_gpu.py',
              'dev/tests/test_panel_stage_c_final_review_fixes.py',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f'unexpected physical prediction review scope: {sorted(changed)}')
          PY
          git rm \
            .github/workflows/pr126-physical-prediction-followup.yml \
            dev/pr126_expand_physical_prediction_gate.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            dev/benchmarks/validate_panel_stage_c_gpu.py \
            dev/tests/test_panel_stage_c_final_review_fixes.py
          git commit -m 'test(panel): cover final prediction paths in physical gate'
          git push origin HEAD:agent/panel-p1-stage-c-covariance
