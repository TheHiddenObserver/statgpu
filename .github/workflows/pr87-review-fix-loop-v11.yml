        y_arr, X_arr, design_info = parser.eval(data)
        return y_arr, X_arr, design_info, parser.row_positions
    y_arr = np.asarray(y)
    if y_arr.ndim == 2 and y_arr.shape[1] == 1:
        y_arr = y_arr.ravel()
    return y_arr, np.asarray(X), None, None
