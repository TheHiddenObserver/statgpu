name: PR87 review fix batch v11

on:
  push:
    branches: [agent/maintenance-0.2.4-0.2.5]
    paths:
      - .github/workflows/pr87-review-fix-loop-v11.yml

permissions:
  contents: write

jobs:
  apply-review-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Patch GLM formula weights and compile evidence gates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              path = Path(path)
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise RuntimeError(f"patch anchor missing in {path}: {old[:100]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          # FormulaParser exposes exact retained row positions; use them for
          # side-array alignment instead of the tuple-only convenience API.
          replace_once(
              "statgpu/linear_model/_glm_base.py",
              '''def _parse_formula_if_provided(formula, data, X, y):
    """Parse formula+data or fall back to raw arrays. Returns (y, X, info)."""
    if formula is not None:
        from statgpu.core.formula import parse_formula
        return parse_formula(formula, data)
    y = np.asarray(y)
