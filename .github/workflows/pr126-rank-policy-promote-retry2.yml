name: PR126 rank-policy canonical promotion retry 2

on:
  push:
    branches: [agent/panel-p1-stage-c-covariance]
    paths:
      - '.github/workflows/pr126-rank-policy-promote-retry2.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply reviewed promotion patch and canonical fixture updates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/pr126-rank-policy-promote.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(workflow) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          block = workflow[start:end]
          indent = min(len(line) - len(line.lstrip()) for line in block if line.strip())
          Path('/tmp/pr126_promote_patch.py').write_text(
              '\n'.join(line[indent:] for line in block) + '\n', encoding='utf-8'
          )
          PY
          python /tmp/pr126_promote_patch.py
          python - <<'PY'
          from pathlib import Path

          CORR_ID = 'panel-stage-c-rank-policy-validation-pr126-20260811-c67ada7ec59f'
          PERF_ID = 'panel-stage-c-rank-policy-performance-pr126-20260811-f27bef0b7c55'

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise RuntimeError(f'{path}: expected {expected} occurrences, found {count}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          path = 'dev/tests/test_benchmark_frontend_data.py'
          replace_exact(path, 'assert len(manifest["sources"]) == 13', 'assert len(manifest["sources"]) == 15')
          replace_exact(path, 'assert report["files_seen"] == 13', 'assert report["files_seen"] == 15')
          replace_exact(path, 'assert report["files_parsed"] == 13', 'assert report["files_parsed"] == 15')
          replace_exact(path, 'assert inventory["registered_sources"] == 13', 'assert inventory["registered_sources"] == 15')
          replace_exact(path, 'assert inventory["available_sources"] == 13', 'assert inventory["available_sources"] == 15')
          replace_exact(path, 'assert inventory["parsed_sources"] == 13', 'assert inventory["parsed_sources"] == 15')

          path = 'dev/tests/test_benchmark_catalog.py'
          old_sources = '''    assert rows["panel-estimation"]["source_ids"] == [\n        "new-modules-20260624-bcbdb676223b",\n        "panel-stage-b-pr122-20260809-2056f836bfe2",\n        "panel-stage-c-validation-pr126-20260811-af2227efe3cd",\n        "panel-stage-c-performance-pr126-20260811-409974070022",\n    ]\n'''
          new_sources = f'''    assert rows["panel-estimation"]["source_ids"] == [\n        "new-modules-20260624-bcbdb676223b",\n        "panel-stage-b-pr122-20260809-2056f836bfe2",\n        "panel-stage-c-validation-pr126-20260811-af2227efe3cd",\n        "panel-stage-c-performance-pr126-20260811-409974070022",\n        "{CORR_ID}",\n        "{PERF_ID}",\n    ]\n'''
          replace_exact(path, old_sources, new_sources)
          replace_exact(
              path,
              'assert inventory["registered_sources"] == len(manifest["sources"]) == 13',
              'assert inventory["registered_sources"] == len(manifest["sources"]) == 15',
          )
          replace_exact(path, 'assert inventory["available_registered_sources"] == 13', 'assert inventory["available_registered_sources"] == 15')
          replace_exact(path, 'assert inventory["parsed_registered_sources"] == 13', 'assert inventory["parsed_registered_sources"] == 15')

          path = 'dev/tests/test_benchmark_inventory_v2.py'
          replace_exact(path, 'assert len(registered) == inventory["registered_sources"] == 13', 'assert len(registered) == inventory["registered_sources"] == 15')
          replace_exact(path, 'assert serialized["available_registered_sources"] == 13', 'assert serialized["available_registered_sources"] == 15')
          replace_exact(path, 'assert serialized["parsed_registered_sources"] == 13', 'assert serialized["parsed_registered_sources"] == 15')
          replace_exact(path, 'assert inventory["available_sources"] == 13', 'assert inventory["available_sources"] == 15')
          replace_exact(path, 'assert inventory["parsed_sources"] == 13', 'assert inventory["parsed_sources"] == 15')

          path = 'dev/tests/test_frontend_domain_coverage.py'
          replace_exact(path, 'assert len(manifest["sources"]) == 13', 'assert len(manifest["sources"]) == 15')
          replace_exact(path, 'assert len(output["runs"]) == 1984', 'assert len(output["runs"]) == 2120')
          replace_exact(path, 'assert report["runs_generated"] == 1984', 'assert report["runs_generated"] == 2120')
          PY
      - name: Validate and regenerate canonical benchmark bundle
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e . pytest 'jsonschema[format]'
          python dev/benchmarks/generate_benchmark_data.py \
            --out frontend/public/data/benchmark_data.json \
            --report frontend/public/data/parse_report.json \
            --inventory-out frontend/public/data/source_inventory.json \
            --deterministic --strict-sources
          python -m pytest \
            dev/tests/test_panel_stage_c_frontend_source.py \
            dev/tests/test_benchmark_frontend_data.py \
            dev/tests/test_benchmark_catalog.py \
            dev/tests/test_benchmark_inventory_v2.py \
            dev/tests/test_frontend_domain_coverage.py -q
          python dev/benchmarks/generate_benchmark_data.py --check --strict-sources
          git diff --check
      - name: Build benchmark frontend
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npm ci
          npm run typecheck
          npm run build
      - name: Enforce exact-source applicability and commit promotion
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git diff --name-only 3dc7df19176f8fb881a8d37e9d75b4f75e71b058 -- 'statgpu/panel/**' 'dev/benchmarks/validate_panel_stage_c_gpu.py' 'dev/benchmarks/benchmark_panel_stage_c_covariance.py')"
          if [ -n "$forbidden" ]; then
            echo "Promotion changed numerical source or physical runners:" >&2
            printf '%s\n' "$forbidden" >&2
            exit 1
          fi
          rm -f .github/workflows/pr126-rank-policy-raw-audit.yml
          rm -f .github/workflows/pr126-rank-policy-promote.yml
          rm -f .github/workflows/pr126-rank-policy-promote-retry.yml
          rm -f .github/workflows/pr126-rank-policy-promote-retry2.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "benchmark: promote PR126 rank-policy P100 evidence"
          git push origin HEAD:agent/panel-p1-stage-c-covariance
