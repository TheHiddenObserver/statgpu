name: PR122 Pending Changelog Sync V2

on:
  push:
    branches:
      - agent/panel-p1-stage-b-diagnostics
    paths:
      - .github/workflows/pr122-sync-pending-changelog-v2.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-b-diagnostics
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update EN/CN changelog status
        run: python -c "import base64; exec(base64.b64decode(' ...TRUNCATED_FOR_DISPLAY... '))"
      - name: Validate changelog diff
        run: |
          git diff --check
          git diff -- docs/en/changelog.md docs/cn/changelog.md
      - name: Commit changelog sync and remove temporary workflows
        run: |
          rm .github/workflows/pr122-sync-pending-changelog.yml
          rm .github/workflows/pr122-sync-pending-changelog-v2.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: mark PR122 applicable Hausman physical gate pending'
          git push origin HEAD:agent/panel-p1-stage-b-diagnostics
