name: PR87 review round 5 fix

on:
  push:
    branches: [agent/maintenance-0.2.4-0.2.5]
    paths: [.github/workflows/pr87-review-round5-fix.yml]

permissions:
  contents: write

jobs:
  fix-test-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply convergence and control-contract fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one anchor, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Shared IRLS: validate public controls and track real convergence.
          replace_once(
              "statgpu/glm_core/_irls.py",
              "import warnings\nfrom typing import Optional\n",
              "import warnings\nfrom numbers import Integral, Real\nfrom typing import Optional\n",
          )
          replace_once(
              "statgpu/glm_core/_irls.py",
              '''    from statgpu.glm_core._validation import (\n        validate_glm_design_matrix,\n        validate_glm_sample_weight,\n    )\n\n    X_validated = validate_glm_design_matrix(X)\n    if backend == "auto":\n        backend = _infer_backend(X_validated)\n''',
              '''    from statgpu.glm_core._validation import (\n        validate_glm_design_matrix,\n        validate_glm_sample_weight,\n    )\n\n    if isinstance(max_iter, bool) or not isinstance(max_iter, Integral) or int(max_iter) < 1:\n        raise ValueError("max_iter must be a positive integer")\n    if isinstance(tol, bool) or not isinstance(tol, Real):\n        raise ValueError("tol must be a finite positive real number")\n    tol = float(tol)\n    if not np.isfinite(tol) or tol <= 0.0:\n        raise ValueError("tol must be a finite positive real number")\n    if isinstance(ridge_alpha, bool) or not isinstance(ridge_alpha, Real):\n        raise ValueError("ridge_alpha must be a finite non-negative real number")\n    ridge_alpha = float(ridge_alpha)\n    if not np.isfinite(ridge_alpha) or ridge_alpha < 0.0:\n        raise ValueError("ridge_alpha must be a finite non-negative real number")\n    if not isinstance(ridge_penalize_intercept, (bool, np.bool_)):\n        raise ValueError("ridge_penalize_intercept must be boolean")\n    max_iter = int(max_iter)\n\n    X_validated = validate_glm_design_matrix(X)\n    if backend == "auto":\n        backend = _infer_backend(X_validated)\n    backend = str(backend).lower()\n    backend = {"cpu": "numpy", "cuda": "cupy"}.get(backend, backend)\n    if backend not in {"numpy", "cupy", "torch"}:\n        raise ValueError("backend must be one of: 'auto', 'numpy', 'cupy', 'torch'")\n''',
          )
          replace_once(
              "statgpu/glm_core/_irls.py",
              '''    penalty_matrix_work = (\n        _to_backend(penalty_matrix, backend, X)\n        if penalty_matrix is not None else None\n    )\n    line_search_failed = False\n    iteration = 0\n''',
              '''    penalty_matrix_work = (\n        _to_backend(penalty_matrix, backend, X)\n        if penalty_matrix is not None else None\n    )\n    if penalty_matrix_work is not None and tuple(penalty_matrix_work.shape) != (\n        n_features, n_features\n    ):\n        raise ValueError(\n            "penalty_matrix must have shape (X.shape[1], X.shape[1])"\n        )\n    line_search_failed = False\n    converged = False\n    iteration = 0\n''',
          )
          replace_once(
              "statgpu/glm_core/_irls.py",
              '''        if iteration % 5 == 4 or iteration == max_iter - 1:\n''',
              '''        if is_constant_weight or iteration % 5 == 4 or iteration == max_iter - 1:\n''',
          )
          replace_once(
              "statgpu/glm_core/_irls.py",
              '''            if grad_norm < tol:\n                break\n\n    n_iter = iteration + 1\n''',
              '''            if grad_norm < tol:\n                converged = True\n                break\n\n    n_iter = iteration + 1\n''',
          )
          replace_once(
              "statgpu/glm_core/_irls.py",
              '''    elif n_iter >= max_iter:\n        warnings.warn(\n''',
              '''    elif not converged:\n        warnings.warn(\n''',
          )

          # Direct LogisticRegression: canonical fit controls and visible convergence.
          replace_once(
              "statgpu/linear_model/wrappers/_logistic.py",
              '''from typing import Any, Dict, Optional, Union, Tuple\nimport numpy as np\n''',
              '''from numbers import Integral, Real\nfrom typing import Any, Dict, Optional, Union, Tuple\nimport warnings\n\nimport numpy as np\n''',
          )
          replace_once(
              "statgpu/linear_model/wrappers/_logistic.py",
              '''from statgpu.metrics import (\n''',
              '''from statgpu.solvers._convergence import ConvergenceWarning\nfrom statgpu.metrics import (\n''',
          )
          replace_once(
              "statgpu/linear_model/wrappers/_logistic.py",
              '''    C : float, default=1.0\n        Inverse of regularization strength; must be a positive float.\n        Smaller values specify stronger regularization.\n''',
              '''    C : float, default=1.0\n        Inverse of regularization strength. Positive values use L2\n        regularization; ``C=0`` preserves the legacy unregularized path.\n''',
          )
          replace_once(
              "statgpu/linear_model/wrappers/_logistic.py",
              '''            "_accuracy_gpu",\n        ):\n            setattr(self, name, None)\n\n    def _cleanup_cuda_memory(self):\n''',
              '''            "_accuracy_gpu",\n            "converged_",\n        ):\n            setattr(self, name, None)\n\n    def _validate_fit_controls(self):\n        """Validate and snapshot public controls for the current fit."""\n        if not isinstance(self.fit_intercept, (bool, np.bool_)):\n            raise ValueError("fit_intercept must be boolean")\n        if isinstance(self.C, bool) or not isinstance(self.C, Real):\n            raise ValueError("C must be a finite non-negative real number")\n        C = float(self.C)\n        if not np.isfinite(C) or C < 0.0:\n            raise ValueError("C must be a finite non-negative real number")\n        if (\n            isinstance(self.max_iter, bool)\n            or not isinstance(self.max_iter, Integral)\n            or int(self.max_iter) < 1\n        ):\n            raise ValueError("max_iter must be a positive integer")\n        if isinstance(self.tol, bool) or not isinstance(self.tol, Real):\n            raise ValueError("tol must be a finite positive real number")\n        tol = float(self.tol)\n        if not np.isfinite(tol) or tol <= 0.0:\n            raise ValueError("tol must be a finite positive real number")\n        if not isinstance(self.compute_inference, (bool, np.bool_)):\n            raise ValueError("compute_inference must be boolean")\n        if not isinstance(self.gpu_memory_cleanup, (bool, np.bool_)):\n            raise ValueError("gpu_memory_cleanup must be boolean")\n        if not isinstance(self.cov_type, str):\n            raise ValueError("cov_type must be a string")\n        cov_type = self.cov_type.lower()\n        valid_cov = {"nonrobust", "hc0", "hc1", "hc2", "hc3", "hac"}\n        if cov_type not in valid_cov:\n            raise ValueError(\n                "cov_type must be one of: 'nonrobust', 'hc0', 'hc1', "\n                "'hc2', 'hc3', 'hac'"\n            )\n        if self.hac_maxlags is not None and (\n            isinstance(self.hac_maxlags, bool)\n            or not isinstance(self.hac_maxlags, Integral)\n            or int(self.hac_maxlags) < 0\n        ):\n            raise ValueError("hac_maxlags must be a non-negative integer or None")\n\n        self._fit_intercept = bool(self.fit_intercept)\n        self._C = C\n        self._max_iter = int(self.max_iter)\n        self._tol = tol\n        self._compute_inference_enabled = bool(self.compute_inference)\n        self._gpu_memory_cleanup = bool(self.gpu_memory_cleanup)\n        self._cov_type = cov_type\n        self._hac_maxlags = (\n            None if self.hac_maxlags is None else int(self.hac_maxlags)\n        )\n\n    def _publish_convergence(self, converged):\n        self.converged_ = bool(converged)\n        if not self.converged_:\n            warnings.warn(\n                f"LogisticRegression IRLS did not converge within "\n                f"{self._max_iter} iterations.",\n                ConvergenceWarning,\n                stacklevel=3,\n            )\n\n    def _cleanup_cuda_memory(self):\n''',
          )
          replace_once(
              "statgpu/linear_model/wrappers/_logistic.py",
              '''        self._train_pred_cache = None\n        self._train_eval_cache = None\n\n        # Validate shape/domain before backend-specific unpacking.\n''',
              '''        self._validate_fit_controls()\n        self._train_pred_cache = None\n        self._train_eval_cache = None\n\n        # Validate shape/domain before backend-specific unpacking.\n''',
          )
          text_path = Path("statgpu/linear_model/wrappers/_logistic.py")
          text = text_path.read_text(encoding="utf-8")
          text = text.replace("alpha = 1.0 / self.C if self.C > 0 else 0.0", "alpha = 1.0 / self._C if self._C > 0 else 0.0")
          if text.count("alpha = 1.0 / self._C if self._C > 0 else 0.0") != 4:
              raise RuntimeError("expected four LogisticRegression alpha normalizations")
          # CPU, CuPy, Torch loops: explicit convergence state and publication.
          text = text.replace(
              '''        iteration = 0\n        for iteration in range(self._max_iter):\n''',
              '''        iteration = 0\n        converged = False\n        for iteration in range(self._max_iter):\n''',
              3,
          )
          text = text.replace(
              '''            if np.linalg.norm(params - params_old) < self._tol:\n                break\n        \n        self.n_iter_ = iteration + 1\n''',
              '''            if np.linalg.norm(params - params_old) < self._tol:\n                converged = True\n                break\n        \n        self.n_iter_ = iteration + 1\n        self._publish_convergence(converged)\n''',
              1,
          )
          text = text.replace(
              '''            if cp.linalg.norm(params - params_old) < self._tol:\n                break\n        \n        self.n_iter_ = iteration + 1\n''',
              '''            if bool((cp.linalg.norm(params - params_old) < self._tol).item()):\n                converged = True\n                break\n        \n        self.n_iter_ = iteration + 1\n        self._publish_convergence(converged)\n''',
              1,
          )
          text = text.replace(
              '''            if torch.linalg.norm(params - params_old) < self._tol:\n                break\n\n        self.n_iter_ = iteration + 1\n''',
              '''            if bool((torch.linalg.norm(params - params_old) < self._tol).item()):\n                converged = True\n                break\n\n        self.n_iter_ = iteration + 1\n        self._publish_convergence(converged)\n''',
              1,
          )
          text_path.write_text(text, encoding="utf-8")

          test_path = Path("dev/tests/test_pr87_code_review_fix_cycle.py")
          tests = test_path.read_text(encoding="utf-8")
          tests += '''\n\ndef test_shared_irls_convergence_on_last_iteration_emits_no_false_warning():\n    import warnings\n\n    from statgpu.glm_core._family import Gaussian\n    from statgpu.glm_core._irls import IRLSSolver\n    from statgpu.solvers import ConvergenceWarning\n\n    X = np.column_stack([np.ones(5), np.linspace(-1.0, 1.0, 5)])\n    y = 0.5 + 2.0 * X[:, 1]\n    with warnings.catch_warnings(record=True) as caught:\n        warnings.simplefilter("always")\n        params, n_iter = IRLSSolver(Gaussian(), max_iter=1, tol=1e-12).fit(\n            X, y, backend="numpy"\n        )\n    assert n_iter == 1\n    assert not any(isinstance(w.message, ConvergenceWarning) for w in caught)\n    np.testing.assert_allclose(params, [0.5, 2.0], atol=1e-12)\n\n\n@pytest.mark.parametrize(\n    "kwargs, message",\n    [\n        ({"max_iter": 0}, "max_iter"),\n        ({"max_iter": True}, "max_iter"),\n        ({"tol": 0.0}, "tol"),\n        ({"tol": np.nan}, "tol"),\n        ({"ridge_alpha": -1.0}, "ridge_alpha"),\n        ({"ridge_penalize_intercept": 1}, "ridge_penalize_intercept"),\n        ({"backend": "mystery"}, "backend"),\n    ],\n)\ndef test_shared_irls_rejects_invalid_controls(kwargs, message):\n    from statgpu.glm_core._family import Gaussian\n    from statgpu.glm_core._irls import IRLSSolver\n\n    solver_kwargs = {k: v for k, v in kwargs.items() if k in {"max_iter", "tol"}}\n    fit_kwargs = {k: v for k, v in kwargs.items() if k not in solver_kwargs}\n    with pytest.raises(ValueError, match=message):\n        IRLSSolver(Gaussian(), **solver_kwargs).fit(\n            np.ones((4, 1)), np.arange(4.0), **fit_kwargs\n        )\n\n\ndef test_shared_irls_rejects_bad_penalty_matrix_shape():\n    from statgpu.glm_core._family import Gaussian\n    from statgpu.glm_core._irls import IRLSSolver\n\n    with pytest.raises(ValueError, match="penalty_matrix"):\n        IRLSSolver(Gaussian()).fit(\n            np.ones((4, 2)), np.arange(4.0), penalty_matrix=np.eye(3)\n        )\n\n\ndef test_logistic_nonconvergence_is_visible_and_state_is_published():\n    from statgpu.linear_model import LogisticRegression\n    from statgpu.solvers import ConvergenceWarning\n\n    X = np.linspace(-2.0, 2.0, 20)[:, None]\n    y = (X[:, 0] > 0).astype(float)\n    model = LogisticRegression(\n        C=1.0, max_iter=1, tol=1e-14, device="cpu",\n        compute_inference=False,\n    )\n    with pytest.warns(ConvergenceWarning, match="did not converge"):\n        model.fit(X, y)\n    assert model._fitted is True\n    assert model.converged_ is False\n    assert model.n_iter_ == 1\n\n\ndef test_logistic_zero_C_legacy_unregularized_path_stays_finite():\n    from statgpu.linear_model import LogisticRegression\n\n    rng = np.random.default_rng(20260806)\n    X = rng.normal(size=(80, 2))\n    probability = 1.0 / (1.0 + np.exp(-(0.2 + X @ np.array([0.7, -0.4]))))\n    y = (rng.random(80) < probability).astype(float)\n    model = LogisticRegression(\n        C=0.0, max_iter=100, device="cpu", compute_inference=False\n    ).fit(X, y)\n    assert np.isfinite(model.coef_).all()\n    assert np.isfinite(model.intercept_)\n\n\n@pytest.mark.parametrize(\n    "name, value, message",\n    [\n        ("fit_intercept", "False", "fit_intercept"),\n        ("C", -1.0, "C"),\n        ("C", np.inf, "C"),\n        ("max_iter", 0, "max_iter"),\n        ("tol", 0.0, "tol"),\n        ("compute_inference", "False", "compute_inference"),\n        ("gpu_memory_cleanup", "False", "gpu_memory_cleanup"),\n        ("cov_type", "invalid", "cov_type"),\n        ("hac_maxlags", 1.5, "hac_maxlags"),\n    ],\n)\ndef test_logistic_invalid_mutated_control_clears_stale_state(\n    name, value, message\n):\n    model, X, y = _fitted_logistic_fixture()\n    setattr(model, name, value)\n    with pytest.raises(ValueError, match=message):\n        model.fit(X, y)\n    _assert_logistic_state_cleared(model)\n\n\ndef test_logistic_direct_control_mutation_is_used_by_refit():\n    from statgpu.linear_model import LogisticRegression\n\n    rng = np.random.default_rng(20260807)\n    X = rng.normal(size=(120, 2))\n    p = 1.0 / (1.0 + np.exp(-(0.3 + X @ np.array([0.8, -0.5]))))\n    y = (rng.random(120) < p).astype(float)\n    model = LogisticRegression(\n        C=1.0, max_iter=100, fit_intercept=True, device="cpu",\n        compute_inference=False,\n    ).fit(X, y)\n    model.fit_intercept = False\n    model.C = 0.0\n    model.max_iter = 200\n    model.tol = 1e-8\n    model.fit(X, y)\n    assert model._fit_intercept is False\n    assert model._C == 0.0\n    assert model._max_iter == 200\n    assert model._tol == pytest.approx(1e-8)\n    assert model.intercept_ == 0.0\n'''
          test_path.write_text(tests, encoding="utf-8")
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation,formula]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run shared IRLS and direct Logistic suites
        run: |
          python -m pytest -q \
            dev/tests/test_pr87_code_review_fix_cycle.py \
            dev/tests/test_logistic.py \
            dev/tests/test_external_consistency.py \
            -k "irls or logistic"
      - name: Run solver and GLM regressions
        run: |
          python -m pytest -q \
            dev/tests/test_loss_penalty_solver_matrix.py \
            dev/tests/test_maintenance_024_025.py \
            -k "irls or logistic or convergence or sample_weight"
      - name: Static review gates
        run: |
          python -m compileall -q statgpu dev/tests/test_pr87_code_review_fix_cycle.py
          git diff --check
      - name: Commit fixes and self-delete
        shell: bash
        run: |
          rm .github/workflows/pr87-review-round5-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add statgpu dev/tests .github/workflows/pr87-review-round5-fix.yml
          git commit -m "fix: validate logistic controls and convergence"
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
