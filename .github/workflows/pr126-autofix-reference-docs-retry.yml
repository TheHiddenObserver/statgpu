name: PR126 reference docs autofix retry

on:
  push:
    branches: [agent/panel-p1-stage-c-covariance]
    paths:
      - .github/workflows/pr126-autofix-reference-docs-retry.yml

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reapply the already-reviewed patch script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          text = Path('.github/workflows/pr126-autofix-reference-docs.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n      - name: Install external test environment"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          script = textwrap.dedent(text[start:end])
          exec(compile(script, '<reviewed-pr126-patch>', 'exec'))
          PY
      - name: Install external test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . 'linearmodels==7.0' 'statsmodels==0.14.6' pytest
      - name: Re-run reviewed regressions
        run: |
          python -m pytest \
            dev/tests/test_panel_stage_c_external.py \
            dev/tests/test_panel_stage_c_external_defaults.py \
            dev/tests/test_panel_stage_c_linearmodels_estimators.py \
            -q --tb=short
          python -m pytest \
            dev/tests/test_panel_stage_c_covariance.py \
            dev/tests/test_panel_stage_c_edge_contracts.py \
            dev/tests/test_panel_stage_c_physical_runner_contract.py \
            -q --tb=short
          python -m py_compile dev/tests/test_panel_stage_c_external.py
          git diff --check
      - name: Verify current acceptance surfaces
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in [
              'CHANGELOG.md', 'docs/en/changelog.md', 'docs/cn/changelog.md',
              'docs/en/models/panel.md', 'docs/cn/models/panel.md',
              'dev/reviews/pr126_physical_gpu_validation.md',
          ]:
              text = Path(path).read_text()
              if path.endswith('pr126_physical_gpu_validation.md'):
                  assert 'SUPERSEDED BY LATER PRODUCTION FIXES / PARTIAL_REMOTE_PENDING' in text
              else:
                  assert '38/38' in text
          PY
      - name: Commit reviewed fixes and delete helpers
        shell: bash
        run: |
          git config user.name 'TheHiddenObserver'
          git config user.email '51812297+TheHiddenObserver@users.noreply.github.com'
          git add \
            dev/tests/test_panel_stage_c_external.py \
            docs/en/models/panel.md docs/cn/models/panel.md \
            CHANGELOG.md docs/en/changelog.md docs/cn/changelog.md \
            dev/reviews/pr126_physical_gpu_validation.md
          git add -f dev/plans/panel_p1_stage_c_covariance_plan.md
          git rm -f \
            .github/workflows/pr126-autofix-reference-docs.yml \
            .github/workflows/pr126-autofix-reference-docs-retry.yml
          git commit -m 'fix(panel): align rank reference and acceptance docs'
          git push origin HEAD:agent/panel-p1-stage-c-covariance
