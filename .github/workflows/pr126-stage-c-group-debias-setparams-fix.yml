name: PR126 Stage C group_debias set_params patch

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - '.github/workflows/pr126-stage-c-group-debias-setparams-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest
      - run: python dev/benchmarks/_pr126_patch_group_debias_set_params.py
      - run: python -m pytest dev/tests/test_panel_stage_c_set_params.py -q --tb=short
      - run: git diff --check
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add statgpu/panel/_base.py
          git commit -m 'fix: validate Stage C group_debias set_params'
          git push origin HEAD:agent/panel-p1-stage-c-covariance
