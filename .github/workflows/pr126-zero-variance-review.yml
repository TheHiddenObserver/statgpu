name: PR126 covariance extreme-scale review

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/pr126-zero-variance-review.yml'
      - 'dev/validation/pr126_covariance_extreme_scale_once.py'
      - 'dev/validation/pr126_covariance_extreme_scale_fixup.py'

permissions:
  contents: write

jobs:
  review-fix:
    if: github.event.pull_request.head.ref == 'agent/panel-p1-stage-c-covariance'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install maintained review environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" pytest
          python -m pip install "torch==2.0.1+cpu" --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[validation,formula]"
      - name: Apply covariance precision fixes
        id: patch
        continue-on-error: true
        run: |
          python dev/validation/pr126_covariance_extreme_scale_once.py
          python dev/validation/pr126_covariance_extreme_scale_fixup.py
      - name: Run isolated focused regressions
        id: focused
        if: steps.patch.outcome == 'success'
        run: |
          set +e
          result=/tmp/pr126_covariance_extreme_scale_result.txt
          : > "$result"
          failed=0
          run_case() {
            name="$1"; shift; log="/tmp/${name}.log"
            "$@" >"$log" 2>&1; rc=$?
            printf '%s=%s\n' "$name" "$rc" >> "$result"
            if [ "$rc" -ne 0 ]; then
              failed=1
              printf '\n--- %s tail ---\n' "$name" >> "$result"
              tail -n 140 "$log" >> "$result"
            fi
          }
          run_case covariance python -m pytest dev/tests/test_panel_stage_c_covariance.py -q --tb=short
          run_case inference_guard python -m pytest dev/tests/test_panel_stage_c_inference_guard.py -q --tb=short
          run_case torch_stage_a python -m pytest dev/tests/test_panel_stage_a_torch_cpu.py -q --tb=short
          run_case torch_stage_b python -m pytest dev/tests/test_panel_stage_b_torch_cpu.py -q --tb=short
          run_case physical_contract python -m pytest dev/tests/test_panel_stage_c_physical_runner_contract.py -q --tb=short
          run_case compile python -m compileall -q statgpu/panel dev/benchmarks/validate_panel_stage_c_gpu.py
          git diff --check >/tmp/diffcheck.log 2>&1; rc=$?
          printf 'diff_check=%s\n' "$rc" >> "$result"
          if [ "$rc" -ne 0 ]; then failed=1; cat /tmp/diffcheck.log >> "$result"; fi
          if [ "$failed" -eq 0 ]; then echo 'success=true' >> "$GITHUB_OUTPUT"; else echo 'success=false' >> "$GITHUB_OUTPUT"; fi
          cat "$result"
      - name: Commit result
        if: always()
        env:
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          FOCUSED_SUCCESS: ${{ steps.focused.outputs.success }}
        run: |
          git config user.name "Ziqian Lin"
          git config user.email "51812297+TheHiddenObserver@users.noreply.github.com"
          if [ "$PATCH_OUTCOME" = success ] && [ "$FOCUSED_SUCCESS" = true ]; then
            git rm -f --ignore-unmatch dev/validation/pr126_covariance_extreme_scale_result.txt
            git add statgpu/panel/_base.py statgpu/panel/_covariance.py dev/tests/test_panel_stage_c_covariance.py dev/tests/test_panel_stage_b_torch_cpu.py dev/tests/test_panel_stage_c_physical_runner_contract.py dev/benchmarks/validate_panel_stage_c_gpu.py
            git commit -m "fix: stabilize extreme-scale panel covariance arithmetic"
            git push origin HEAD:agent/panel-p1-stage-c-covariance
          else
            if [ -f /tmp/pr126_covariance_extreme_scale_result.txt ]; then cp /tmp/pr126_covariance_extreme_scale_result.txt dev/validation/pr126_covariance_extreme_scale_result.txt; else printf 'patch=%s\nfocused_success=%s\n' "$PATCH_OUTCOME" "$FOCUSED_SUCCESS" > dev/validation/pr126_covariance_extreme_scale_result.txt; fi
            git add dev/validation/pr126_covariance_extreme_scale_result.txt
            git commit -m "chore: diagnose PR126 covariance extreme-scale gate failure"
            git push origin HEAD:agent/panel-p1-stage-c-covariance
            exit 1
          fi
