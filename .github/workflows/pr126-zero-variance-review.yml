name: PR126 final clean-tree review

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/pr126-zero-variance-review.yml'
      - 'dev/validation/pr126_final_docs_once.py'

permissions:
  contents: write

jobs:
  clean-review:
    if: github.event.pull_request.head.ref == 'agent/panel-p1-stage-c-covariance'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install maintained review environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" pytest
          python -m pip install "torch==2.0.1+cpu" --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[validation,formula]"
      - name: Apply final documentation and remove review scaffolding
        run: |
          python dev/validation/pr126_final_docs_once.py
          git rm -f --ignore-unmatch \
            dev/validation/pr126_zero_variance_inference_once.py \
            dev/validation/pr126_zero_variance_tolerance_fix.py \
            dev/validation/pr126_zero_variance_result.txt \
            dev/validation/pr126_covariance_extreme_scale_once.py \
            dev/validation/pr126_covariance_extreme_scale_fixup.py \
            dev/validation/pr126_covariance_extreme_scale_test_fix.py \
            dev/validation/pr126_covariance_extreme_scale_result.txt \
            dev/validation/pr126_final_docs_once.py
          leftovers="$(find dev/validation -maxdepth 1 -type f -name 'pr126_*' -print)"
          if [ -n "$leftovers" ]; then
            echo "Unexpected PR126 review scaffolding remains:"
            echo "$leftovers"
            exit 1
          fi
      - name: Run clean-tree focused regressions and documentation gates
        run: |
          python -m pytest \
            dev/tests/test_panel_stage_c_covariance.py \
            dev/tests/test_panel_stage_c_inference_guard.py \
            dev/tests/test_panel_stage_a_torch_cpu.py \
            dev/tests/test_panel_stage_b_torch_cpu.py \
            dev/tests/test_fama_macbeth_review_fixes.py \
            dev/tests/test_panel_stage_c_physical_runner_contract.py \
            dev/tests/test_panel_stage_c_final_review_fixes.py \
            -q --tb=short
          python dev/validation/fix_docs_links.py --check
          python dev/validation/check_docs_contracts.py
          python -m compileall -q statgpu/panel dev/benchmarks/validate_panel_stage_c_gpu.py
          git diff --check
      - name: Commit clean reviewed tree
        run: |
          git config user.name "Ziqian Lin"
          git config user.email "51812297+TheHiddenObserver@users.noreply.github.com"
          git add CHANGELOG.md docs/en/panel/fama-macbeth.md docs/cn/panel/fama-macbeth.md docs/en/panel/covariance.md docs/cn/panel/covariance.md docs/en/changelog.md docs/cn/changelog.md dev/validation
          git commit -m "docs: finalize PR126 numerical review"
          git push origin HEAD:agent/panel-p1-stage-c-covariance
