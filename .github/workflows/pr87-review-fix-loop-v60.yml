name: PR87 review fix batch v60

on:
  push:
    branches:
      - agent/maintenance-0.2.4-0.2.5

permissions:
  contents: write

concurrency:
  group: pr87-review-fix-v60
  cancel-in-progress: false

jobs:
  apply-review-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply finite-guard lifecycle fixes
        run: python pr87_patch_v60.py
      - name: Install validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation,formula]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile changed modules
        run: |
          python -m py_compile \
            statgpu/_base.py \
            dev/tests/test_maintenance_024_025.py
      - name: Run targeted finite-guard lifecycle tests
        run: |
          python -m pytest \
            dev/tests/test_maintenance_024_025.py::test_cv_finite_guard_resets_stale_state_before_rejecting_input \
            dev/tests/test_maintenance_024_025.py::test_finite_guard_does_not_reset_cv_state_on_prediction_failure \
            -q --tb=short
      - name: Run full CPU and documentation validation
        run: |
          python -m pytest dev/tests -q --tb=short
          python dev/validation/fix_docs_links.py --check
          python dev/validation/check_docs_contracts.py
      - name: Commit reviewed source fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f \
            pr87_patch_v60.py \
            .github/workflows/pr87-review-fix-loop-v60.yml
          git add \
            statgpu/_base.py \
            dev/tests/test_maintenance_024_025.py \
            CHANGELOG.md docs/en/changelog.md docs/cn/changelog.md
          git commit -m "fix: reset CV state before finite validation"
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
