name: PR122 Applicable Hausman Autofix

on:
  push:
    branches:
      - agent/panel-p1-stage-b-diagnostics
    paths:
      - .github/workflows/pr122-autofix-applicable-hausman.yml

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-b-diagnostics
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Apply focused Hausman physical gate patch
        run: python -c "import base64; exec(base64.b64decode(''))"

      - name: Install physical-like targeted dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.24.2 scipy==1.10.1 joblib pytest
          python -m pip install -e . --no-deps

      - name: Run targeted Stage-B review gates
        run: |
          python -m pytest -q \
            dev/tests/test_panel_stage_b_physical_runner_contract.py \
            dev/tests/test_panel_stage_b_diagnostics.py \
            dev/tests/test_panel_stage_b_hausman_covariance.py \
            dev/tests/test_panel_stage_b_review_regressions.py
          python -m compileall -q dev/benchmarks/validate_panel_stage_b_gpu.py
          git diff --check

      - name: Commit focused fix and remove temporary carrier
        run: |
          rm .github/workflows/pr122-autofix-applicable-hausman.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: require applicable Hausman GPU coverage'
          git push origin HEAD:agent/panel-p1-stage-b-diagnostics
