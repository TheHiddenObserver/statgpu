def test_physical_runner_finds_applicable_hausman_reference_fixture():
    fixture = _find_applicable_hausman_fixture()
    result = fixture["reference"]

    assert result["applicable"] is True
    assert result["reason"] is None
    assert result["df"] is not None and float(result["df"]) > 0.0
    assert np.isfinite(float(result["statistic"]))
    assert np.isfinite(float(result["pvalue"]))
    assert fixture["X"].shape[0] == fixture["y"].shape[0]
    assert fixture["entity"].shape[0] == fixture["y"].shape[0]


def test_physical_runner_requires_applicable_hausman_per_backend():
    with pytest.raises(AssertionError, match="requires at least one applicable"):
        _require_applicable_hausman_coverage(
            {
                "hausman_balanced": {"applicable": False},
                "hausman_unbalanced": {"applicable": False},
            },
            backend="torch",
        )

    applicable = _require_applicable_hausman_coverage(
        {
            "hausman_balanced": {"applicable": False},
            "hausman_applicable_physical": {"applicable": True},
        },
        backend="cupy",
    )
    assert applicable == ["hausman_applicable_physical"]
'''
