name: PR122 Applicable Hausman Autofix

on:
  push:
    branches:
      - agent/panel-p1-stage-b-diagnostics
    paths:
      - .github/workflows/pr122-autofix-applicable-hausman.yml

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-b-diagnostics
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install -e .

      - name: Scan fitted Hausman regimes
        run: |
          python - <<'PY'
          import numpy as np
          from statgpu.panel import PanelOLS, RandomEffects

          best = None
          for n_entities in (12, 24, 32, 48):
              for n_times in (4, 6, 8, 12):
                  entity = np.repeat(np.arange(n_entities), n_times)
                  for effect_scale in (0.0, 0.01, 0.03, 0.08, 0.2, 0.5):
                      for noise_scale in (0.1, 0.2, 0.5, 1.0):
                          for seed in range(20260810, 20260850):
                              rng = np.random.default_rng(seed)
                              X = rng.normal(size=(entity.size, 1))
                              alpha = np.repeat(
                                  rng.normal(scale=effect_scale, size=n_entities),
                                  n_times,
                              )
                              y = 0.8 * X[:, 0] + alpha + rng.normal(
                                  scale=noise_scale, size=entity.size
                              )
                              fe = PanelOLS(
                                  entity_effects=True,
                                  cov_type='nonrobust',
                                  device='cpu',
                              ).fit(X, y, entity_ids=entity)
                              re = RandomEffects(device='cpu').fit(
                                  X, y, entity_ids=entity
                              )
                              result = fe.hausman_test(re)
                              dvar = float(
                                  np.asarray(fe._panel_cov_params)[0, 0]
                                  - np.asarray(re._panel_cov_params)[0, 0]
                              )
                              candidate = (
                                  dvar,
                                  n_entities,
                                  n_times,
                                  effect_scale,
                                  noise_scale,
                                  seed,
                                  result.applicable,
                                  result.statistic,
                                  result.pvalue,
                                  result.df,
                                  result.reason,
                              )
                              if best is None or dvar > best[0]:
                                  best = candidate
                              if result.applicable:
                                  print('FOUND', candidate)
                                  raise SystemExit(0)
          print('BEST', best)
          raise SystemExit('no applicable fitted Hausman fixture found')
          PY
