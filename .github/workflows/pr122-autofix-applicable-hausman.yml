def _hausman_applicable_dataset(seed: int):
    """Return a deterministic one-way panel suited to an applicable Hausman gate."""
    rng = np.random.default_rng(seed)
    n_entities, n_times = 32, 8
    entity = np.repeat(np.arange(n_entities), n_times)
    time = np.tile(np.arange(n_times), n_entities)
    X = rng.normal(size=(entity.size, 2))
    random_effect = np.repeat(rng.normal(scale=0.65, size=n_entities), n_times)
    y = (
        0.8 * X[:, 0]
        - 0.35 * X[:, 1]
        + random_effect
        + rng.normal(scale=0.2, size=entity.size)
    )
    return X.astype(np.float64), y.astype(np.float64), entity, time


def _find_applicable_hausman_fixture(*, start_seed=20260810, max_attempts=512):
    """Find a bounded deterministic NumPy fixture with an applicable Hausman test."""
    for seed in range(int(start_seed), int(start_seed) + int(max_attempts)):
        X, y, entity, time = _hausman_applicable_dataset(seed)
        fe = PanelOLS(entity_effects=True, cov_type="nonrobust", device="cpu").fit(
            X, y, entity_ids=entity
        )
        re = RandomEffects(device="cpu").fit(X, y, entity_ids=entity)
        result = _test_result(fe.hausman_test(re))
        if (
            result["applicable"]
            and result["statistic"] is not None
            and result["pvalue"] is not None
            and result["df"] is not None
            and np.isfinite(float(result["statistic"]))
            and np.isfinite(float(result["pvalue"]))
            and float(result["df"]) > 0.0
        ):
            return {
                "seed": int(seed),
                "X": X,
                "y": y,
                "entity": entity,
                "time": time,
                "reference": result,
            }
    raise RuntimeError(
        "unable to find an applicable Hausman fixture within the bounded seed search"
    )


def _require_applicable_hausman_coverage(diagnostics, *, backend):
    """Require at least one physically executed applicable Hausman diagnostic."""
    applicable = sorted(
        name
        for name, payload in diagnostics.items()
        if payload.get("applicable") is True
    )
    if not applicable:
        raise AssertionError(
            f"{backend}: physical Hausman gate requires at least one applicable case"
        )
    return applicable


