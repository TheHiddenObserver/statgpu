name: PR87 review fix batch v6

on:
  push:
    branches: [agent/maintenance-0.2.4-0.2.5]
    paths:
      - .github/workflows/pr87-review-fix-loop-v6.yml

permissions:
  contents: write

jobs:
  apply-review-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Patch formula boundary and add regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          base = Path('statgpu/_base.py')
          text = base.read_text(encoding='utf-8')
          text = text.replace(
              '        def wrap_method(original):\n',
              '        def wrap_method(original, method_name):\n',
              1,
          )
          old = '''                    if formula_active and type(value).__module__.startswith("pandas"):\n                        # Formula/model-matrix code owns row dropping, categorical\n                        # encoding, and aligned side-array error semantics.\n                        continue\n'''
          new = '''                    formula_owned_pandas = formula_active or (\n                        method_name != "fit"\n                        and name == "X"\n                        and getattr(self, "_design_info", None) is not None\n                    )\n                    if formula_owned_pandas and type(value).__module__.startswith("pandas"):\n                        # Current formula calls own all pandas row-alignment semantics.\n                        # After a formula fit, only X passed to a prediction-like\n                        # method is transformed by stored design_info; direct refits\n                        # and side arrays such as y still use the shared finite guard.\n                        continue\n'''
          if old not in text:
              raise RuntimeError('formula pandas ownership anchor missing')
          text = text.replace(old, new, 1)
          old_call = '            setattr(cls, method_name, wrap_method(original))\n'
          new_call = '            setattr(cls, method_name, wrap_method(original, method_name))\n'
          if old_call not in text:
              raise RuntimeError('finite wrapper install anchor missing')
          text = text.replace(old_call, new_call, 1)
          base.write_text(text, encoding='utf-8')

          tests = Path('dev/tests/test_maintenance_024_025.py')
          test_text = tests.read_text(encoding='utf-8')
          marker = '# PR87_FORMULA_PREDICT_OWNERSHIP_TEST'
          if marker not in test_text:
              test_text += '''\n\n# PR87_FORMULA_PREDICT_OWNERSHIP_TEST\ndef test_formula_predict_dataframe_keeps_formula_missing_row_semantics():\n    pd = pytest.importorskip("pandas")\n    from statgpu.linear_model import LinearRegression\n\n    data = pd.DataFrame(\n        {"y": [1.0, 2.0, 3.0, 4.0], "x": [0.0, 1.0, 2.0, 3.0]}\n    )\n    model = LinearRegression(device="cpu").fit(formula="y ~ x", data=data)\n    new_data = pd.DataFrame({"x": [0.0, np.nan, 2.0, 3.0]})\n    prediction = np.asarray(model.predict(new_data))\n    assert prediction.shape == (3,)\n    assert np.isfinite(prediction).all()\n'''
              tests.write_text(test_text, encoding='utf-8')
          PY

      - name: Install validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" scipy pytest packaging "scikit-learn==1.3.2" pandas patsy joblib
          python -m pip install -e . --no-deps

      - name: Run targeted formula and maintenance tests
        run: |
          python -m pytest \
            dev/tests/test_maintenance_024_025.py \
            dev/tests/test_core_contracts.py::test_set_params_rejects_unknown_and_supports_nested_estimators \
            -q --tb=short

      - name: Commit source-only fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add statgpu/_base.py dev/tests/test_maintenance_024_025.py
          git commit -m "fix: preserve formula prediction validation ownership"
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
