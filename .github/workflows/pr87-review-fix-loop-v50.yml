name: PR87 review fix batch v50

on:
  push:
    branches:
      - agent/maintenance-0.2.4-0.2.5

permissions:
  contents: write

concurrency:
  group: pr87-review-fix-v50
  cancel-in-progress: false

jobs:
  apply-review-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Normalize temporary patch harness
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("pr87_patch_v50.py")
          text = p.read_text(encoding="utf-8")

          noop_start = text.index(
              "# Kernel local-linear ridge retries must not suppress device/programming errors."
          )
          import_marker = "# Insert a direct import without disturbing the existing multiline import."
          import_pos = text.index(import_marker, noop_start)
          text = (
              text[:noop_start]
              + "# Kernel local-linear ridge retries must not suppress device/programming errors.\n"
              + text[import_pos:]
          )

          old_test_start = text.index(
              "def test_kernel_ridge_retry_preserves_nonrank_runtime_failure(monkeypatch):"
          )
          old_test_end = text.index("'''\nif \"test_backend_linalg_failure_classifier_is_narrow\"", old_test_start)
          new_test = '''def test_kernel_ridge_retry_preserves_nonrank_runtime_failure(monkeypatch):
              from statgpu.nonparametric.kernel_smoothing._kernel_regression import (
                  _solve_linear_system_with_ridge,
              )

              monkeypatch.setattr(
                  np.linalg,
                  "solve",
                  lambda *args, **kwargs: (_ for _ in ()).throw(
                      RuntimeError("CUDA out of memory")
                  ),
              )
              with pytest.raises(RuntimeError, match="CUDA out of memory"):
                  _solve_linear_system_with_ridge(np.eye(2), np.ones(2), np)
          '''
          text = text[:old_test_start] + new_test + text[old_test_end:]

          cv_start = text.index("# CV IRLS solve fallback.")
          cv_end = text.index("# Regression tests:", cv_start)
          q = "'" * 3
          old = (
              "                try:\n"
              "                    params = backend.solve(XtWX, Xtz)\n"
              "                except Exception:\n"
              "                    lstsq_result = backend.lstsq(XtWX, Xtz)\n"
              "                    params = lstsq_result[0]\n"
          )
          new = (
              "                try:\n"
              "                    params = backend.solve(XtWX, Xtz)\n"
              "                except Exception as exc:\n"
              "                    if not _linalg_exception_is_rank_failure(exc):\n"
              "                        raise\n"
              "                    lstsq_result = backend.lstsq(XtWX, Xtz)\n"
              "                    params = lstsq_result[0]\n"
          )
          section = (
              "# CV IRLS solve fallback.\n"
              "replace(\n"
              "    \"statgpu/linear_model/cv/_logistic_cv.py\",\n"
              "    \"from statgpu.backends import get_backend, _torch_dev\\n\",\n"
              "    \"from statgpu.backends import get_backend, _torch_dev\\n"
              "from statgpu.backends._array_ops import _linalg_exception_is_rank_failure\\n\",\n"
              ")\n"
              "replace(\n"
              "    \"statgpu/linear_model/cv/_logistic_cv.py\",\n"
              f"    {q}{old}{q},\n"
              f"    {q}{new}{q},\n"
              ")\n\n"
          )
          p.write_text(text[:cv_start] + section + text[cv_end:], encoding="utf-8")
          PY
      - name: Apply reviewed fixes
        run: python pr87_patch_v50.py
      - name: Install validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation,formula]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile changed modules
        run: |
          python -m py_compile \
            statgpu/backends/_array_ops.py \
            statgpu/glm_core/_base.py \
            statgpu/linear_model/_glm_base.py \
            statgpu/linear_model/penalized/_fit_mixin.py \
            statgpu/linear_model/penalized/_inference_mixin.py \
            statgpu/linear_model/wrappers/_linear.py \
            statgpu/linear_model/wrappers/_logistic.py \
            statgpu/linear_model/cv/_logistic_cv.py \
            statgpu/nonparametric/kernel_smoothing/_kernel_regression.py \
            dev/tests/test_maintenance_024_025.py
      - name: Run targeted fallback-contract tests
        run: |
          python -m pytest \
            dev/tests/test_maintenance_024_025.py::test_backend_linalg_failure_classifier_is_narrow \
            dev/tests/test_maintenance_024_025.py::test_glm_response_validation_preserves_backend_runtime_failure \
            dev/tests/test_maintenance_024_025.py::test_penalized_exact_torch_preserves_nonrank_runtime_failure \
            dev/tests/test_maintenance_024_025.py::test_kernel_ridge_retry_preserves_nonrank_runtime_failure \
            -q --tb=short
      - name: Run full CPU and documentation validation
        run: |
          python -m pytest dev/tests -q --tb=short
          python dev/validation/fix_docs_links.py --check
          python dev/validation/check_docs_contracts.py
      - name: Commit reviewed source fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f \
            pr87_scan_v50.py \
            pr87_patch_v50.py \
            .github/workflows/pr87-review-scan-v50.yml \
            .github/workflows/pr87-review-fix-loop-v50.yml
          git add \
            statgpu/backends/_array_ops.py \
            statgpu/glm_core/_base.py \
            statgpu/linear_model/_glm_base.py \
            statgpu/linear_model/penalized/_fit_mixin.py \
            statgpu/linear_model/penalized/_inference_mixin.py \
            statgpu/linear_model/wrappers/_linear.py \
            statgpu/linear_model/wrappers/_logistic.py \
            statgpu/linear_model/cv/_logistic_cv.py \
            statgpu/nonparametric/kernel_smoothing/_kernel_regression.py \
            dev/tests/test_maintenance_024_025.py \
            CHANGELOG.md docs/en/changelog.md docs/cn/changelog.md
          git commit -m "fix: preserve GPU linalg infrastructure failures"
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
