name: PR126 v4 final asset synchronization

on:
  push:
    branches: [agent/panel-p1-stage-c-covariance]
    paths:
      - '.github/workflows/pr126-v4-raw-audit.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[validation]'
      - name: Run maintained v4 parser and catalog matrix
        run: |
          python -m pytest \
            dev/tests/test_benchmark_catalog.py \
            dev/tests/test_benchmark_frontend_data.py \
            dev/tests/test_benchmark_inventory_v2.py \
            dev/tests/test_frontend_domain_coverage.py \
            dev/tests/test_panel_stage_c_identifiability_frontend_source.py \
            -q --tb=short
      - name: Regenerate canonical benchmark bundle
        run: |
          python dev/benchmarks/generate_benchmark_data.py \
            --out frontend/public/data/benchmark_data.json \
            --report frontend/public/data/parse_report.json \
            --inventory-out frontend/public/data/source_inventory.json \
            --deterministic --strict-sources
      - name: Build frontend and synchronize docs mirror
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Validate final diff and remove temporary audit helpers
        run: |
          rm -f dev/pr126_v4_raw_audit.py .github/workflows/pr126-v4-raw-audit.yml
          python - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/pr126-v4-raw-audit.yml',
              'dev/pr126_v4_raw_audit.py',
              'frontend/public/data/benchmark_data.json',
              'frontend/public/data/parse_report.json',
              'frontend/public/data/source_inventory.json',
              'docs/assets/benchmarks/data/benchmark_data.json',
              'docs/assets/benchmarks/data/parse_report.json',
              'docs/assets/benchmarks/data/source_inventory.json',
          }
          changed = set(subprocess.check_output(['git','status','--porcelain'], text=True).splitlines())
          paths = {line[3:] for line in changed}
          if paths != expected:
              raise SystemExit(f'unexpected final asset-sync delta: {sorted(paths)}')
          PY
          git diff --check
      - name: Commit synchronized assets and helper cleanup
        run: |
          git config user.name 'chatgpt-codex-connector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            .github/workflows/pr126-v4-raw-audit.yml \
            dev/pr126_v4_raw_audit.py \
            frontend/public/data \
            docs/assets/benchmarks/data
          git commit -m 'bench: synchronize PR126 v4 canonical assets'
          git push origin HEAD:agent/panel-p1-stage-c-covariance
