name: Gaussian inference backend-native

on:
  pull_request:
    branches: [master]
    paths:
      - 'statgpu/inference/__init__.py'
      - 'statgpu/inference/_low_df_reference_contract.py'
      - 'statgpu/linear_model/__init__.py'
      - 'statgpu/linear_model/_gaussian_inference.py'
      - 'statgpu/linear_model/_gaussian_inference_device_contract.py'
      - 'statgpu/backends/_gpu_inference_cupy.py'
      - 'statgpu/backends/_utils.py'
      - 'statgpu/backends/_validation.py'
      - 'statgpu/linear_model/penalized/__init__.py'
      - 'statgpu/linear_model/penalized/_base.py'
      - 'statgpu/linear_model/penalized/_fit_mixin.py'
      - 'statgpu/linear_model/penalized/_gaussian_fit_transaction_contract.py'
      - 'statgpu/linear_model/penalized/_no_inference_cleanup_contract.py'
      - 'statgpu/linear_model/penalized/_no_inference_public_validation_reset_contract.py'
      - 'statgpu/linear_model/penalized/_inference_mixin.py'
      - 'statgpu/linear_model/penalized/_latest_review_fix_contract.py'
      - 'statgpu/linear_model/penalized/_penalized_linear.py'
      - 'statgpu/linear_model/wrappers/__init__.py'
      - 'statgpu/linear_model/wrappers/_linear.py'
      - 'statgpu/linear_model/wrappers/_linear_fit_transaction_contract.py'
      - 'statgpu/linear_model/wrappers/_ridge.py'
      - 'dev/tests/test_gaussian_inference_*.py'
      - 'dev/benchmarks/validate_gaussian_inference_backend_native_gpu.py'
      - 'dev/benchmarks/validate_gaussian_inference_cupy_rank_recovery_gpu.py'
      - '.github/workflows/gaussian-inference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation,formula]"
      - name: Run focused Gaussian and Ridge regressions
        run: |
          python -m pytest \
            dev/tests/test_gaussian_inference_backend_native.py \
            dev/tests/test_gaussian_inference_covariance_matrix.py \
            dev/tests/test_gaussian_inference_device_boundaries.py \
            dev/tests/test_gaussian_inference_public_consumers.py \
            dev/tests/test_gaussian_inference_public_validation_reset.py \
            dev/tests/test_gaussian_inference_latest_review_regressions.py \
            dev/tests/test_gaussian_inference_final_review_contract.py \
            dev/tests/test_gaussian_inference_validation_provenance.py \
            dev/tests/test_gaussian_inference_linear_dispatch_cleanup.py \
            dev/tests/test_gaussian_inference_no_cleanup_refit.py \
            dev/tests/test_gaussian_inference_formula_cleanup_contract.py \
            dev/tests/test_gaussian_inference_gpu_runner_contract.py \
            dev/tests/test_gaussian_inference_cupy_rank_recovery_contract.py \
            dev/tests/test_gaussian_inference_no_host_transfer.py \
            dev/tests/test_ridge_inference.py \
            dev/tests/test_ridge_weighted_consistency.py \
            dev/tests/test_ridge_cv.py \
            -q --tb=short

  torch-cpu-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install Torch 2.0 CPU environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" pytest scipy
          python -m pip install "torch==2.0.1+cpu" --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[validation,formula]"
      - name: Confirm hosted Torch contract
        run: |
          python - <<'PY'
          import torch
          assert torch.__version__.startswith("2.0.1")
          assert not torch.cuda.is_available()
          print("torch", torch.__version__, "device=cpu")
          PY
      - name: Run backend-native inference tests on Torch CPU
        run: |
          python -m pytest \
            dev/tests/test_gaussian_inference_backend_native.py \
            dev/tests/test_gaussian_inference_covariance_matrix.py \
            dev/tests/test_gaussian_inference_device_boundaries.py \
            dev/tests/test_gaussian_inference_public_consumers.py \
            dev/tests/test_gaussian_inference_public_validation_reset.py \
            dev/tests/test_gaussian_inference_latest_review_regressions.py \
            dev/tests/test_gaussian_inference_final_review_contract.py \
            dev/tests/test_gaussian_inference_validation_provenance.py \
            dev/tests/test_gaussian_inference_linear_dispatch_cleanup.py \
            dev/tests/test_gaussian_inference_no_cleanup_refit.py \
            dev/tests/test_gaussian_inference_formula_cleanup_contract.py \
            dev/tests/test_gaussian_inference_no_host_transfer.py \
            -q --tb=short

  static-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation,formula]" ruff
      - name: Compile changed implementation and validator
        run: |
          python -m compileall -q \
            statgpu/inference/__init__.py \
            statgpu/inference/_low_df_reference_contract.py \
            statgpu/linear_model/__init__.py \
            statgpu/linear_model/_gaussian_inference.py \
            statgpu/linear_model/_gaussian_inference_device_contract.py \
            statgpu/backends/_gpu_inference_cupy.py \
            statgpu/backends/_utils.py \
            statgpu/backends/_validation.py \
            statgpu/linear_model/penalized/__init__.py \
            statgpu/linear_model/penalized/_base.py \
            statgpu/linear_model/penalized/_fit_mixin.py \
            statgpu/linear_model/penalized/_gaussian_fit_transaction_contract.py \
            statgpu/linear_model/penalized/_no_inference_cleanup_contract.py \
            statgpu/linear_model/penalized/_no_inference_public_validation_reset_contract.py \
            statgpu/linear_model/penalized/_inference_mixin.py \
            statgpu/linear_model/penalized/_latest_review_fix_contract.py \
            statgpu/linear_model/penalized/_penalized_linear.py \
            statgpu/linear_model/wrappers/__init__.py \
            statgpu/linear_model/wrappers/_linear.py \
            statgpu/linear_model/wrappers/_linear_fit_transaction_contract.py \
            statgpu/linear_model/wrappers/_ridge.py \
            dev/tests/test_gaussian_inference_backend_native.py \
            dev/tests/test_gaussian_inference_covariance_matrix.py \
            dev/tests/test_gaussian_inference_device_boundaries.py \
            dev/tests/test_gaussian_inference_public_consumers.py \
            dev/tests/test_gaussian_inference_public_validation_reset.py \
            dev/tests/test_gaussian_inference_latest_review_regressions.py \
            dev/tests/test_gaussian_inference_final_review_contract.py \
            dev/tests/test_gaussian_inference_validation_provenance.py \
            dev/tests/test_gaussian_inference_linear_dispatch_cleanup.py \
            dev/tests/test_gaussian_inference_no_cleanup_refit.py \
            dev/tests/test_gaussian_inference_formula_cleanup_contract.py \
            dev/tests/test_gaussian_inference_gpu_runner_contract.py \
            dev/tests/test_gaussian_inference_cupy_rank_recovery_contract.py \
            dev/tests/test_gaussian_inference_no_host_transfer.py \
            dev/benchmarks/validate_gaussian_inference_backend_native_gpu.py \
            dev/benchmarks/validate_gaussian_inference_cupy_rank_recovery_gpu.py
      - name: High-signal static checks
        run: |
          ruff check \
            statgpu/inference/__init__.py \
            statgpu/inference/_low_df_reference_contract.py \
            statgpu/linear_model/__init__.py \
            statgpu/linear_model/_gaussian_inference.py \
            statgpu/linear_model/_gaussian_inference_device_contract.py \
            statgpu/backends/_gpu_inference_cupy.py \
            statgpu/backends/_utils.py \
            statgpu/backends/_validation.py \
            statgpu/linear_model/penalized/__init__.py \
            statgpu/linear_model/penalized/_base.py \
            statgpu/linear_model/penalized/_fit_mixin.py \
            statgpu/linear_model/penalized/_gaussian_fit_transaction_contract.py \
            statgpu/linear_model/penalized/_no_inference_cleanup_contract.py \
            statgpu/linear_model/penalized/_no_inference_public_validation_reset_contract.py \
            statgpu/linear_model/penalized/_inference_mixin.py \
            statgpu/linear_model/penalized/_latest_review_fix_contract.py \
            statgpu/linear_model/penalized/_penalized_linear.py \
            statgpu/linear_model/wrappers/__init__.py \
            statgpu/linear_model/wrappers/_linear.py \
            statgpu/linear_model/wrappers/_linear_fit_transaction_contract.py \
            statgpu/linear_model/wrappers/_ridge.py \
            dev/tests/test_gaussian_inference_backend_native.py \
            dev/tests/test_gaussian_inference_covariance_matrix.py \
            dev/tests/test_gaussian_inference_device_boundaries.py \
            dev/tests/test_gaussian_inference_public_consumers.py \
            dev/tests/test_gaussian_inference_public_validation_reset.py \
            dev/tests/test_gaussian_inference_latest_review_regressions.py \
            dev/tests/test_gaussian_inference_final_review_contract.py \
            dev/tests/test_gaussian_inference_validation_provenance.py \
            dev/tests/test_gaussian_inference_linear_dispatch_cleanup.py \
            dev/tests/test_gaussian_inference_no_cleanup_refit.py \
            dev/tests/test_gaussian_inference_formula_cleanup_contract.py \
            dev/tests/test_gaussian_inference_gpu_runner_contract.py \
            dev/tests/test_gaussian_inference_cupy_rank_recovery_contract.py \
            dev/tests/test_gaussian_inference_no_host_transfer.py \
            dev/benchmarks/validate_gaussian_inference_backend_native_gpu.py \
            dev/benchmarks/validate_gaussian_inference_cupy_rank_recovery_gpu.py \
            --select F821,E9,F63,F7,F82
