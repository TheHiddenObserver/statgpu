name: PR126 rank-deficient estimator matrix retry

on:
  push:
    branches: [agent/panel-p1-stage-c-covariance]
    paths:
      - .github/workflows/pr126-autofix-rank-matrix-retry.yml

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Add maintained rank-deficient estimator matrix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          torch_test = Path('dev/tests/test_panel_stage_c_torch_cpu.py')
          text = torch_test.read_text()
          addition = r'''


def test_stage_c_exact_rank_deficient_estimator_matrix_torch_cpu_matches_numpy():
    rng = np.random.default_rng(12912)
    n_entities, n_times = 15, 4
    entity = np.repeat(np.arange(n_entities), n_times)
    time = np.tile(np.arange(n_times), n_entities)
    x = rng.normal(size=entity.size)
    X = np.column_stack([x, 2.0 * x])
    alpha = np.repeat(rng.normal(scale=0.3, size=n_entities), n_times)
    y = 0.6 * x + alpha + rng.normal(scale=0.2, size=entity.size)

    X_t, y_t, entity_t, time_t = _torch_arrays(X, y, entity, time)
    model_pairs = [
        (
            PooledOLS(cov_type="hc0").fit(X, y, entity_ids=entity),
            PooledOLS(cov_type="hc0").fit(X_t, y_t, entity_ids=entity_t),
        ),
        (
            PanelOLS(cov_type="hc0").fit(X, y),
            PanelOLS(cov_type="hc0").fit(X_t, y_t),
        ),
        (
            BetweenOLS(cov_type="hc0").fit(X, y, entity_ids=entity),
            BetweenOLS(cov_type="hc0").fit(X_t, y_t, entity_ids=entity_t),
        ),
        (
            FirstDifferenceOLS(cov_type="hc0").fit(
                X, y, entity_ids=entity, time_ids=time
            ),
            FirstDifferenceOLS(cov_type="hc0").fit(
                X_t, y_t, entity_ids=entity_t, time_ids=time_t
            ),
        ),
    ]

    X_re = np.column_stack([np.ones(entity.size), X])
    X_re_t = torch.as_tensor(X_re, dtype=torch.float64)
    model_pairs.append(
        (
            RandomEffects(cov_type="hc0").fit(X_re, y, entity_ids=entity),
            RandomEffects(cov_type="hc0").fit(
                X_re_t, y_t, entity_ids=entity_t
            ),
        )
    )

    for expected, actual in model_pairs:
        _assert_inference(actual, expected, rtol=2e-7, atol=2e-9)
        metadata = expected._covariance_metadata
        actual_meta = actual._covariance_metadata
        assert metadata["design_rank"] < metadata["design_columns"]
        assert actual_meta["design_rank"] == metadata["design_rank"]
        assert actual_meta["design_columns"] == metadata["design_columns"]
'''
          if 'test_stage_c_exact_rank_deficient_estimator_matrix_torch_cpu_matches_numpy' in text:
              raise SystemExit('rank-deficient five-family matrix already exists')
          torch_test.write_text(text + addition)

          plan = Path('dev/plans/panel_p1_stage_c_covariance_plan.md')
          text = plan.read_text()
          needle = '- use pseudoinverse consistently for supported rank-deficient fit spaces; numerical rank and pseudoinverse must come from the same backend-native SVD mask with the explicit float64 cutoff `max(n,k) * eps * s_max`, never from independent backend defaults;\n'
          addition_line = "- preserve each estimator's historical full-column-rank coefficient solver; the shared SVD minimum-norm solve is entered only when the explicit rank policy reports `rank < k` or the historical full-rank solver raises a linear-algebra failure, and the resulting fit-space rank is reused by covariance/diagnostics;\n"
          if text.count(needle) != 1:
              raise SystemExit('plan rank marker mismatch')
          plan.write_text(text.replace(needle, needle + addition_line))

          en = Path('docs/en/models/panel.md')
          text = en.read_text()
          marker = 'Numerical rank and the pseudoinverse are derived from the same backend-native SVD mask with cutoff `max(n,k) * eps64 * s_max`, so NumPy/CuPy/Torch cannot select different effective covariance subspaces merely because their library defaults differ.'
          extra = " Full-column-rank fits retain each estimator's historical coefficient solver; the shared SVD minimum-norm solve is used only for explicitly rank-deficient fit spaces or a linear-algebra solver failure."
          if marker not in text:
              raise SystemExit('EN rank policy marker missing')
          if extra.strip() not in text:
              text = text.replace(marker, marker + extra, 1)
          en.write_text(text)

          cn = Path('docs/cn/models/panel.md')
          text = cn.read_text()
          marker = '`max(n,k) * eps64 * s_max`'
          extra = ' 对 full-column-rank fit 仍保留各 estimator 的历史 coefficient solver；只有显式判定为 rank-deficient 或历史 solver 发生线性代数失败时才进入共享 SVD minimum-norm solve。'
          pos = text.find(marker)
          if pos < 0:
              raise SystemExit('CN rank policy marker missing')
          if extra.strip() not in text:
              end = text.find('。', pos)
              if end < 0:
                  end = pos + len(marker)
              else:
                  end += 1
              text = text[:end] + extra + text[end:]
          cn.write_text(text)
          PY
      - name: Install Torch/formula/validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[formula,validation,torch]' 'linearmodels==7.0' 'statsmodels==0.14.6' pytest
      - name: Run maintained Torch and focused Stage-C matrix
        run: |
          python -m pytest \
            dev/tests/test_panel_stage_c_torch_cpu.py \
            dev/tests/test_panel_stage_c_covariance.py \
            dev/tests/test_panel_stage_c_edge_contracts.py \
            dev/tests/test_panel_stage_c_external.py \
            dev/tests/test_panel_stage_c_external_defaults.py \
            dev/tests/test_panel_stage_c_linearmodels_estimators.py \
            dev/tests/test_panel_stage_c_api_formula.py \
            dev/tests/test_panel_stage_c_physical_runner_contract.py \
            dev/tests/test_panel_stage_c_inference_guard.py \
            -q --tb=short
          git diff --check
      - name: Commit matrix completion and delete helpers
        shell: bash
        run: |
          git config user.name 'TheHiddenObserver'
          git config user.email '51812297+TheHiddenObserver@users.noreply.github.com'
          git add dev/tests/test_panel_stage_c_torch_cpu.py docs/en/models/panel.md docs/cn/models/panel.md
          git add -f dev/plans/panel_p1_stage_c_covariance_plan.md
          git rm -f \
            .github/workflows/pr126-autofix-rank-matrix.yml \
            .github/workflows/pr126-autofix-rank-matrix-retry.yml
          git commit -m 'test(panel): cover rank-deficient estimator matrix'
          git push origin HEAD:agent/panel-p1-stage-c-covariance
