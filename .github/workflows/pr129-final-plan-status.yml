name: PR129 final plan status

on:
  push:
    branches:
      - agent/post-v0.2.5-next-phase-plan
    paths:
      - '.github/workflows/pr129-final-plan-status.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/post-v0.2.5-next-phase-plan
          fetch-depth: 0
      - name: Record hosted/review closure in implementation plan
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('dev/plans/gaussian_inference_backend_native_plan.md')
          text = path.read_text()
          old_status = 'Production implementation status: **implemented; final acceptance pending**'
          new_status = 'Production implementation status: **implemented; hosted/review clean; physical CUDA pending (`PARTIAL_REMOTE_PENDING`)**'
          if text.count(old_status) != 1:
              raise SystemExit(f'expected one production-status line, found {text.count(old_status)}')
          text = text.replace(old_status, new_status)

          old_tail = '''Remaining acceptance gates are deliberately not claimed as passed:\n\n- draft PR #129 hosted workflows must complete successfully on the final source head;\n- the final complete diff must receive a fresh review with no unresolved CRITICAL/HIGH/relevant actionable MEDIUM findings;\n- the physical validator contract must remain frozen after review;\n- exact clean-head CuPy and Torch CUDA acceptance must run and produce canonical evidence matching that validator contract.\n\nUntil the hosted gates are green and the final fresh review is clean, this branch is **not** eligible for `PARTIAL_REMOTE_PENDING`. Once those local/hosted gates are closed, if only exact physical CUDA evidence remains, the correct hard-exit status is `PARTIAL_REMOTE_PENDING`, not `COMPLETE`.'''
          new_tail = '''Hosted/review acceptance is closed on reviewed implementation head `63af2473f1e84ca5a1d5c4e655d50c0ec7857e8a`:\n\n- all six hosted PR workflows passed, including the focused Gaussian workflow's Python 3.9, Python 3.12, Torch 2.0 CPU, and static-contract jobs;\n- the final complete-diff review found no unresolved CRITICAL/HIGH/relevant actionable MEDIUM findings;\n- the physical validator contract is frozen after that review; subsequent closure edits are documentation/status-only and do not alter production numerics, validator cases, thresholds, provenance logic, or pass/fail semantics.\n\nThe only remaining acceptance gate is exact clean-head CuPy and Torch CUDA execution of the frozen physical validator with canonical evidence matching the final candidate SHA. Therefore the correct hard-exit state is **`PARTIAL_REMOTE_PENDING`**, not `COMPLETE`. PR #129 must remain draft until that physical evidence passes.'''
          if text.count(old_tail) != 1:
              raise SystemExit(f'expected one final acceptance block, found {text.count(old_tail)}')
          path.write_text(text.replace(old_tail, new_tail))

          Path('.github/workflows/pr129-final-plan-status.yml').unlink()
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'no changes produced'; exit 1; }
          git commit -m "docs(plan): record PR129 partial-remote closure"
          git push origin HEAD:agent/post-v0.2.5-next-phase-plan
