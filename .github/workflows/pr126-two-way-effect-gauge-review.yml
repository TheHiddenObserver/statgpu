name: PR126 two-way effect gauge review

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  apply-validate-commit:
    if: github.event.pull_request.number == 126
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install maintained Torch CPU environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" pytest
          python -m pip install "torch==2.0.1+cpu" --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Apply two-way FE gauge fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('dev/validation/pr126_fix_two_way_effect_gauge.py')
          text = p.read_text(encoding='utf-8')
          replacements = [
              (
                  '    range_mode = xp.zeros_like(level_scale, dtype=xp.bool)\\n',
                  '    range_mode = level_scale < 0.0\\n',
                  'range-mode dtype staging anchor',
              ),
              (
                  '    X = np.ones((values_np.size, 1), dtype=np.float64)\\n',
                  '    X = np.linspace(-1.0, 1.0, values_np.size, dtype=np.float64)[:, None]\\n',
                  'public gauge fixture design anchor',
              ),
          ]
          for old, new, name in replacements:
              if old not in text:
                  raise SystemExit(f'{name} not found')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
          python dev/validation/pr126_fix_two_way_effect_gauge.py
      - name: Run targeted review gates
        run: |
          python -m pytest \
            dev/tests/test_panel_stage_b_torch_cpu.py \
            dev/tests/test_panel_stage_a_golden.py \
            dev/tests/test_panel_stage_c_final_review_fixes.py \
            dev/tests/test_panel_stage_c_physical_runner_contract.py \
            dev/tests/test_panel_two_way_demean_scale.py \
            -q --tb=short
          python -m compileall -q statgpu dev/benchmarks dev/tests
          git diff --check
      - name: Remove temporary review scaffolding
        run: |
          rm -f dev/validation/pr126_fix_two_way_effect_gauge.py
          rm -f .github/workflows/pr126-two-way-effect-gauge-review.yml
          git diff --check
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: range-center two-way fixed effects"
          git push origin HEAD:agent/panel-p1-stage-c-covariance
