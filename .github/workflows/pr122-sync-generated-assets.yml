name: PR122 generated benchmark asset sync

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  sync-generated-assets:
    if: >-
      github.event.pull_request.number == 122 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install schema validation dependency
        run: python -m pip install 'jsonschema[format]'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate benchmark data deterministically
        run: |
          python dev/benchmarks/generate_benchmark_data.py \
            --out frontend/public/data/benchmark_data.json \
            --report frontend/public/data/parse_report.json \
            --inventory-out frontend/public/data/source_inventory.json \
            --deterministic --strict-sources
      - name: Build frontend mirror
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Verify scope and commit generated assets
        shell: bash
        run: |
          set -euo pipefail
          allowed='^( M|M |\?\?) (frontend/public/data/(benchmark_data|parse_report|source_inventory)\.json|docs/assets/benchmarks/data/(benchmark_data|parse_report|source_inventory)\.json)$'
          status="$(git status --porcelain)"
          printf '%s\n' "$status"
          unexpected="$(printf '%s\n' "$status" | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected generated changes:'
            printf '%s\n' "$unexpected"
            exit 1
          fi
          git add \
            frontend/public/data/benchmark_data.json \
            frontend/public/data/parse_report.json \
            frontend/public/data/source_inventory.json \
            docs/assets/benchmarks/data/benchmark_data.json \
            docs/assets/benchmarks/data/parse_report.json \
            docs/assets/benchmarks/data/source_inventory.json
          if git diff --cached --quiet; then
            echo 'Generated assets already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'benchmark: refresh PR122 frontend evidence assets'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
