name: PR87 review fix batch v51

on:
  push:
    branches:
      - agent/maintenance-0.2.4-0.2.5

permissions:
  contents: write

concurrency:
  group: pr87-review-fix-v51
  cancel-in-progress: false

jobs:
  apply-review-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply reviewed CV fixes
        run: python pr87_patch_v51.py
      - name: Install validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation,formula]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile changed modules
        run: |
          python -m py_compile \
            statgpu/linear_model/penalized/_penalized_cv.py \
            dev/tests/test_maintenance_024_025.py
      - name: Run targeted CV objective tests
        run: |
          python -m pytest \
            dev/tests/test_maintenance_024_025.py::test_penalized_cv_does_not_substitute_mse_for_non_gaussian_loss \
            dev/tests/test_maintenance_024_025.py::test_penalized_cv_squared_error_emergency_fallback_preserves_weights \
            dev/tests/test_maintenance_024_025.py::test_penalized_cv_loss_evaluation_preserves_infrastructure_failure \
            dev/tests/test_maintenance_024_025.py::test_penalized_cv_infrastructure_classifier_is_narrow \
            -q --tb=short
      - name: Run full CPU and documentation validation
        run: |
          python -m pytest dev/tests -q --tb=short
          python dev/validation/fix_docs_links.py --check
          python dev/validation/check_docs_contracts.py
      - name: Commit reviewed source fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f \
            pr87_patch_v51.py \
            .github/workflows/pr87-review-fix-loop-v51.yml
          git add \
            statgpu/linear_model/penalized/_penalized_cv.py \
            dev/tests/test_maintenance_024_025.py \
            CHANGELOG.md docs/en/changelog.md docs/cn/changelog.md
          git commit -m "fix: preserve penalized CV objectives"
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
