          python dev/benchmarks/generate_benchmark_data.py --check --strict-sources
      - name: Verify immutable raw bytes and promotion scope
        run: |
          test "$(git rev-parse c578f9af48c4322a6deec126f0e1440bb3519852:results/pr126_p100_fresh/environment.txt)" = "$(git hash-object results/pr126_p100_fresh/environment.txt)"
          test "$(git rev-parse c578f9af48c4322a6deec126f0e1440bb3519852:results/pr126_p100_fresh/panel_stage_c_correctness_p100.json)" = "$(git hash-object results/pr126_p100_fresh/panel_stage_c_correctness_p100.json)"
          test "$(git rev-parse c578f9af48c4322a6deec126f0e1440bb3519852:results/pr126_p100_fresh/panel_stage_c_correctness_p100.log)" = "$(git hash-object results/pr126_p100_fresh/panel_stage_c_correctness_p100.log)"
          test "$(git rev-parse c578f9af48c4322a6deec126f0e1440bb3519852:results/pr126_p100_fresh/panel_stage_c_performance_p100.json)" = "$(git hash-object results/pr126_p100_fresh/panel_stage_c_performance_p100.json)"
          test "$(git rev-parse c578f9af48c4322a6deec126f0e1440bb3519852:results/pr126_p100_fresh/panel_stage_c_performance_p100.log)" = "$(git hash-object results/pr126_p100_fresh/panel_stage_c_performance_p100.log)"
          test "$(git rev-parse c578f9af48c4322a6deec126f0e1440bb3519852:results/pr126_p100_fresh/validation_summary.txt)" = "$(git hash-object results/pr126_p100_fresh/validation_summary.txt)"
          changed="$(git status --porcelain | sed 's/^...//' | sort)"
          printf '%s\n' "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(CHANGELOG.md|\.github/workflows/(benchmark-frontend.yml|pr126-promote-p100-v5.yml)|dev/benchmarks/(benchmark_coverage_matrix.json|frontend_sources.json|frontend_data/parsers/(__init__\.py|panel_stage_c_final\.py)|frontend_data/registry\.py)|dev/tests/test_panel_stage_c_frontend_source\.py|docs/assets/benchmarks/.*|frontend/public/data/.*|results/pr126_p100_fresh/SHA256SUMS)$' || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected promotion scope:"
            printf '%s\n' "$bad"
            exit 1
          fi
      - name: Commit promotion and remove temporary workflow
        run: |
          rm .github/workflows/pr126-promote-p100-v5.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'benchmark: promote PR126 fresh P100 evidence as v5'
