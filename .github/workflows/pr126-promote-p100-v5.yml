name: PR126 guarded P100 v5 promotion

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - '.github/workflows/pr126-promote-p100-v5.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Guard exact evidence lineage
        shell: bash
        run: |
          base='c578f9af48c4322a6deec126f0e1440bb3519852'
          test "$(git rev-parse ${base}^)" = '5f0cea9216321361842bc3c438219084a4cf5538'
          actual="$(git diff --name-only "$base" HEAD | sort)"
          expected="$(printf '%s\n' '.github/scripts/pr126_promote_p100_v5.py' '.github/workflows/pr126-promote-p100-v5.yml' | sort)"
          test "$actual" = "$expected"
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest 'jsonschema[format]'
      - name: Audit and stage v5 promotion
        run: python .github/scripts/pr126_promote_p100_v5.py
      - name: Generate deterministic benchmark assets
        run: |
          python dev/benchmarks/generate_benchmark_data.py \
            --out frontend/public/data/benchmark_data.json \
            --report frontend/public/data/parse_report.json \
            --inventory-out frontend/public/data/source_inventory.json \
            --deterministic --strict-sources
      - name: Run focused promotion regressions
        run: |
          python -m py_compile \
            dev/benchmarks/frontend_data/parsers/panel_stage_c_final.py \
            dev/benchmarks/frontend_data/parsers/__init__.py \
            dev/benchmarks/frontend_data/registry.py
          python -m pytest \
            dev/tests/test_panel_stage_c_frontend_source.py \
            dev/tests/test_benchmark_catalog.py \
            dev/tests/test_benchmark_inventory_v2.py \
            dev/tests/test_benchmark_frontend_data.py -q
          python dev/benchmarks/generate_benchmark_data.py --check --strict-sources
      - name: Verify raw bytes and staged scope
        shell: bash
        run: |
          for f in \
            environment.txt \
            panel_stage_c_correctness_p100.json \
            panel_stage_c_correctness_p100.log \
            panel_stage_c_performance_p100.json \
            panel_stage_c_performance_p100.log \
            validation_summary.txt; do
            path="results/pr126_p100_fresh/$f"
            test "$(git rev-parse c578f9af48c4322a6deec126f0e1440bb3519852:"$path")" = "$(git hash-object "$path")"
          done
          changed="$(git status --porcelain | sed 's/^...//' | sort)"
          printf '%s\n' "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(CHANGELOG.md|\.github/(scripts/pr126_promote_p100_v5.py|workflows/(benchmark-frontend.yml|pr126-promote-p100-v5.yml))|dev/benchmarks/(benchmark_coverage_matrix.json|frontend_sources.json|frontend_data/parsers/(__init__\.py|panel_stage_c_final\.py)|frontend_data/registry\.py)|dev/tests/test_panel_stage_c_frontend_source\.py|docs/assets/benchmarks/.*|frontend/public/data/.*|results/pr126_p100_fresh/SHA256SUMS)$' || true)"
          if [ -n "$bad" ]; then
            echo 'Unexpected promotion scope:'
            printf '%s\n' "$bad"
            exit 1
          fi
      - name: Commit promotion without temporary runner
        run: |
          rm .github/workflows/pr126-promote-p100-v5.yml
          rm .github/scripts/pr126_promote_p100_v5.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'benchmark: promote PR126 fresh P100 evidence as v5'
          git push origin HEAD:agent/panel-p1-stage-c-covariance
