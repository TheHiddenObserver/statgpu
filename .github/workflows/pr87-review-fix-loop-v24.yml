name: PR87 review fix batch v24

on:
  push:
    branches: [agent/maintenance-0.2.4-0.2.5]
    paths:
      - .github/workflows/pr87-review-fix-loop-v24.yml

permissions:
  contents: write

jobs:
  apply-review-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply weighted IRLS and compile-policy fixes
        run: python pr87_patch_v24.py
      - name: Install validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation,formula]"
      - name: Run targeted validation
        run: |
          python -m py_compile \
            statgpu/glm_core/_irls.py \
            statgpu/glm_core/_solver_utils.py \
            statgpu/linear_model/_glm_base.py \
            statgpu/inference/_sandwich.py \
            dev/benchmarks/benchmark_torch_compile_maintenance.py \
            dev/tests/test_maintenance_024_025.py
          python -m pytest \
            dev/tests/test_maintenance_024_025.py \
            dev/tests/test_glm*.py \
            -q --tb=short
      - name: Commit source fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f pr87_patch_v24.py
          git add \
            statgpu/glm_core/_irls.py \
            statgpu/glm_core/_solver_utils.py \
            statgpu/linear_model/_glm_base.py \
            statgpu/inference/_sandwich.py \
            dev/benchmarks/benchmark_torch_compile_maintenance.py \
            dev/tests/test_maintenance_024_025.py
          git commit -m "fix: align weighted IRLS and compile policy"
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
