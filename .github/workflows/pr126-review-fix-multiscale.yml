name: PR126 review-fix multiscale gate

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - .github/workflows/pr126-review-fix-multiscale.yml

permissions:
  contents: write

concurrency:
  group: pr126-review-fix-multiscale
  cancel-in-progress: false

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply reviewed fixes
        run: python dev/validation/pr126_review_fix_multiscale_once.py
      - name: Install focused validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation,formula]"
      - name: Run focused review regressions
        run: |
          python -m pytest \
            dev/tests/test_panel_stage_c_covariance.py \
            dev/tests/test_panel_stage_b_hausman_covariance.py \
            dev/tests/test_panel_stage_c_physical_runner_contract.py \
            -q --tb=short
      - name: Validate syntax and diff
        run: |
          python -m compileall -q statgpu/panel dev/benchmarks/validate_panel_stage_c_gpu.py
          git diff --check
          git status --short
      - name: Commit validated review fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve multiscale panel cancellations"
          git push origin HEAD:agent/panel-p1-stage-c-covariance
