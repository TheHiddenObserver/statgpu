name: PR87 review fix batch v40

on:
  push:
    branches: [agent/maintenance-0.2.4-0.2.5]
    paths:
      - .github/workflows/pr87-review-fix-loop-v40.yml

permissions:
  contents: write

jobs:
  apply-review-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply review fixes
        run: python pr87_patch_v40.py
      - name: Install validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation,formula]"
      - name: Run targeted backend warm-start tests
        run: |
          python -m py_compile \
            statgpu/solvers/_newton.py \
            statgpu/solvers/_proximal_newton.py \
            statgpu/solvers/_lbfgs.py \
            statgpu/solvers/_lbfgs_b.py \
            statgpu/solvers/_admm.py \
            dev/tests/test_maintenance_024_025.py
          python -m pytest \
            dev/tests/test_maintenance_024_025.py::test_solver_numpy_warm_starts_follow_torch_cpu_backend_dtype \
            dev/tests/test_maintenance_024_025.py::test_torch_cuda_solver_numpy_warm_starts_stay_on_device \
            dev/tests/test_maintenance_024_025.py::test_cupy_solver_numpy_warm_starts_stay_on_device \
            dev/tests/test_maintenance_024_025.py::test_proximal_newton_none_penalty_has_no_spurious_warning \
            -q --tb=short
      - name: Run full CPU and documentation validation
        run: |
          python -m pytest dev/tests -q --tb=short
          python dev/validation/fix_docs_links.py --check
          python dev/validation/check_docs_contracts.py
      - name: Commit reviewed source fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f pr87_patch_v40.py .github/workflows/pr87-review-fix-loop-v40.yml
          git add \
            statgpu/solvers/_newton.py \
            statgpu/solvers/_proximal_newton.py \
            statgpu/solvers/_lbfgs.py \
            statgpu/solvers/_lbfgs_b.py \
            statgpu/solvers/_admm.py \
            dev/tests/test_maintenance_024_025.py \
            docs/en/guides/solver-algorithms.md \
            docs/cn/guides/solver-algorithms.md \
            CHANGELOG.md docs/en/changelog.md docs/cn/changelog.md
          git commit -m "fix: normalize solver warm starts across backends"
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
