name: PR126 panel final numerical documentation gate

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Apply documentation synchronization
        run: python dev/validation/pr126_panel_docs_final_once.py
      - name: Run maintained documentation contracts
        run: |
          python dev/validation/fix_docs_links.py --check
          python dev/validation/check_docs_contracts.py
          git diff --check
      - name: Commit documentation only
        run: |
          git config user.name "Ziqian Lin"
          git config user.email "51812297+TheHiddenObserver@users.noreply.github.com"
          git add \
            docs/en/panel/fama-macbeth.md \
            docs/cn/panel/fama-macbeth.md \
            docs/en/changelog.md \
            docs/cn/changelog.md \
            CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No documentation changes to commit"
          else
            git commit -m "docs: align PR126 numerical safety status"
            git push origin HEAD:agent/panel-p1-stage-c-covariance
          fi
