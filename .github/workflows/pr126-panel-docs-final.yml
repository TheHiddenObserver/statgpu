name: PR126 panel final numerical documentation gate

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Apply and validate documentation
        run: |
          set +e
          python dev/validation/pr126_panel_docs_final_once.py > /tmp/patch.log 2>&1
          patch_rc=$?
          if [ "$patch_rc" -eq 0 ]; then
            python - <<'PY'
          from pathlib import Path
          for path, old, new in (
              (Path("docs/en/panel/fama-macbeth.md"), "> Last updated: 2026-08-18  \n", "> Last updated: 2026-08-18<br>\n"),
              (Path("docs/cn/panel/fama-macbeth.md"), "> 最后更新：2026-08-18  \n", "> 最后更新：2026-08-18<br>\n"),
          ):
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise RuntimeError(f"date-format anchor missing in {path}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
            format_rc=$?
          else
            format_rc=99
          fi
          if [ "$patch_rc" -eq 0 ] && [ "$format_rc" -eq 0 ]; then
            python dev/validation/fix_docs_links.py --check > /tmp/links.log 2>&1
            links_rc=$?
            python dev/validation/check_docs_contracts.py > /tmp/contracts.log 2>&1
            contracts_rc=$?
            git diff --check > /tmp/diff.log 2>&1
            diff_rc=$?
          else
            links_rc=99
            contracts_rc=99
            diff_rc=99
            echo "links skipped because patch/format failed" > /tmp/links.log
            echo "contracts skipped because patch/format failed" > /tmp/contracts.log
            echo "diff-check skipped because patch/format failed" > /tmp/diff.log
          fi
          {
            echo "patch_rc=$patch_rc"
            echo "format_rc=$format_rc"
            echo "links_rc=$links_rc"
            echo "contracts_rc=$contracts_rc"
            echo "diff_rc=$diff_rc"
            echo "--- patch log ---"
            cat /tmp/patch.log
            echo "--- links log ---"
            cat /tmp/links.log
            echo "--- contracts log ---"
            cat /tmp/contracts.log
            echo "--- diff log ---"
            cat /tmp/diff.log
          } > dev/validation/pr126_panel_docs_result.txt
          tail -220 dev/validation/pr126_panel_docs_result.txt
          exit 0
      - name: Commit docs or diagnostic
        run: |
          git config user.name "Ziqian Lin"
          git config user.email "51812297+TheHiddenObserver@users.noreply.github.com"
          if grep -q '^patch_rc=0$' dev/validation/pr126_panel_docs_result.txt \
             && grep -q '^format_rc=0$' dev/validation/pr126_panel_docs_result.txt \
             && grep -q '^links_rc=0$' dev/validation/pr126_panel_docs_result.txt \
             && grep -q '^contracts_rc=0$' dev/validation/pr126_panel_docs_result.txt \
             && grep -q '^diff_rc=0$' dev/validation/pr126_panel_docs_result.txt; then
            git add \
              docs/en/panel/fama-macbeth.md \
              docs/cn/panel/fama-macbeth.md \
              docs/en/changelog.md \
              docs/cn/changelog.md \
              CHANGELOG.md
            if ! git diff --cached --quiet; then
              git commit -m "docs: align PR126 numerical safety status"
              git push origin HEAD:agent/panel-p1-stage-c-covariance
            fi
          else
            git add dev/validation/pr126_panel_docs_result.txt
            git commit -m "ci: record PR126 documentation sync failure"
            git push origin HEAD:agent/panel-p1-stage-c-covariance
          fi
