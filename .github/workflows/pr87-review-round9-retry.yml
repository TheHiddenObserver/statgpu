name: PR87 review round 9 likelihood retry

on:
  push:
    branches: [agent/maintenance-0.2.4-0.2.5]
    paths: [.github/workflows/pr87-review-round9-retry.yml]

permissions:
  contents: write

jobs:
  review-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply stable cross-backend likelihood fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one anchor, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = "statgpu/linear_model/wrappers/_logistic.py"
          replace_once(
              path,
              "from statgpu.glm_core._validation import (\n",
              "from statgpu.glm_core._logistic import LogisticLoss\n"
              "from statgpu.glm_core._validation import (\n",
          )
          replace_once(
              path,
              "        eta_diag = self._X_design @ params\n"
              "        p_diag = np.clip(self._sigmoid(eta_diag), 1e-15, 1.0 - 1e-15)\n"
              "        loglik_i = y * np.log(p_diag) + (1.0 - y) * np.log(1.0 - p_diag)\n",
              "        eta_diag = self._X_design @ params\n"
              "        loglik_i = -LogisticLoss().per_sample_value(eta_diag, y)\n",
          )
          replace_once(
              path,
              "        # Compute log-likelihood on GPU\n"
              "        eta = X_design @ params\n"
              "        p = 1 / (1 + cp.exp(-cp.clip(eta, -500, 500)))\n"
              "        loglik_i = y * cp.log(p + 1e-10) + (1 - y) * cp.log(1 - p + 1e-10)\n"
              "        loglik = cp.sum(loglik_i if sw_work is None else sw_work * loglik_i)\n",
              "        # Reuse the registered stable Bernoulli objective on CuPy.\n"
              "        eta = X_design @ params\n"
              "        p = 1 / (1 + cp.exp(-cp.clip(eta, -500, 500)))\n"
              "        loglik_i = -LogisticLoss().per_sample_value(eta, y)\n"
              "        loglik = cp.sum(loglik_i if sw_work is None else sw_work * loglik_i)\n",
          )
          replace_once(
              path,
              "        # Compute log-likelihood on GPU\n"
              "        eta = X_design @ params\n"
              "        p = 1 / (1 + torch.exp(-torch.clamp(eta, -500, 500)))\n"
              "        loglik_i = y * torch.log(p + 1e-10) + (1 - y) * torch.log(1 - p + 1e-10)\n"
              "        loglik = torch.sum(loglik_i if sw_work is None else sw_work * loglik_i)\n",
              "        # Reuse the registered stable Bernoulli objective on Torch.\n"
              "        eta = X_design @ params\n"
              "        p = 1 / (1 + torch.exp(-torch.clamp(eta, -500, 500)))\n"
              "        loglik_i = -LogisticLoss().per_sample_value(eta, y)\n"
              "        loglik = torch.sum(loglik_i if sw_work is None else sw_work * loglik_i)\n",
          )

          test_path = Path("dev/tests/test_pr87_code_review_fix_cycle.py")
          text = test_path.read_text(encoding="utf-8")
          text += '''


def test_logistic_wrapper_reuses_registered_objective_on_all_backends():
    import inspect
    import statgpu.linear_model.wrappers._logistic as module

    source = inspect.getsource(module.LogisticRegression)
    assert source.count("LogisticLoss().per_sample_value") == 3
    assert "log(p + 1e-10)" not in source
    assert "log(1 - p + 1e-10)" not in source


def test_logistic_cpu_likelihood_matches_stable_registered_objective():
    from statgpu.glm_core._logistic import LogisticLoss
    from statgpu.linear_model import LogisticRegression

    X = np.array([[-30.0], [-10.0], [10.0], [30.0]], dtype=float)
    y = np.array([0.0, 0.0, 1.0, 1.0])
    weights = np.array([1.0, 2.0, 3.0, 4.0])
    model = LogisticRegression(
        C=0.5, max_iter=200, tol=1e-10, device="cpu",
        compute_inference=False,
    ).fit(X, y, sample_weight=weights)
    eta = model.intercept_ + X @ model.coef_
    expected = -np.sum(weights * LogisticLoss().per_sample_value(eta, y))
    assert model.loglikelihood == pytest.approx(expected, rel=1e-13, abs=1e-13)


def test_logistic_private_torch_path_matches_registered_objective(monkeypatch):
    torch = pytest.importorskip("torch")
    import statgpu.linear_model.wrappers._logistic as module
    from statgpu.glm_core._logistic import LogisticLoss

    monkeypatch.setattr(module, "_get_torch_device_str", lambda: "cpu")
    X = torch.tensor([[-8.0], [-2.0], [2.0], [8.0]], dtype=torch.float64)
    y = torch.tensor([0.0, 0.0, 1.0, 1.0], dtype=torch.float64)
    weights = torch.tensor([1.0, 2.0, 3.0, 4.0], dtype=torch.float64)
    model = module.LogisticRegression(
        C=1.0, max_iter=200, tol=1e-10, device="torch",
        compute_inference=False,
    )
    model._validate_fit_controls()
    model._fit_torch(X, y, sample_weight=weights)
    params = torch.as_tensor(model._params, dtype=torch.float64)
    design = torch.cat([torch.ones((X.shape[0], 1), dtype=X.dtype), X], dim=1)
    eta = design @ params
    expected = -torch.sum(
        weights * LogisticLoss().per_sample_value(eta, y)
    ).item()
    assert model._loglik == pytest.approx(expected, rel=1e-13, abs=1e-13)
'''
          test_path.write_text(text, encoding="utf-8")

          additions = {
              "docs/en/changelog.md": (
                  "- Unified CPU, CuPy, and Torch fitted log-likelihood diagnostics "
                  "with the registered numerically stable LogisticLoss objective.\n\n"
              ),
              "docs/cn/changelog.md": (
                  "- 统一 CPU、CuPy 与 Torch 的拟合对数似然诊断，全部复用数值稳定的 "
                  "LogisticLoss 注册目标。\n\n"
              ),
          }
          for doc_path, addition in additions.items():
              p = Path(doc_path)
              text = p.read_text(encoding="utf-8")
              marker = "# Changelog\n\n"
              if marker not in text:
                  raise RuntimeError(f"{doc_path}: changelog heading missing")
              p.write_text(text.replace(marker, marker + addition, 1), encoding="utf-8")
          PY
      - name: Install validation and Torch CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation,formula]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ruff
      - name: Run likelihood and Logistic contracts
        run: |
          python -m pytest -q \
            dev/tests/test_pr87_code_review_fix_cycle.py \
            dev/tests/test_logistic.py \
            -k "logistic or likelihood or loglik"
      - name: Run complete CPU test tree
        run: python -m pytest dev/tests -q --tb=short
      - name: Run documentation and static gates
        shell: bash
        run: |
          python dev/validation/fix_docs_links.py --check
          python dev/validation/check_docs_contracts.py
          python -m compileall -q statgpu dev/validation dev/benchmarks
          ruff check \
            statgpu/linear_model/wrappers/_logistic.py \
            dev/tests/test_pr87_code_review_fix_cycle.py \
            --select F821,E9,F63,F7,F82
          git diff --check
          python -m pytest --collect-only -q >/dev/null
      - name: Commit reviewed fix and remove temporary workflows
        shell: bash
        run: |
          rm .github/workflows/pr87-review-round9-loglik.yml
          rm .github/workflows/pr87-review-round9-retry.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add statgpu dev/tests docs .github/workflows/pr87-review-round9-loglik.yml .github/workflows/pr87-review-round9-retry.yml
          git commit -m "fix: unify logistic likelihood diagnostics"
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
