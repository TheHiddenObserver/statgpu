name: PR87 review fix batch v65

on:
  push:
    branches:
      - agent/maintenance-0.2.4-0.2.5

permissions:
  contents: write

concurrency:
  group: pr87-review-fix-v65
  cancel-in-progress: false

jobs:
  apply-review-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply evidence-documentation closeout
        run: python pr87_patch_v65.py
      - name: Install validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation,formula]"
      - name: Run full CPU and documentation validation
        run: |
          python -m pytest dev/tests -q --tb=short
          python dev/validation/fix_docs_links.py --check
          python dev/validation/check_docs_contracts.py
      - name: Commit reviewed documentation closeout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f \
            pr87_patch_v65.py \
            .github/workflows/pr87-review-fix-loop-v65.yml
          git add CHANGELOG.md docs/en/changelog.md docs/cn/changelog.md
          git commit -m "docs: qualify ElasticNet performance evidence"
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
