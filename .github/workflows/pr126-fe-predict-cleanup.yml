name: PR126 FE prediction cleanup

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  apply-validate-commit:
    if: github.event.pull_request.number == 126
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install maintained Torch CPU environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" pytest
          python -m pip install "torch==2.0.1+cpu" --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Apply FE prediction cleanup
        run: python dev/validation/pr126_cleanup_fe_predict_map.py
      - name: Run targeted review gates
        run: |
          python -m pytest \
            dev/tests/test_panel_stage_b_torch_cpu.py \
            dev/tests/test_panel_stage_a_golden.py \
            dev/tests/test_panel_stage_c_final_review_fixes.py \
            dev/tests/test_panel_stage_c_api_formula.py \
            -q --tb=short
          python -m compileall -q statgpu dev/tests
          git diff --check
      - name: Remove temporary review scaffolding
        run: |
          rm -f dev/validation/pr126_cleanup_fe_predict_map.py
          rm -f .github/workflows/pr126-fe-predict-cleanup.yml
          git diff --check
      - name: Commit validated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "perf: remove obsolete FE prediction mask"
          git push origin HEAD:agent/panel-p1-stage-c-covariance
