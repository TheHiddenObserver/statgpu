name: PR126 v4 final parser review

on:
  push:
    branches: [agent/panel-p1-stage-c-covariance]
    paths:
      - 'dev/pr126_v4_final_parser_hardening.py'
      - '.github/workflows/pr126-v4-final-parser-review.yml'

permissions:
  contents: write

jobs:
  parser-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply post-promotion review fixes
        run: python dev/pr126_v4_final_parser_hardening.py
      - name: Install parser validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest 'jsonschema[format]'
      - name: Run v4 parser and maintained canonical matrix
        run: |
          python -m pytest -q \
            dev/tests/test_panel_stage_c_identifiability_frontend_source.py \
            dev/tests/test_benchmark_frontend_data.py \
            dev/tests/test_benchmark_catalog.py \
            dev/tests/test_benchmark_inventory_v2.py \
            dev/tests/test_frontend_contracts.py \
            dev/tests/test_frontend_domain_coverage.py \
            dev/tests/test_panel_stage_c_frontend_source.py
      - name: Strict deterministic generator check
        run: |
          python dev/benchmarks/generate_benchmark_data.py --check --strict-sources
      - name: Static and exact-source applicability gates
        run: |
          python -m compileall -q \
            dev/benchmarks/frontend_data/parsers/panel_stage_c_identifiability.py \
            dev/tests/test_panel_stage_c_identifiability_frontend_source.py
          git diff --check

          numerical_changed="$(git diff --name-only a99726e19c535dfcd0a94711bbc8be6aac437584...HEAD; git diff --name-only)"
          if printf '%s\n' "$numerical_changed" | grep -E '^(statgpu/panel/|dev/benchmarks/validate_panel_stage_c_gpu.py$|dev/benchmarks/benchmark_panel_stage_c_covariance.py$)' ; then
            echo 'Exact measurement-source applicability violated by post-promotion review.'
            exit 1
          fi

          raw_paths='results/pr126_p100/panel_stage_c_gpu_validation_a99726e1.json results/pr126_p100/panel_stage_c_performance_a99726e1.json'
          if ! git diff --quiet ccc46da6c5f2dee025c7715e39215db69b2872b8...HEAD -- $raw_paths ; then
            echo 'Immutable raw P100 artifacts changed after their raw commit.'
            git diff --stat ccc46da6c5f2dee025c7715e39215db69b2872b8...HEAD -- $raw_paths
            exit 1
          fi
          if ! git diff --quiet -- $raw_paths ; then
            echo 'Working tree modified immutable raw P100 artifacts.'
            exit 1
          fi
      - name: Commit validated parser hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f \
            .github/workflows/pr126-v4-final-parser-review.yml \
            dev/pr126_v4_final_parser_hardening.py
          git add \
            dev/benchmarks/frontend_data/parsers/panel_stage_c_identifiability.py \
            dev/tests/test_panel_stage_c_identifiability_frontend_source.py \
            dev/reviews/pr126_round4_autofix_review_2026-08-12.md
          git diff --cached --check
          git commit -m 'test: harden PR126 v4 immutable parser contract'
          git push origin HEAD:agent/panel-p1-stage-c-covariance
