name: PR129 Codex P2 staging

on:
  push:
    branches:
      - agent/pr129-codex-p2-fix-stage
    paths:
      - dev/pr129_codex_p2_test_followup.py
      - .github/workflows/pr129-codex-p2-stage.yml

permissions:
  contents: write

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr129-codex-p2-fix-stage
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply hosted test follow-up
        run: python dev/pr129_codex_p2_test_followup.py
      - name: Static syntax check
        run: |
          python -m compileall -q \
            dev/tests/test_gaussian_inference_gpu_runner_contract.py \
            dev/tests/test_gaussian_inference_no_host_transfer.py
          git diff --check
      - name: Commit hosted test follow-up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            dev/tests/test_gaussian_inference_gpu_runner_contract.py \
            dev/tests/test_gaussian_inference_no_host_transfer.py
          git commit -m "test(inference): align PR129 review-fix contracts"
          git push origin HEAD:agent/pr129-codex-p2-fix-stage
