name: PR87 review fix batch v56

on:
  push:
    branches:
      - agent/maintenance-0.2.4-0.2.5

permissions:
  contents: write

concurrency:
  group: pr87-review-fix-v56
  cancel-in-progress: false

jobs:
  apply-review-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply weighted CV grid fixes
        run: |
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path
          payload = "".join(
              Path(f"pr87_patch_v56.part{i}").read_text(encoding="utf-8")
              for i in range(2)
          )
          source = gzip.decompress(base64.b64decode(payload, validate=True))
          exec(compile(source, "pr87_patch_v56.py", "exec"))
          PY
      - name: Normalize generated LogisticCV indentation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("statgpu/linear_model/cv/_logistic_cv.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          function_start = next(
              index for index, line in enumerate(lines)
              if line.startswith("def _select_logistic_c_cv(")
          )
          grid_start = next(
              index for index in range(function_start + 1, len(lines))
              if lines[index].lstrip().startswith("# Generate a grid for the same weighted objective")
          )
          degenerate_start = next(
              index for index in range(grid_start + 1, len(lines))
              if lines[index].lstrip() == "# Handle degenerate cases"
          )
          fold_start = next(
              index for index in range(degenerate_start + 1, len(lines))
              if lines[index].lstrip() == "# Generate CV folds"
          )
          input_start = next(
              index for index in range(function_start + 1, grid_start)
              if lines[index].lstrip() == "if use_gpu:"
          )

          def normalize_region(start, end, target=4):
              nonblank = [line for line in lines[start:end] if line]
              minimum = min(len(line) - len(line.lstrip(" ")) for line in nonblank)
              delta = target - minimum
              for index in range(start, end):
                  line = lines[index]
                  if not line:
                      continue
                  if delta >= 0:
                      lines[index] = " " * delta + line
                  else:
                      remove = -delta
                      if not line.startswith(" " * remove):
                          raise SystemExit(f"cannot dedent line {index + 1} by {remove}")
                      lines[index] = line[remove:]

          normalize_region(input_start, grid_start)
          normalize_region(grid_start, degenerate_start)
          normalize_region(degenerate_start, fold_start)
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Compile generated source
        run: |
          python -m py_compile \
            statgpu/linear_model/cv/_device.py \
            statgpu/linear_model/cv/_logistic_cv.py \
            statgpu/linear_model/cv/_elasticnet_cv.py \
            dev/tests/test_maintenance_024_025.py
      - name: Install validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation,formula]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run targeted weighted-grid tests
        run: |
          python -m pytest \
            dev/tests/test_maintenance_024_025.py::test_logistic_default_grid_respects_integer_weight_replication \
            dev/tests/test_maintenance_024_025.py::test_elasticnet_default_grid_respects_integer_weight_replication \
            dev/tests/test_maintenance_024_025.py::test_cv_device_inspection_does_not_mask_runtime_failures \
            -q --tb=short
      - name: Run full CPU and documentation validation
        run: |
          python -m pytest dev/tests -q --tb=short
          python dev/validation/fix_docs_links.py --check
          python dev/validation/check_docs_contracts.py
      - name: Commit reviewed source fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f \
            pr87_patch_v56.part0 \
            pr87_patch_v56.part1 \
            .github/workflows/pr87-review-fix-loop-v56.yml
          git add \
            statgpu/linear_model/cv/_device.py \
            statgpu/linear_model/cv/_logistic_cv.py \
            statgpu/linear_model/cv/_elasticnet_cv.py \
            dev/tests/test_maintenance_024_025.py \
            CHANGELOG.md docs/en/changelog.md docs/cn/changelog.md
          git commit -m "fix: weight dedicated CV default grids"
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
