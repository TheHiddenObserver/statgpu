name: PR126 Rank DF Physical Matrix Autofix

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - '.github/workflows/pr126-rank-df-physical-matrix-autofix.yml'

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply physical matrix patch
        run: |
          python dev/pr126_expand_physical_matrix.py
          python dev/pr126_physical_matrix_followup.py
      - name: Install validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" pytest pandas patsy
          python -m pip install "torch==2.0.1+cpu" --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Run runner and maintained rank matrix contracts
        run: |
          python -m pytest \
            dev/tests/test_panel_stage_c_physical_runner_contract.py \
            dev/tests/test_panel_stage_c_performance_runner_contract.py \
            dev/tests/test_panel_stage_c_rank_deficient_matrix.py \
            dev/tests/test_panel_stage_c_inference_guard.py \
            dev/tests/test_panel_stage_c_torch_cpu.py \
            -q --tb=short
          python -m compileall -q dev/benchmarks/validate_panel_stage_c_gpu.py dev/benchmarks/benchmark_panel_stage_c_covariance.py
          git diff --check
      - name: Commit validated physical matrix
        run: |
          rm dev/pr126_expand_physical_matrix.py
          rm dev/pr126_physical_matrix_followup.py
          rm .github/workflows/pr126-rank-df-physical-matrix-autofix.yml
          git config user.name "chatgpt-codex-connector"
          git config user.email "1144995+chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add dev/benchmarks/validate_panel_stage_c_gpu.py dev/benchmarks/benchmark_panel_stage_c_covariance.py dev/tests/test_panel_stage_c_physical_runner_contract.py dev/tests/test_panel_stage_c_performance_runner_contract.py
          git add -u dev/pr126_expand_physical_matrix.py dev/pr126_physical_matrix_followup.py .github/workflows/pr126-rank-df-physical-matrix-autofix.yml
          git commit -m "test: expand panel rank-deficient physical matrix"
          git push origin HEAD:agent/panel-p1-stage-c-covariance
