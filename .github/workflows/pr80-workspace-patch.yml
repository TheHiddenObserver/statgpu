name: PR80 Workspace Patch

on:
  push:
    branches: [codex/survival-gpu-completion]

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'TheHiddenObserver/statgpu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/survival-gpu-completion
      - name: Apply bounded workspace estimate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          risk_path = Path("statgpu/survival/_risk_sets.py")
          text = risk_path.read_text(encoding="utf-8")
          old = '''    # risk/failure masks coexist with their floating forms, masked/shifted
              # predictors, risk/failure weights, and (for residuals) hazard weights.
              # Moment evaluation additionally holds several batch-by-p-by-p tensors.
              row_buffers = 8 if score_residuals else 6
              row_bytes = max(int(n_rows), 1) * (
                  2 + row_buffers * int(itemsize)
              )
              moment_bytes = 0
              if compute_derivatives:
                  moment_bytes = (
                      6 * max(int(n_features) * int(n_features), 1) * int(itemsize)
                  )
              return row_bytes + moment_bytes
          '''
          new = '''    # risk/failure masks coexist with their floating forms, masked/shifted
              # predictors, risk/failure weights, and (for residuals) hazard weights.
              # Three-operand einsum implementations may contract ``bn,ni`` first,
              # materializing a batch-by-row-by-feature weighted design before the
              # final p-by-p moment. Count two such row-feature buffers conservatively
              # so wide models select streaming before backend-specific contraction
              # paths can exceed the advertised workspace ceiling.
              row_buffers = 8 if score_residuals else 6
              derivative_row_buffers = 2 * max(int(n_features), 0) if compute_derivatives else 0
              row_bytes = max(int(n_rows), 1) * (
                  2 + (row_buffers + derivative_row_buffers) * int(itemsize)
              )
              moment_bytes = 0
              if compute_derivatives:
                  moment_bytes = (
                      6 * max(int(n_features) * int(n_features), 1) * int(itemsize)
                  )
              return row_bytes + moment_bytes
          '''
          if old in text:
              risk_path.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif "derivative_row_buffers = 2 * max(int(n_features), 0)" not in text:
              raise SystemExit("expected workspace estimate block was not found")

          workflow_path = Path(".github/workflows/test.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          anchor = "            dev/tests/test_pr80_fit_boundary.py \\\n"
          additions = (
              anchor
              + "            dev/tests/test_pr80_constructor_boundaries.py \\\n"
              + "            dev/tests/test_pr80_workspace_estimator.py \\\n"
          )
          if "dev/tests/test_pr80_workspace_estimator.py" not in workflow:
              if anchor not in workflow:
                  raise SystemExit("regression-matrix anchor was not found")
              workflow_path.write_text(
                  workflow.replace(anchor, additions, 1), encoding="utf-8"
              )
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Workspace patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add statgpu/survival/_risk_sets.py .github/workflows/test.yml
          git commit -m "Bound Cox derivative workspace estimates"
          git push origin HEAD:codex/survival-gpu-completion
