name: PR126 full-rank conditioning fix once

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - .github/workflows/pr126-full-rank-conditioning-fix.yml

permissions:
  contents: write

jobs:
  apply-review-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply exact review patch
        run: python dev/validation/pr126_full_rank_conditioning_fix_once.py

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run focused review gates
        run: |
          python -m compileall -q statgpu/panel
          python -m pytest -q dev/tests/test_panel_stage_c_full_rank_conditioning.py
          python -m pytest -q dev/tests/test_panel_stage_c_inference_guard.py
          git diff --check

      - name: Commit reviewed fix and remove staging helpers
        run: |
          rm .github/workflows/pr126-full-rank-conditioning-fix.yml
          rm dev/validation/pr126_full_rank_conditioning_fix_once.py
          git config user.name "statgpu-review-fix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilize full-rank panel least squares"
          git push origin HEAD:agent/panel-p1-stage-c-covariance
