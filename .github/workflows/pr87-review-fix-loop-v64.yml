name: PR87 review fix batch v64

on:
  push:
    branches:
      - agent/maintenance-0.2.4-0.2.5

permissions:
  contents: write

concurrency:
  group: pr87-review-fix-v64
  cancel-in-progress: false

jobs:
  apply-review-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply ElasticNet Ridge scaling fix
        run: python pr87_patch_v64.py
      - name: Install validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation,formula]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile affected tests
        run: python -m py_compile dev/tests/test_maintenance_024_025.py
      - name: Run scaling and inference regression tests
        run: |
          python -m pytest \
            dev/tests/test_maintenance_024_025.py::test_elasticnet_zero_l1_ratio_matches_same_alpha_ridge \
            dev/tests/test_maintenance_024_025.py::test_elasticnet_wrapper_cpu_debiased_inference_contract \
            dev/tests/test_maintenance_024_025.py::test_elasticnet_cv_compute_inference_runs_on_final_refit \
            -q --tb=short
      - name: Run full CPU and documentation validation
        run: |
          python -m pytest dev/tests -q --tb=short
          python dev/validation/fix_docs_links.py --check
          python dev/validation/check_docs_contracts.py
      - name: Commit reviewed scaling fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f \
            pr87_patch_v64.py \
            .github/workflows/pr87-review-fix-loop-v64.yml
          git add \
            dev/tests/test_maintenance_024_025.py \
            docs/en/models/elastic-net.md \
            docs/cn/models/elastic-net.md \
            CHANGELOG.md docs/en/changelog.md docs/cn/changelog.md
          git commit -m "docs: correct ElasticNet Ridge alpha scaling"
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
