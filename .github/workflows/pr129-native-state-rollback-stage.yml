name: PR129 native state rollback staging

on:
  push:
    branches:
      - agent/pr129-native-state-rollback-stage
    paths:
      - dev/pr129_native_state_rollback.py
      - .github/workflows/pr129-native-state-rollback-stage.yml

permissions:
  contents: write

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr129-native-state-rollback-stage
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply rollback fix
        run: python dev/pr129_native_state_rollback.py
      - name: Normalize test EOF
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('dev/tests/test_gaussian_inference_no_host_transfer.py')
          path.write_text(path.read_text().rstrip() + '\n')
          PY
      - name: Static checks
        run: |
          python -m compileall -q \
            statgpu/linear_model/penalized/_fit_mixin.py \
            dev/tests/test_gaussian_inference_no_host_transfer.py
          git diff --check
      - name: Commit repaired source and test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            statgpu/linear_model/penalized/_fit_mixin.py \
            dev/tests/test_gaussian_inference_no_host_transfer.py
          git commit -m "fix(inference): roll back native fit state on failure"
          git push origin HEAD:agent/pr129-native-state-rollback-stage
