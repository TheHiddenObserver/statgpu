name: PR87 scale benchmark Python 3.9 fix

on:
  push:
    branches:
      - agent/maintenance-0.2.4-0.2.5

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Replace Python 3.10-only annotations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('dev/benchmarks/benchmark_torch_compile_scale.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'from typing import Iterable, Sequence': 'from typing import Iterable, Optional, Sequence',
              '    scales: Sequence[tuple[int, int]] | None,': '    scales: Optional[Sequence[tuple[int, int]]],',
              '    cases: Sequence[str] | None,': '    cases: Optional[Sequence[str]],',
              '    repeats: int | None,': '    repeats: Optional[int],',
          }
          for old, new in replacements.items():
              assert text.count(old) == 1, (old, text.count(old))
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate benchmark contracts on Python 3.9
        shell: bash
        run: |
          python -m pip install -q pytest numpy
          python -m compileall -q \
            dev/benchmarks/benchmark_torch_compile_scale.py \
            dev/tests/test_torch_compile_scale_benchmark_contract.py
          python -m pytest -q \
            dev/tests/test_torch_compile_scale_benchmark_contract.py \
            dev/tests/test_torch_compile_benchmark_contract.py

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/pr87-scale-benchmark-py39-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/benchmarks/benchmark_torch_compile_scale.py \
            .github/workflows/pr87-scale-benchmark-py39-fix.yml
          git commit -m "fix: keep scale benchmark compatible with Python 3.9"
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
