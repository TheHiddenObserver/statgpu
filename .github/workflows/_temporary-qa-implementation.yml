name: Temporary dashboard QA implementation

on:
  push:
    branches:
      - agent/benchmark-production-qa-accessibility
    paths:
      - .github/workflows/_temporary-qa-implementation.yml

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/benchmark-production-qa-accessibility
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply production QA and accessibility changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_str: str, old: str, new: str) -> None:
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              assert count == 1, f'{path_str}: expected one replacement, got {count}'
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Accessible filter labels and native keyboard scale buttons.
          replace_once(
              'frontend/src/components/FilterBar.ts',
              """    bar.appendChild(h('span', { class: 'filter-label' }, 'Model:'));\n    const sel = h('select');\n""",
              """    bar.appendChild(h('label', { class: 'filter-label', for: 'model-select' }, 'Model:'));\n    const sel = h('select', { id: 'model-select' });\n""",
          )
          replace_once(
              'frontend/src/components/FilterBar.ts',
              """      bar.appendChild(h('span', { class: 'filter-label' }, 'Variant:'));\n      const vsel = h('select');\n""",
              """      bar.appendChild(h('label', { class: 'filter-label', for: 'variant-select' }, 'Variant:'));\n      const vsel = h('select', { id: 'variant-select' });\n""",
          )
          replace_once(
              'frontend/src/components/FilterBar.ts',
              """      bar.appendChild(h('span', { class: 'filter-label' }, 'Penalty:'));\n      const sel = h('select');\n""",
              """      bar.appendChild(h('label', { class: 'filter-label', for: 'penalty-select' }, 'Penalty:'));\n      const sel = h('select', { id: 'penalty-select' });\n""",
          )
          replace_once(
              'frontend/src/components/FilterBar.ts',
              """      bar.appendChild(h('span', { class: 'filter-label' }, 'Solver:'));\n      const sel = h('select');\n""",
              """      bar.appendChild(h('label', { class: 'filter-label', for: 'solver-select' }, 'Solver:'));\n      const sel = h('select', { id: 'solver-select' });\n""",
          )
          replace_once(
              'frontend/src/components/FilterBar.ts',
              """      const chip = h(\n        'span',\n        {\n          class: `scale-chip${active ? ' active' : ''}`,\n          'data-scale-key': sk,\n          'aria-pressed': String(active),\n        },\n""",
              """      const chip = h(\n        'button',\n        {\n          type: 'button',\n          class: `scale-chip${active ? ' active' : ''}`,\n          'data-scale-key': sk,\n          'aria-pressed': String(active),\n        },\n""",
          )

          # Sortable column headers expose keyboard activation and aria-sort.
          replace_once(
              'frontend/src/components/OverviewTable.ts',
              """  for (const col of columns) {\n    const arrow = state.sortColumn === col.key\n      ? (state.sortDir === 'asc' ? ' ▲' : ' ▼') : '';\n    const th = h('th', {}, col.label + arrow);\n    th.addEventListener('click', () => {\n      setSortColumn(state, col.key);\n      onUpdate();\n    });\n    headerRow.appendChild(th);\n  }\n""",
              """  for (const col of columns) {\n    const activeSort = state.sortColumn === col.key;\n    const arrow = activeSort ? (state.sortDir === 'asc' ? ' ▲' : ' ▼') : '';\n    const th = h('th', {\n      scope: 'col',\n      tabindex: '0',\n      'aria-sort': activeSort ? (state.sortDir === 'asc' ? 'ascending' : 'descending') : 'none',\n      title: `Sort by ${col.label}`,\n    }, col.label + arrow);\n    const activateSort = () => {\n      setSortColumn(state, col.key);\n      onUpdate();\n    };\n    th.addEventListener('click', activateSort);\n    th.addEventListener('keydown', (event) => {\n      const keyEvent = event as KeyboardEvent;\n      if (keyEvent.key !== 'Enter' && keyEvent.key !== ' ') return;\n      keyEvent.preventDefault();\n      activateSort();\n    });\n    headerRow.appendChild(th);\n  }\n""",
          )

          # Metric panels use native disclosure buttons instead of pointer-only divs.
          replace_once(
              'frontend/src/components/panels/PanelTable.ts',
              """  const toggle = h('div', {\n    style: 'color:#1890ff; cursor:pointer; font-weight:bold; margin-bottom:4px;',\n  }, `${expanded ? '▼' : '▶'} ${title} (${rows.length})`);\n""",
              """  const toggle = h('button', {\n    type: 'button',\n    class: 'metric-panel-toggle',\n    'aria-expanded': String(expanded),\n  }, `${expanded ? '▼' : '▶'} ${title} (${rows.length})`);\n""",
          )

          # Main landmark, chart semantics, and synchronized accessible data tables.
          replace_once(
              'frontend/src/main.ts',
              """import { renderSpeedupChart } from './charts/SpeedupChart';\nimport { emptyStateMessage } from './components/EmptyState';\n""",
              """import { renderSpeedupChart } from './charts/SpeedupChart';\nimport { renderChartDataFallback } from './components/ChartDataFallback';\nimport { emptyStateMessage } from './components/EmptyState';\n""",
          )
          replace_once(
              'frontend/src/main.ts',
              """function renderMain(): HTMLElement {\n  const main = h('div', { class: 'main' });\n  const filtered = getFilteredRuns();\n  main.appendChild(renderFilterBar(data!.runs, data!, state!, update));\n  main.appendChild(renderChartArea(filtered));\n  main.appendChild(renderOverviewTable(filtered, state!, update));\n  return main;\n}\n""",
              """function renderMain(): HTMLElement {\n  const main = h('main', { class: 'main', id: 'dashboard-main', tabindex: '-1' });\n  const filtered = getFilteredRuns();\n  main.appendChild(renderFilterBar(data!.runs, data!, state!, update));\n  main.appendChild(renderChartArea(filtered));\n  main.appendChild(renderChartDataFallback(filtered, focusedSpeedupRuns(filtered), state!));\n  main.appendChild(renderOverviewTable(filtered, state!, update));\n  return main;\n}\n""",
          )
          replace_once(
              'frontend/src/main.ts',
              """  const timingDiv = h('div', { id: 'timing-chart', class: 'chart-container' });\n  const speedupDiv = h('div', { id: 'speedup-chart', class: 'chart-container' });\n""",
              """  const timingDiv = h('div', {\n    id: 'timing-chart',\n    class: 'chart-container',\n    role: 'img',\n    'aria-label': 'Fit Time chart',\n    'aria-describedby': 'timing-chart-data',\n  });\n  const speedupDiv = h('div', {\n    id: 'speedup-chart',\n    class: 'chart-container',\n    role: 'img',\n    'aria-label': 'Speedup vs Reference chart',\n    'aria-describedby': 'speedup-chart-data',\n  });\n""",
          )
          replace_once(
              'frontend/src/main.ts',
              """  main.appendChild(renderFilterBar(allRuns, data!, state!, update));\n  main.appendChild(renderChartArea(filtered));\n  main.appendChild(renderOverviewTable(filtered, state!, update));\n""",
              """  main.appendChild(renderFilterBar(allRuns, data!, state!, update));\n  main.appendChild(renderChartArea(filtered));\n  main.appendChild(renderChartDataFallback(filtered, focusedSpeedupRuns(filtered), state!));\n  main.appendChild(renderOverviewTable(filtered, state!, update));\n""",
          )

          Path('frontend/src/components/ChartDataFallback.ts').write_text(r'''/** Accessible tabular alternative for ECharts content. */

import type { Run } from '../schema';
import type { AppState } from '../state';
import { selectTimingRuns } from '../charts/TimingChart';
import { selectSpeedupRuns } from '../charts/SpeedupChart';
import { h } from '../utils/dom';
import { formatModelName } from '../utils/format';

function identityCells(run: Run): string[] {
  return [
    formatModelName(run.model_id),
    run.variant ?? '—',
    run.penalty ?? '—',
    run.solver_display ?? run.solver ?? '—',
    run.framework === 'statgpu'
      ? [run.backend, run.implementation].filter(Boolean).join('/') || 'statgpu'
      : run.framework,
    run.scale.label,
  ];
}

function renderTable(
  id: string,
  caption: string,
  valueLabel: string,
  rows: Array<{ run: Run; value: string; reference: string }>,
): HTMLElement {
  const details = h('details', { class: 'chart-data-details', id });
  details.appendChild(h('summary', {}, `${caption} (${rows.length} rows)`));
  const wrapper = h('div', { class: 'chart-data-table-wrap' });
  const table = h('table', { class: 'chart-data-table' });
  table.appendChild(h('caption', {}, `${caption}. Full labels are shown here when chart labels are truncated.`));
  const header = h('tr');
  for (const label of ['Model', 'Variant', 'Penalty', 'Solver', 'Backend / reference', 'Scale', valueLabel, 'Reference']) {
    header.appendChild(h('th', { scope: 'col' }, label));
  }
  const thead = h('thead');
  thead.appendChild(header);
  table.appendChild(thead);
  const tbody = h('tbody');
  for (const { run, value, reference } of rows) {
    const tr = h('tr');
    for (const cell of [...identityCells(run), value, reference]) {
      tr.appendChild(h('td', {}, cell));
    }
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  wrapper.appendChild(table);
  details.appendChild(wrapper);
  return details;
}

export function renderChartDataFallback(
  timingSourceRuns: Run[],
  speedupSourceRuns: Run[],
  state: AppState,
): HTMLElement {
  const section = h('section', {
    class: 'chart-data-fallback',
    'aria-label': 'Accessible chart data',
  });
  section.appendChild(h('h2', { class: 'chart-data-heading' }, 'Chart data tables'));
  section.appendChild(h('p', { class: 'chart-data-help' },
    'Use these tables for exact values and full labels; they follow the current filters and chart view.'));

  const timing = selectTimingRuns(timingSourceRuns, state).runs.map((run) => ({
    run,
    value: `${run.metrics.timing!.fit_time_ms.toFixed(3)} ms`,
    reference: run.metrics.timing!.quality,
  }));
  const speedup = selectSpeedupRuns(speedupSourceRuns, state).runs.map((run) => ({
    run,
    value: `${run.metrics.speedup!.value.toFixed(3)}×`,
    reference: `${run.metrics.speedup!.reference_framework} (${run.metrics.speedup!.reported_semantics})`,
  }));

  section.appendChild(renderTable('timing-chart-data', 'Fit Time chart data', 'Time', timing));
  section.appendChild(renderTable('speedup-chart-data', 'Speedup chart data', 'Speedup', speedup));
  return section;
}
''', encoding='utf-8')

