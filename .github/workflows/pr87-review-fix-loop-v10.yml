name: PR87 review fix batch v10

on:
  push:
    branches: [agent/maintenance-0.2.4-0.2.5]
    paths:
      - .github/workflows/pr87-review-fix-loop-v10.yml

permissions:
  contents: write

jobs:
  apply-review-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Patch group compile cache isolation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('dev/tests/test_maintenance_024_025.py')
          text = path.read_text(encoding='utf-8')
          old = '''    import statgpu.solvers._fista_lla as fista_lla_module\n\n    fista_lla_module._SQERR_PROXIMAL_TORCH = None\n    fista_lla_module._FUSED_PROXIMAL_CLIP_TORCH = None\n    get_torch_compile_diagnostics(clear=True)\n'''
          new = '''    import statgpu.solvers._fista_lla as fista_lla_module\n\n    fista_lla_module._SQERR_PROXIMAL_TORCH = None\n    fista_lla_module._FUSED_PROXIMAL_CLIP_TORCH = None\n    if penalty == "group_scad":\n        import statgpu.penalties._group_scad as group_scad_module\n\n        group_scad_module._GROUP_SCAD_PROXIMAL_TORCH_COMPILED = None\n    elif penalty == "group_mcp":\n        import statgpu.penalties._group_mcp as group_mcp_module\n\n        group_mcp_module._GROUP_MCP_PROXIMAL_TORCH_COMPILED = None\n    get_torch_compile_diagnostics(clear=True)\n'''
          if old not in text:
              raise RuntimeError('model-level compile cache anchor missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" scipy pytest packaging "scikit-learn==1.3.2" pandas patsy joblib
          python -m pip install -e . --no-deps

      - name: Run targeted CPU maintenance tests
        run: |
          python -m py_compile dev/benchmarks/benchmark_torch_compile_maintenance.py
          python -m pytest \
            dev/tests/test_maintenance_024_025.py \
            dev/tests/test_core_contracts.py::test_set_params_rejects_unknown_and_supports_nested_estimators \
            -q --tb=short

      - name: Commit test isolation fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/tests/test_maintenance_024_025.py
          git commit -m "test: isolate group compile matrix caches"
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
