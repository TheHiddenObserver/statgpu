name: Temporary sync dashboard QA docs

on:
  push:
    branches:
      - agent/benchmark-production-qa-accessibility
    paths:
      - '.github/workflows/_temporary-sync-dashboard-qa-docs.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/benchmark-production-qa-accessibility
          fetch-depth: 0
      - name: Apply dashboard QA documentation sync
        run: python dev/benchmarks/_temporary_sync_dashboard_qa_docs.py
      - name: Commit documentation sync
        run: |
          git rm .github/workflows/_temporary-sync-dashboard-qa-docs.yml
          git rm dev/benchmarks/_temporary_sync_dashboard_qa_docs.py
          git config user.name 'Ziqian Lin'
          git config user.email '51812297+TheHiddenObserver@users.noreply.github.com'
          git add docs/en/guides/benchmarks.md docs/en/guides/statgpu_benchmark_dashboard.md docs/cn/guides/benchmarks.md
          git diff --cached --check
          git commit -m 'docs: sync benchmark production QA guidance'
          git push origin HEAD:agent/benchmark-production-qa-accessibility
