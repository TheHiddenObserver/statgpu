name: PR126 guarded round8 formula RHS fix

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - '.github/workflows/pr126-round8-formula-rhs-fix.yml'

permissions:
  contents: write

jobs:
  formula-rhs-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Guard exact technical parent
        run: |
          base='1d8d8d79945f7ff671e370196ceef5fd54f996db'
          test "$(git diff --name-only "$base" HEAD)" = ".github/workflows/pr126-round8-formula-rhs-fix.yml"
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pandas patsy
      - name: Apply shared top-level RHS fix
        run: |
          printf '%s' '' | base64 -d > /tmp/pr126_round8_rhs_fix.py
          python /tmp/pr126_round8_rhs_fix.py
      - name: Run focused regressions
        run: |
          python -m pytest dev/tests/test_panel_formula.py dev/tests/test_panel_stage_c_final_review_fixes.py -q --tb=short
          python -m compileall -q statgpu/panel
      - name: Verify scope and commit without temporary workflow
        run: |
          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' dev/tests/test_panel_formula.py statgpu/panel/_formula.py | sort)"
          test "$changed" = "$expected"
          git rm .github/workflows/pr126-round8-formula-rhs-fix.yml
          git add statgpu/panel/_formula.py dev/tests/test_panel_formula.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(panel): share quote-aware formula RHS parsing'
          git push origin HEAD:agent/panel-p1-stage-c-covariance
