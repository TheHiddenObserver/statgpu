name: Temporary CV CPU candidate

on:
  push:
    branches:
      - agent/canonical-cv-benchmark-source
    paths:
      - .github/workflows/_temporary-cv-candidate.yml

permissions:
  contents: read

concurrency:
  group: temporary-cv-cpu-candidate
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install benchmark dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e . 'jsonschema[format]'
      - name: Run CPU candidate and retain status
        id: candidate
        shell: bash
        run: |
          set +e
          mkdir -p _candidate
          python dev/benchmarks/benchmark_cv_models.py \
            --out _candidate/cv_benchmark_candidate.json \
            --env-id github-actions-cpu \
            --backends numpy,cupy,torch \
            --n-samples 120 \
            --n-features 8 \
            --repeats 1 \
            --warmup 0 \
            > _candidate/runner.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat _candidate/runner.log
          exit 0
      - name: Profile PenalizedGLM CV internals
        if: always()
        run: |
          python - <<'PY' > _candidate/pglm_profile.txt
          import cProfile
          import importlib
          import io
          import pstats
          from dev.benchmarks.benchmark_cv_models import (
              CASE_SPECS,
              _construct,
              _fit_args,
              _model_kwargs,
              _regression_data,
          )

          spec = next(spec for spec in CASE_SPECS if spec.model_id == "PenalizedGLM_CV")
          X, y, _, _ = _regression_data(20260807, 120, 8)
          cls = getattr(importlib.import_module(spec.import_module), spec.import_name)
          model = _construct(cls, _model_kwargs(spec, "numpy", 20260807))
          profile = cProfile.Profile()
          profile.runcall(model.fit, *_fit_args(spec, X, y))
          stream = io.StringIO()
          pstats.Stats(profile, stream=stream).strip_dirs().sort_stats("cumulative").print_stats(160)
          print(stream.getvalue())
          PY
          cat _candidate/pglm_profile.txt
      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cv-cpu-candidate
          path: _candidate/
          retention-days: 7
      - name: Require a valid candidate
        run: test "${{ steps.candidate.outputs.status }}" = "0"
