name: Temporary CV CPU candidate

on:
  push:
    branches:
      - agent/canonical-cv-benchmark-source
    paths:
      - .github/workflows/_temporary-cv-candidate.yml

permissions:
  contents: read

concurrency:
  group: temporary-cv-cpu-candidate
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install benchmark dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e . 'jsonschema[format]'
      - name: Run final repeated CPU candidate and retain status
        id: candidate
        shell: bash
        run: |
          set +e
          mkdir -p _candidate
          python dev/benchmarks/benchmark_cv_models.py \
            --out _candidate/cv_benchmark_candidate.json \
            --env-id github-actions-cpu \
            --backends numpy,cupy,torch \
            --n-samples 120 \
            --n-features 8 \
            --repeats 3 \
            --warmup 1 \
            > _candidate/runner.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat _candidate/runner.log
          exit 0
      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cv-cpu-candidate
          path: _candidate/
          retention-days: 7
      - name: Require a valid candidate
        run: test "${{ steps.candidate.outputs.status }}" = "0"
