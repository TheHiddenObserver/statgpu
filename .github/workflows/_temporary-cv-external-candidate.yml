name: Temporary CV external candidate

on:
  push:
    branches:
      - agent/canonical-cv-benchmark-source
    paths:
      - .github/workflows/_temporary-cv-external-candidate.yml

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install benchmark dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[validation]'
      - name: Run aligned CPU candidate
        run: |
          mkdir -p _candidate
          python dev/benchmarks/benchmark_cv_models.py \
            --out _candidate/cv_benchmark_external_candidate.json \
            --env-id github-actions-cpu \
            --backends numpy,cupy,torch \
            --n-samples 120 \
            --n-features 8 \
            --repeats 3 \
            --warmup 1 \
            --include-sklearn
      - name: Verify expected framework coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path('_candidate/cv_benchmark_external_candidate.json').read_text())
          aligned = {'RidgeCV', 'LassoCV', 'ElasticNetCV', 'LogisticRegressionCV'}
          for case in source['cases']:
              successes = {(run['framework'], run['backend']) for run in case['runs'] if run['status'] == 'success'}
              assert ('statgpu', 'numpy') in successes, (case['model_id'], successes)
              if case['model_id'] in aligned:
                  assert ('sklearn', None) in successes, (case['model_id'], successes)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cv-external-candidate
          path: _candidate/
          retention-days: 7
