name: Temporary CV external candidate

on:
  push:
    branches:
      - agent/canonical-cv-benchmark-source
    paths:
      - .github/workflows/_temporary-cv-external-candidate.yml

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install benchmark dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[validation]'
      - name: Run final aligned CPU candidate
        run: |
          mkdir -p _candidate
          python dev/benchmarks/benchmark_cv_models.py \
            --out _candidate/cv_benchmark_external_candidate.json \
            --env-id github-actions-cpu \
            --backends numpy,cupy,torch \
            --n-samples 120 \
            --n-features 8 \
            --repeats 3 \
            --warmup 1 \
            --include-sklearn
      - name: Verify framework, parameters, and score semantics
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          source = json.loads(Path('_candidate/cv_benchmark_external_candidate.json').read_text())
          aligned = {'RidgeCV', 'LassoCV', 'ElasticNetCV', 'LogisticRegressionCV'}
          minimize = aligned | {'PenalizedGLM_CV'}
          for case in source['cases']:
              successes = [run for run in case['runs'] if run['status'] == 'success']
              by_framework = {run['framework']: run for run in successes}
              assert by_framework['statgpu']['backend'] == 'numpy'
              if case['model_id'] in aligned:
                  assert 'sklearn' in by_framework
                  statgpu = by_framework['statgpu']
                  sklearn = by_framework['sklearn']
                  assert statgpu['selected_parameters'] == sklearn['selected_parameters'], (
                      case['model_id'], statgpu['selected_parameters'], sklearn['selected_parameters']
                  )
                  assert abs(statgpu['scores']['final_score'] - sklearn['scores']['final_score']) < 1e-4
                  assert abs(statgpu['scores']['validation_score'] - sklearn['scores']['validation_score']) < 0.05
              for run in successes:
                  scores = run['scores']
                  assert math.isfinite(scores['validation_score'])
                  assert math.isfinite(scores['final_score'])
                  if case['model_id'] in minimize:
                      assert scores['validation_score'] >= 0.0
                      assert scores['final_score'] >= 0.0
                  assert run['timing']['cv_evaluation_ms'] > 0.0
                  assert run['timing']['final_refit_ms'] > 0.0
                  assert run['timing']['total_fit_ms'] > 0.0
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cv-external-candidate
          path: _candidate/
          retention-days: 7
