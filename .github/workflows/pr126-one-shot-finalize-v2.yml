name: PR126 one-shot finalization sync v2

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - '.github/workflows/pr126-one-shot-finalize-v2.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install repository test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest jsonschema
      - name: Apply guarded final-review edits
        run: python dev/pr126_finalize_once.py
      - name: Run targeted final-review regressions
        run: |
          python -m pytest \
            dev/tests/test_panel_stage_c_final_review_fixes.py \
            dev/tests/test_panel_stage_c_set_params.py \
            dev/tests/test_panel_two_way_demean_scale.py \
            -q --tb=short
      - name: Regenerate benchmark frontend assets deterministically
        run: python dev/benchmarks/generate_benchmark_data.py --deterministic --strict-sources
      - name: Verify one-shot change scope and generated metadata, then commit
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          allowed = {
              'statgpu/panel/_fixed_effects.py',
              'dev/tests/test_panel_stage_c_final_review_fixes.py',
              'docs/en/models/panel.md',
              'docs/cn/models/panel.md',
              'docs/en/changelog.md',
              'docs/cn/changelog.md',
              'frontend/public/data/benchmark_data.json',
              'frontend/public/data/parse_report.json',
              'frontend/public/data/source_inventory.json',
              'docs/assets/benchmarks/data/benchmark_data.json',
              'docs/assets/benchmarks/data/parse_report.json',
              'docs/assets/benchmarks/data/source_inventory.json',
          }
          changed = set(
              subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          )
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f'unexpected one-shot changes: {unexpected}')
          required = {
              'statgpu/panel/_fixed_effects.py',
              'dev/tests/test_panel_stage_c_final_review_fixes.py',
              'docs/en/models/panel.md',
              'docs/cn/models/panel.md',
              'docs/en/changelog.md',
              'docs/cn/changelog.md',
          }
          missing = sorted(required - changed)
          if missing:
              raise SystemExit(f'expected one-shot source/doc changes missing: {missing}')

          front_report = json.loads(Path('frontend/public/data/parse_report.json').read_text())
          docs_report = json.loads(Path('docs/assets/benchmarks/data/parse_report.json').read_text())
          front_inventory = json.loads(Path('frontend/public/data/source_inventory.json').read_text())
          docs_inventory = json.loads(Path('docs/assets/benchmarks/data/source_inventory.json').read_text())
          expected_generation = '1c58a08ce9fde836078137736c390db5358f3a59a0c4969aff12dd20aca4302e'
          expected_coverage = 'a0bd04d8c9b27f45988cf9d9ad4185df20a00fb9e38354266ff6317857688ad8'
          if front_report != docs_report:
              raise SystemExit('frontend/docs parse_report mirrors differ')
          if front_inventory != docs_inventory:
              raise SystemExit('frontend/docs source_inventory mirrors differ')
          if front_report.get('generation_id') != expected_generation:
              raise SystemExit(f"unexpected generation_id: {front_report.get('generation_id')}")
          if front_report.get('runs_generated') != 2426 or front_report.get('files_parsed') != 19:
              raise SystemExit('unexpected strict generator run/source counts')
          if front_inventory.get('coverage_matrix_digest') != expected_coverage:
              raise SystemExit(
                  f"unexpected coverage digest: {front_inventory.get('coverage_matrix_digest')}"
              )
          print('validated change scope:', *sorted(changed), sep='\n  ')
          print('validated generation_id', expected_generation)
          print('validated coverage_matrix_digest', expected_coverage)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            statgpu/panel/_fixed_effects.py \
            dev/tests/test_panel_stage_c_final_review_fixes.py \
            docs/en/models/panel.md docs/cn/models/panel.md \
            docs/en/changelog.md docs/cn/changelog.md \
            frontend/public/data/benchmark_data.json \
            frontend/public/data/parse_report.json \
            frontend/public/data/source_inventory.json \
            docs/assets/benchmarks/data/benchmark_data.json \
            docs/assets/benchmarks/data/parse_report.json \
            docs/assets/benchmarks/data/source_inventory.json
          git commit -m 'fix(panel): close final review and sync benchmark assets'
          git push origin HEAD:agent/panel-p1-stage-c-covariance
