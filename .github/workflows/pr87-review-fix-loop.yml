name: PR87 review fix batch

on:
  push:
    branches: [agent/maintenance-0.2.4-0.2.5]
    paths:
      - .github/workflows/pr87-review-fix-loop.yml

permissions:
  contents: write

jobs:
  apply-review-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply source, test, and workflow fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          def replace_once(path, old, new):
              path = Path(path)
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise RuntimeError(f"expected patch anchor not found in {path}: {old[:120]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Formula ownership is a property of the current call, not prior fitted state.
          replace_once(
              "statgpu/_base.py",
              '''                formula_active = (\n                    bound.arguments.get("formula") is not None\n                    or bound.arguments.get("data") is not None\n                    or getattr(self, "_design_info", None) is not None\n                )\n''',
              '''                formula_active = (\n                    bound.arguments.get("formula") is not None\n                    or bound.arguments.get("data") is not None\n                )\n''',
          )

          # Clone estimator-valued roots before nested updates so failures cannot
          # mutate children shared with the live estimator.
          replace_once(
              "statgpu/_base.py",
              '''        try:\n            fresh = type(self)(**direct)\n''',
              '''        if nested:\n            try:\n                from sklearn.base import clone as sklearn_clone\n            except ImportError:\n                sklearn_clone = None\n            for root in nested:\n                nested_value = direct[root]\n                if sklearn_clone is not None and hasattr(nested_value, "get_params"):\n                    direct[root] = sklearn_clone(nested_value)\n                else:\n                    direct[root] = copy.deepcopy(nested_value)\n\n        try:\n            fresh = type(self)(**direct)\n''',
          )

          # StepwiseSelector is a public supervised transformer outside BaseEstimator.
          replace_once(
              "statgpu/feature_selection/_stepwise.py",
              '''from statgpu.backends import _to_float_scalar\n''',
              '''from statgpu.backends import _to_float_scalar\nfrom statgpu.backends._validation import check_finite\n''',
          )
          replace_once(
              "statgpu/feature_selection/_stepwise.py",
              '''    _VALID_CRITERIA = {"aic", "bic"}\n    _VALID_DIRECTIONS = {"forward", "backward", "both"}\n\n''',
              '''    _VALID_CRITERIA = {"aic", "bic"}\n    _VALID_DIRECTIONS = {"forward", "backward", "both"}\n\n    def _more_tags(self):\n        return {"requires_y": True}\n\n    def __sklearn_tags__(self):\n        try:\n            from sklearn.utils import Tags, TargetTags, TransformerTags\n        except ImportError:\n            return self._more_tags()\n        return Tags(\n            estimator_type=None,\n            target_tags=TargetTags(required=True),\n            transformer_tags=TransformerTags(),\n            requires_fit=True,\n        )\n\n    def __sklearn_is_fitted__(self):\n        return bool(self._fitted and self.best_model_ is not None)\n\n''',
          )
          replace_once(
              "statgpu/feature_selection/_stepwise.py",
              '''    @staticmethod\n    def _prepare_X(X):\n        if not hasattr(X, "shape") or not hasattr(X, "ndim"):\n''',
              '''    @staticmethod\n    def _prepare_X(X):\n        check_finite(X, name="X")\n        if not hasattr(X, "shape") or not hasattr(X, "ndim"):\n''',
          )
          replace_once(
              "statgpu/feature_selection/_stepwise.py",
              '''    @staticmethod\n    def _prepare_y(y):\n        if not hasattr(y, "shape") or not hasattr(y, "ndim"):\n''',
              '''    @staticmethod\n    def _prepare_y(y):\n        check_finite(y, name="y")\n        if not hasattr(y, "shape") or not hasattr(y, "ndim"):\n''',
          )

          # Function-style knockoff entry points must match selector behavior.
          knockoff_path = Path("statgpu/feature_selection/_knockoff.py")
          knockoff = knockoff_path.read_text(encoding="utf-8")
          marker = "    q_f = _validate_q(q)\n"
          if knockoff.count(marker) != 2:
              raise RuntimeError(f"expected exactly two public knockoff q validators, found {knockoff.count(marker)}")
          validation = (
              '    check_finite(X, name="X")\n'
              '    check_finite(y, name="y")\n'
              '    if Xk is not None:\n'
              '        check_finite(Xk, name="Xk")\n'
              '    q_f = _validate_q(q)\n'
          )
          knockoff_path.write_text(knockoff.replace(marker, validation, 2), encoding="utf-8")

          # Explicitly cover the sklearn protocol transition version as well as
          # legacy and latest supported releases.
          Path(".github/workflows/maintenance-compatibility.yml").write_text(
              textwrap.dedent('''\
              name: Maintenance compatibility

              on:
                push:
                  branches: [master]
                pull_request:
                  branches: [master]

              permissions:
                contents: read

              jobs:
                sklearn-compatibility:
                  runs-on: ubuntu-latest
                  strategy:
                    fail-fast: false
                    matrix:
                      sklearn-spec:
                        - scikit-learn==1.2.2
                        - scikit-learn==1.3.2
                        - scikit-learn
                  steps:
                    - uses: actions/checkout@v4

                    - uses: actions/setup-python@v5
                      with:
                        python-version: "3.11"

                    - name: Install compatibility environment
                      run: |
                        python -m pip install --upgrade pip
                        python -m pip install "numpy<2" scipy pytest packaging pandas patsy "${{ matrix.sklearn-spec }}"
                        python -m pip install -e . --no-deps

                    - name: Run maintenance regressions
                      run: |
                        python -m pytest \\
                          dev/tests/test_maintenance_024_025.py \\
                          dev/tests/test_legacy_sklearn_integration.py \\
                          dev/tests/test_second_full_review.py::TestEstimatorCloneAndFeatureSelectionBackend::test_all_default_public_estimators_clone \\
                          -q --tb=short
              '''),
              encoding="utf-8",
          )

          tests = Path("dev/tests/test_maintenance_024_025.py")
          test_text = tests.read_text(encoding="utf-8")
          marker = "# PR87_REVIEW_FIX_BATCH_TESTS"
          if marker not in test_text:
              test_text += textwrap.dedent(r'''

              # PR87_REVIEW_FIX_BATCH_TESTS
              def test_formula_history_does_not_bypass_direct_pandas_finite_guard():
                  pd = pytest.importorskip("pandas")
                  from statgpu.linear_model import LinearRegression

                  data = pd.DataFrame(
                      {"y": [1.0, 2.0, 3.0, 4.0], "x": [0.0, 1.0, 2.0, 3.0]}
                  )
                  model = LinearRegression(device="cpu").fit(formula="y ~ x", data=data)
                  X_bad = pd.DataFrame({"x": [0.0, np.nan, 2.0, 3.0]})
                  y = pd.Series([1.0, 2.0, 3.0, 4.0])
                  with pytest.raises(ValueError, match=r"X.*finite"):
                      model.fit(X_bad, y)


              def test_stepwise_selector_finite_and_supervised_tag_contract():
                  from statgpu.feature_selection import StepwiseSelector
                  from statgpu.linear_model import LinearRegression

                  selector = StepwiseSelector(LinearRegression)
                  X = np.array([[1.0, np.nan], [2.0, 3.0]])
                  y = np.array([0.0, 1.0])
                  with pytest.raises(ValueError, match=r"X.*finite"):
                      selector.fit(X, y)
                  assert selector._more_tags()["requires_y"] is True

                  try:
                      from sklearn.utils import get_tags
                  except ImportError:
                      from sklearn.utils._tags import _safe_tags

                      assert _safe_tags(selector)["requires_y"] is True
                  else:
                      assert get_tags(selector).target_tags.required is True
                      assert get_tags(selector).transformer_tags is not None


              @pytest.mark.parametrize(
                  "entrypoint",
                  [
                      "fixed_x_knockoff_filter",
                      "model_x_knockoff_filter",
                      "knockoff_filter",
                  ],
              )
              def test_function_style_knockoff_entrypoints_reject_nonfinite(entrypoint):
                  import statgpu.feature_selection as feature_selection

                  fn = getattr(feature_selection, entrypoint)
                  X = np.array([[1.0, np.nan], [2.0, 3.0]])
                  y = np.array([0.0, 1.0])
                  with pytest.raises(ValueError, match=r"X.*finite"):
                      fn(X, y, backend="numpy")


              def test_nested_set_params_is_atomic_and_does_not_mutate_shared_children():
                  from statgpu._base import BaseEstimator

                  class Child(BaseEstimator):
                      def __init__(self, value=1, device="cpu"):
                          super().__init__(device=device)
                          self.value = value

                      def fit(self, X, y=None):
                          self._fitted = True
                          return self

                      def predict(self, X):
                          return np.zeros(len(X))

                  class Parent(BaseEstimator):
                      def __init__(self, left=None, right=None, device="cpu"):
                          super().__init__(device=device)
                          self.left = left
                          self.right = right

                      def fit(self, X, y=None):
                          self._fitted = True
                          return self

                      def predict(self, X):
                          return np.zeros(len(X))

                  left = Child(value=1)
                  right = Child(value=2)
                  parent = Parent(left=left, right=right)

                  with pytest.raises(ValueError, match="Invalid parameter"):
                      parent.set_params(left__value=7, right__unknown=3)
                  assert parent.left is left
                  assert parent.right is right
                  assert left.value == 1
                  assert right.value == 2

                  parent.set_params(left__value=7)
                  assert left.value == 1
                  assert parent.left is not left
                  assert parent.left.value == 7


              def test_torch_public_finite_validation_stays_on_cuda():
                  torch = _require_modern_torch_cuda()
                  from statgpu.linear_model import LinearRegression

                  X = torch.tensor(
                      [[1.0, 2.0], [3.0, float("nan")]],
                      dtype=torch.float64,
                      device="cuda",
                  )
                  y = torch.tensor([1.0, 2.0], dtype=torch.float64, device="cuda")
                  with pytest.raises(ValueError, match=r"X.*finite"):
                      LinearRegression(device="torch").fit(X, y)
                  assert X.is_cuda and y.is_cuda


              def test_cupy_public_finite_validation_stays_on_cuda():
                  cp = pytest.importorskip("cupy")
                  try:
                      if cp.cuda.runtime.getDeviceCount() < 1:
                          pytest.skip("requires a working CuPy CUDA backend")
                  except Exception:
                      pytest.skip("requires a working CuPy CUDA backend")
                  from statgpu.linear_model import LinearRegression

                  X = cp.asarray([[1.0, 2.0], [3.0, cp.nan]], dtype=cp.float64)
                  y = cp.asarray([1.0, 2.0], dtype=cp.float64)
                  with pytest.raises(ValueError, match=r"X.*finite"):
                      LinearRegression(device="cuda").fit(X, y)
                  assert isinstance(X, cp.ndarray) and isinstance(y, cp.ndarray)


              @pytest.mark.parametrize(
                  "penalty,penalty_kwargs",
                  [
                      ("scad", {}),
                      ("mcp", {}),
                      ("group_scad", {"groups": [[0, 1], [2, 3], [4, 5]]}),
                      ("group_mcp", {"groups": [[0, 1], [2, 3], [4, 5]]}),
                  ],
              )
              def test_torch_nonconvex_model_level_compile_matrix_py21(
                  monkeypatch, penalty, penalty_kwargs
              ):
                  torch = _require_modern_torch_cuda()
                  monkeypatch.delenv("STATGPU_TORCH_COMPILE_MODE", raising=False)

                  from statgpu.backends import _to_numpy
                  from statgpu.backends._torch_compile import get_torch_compile_diagnostics
                  from statgpu.linear_model import PenalizedLinearRegression
                  import statgpu.solvers._fista_lla as fista_lla_module

                  fista_lla_module._SQERR_PROXIMAL_TORCH = None
                  fista_lla_module._FUSED_PROXIMAL_CLIP_TORCH = None
                  get_torch_compile_diagnostics(clear=True)
                  torch._dynamo.reset()

                  rng = np.random.default_rng(20260805)
                  X = rng.normal(size=(192, 6)).astype(np.float64)
                  beta = np.array([1.2, -0.8, 0.6, 0.0, 0.0, 0.0])
                  y = X @ beta + 0.05 * rng.normal(size=X.shape[0])
                  model = PenalizedLinearRegression(
                      penalty=penalty,
                      penalty_kwargs=penalty_kwargs,
                      alpha=0.03,
                      max_iter=40,
                      max_lla_iters=3,
                      tol=1e-6,
                      lla_tol=1e-6,
                      device="torch",
                      compute_inference=False,
                  ).fit(X, y)
                  prediction = np.asarray(_to_numpy(model.predict(X)))

                  assert prediction.shape == y.shape
                  assert np.isfinite(prediction).all()
                  assert np.isfinite(np.asarray(model.coef_)).all()
                  events = get_torch_compile_diagnostics(clear=True)
                  assert any(event["status"] == "compiled" for event in events)
                  assert not any("fallback" in event["status"] for event in events)


              def test_torch_elasticnet_model_level_compile_path_py21(monkeypatch):
                  _require_modern_torch_cuda()
                  monkeypatch.delenv("STATGPU_TORCH_COMPILE_MODE", raising=False)
                  from statgpu.backends import _to_numpy
                  from statgpu.backends._torch_compile import get_torch_compile_diagnostics
                  from statgpu.linear_model import ElasticNet

                  get_torch_compile_diagnostics(clear=True)
                  rng = np.random.default_rng(20260806)
                  X = rng.normal(size=(192, 10)).astype(np.float64)
                  y = X[:, 0] - 0.5 * X[:, 1] + 0.05 * rng.normal(size=X.shape[0])
                  model = ElasticNet(
                      alpha=0.02,
                      l1_ratio=0.6,
                      max_iter=60,
                      tol=1e-6,
                      device="torch",
                  ).fit(X, y)
                  prediction = np.asarray(_to_numpy(model.predict(X)))
                  assert np.isfinite(prediction).all()
                  events = get_torch_compile_diagnostics(clear=True)
                  assert any(event["status"] == "compiled" for event in events)
                  assert not any("fallback" in event["status"] for event in events)
              ''')
              tests.write_text(test_text, encoding="utf-8")

          # Add a reproducible remote benchmark command without fabricating GPU timings.
          benchmark = Path("dev/benchmarks/benchmark_torch_compile_maintenance.py")
          if not benchmark.exists():
              benchmark.write_text(textwrap.dedent(r'''
              """RTX-class benchmark for the maintenance torch.compile policy.

              Run after the local review-fix loop is clean. The script writes a
              machine-readable JSON result and never treats missing GPU evidence as
              a completed performance claim.
              """

              from __future__ import annotations

              import argparse
              import json
              import os
              import platform
              import time
              from pathlib import Path

              import numpy as np


              def _sync(torch):
                  torch.cuda.synchronize()


              def _time_fit(torch, factory, X, y, repeats):
                  times = []
                  predictions = None
                  for _ in range(repeats):
                      _sync(torch)
                      start = time.perf_counter()
                      model = factory().fit(X, y)
                      _sync(torch)
                      times.append(time.perf_counter() - start)
                      predictions = model.predict(X)
                  return times, predictions


              def main():
                  parser = argparse.ArgumentParser()
                  parser.add_argument("--output", default="results/torch_compile_maintenance.json")
                  parser.add_argument("--repeats", type=int, default=3)
                  args = parser.parse_args()

                  import torch
                  if not torch.cuda.is_available():
                      raise SystemExit("A physical Torch CUDA GPU is required")

                  from statgpu.backends import _to_numpy
                  from statgpu.backends._torch_compile import get_torch_compile_diagnostics
                  from statgpu.linear_model import ElasticNet, Lasso, PenalizedLinearRegression

                  rng = np.random.default_rng(20260805)
                  X = rng.normal(size=(2048, 128)).astype(np.float64)
                  beta = np.zeros(128)
                  beta[:12] = np.linspace(1.2, -0.2, 12)
                  y = X @ beta + 0.1 * rng.normal(size=X.shape[0])

                  cases = {
                      "lasso": lambda: Lasso(alpha=0.01, max_iter=120, tol=1e-6, device="torch"),
                      "elasticnet": lambda: ElasticNet(alpha=0.01, l1_ratio=0.6, max_iter=120, tol=1e-6, device="torch"),
                      "scad": lambda: PenalizedLinearRegression(penalty="scad", alpha=0.03, max_iter=80, max_lla_iters=3, device="torch"),
                      "group_scad": lambda: PenalizedLinearRegression(
                          penalty="group_scad",
                          penalty_kwargs={"groups": [list(range(i, i + 8)) for i in range(0, 128, 8)]},
                          alpha=0.03,
                          max_iter=80,
                          max_lla_iters=3,
                          device="torch",
                      ),
                  }

                  result = {
                      "method": "torch_compile_maintenance",
                      "backend_times": {"numpy": None, "cupy": None, "torch": {}},
                      "external_baseline": {"name": None, "time": None, "version": None},
                      "precision_vs_external": {},
                      "convergence_status": {},
                      "backend_precision": {},
                      "compatibility_matrix": {},
                      "cv_matrix": {},
                      "inference_matrix": {},
                      "threshold_source": {"source": "maintenance Issue #45 workload matrix"},
                      "objective_scaling": "unchanged across compile modes",
                      "penalty_scale_mapping": None,
                      "cpu_vs_external": None,
                      "gpu_vs_cpu": None,
                      "crossover_n": None,
                      "target_scale_source": "maintenance benchmark: n=2048, p=128",
                      "optimization_notes": [
                          "Compare default mode against explicit disable and optional reduce-overhead.",
                          "Correctness and fallback visibility are release gates; performance equivalence is not assumed.",
                      ],
                      "validation_tier": "remote-full",
                      "schema_status": "ok",
                      "timing_scope": {"fit": "includes solver execution; excludes data generation"},
                      "reproducibility": {
                          "seed": 20260805,
                          "python": platform.python_version(),
                          "torch": torch.__version__,
                          "cuda": torch.version.cuda,
                          "gpu": torch.cuda.get_device_name(0),
                      },
                      "uncovered_reasons": [],
                  }

                  for mode in ("disable", "default"):
                      os.environ["STATGPU_TORCH_COMPILE_MODE"] = mode
                      for name, factory in cases.items():
                          get_torch_compile_diagnostics(clear=True)
                          times, prediction = _time_fit(torch, factory, X, y, args.repeats)
                          pred = np.asarray(_to_numpy(prediction))
                          key = f"{name}:{mode}"
                          result["backend_times"]["torch"][key] = times
                          result["backend_precision"][key] = {
                              "finite_prediction": bool(np.isfinite(pred).all())
                          }
                          result["compatibility_matrix"][key] = get_torch_compile_diagnostics(clear=True)

                  output = Path(args.output)
                  output.parent.mkdir(parents=True, exist_ok=True)
                  output.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
                  print(output)


              if __name__ == "__main__":
                  main()
              '''), encoding="utf-8")
          PY

      - name: Install targeted validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" scipy pytest packaging "scikit-learn==1.3.2" pandas patsy joblib
          python -m pip install -e . --no-deps

      - name: Run targeted CPU review-fix tests
        run: |
          python -m pytest \
            dev/tests/test_maintenance_024_025.py \
            dev/tests/test_core_contracts.py::test_set_params_rejects_unknown_and_supports_nested_estimators \
            -q --tb=short

      - name: Commit reviewed changes and remove bootstrap workflow
        shell: bash
        run: |
          rm .github/workflows/pr87-review-fix-loop.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: address PR87 independent review findings"
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
