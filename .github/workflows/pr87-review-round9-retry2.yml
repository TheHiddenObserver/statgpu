name: PR87 review round 9 isolated retry

on:
  push:
    branches: [agent/maintenance-0.2.4-0.2.5]
    paths: [.github/workflows/pr87-review-round9-retry2.yml]

permissions:
  contents: write

jobs:
  review-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply isolated likelihood patch
        shell: bash
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 --decode > /tmp/pr87_round9.py
          python /tmp/pr87_round9.py
      - name: Install validation and Torch CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation,formula]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ruff
      - name: Run likelihood and Logistic contracts
        run: |
          python -m pytest -q \
            dev/tests/test_pr87_code_review_fix_cycle.py \
            dev/tests/test_logistic.py \
            -k "logistic or likelihood or loglik"
      - name: Run complete CPU test tree
        run: python -m pytest dev/tests -q --tb=short
      - name: Run documentation and static gates
        shell: bash
        run: |
          python dev/validation/fix_docs_links.py --check
          python dev/validation/check_docs_contracts.py
          python -m compileall -q statgpu dev/validation dev/benchmarks
          ruff check \
            statgpu/linear_model/wrappers/_logistic.py \
            dev/tests/test_pr87_code_review_fix_cycle.py \
            --select F821,E9,F63,F7,F82
          git diff --check
          python -m pytest --collect-only -q >/dev/null
      - name: Commit reviewed fix and remove temporary workflows
        shell: bash
        run: |
          rm .github/workflows/pr87-review-round9-loglik.yml
          rm .github/workflows/pr87-review-round9-retry.yml
          rm .github/workflows/pr87-review-round9-retry2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add statgpu dev/tests docs .github/workflows/pr87-review-round9-loglik.yml .github/workflows/pr87-review-round9-retry.yml .github/workflows/pr87-review-round9-retry2.yml
          git commit -m "fix: unify logistic likelihood diagnostics"
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
