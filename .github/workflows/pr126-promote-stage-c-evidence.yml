name: PR126 Stage C evidence promotion

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - '.github/workflows/pr126-promote-stage-c-evidence.yml'

permissions:
  contents: write

jobs:
  promote-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest 'jsonschema[format]'
      - name: Apply audited Stage C evidence promotion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('dev/benchmarks/_pr126_promote_stage_c_evidence.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '## 2026-08-09 — Panel Stage C 协方差完成（PR #126）\\n',
              '## 2026-08-09 — Panel Stage C 协方差补齐（PR #126）\\n',
          )
          text = text.replace(
              'assert len(output["runs"]) == 1862',
              'assert len(output["runs"]) == 1976',
          )
          path.write_text(text, encoding='utf-8')
          PY
          python dev/benchmarks/_pr126_promote_stage_c_evidence.py
      - name: Run focused parser, catalog, coverage, and inventory gates
        run: |
          python -m pytest \
            dev/tests/test_panel_stage_c_frontend_source.py \
            dev/tests/test_benchmark_catalog.py \
            dev/tests/test_benchmark_inventory_v2.py \
            dev/tests/test_frontend_domain_coverage.py \
            -q --tb=short
          python dev/benchmarks/generate_benchmark_data.py --check --strict-sources
      - name: Regenerate canonical frontend and docs assets
        run: |
          python dev/benchmarks/generate_benchmark_data.py \
            --out frontend/public/data/benchmark_data.json \
            --report frontend/public/data/parse_report.json \
            --inventory-out frontend/public/data/source_inventory.json \
            --deterministic --strict-sources
          cd frontend
          npm ci
          npm run build
      - name: Verify generated assets are stable
        run: |
          cp frontend/public/data/benchmark_data.json /tmp/benchmark_data.json
          cp frontend/public/data/parse_report.json /tmp/parse_report.json
          cp frontend/public/data/source_inventory.json /tmp/source_inventory.json
          python dev/benchmarks/generate_benchmark_data.py \
            --out frontend/public/data/benchmark_data.json \
            --report frontend/public/data/parse_report.json \
            --inventory-out frontend/public/data/source_inventory.json \
            --deterministic --strict-sources
          cmp /tmp/benchmark_data.json frontend/public/data/benchmark_data.json
          cmp /tmp/parse_report.json frontend/public/data/parse_report.json
          cmp /tmp/source_inventory.json frontend/public/data/source_inventory.json
          git diff --check
      - name: Commit validated evidence promotion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'benchmark: promote PR126 Stage C P100 evidence'
          git push origin HEAD:agent/panel-p1-stage-c-covariance
