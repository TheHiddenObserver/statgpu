name: PR126 panel tiny-design review gate

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install maintained focused environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" scipy pandas patsy pytest
          python -m pip install "torch==2.0.1+cpu" --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Apply patch and capture focused result
        run: |
          set +e
          python dev/validation/pr126_panel_numeric_retry_once.py > /tmp/patch.log 2>&1
          patch_rc=$?
          if [ "$patch_rc" -eq 0 ]; then
            python -m pytest \
              dev/tests/test_fama_macbeth_batched_solver.py \
              dev/tests/test_fama_macbeth_review_fixes.py \
              dev/tests/test_fama_macbeth_inference_matrix.py \
              dev/tests/test_panel_stage_b_fit_statistics.py \
              dev/tests/test_panel_stage_c_full_rank_conditioning.py \
              -q --tb=short > /tmp/pytest.log 2>&1
            test_rc=$?
          else
            test_rc=99
            echo "pytest skipped because patch failed" > /tmp/pytest.log
          fi
          if [ "$patch_rc" -eq 0 ] && [ "$test_rc" -eq 0 ]; then
            python -m py_compile \
              statgpu/panel/_linalg.py \
              statgpu/panel/_fama_macbeth.py \
              dev/benchmarks/validate_panel_stage_c_gpu.py \
              dev/benchmarks/validate_fama_macbeth_review_fix_gpu.py
            compile_rc=$?
            git diff --check
            diff_rc=$?
          else
            compile_rc=99
            diff_rc=99
          fi
          {
            echo "patch_rc=$patch_rc"
            echo "test_rc=$test_rc"
            echo "compile_rc=$compile_rc"
            echo "diff_rc=$diff_rc"
            echo "--- patch log ---"
            cat /tmp/patch.log
            echo "--- pytest log ---"
            cat /tmp/pytest.log
          } > dev/validation/pr126_tiny_design_result.txt
          tail -240 dev/validation/pr126_tiny_design_result.txt
          exit 0
      - name: Commit substantive fix or diagnostics
        run: |
          git config user.name "Ziqian Lin"
          git config user.email "51812297+TheHiddenObserver@users.noreply.github.com"
          if grep -q '^patch_rc=0$' dev/validation/pr126_tiny_design_result.txt \
             && grep -q '^test_rc=0$' dev/validation/pr126_tiny_design_result.txt \
             && grep -q '^compile_rc=0$' dev/validation/pr126_tiny_design_result.txt \
             && grep -q '^diff_rc=0$' dev/validation/pr126_tiny_design_result.txt; then
            git add \
              statgpu/panel/_linalg.py \
              dev/tests/test_fama_macbeth_batched_solver.py \
              dev/benchmarks/validate_panel_stage_c_gpu.py
            if ! git diff --cached --quiet; then
              git commit -m "fix: stabilize panel numerical fallbacks"
              git push origin HEAD:agent/panel-p1-stage-c-covariance
            fi
          else
            git add dev/validation/pr126_tiny_design_result.txt
            git commit -m "ci: record PR126 shared-linalg failure"
            git push origin HEAD:agent/panel-p1-stage-c-covariance
          fi
