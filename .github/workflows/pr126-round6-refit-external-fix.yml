name: PR126 guarded round6 refit and external fixes

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - '.github/workflows/pr126-round6-refit-external-fix.yml'

permissions:
  contents: write

jobs:
  round6-refit-external:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pandas patsy 'linearmodels==7.0' 'statsmodels==0.14.6'
      - name: Apply exact reviewed fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected}, found {count}: {old!r}')
              p.write_text(text.replace(old, new, expected), encoding='utf-8')

          panel = 'statgpu/panel/_fixed_effects.py'
          # Add a transactional reset contract and use it at the start of every
          # fit.  The public finite guard will also call this on pre-fit numeric
          # validation failures because the method now exists.
          marker = '''    def fit(\n        self,\n        X=None,\n'''
          reset_method = '''    def _reset_fit_state(self):\n        """Clear derived fit state so failed refits cannot expose stale results."""\n        configured = getattr(self, "_constructor_params_raw", {})\n        self.entity_effects = bool(\n            configured.get("entity_effects", self.entity_effects)\n        )\n        self.time_effects = bool(\n            configured.get("time_effects", self.time_effects)\n        )\n        self._fitted = False\n        for name in (\n            "coef_",\n            "bse_",\n            "tvalues_",\n            "pvalues_",\n            "conf_int_",\n            "rsquared_within",\n            "fit_statistics_",\n            "nobs",\n            "df_resid",\n            "_params",\n            "_scale",\n            "_pooling_f_result",\n            "_panel_diagnostic_identity",\n            "_predict_constant_index",\n            "_predict_constant_value",\n            "_grand_mean",\n            "_design_info",\n            "_feature_names",\n            "_formula_has_intercept",\n            "_backend_name",\n            "_predict_backend_name",\n            "_panel_index_info",\n            "_panel_cov_params_raw",\n            "_coefficient_inference_reason",\n        ):\n            setattr(self, name, None)\n        self._coefficient_inference_available = False\n        self._covariance_metadata = {}\n        self._entity_effects_map = {}\n        self._time_effects_map = {}\n        self._two_way_entity_components = {}\n        self._two_way_time_components = {}\n\n'''
          replace_exact(panel, marker, reset_method + marker)
          replace_exact(
              panel,
              '''    ):\n        """Fit the fixed effects model."""\n        (\n            y_data,\n''',
              '''    ):\n        """Fit the fixed effects model."""\n        self._reset_fit_state()\n        (\n            y_data,\n''',
          )

          # Give effects-only formulas a precise fail-closed boundary rather than
          # falling through to the generic empty-X numeric validator.
          replace_exact(
              panel,
              '''            self._feature_names = ["Intercept", *list(self._feature_names or [])]\n\n        entity_ids = aligned["entity_ids"]\n''',
              '''            self._feature_names = ["Intercept", *list(self._feature_names or [])]\n\n        if (\n            formula is not None\n            and (self.entity_effects or self.time_effects)\n            and int(np.asarray(X_data).shape[1]) == 0\n        ):\n            raise ValueError(\n                "PanelOLS fixed-effect formulas require at least one "\n                "non-intercept regressor; effects-only formulas are not supported"\n            )\n\n        entity_ids = aligned["entity_ids"]\n''',
          )

          # Accurate public metadata for the now-explicit no-FE level path.
          replace_exact(
              panel,
              '''            metadata={\n                "fit_space": "fixed-effect transformed regression",\n''',
              '''            metadata={\n                "fit_space": (\n                    "fixed-effect transformed regression"\n                    if self.entity_effects or self.time_effects\n                    else "level regression"\n                ),\n''',
          )

          test_path = 'dev/tests/test_panel_stage_c_final_review_fixes.py'
          marker_test = '''\ndef test_panel_formula_without_fixed_effects_preserves_patsy_intercept():\n'''
          additions = '''\ndef test_panel_failed_refit_invalidates_previous_fitted_state():\n    rng = np.random.default_rng(2026082301)\n    entity = np.repeat(np.arange(8), 5)\n    X = rng.normal(size=(entity.size, 2))\n    y = X @ np.array([0.6, -0.2]) + rng.normal(scale=0.1, size=entity.size)\n    model = PanelOLS(entity_effects=True).fit(X, y, entity_ids=entity)\n    assert model._fitted is True\n    assert model.coef_ is not None\n\n    with pytest.raises(ValueError, match="entity_ids is required"):\n        model.fit(X, y)\n\n    assert model._fitted is False\n    assert model.coef_ is None\n    assert model.fit_statistics_ is None\n    assert model.entity_effects is True  # constructor contract restored\n    with pytest.raises(RuntimeError, match="not fitted"):\n        model.predict(X[:3], entity_ids=entity[:3])\n\n\ndef test_panel_failed_formula_refit_clears_prior_formula_metadata():\n    pd = pytest.importorskip("pandas")\n    pytest.importorskip("patsy")\n    rng = np.random.default_rng(2026082302)\n    n = 30\n    data = pd.DataFrame(\n        {\n            "y": rng.normal(size=n),\n            "x": rng.normal(size=n),\n            "entity": np.repeat(np.arange(6), 5),\n            "time": np.tile(np.arange(5), 6),\n            "industry": np.repeat(np.arange(3), 10),\n        }\n    )\n    model = PanelOLS().fit(formula="y ~ x | entity", data=data)\n    assert model._design_info is not None\n\n    with pytest.raises(ValueError, match="at most two"):\n        model.fit(formula="y ~ x | entity + time + industry", data=data)\n\n    assert model._fitted is False\n    assert model.coef_ is None\n    assert model._design_info is None\n    assert model.entity_effects is False\n    assert model.time_effects is False\n\n\ndef test_panel_effects_only_formula_has_explicit_failure_mode():\n    pd = pytest.importorskip("pandas")\n    pytest.importorskip("patsy")\n    n = 24\n    data = pd.DataFrame(\n        {\n            "y": np.linspace(-1.0, 1.0, n),\n            "entity": np.repeat(np.arange(6), 4),\n        }\n    )\n    with pytest.raises(ValueError, match="effects-only formulas are not supported"):\n        PanelOLS().fit(formula="y ~ 1 | entity", data=data)\n\n'''
          replace_exact(test_path, marker_test, additions + marker_test)

          # External estimator baseline for the corrected level-constant
          # inference contract.
          external = 'dev/tests/test_panel_stage_c_linearmodels_estimators.py'
          marker_external = '''\ndef test_pooled_dk_estimator_matches_linearmodels_full_integration():\n'''
          external_test = '''\ndef test_panel_no_effect_level_constant_matches_statsmodels_ols():\n    rng = np.random.default_rng(20260823)\n    n = 100\n    x = rng.normal(size=n)\n    X = np.column_stack([np.ones(n), x])\n    y = 1.2 + 0.7 * x + rng.normal(scale=0.18, size=n)\n\n    sg = PanelOLS(cov_type="nonrobust").fit(X, y)\n    reference = statsmodels.OLS(y, X).fit()\n\n    assert_allclose(sg.coef_, reference.params, rtol=2e-11, atol=2e-12)\n    assert_allclose(sg._panel_cov_params_raw, reference.cov_params(), rtol=2e-10, atol=2e-12)\n    assert_allclose(sg.bse_, reference.bse, rtol=2e-10, atol=2e-12)\n    assert_allclose(sg.fit_statistics_.rsquared_overall, reference.rsquared, rtol=0, atol=3e-12)\n    assert_allclose(sg.fit_statistics_.rsquared_adj, reference.rsquared_adj, rtol=0, atol=3e-12)\n    assert_allclose(sg.fit_statistics_.f_statistic, reference.fvalue, rtol=2e-10, atol=2e-12)\n    assert_allclose(sg.fit_statistics_.f_pvalue, reference.f_pvalue, rtol=2e-10, atol=2e-12)\n    assert sg.fit_statistics_.f_df == (1.0, float(reference.df_resid))\n    assert sg.fit_statistics_.metadata["fit_space"] == "level regression"\n\n'''
          replace_exact(external, marker_external, external_test + marker_external)

          # Strengthen physical level-constant audit with explicit GPU-vs-NumPy
          # values, not only same-backend Panel-vs-Pooled parity.
          runner = 'dev/benchmarks/validate_panel_stage_c_gpu.py'
          replace_exact(
              runner,
              '''        "max_abs_differences_vs_pooled": differences,\n    }\n\n\ndef _disconnected_two_way_prediction_audit(backend):\n''',
              '''        "max_abs_differences_vs_pooled": differences,\n        "values": {\n            "coef": _array(panel.coef_).tolist(),\n            "bse": _array(panel.bse_).tolist(),\n            "prediction": _array(panel_prediction).tolist(),\n            "rsquared_overall": float(panel_fit.rsquared_overall),\n            "rsquared_adj": float(panel_fit.rsquared_adj),\n            "f_statistic": float(panel_fit.f_statistic),\n            "f_pvalue": float(panel_fit.f_pvalue),\n        },\n    }\n\n\ndef _disconnected_two_way_prediction_audit(backend):\n''',
          )
          replace_exact(
              runner,
              '''        payload["level_constant_contract"] = level_constant_audit\n\n        primitive_values = _public_primitive_cases(\n''',
              '''        numpy_diffs = {}\n        for field in ("coef", "bse", "prediction"):\n            actual = np.asarray(level_constant_audit["values"][field], dtype=np.float64)\n            expected = np.asarray(level_constant_reference["values"][field], dtype=np.float64)\n            np.testing.assert_allclose(\n                actual, expected, rtol=args.rtol, atol=args.atol,\n                err_msg=f"level_constant.numpy.{field}"\n            )\n            numpy_diffs[field] = _max_abs(actual, expected)\n        for field in ("rsquared_overall", "rsquared_adj", "f_statistic", "f_pvalue"):\n            numpy_diffs[field] = _scalar_diff(\n                level_constant_audit["values"][field],\n                level_constant_reference["values"][field],\n                rtol=args.rtol,\n                atol=args.atol,\n                label=f"level_constant.numpy.{field}",\n            )\n        if level_constant_audit["f_df"] != level_constant_reference["f_df"]:\n            raise AssertionError("level-constant F degrees of freedom drifted from NumPy")\n        level_constant_audit["max_abs_differences_vs_numpy"] = numpy_diffs\n        payload["level_constant_contract"] = level_constant_audit\n\n        primitive_values = _public_primitive_cases(\n''',
          )

          # Docs: make effects-only formula limitation explicit.
          replace_exact(
              'docs/en/models/panel.md',
              '''formulas requesting more than two fixed-effect variables fail closed rather than silently dropping additional effects.''',
              '''formulas requesting more than two fixed-effect variables fail closed rather than silently dropping additional effects, and effects-only fixed-effect formulas without a non-intercept regressor are explicitly unsupported.''',
          )
          replace_exact(
              'docs/cn/models/panel.md',
              '''若请求超过两个 fixed-effect 变量会 fail closed，而不会静默丢弃后续 effect。''',
              '''若请求超过两个 fixed-effect 变量会 fail closed，而不会静默丢弃后续 effect；仅包含 fixed effect、没有 non-intercept regressor 的 effects-only formula 也会明确报不支持。''',
          )
          PY
      - name: Run focused regressions and external baseline
        run: |
          python -m pytest \
            dev/tests/test_panel_stage_c_final_review_fixes.py \
            dev/tests/test_panel_formula.py \
            dev/tests/test_panel_stage_c_linearmodels_estimators.py \
            -q --tb=short
      - name: Verify scope and commit without temporary workflow
        run: |
          git rm .github/workflows/pr126-round6-refit-external-fix.yml
          python - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/pr126-round6-refit-external-fix.yml',
              'statgpu/panel/_fixed_effects.py',
              'dev/benchmarks/validate_panel_stage_c_gpu.py',
              'dev/tests/test_panel_stage_c_final_review_fixes.py',
              'dev/tests/test_panel_stage_c_linearmodels_estimators.py',
              'docs/en/models/panel.md',
              'docs/cn/models/panel.md',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'HEAD'], text=True).splitlines())
          if changed != allowed:
              raise SystemExit(f'unexpected round6 refit scope: {sorted(changed)}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(panel): make refits transactional and strengthen level baseline'
          git push origin HEAD:agent/panel-p1-stage-c-covariance
