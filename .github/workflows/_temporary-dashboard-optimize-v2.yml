name: Temporary dashboard measured optimizations v2

on:
  push:
    branches:
      - agent/benchmark-dashboard-optimization-audit
    paths:
      - .github/workflows/_temporary-dashboard-optimize-v2.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/benchmark-dashboard-optimization-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Reuse audited optimization patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          text = Path('.github/workflows/_temporary-dashboard-optimize.yml').read_text()
          marker = '      - name: Apply optimization patch\n        run: |\n'
          start = text.index(marker) + len(marker)
          end = text.index('      - name: Typecheck and build', start)
          Path('/tmp/apply-dashboard-opt.sh').write_text(textwrap.dedent(text[start:end]))
          PY
          bash /tmp/apply-dashboard-opt.sh
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/components/ChartDataFallback.ts')
          text = p.read_text()
          old = "const details = h('details', { class: 'chart-data-details', id });"
          new = "const details = h('details', { class: 'chart-data-details', id }) as HTMLDetailsElement;"
          if old not in text:
              raise SystemExit('details anchor missing')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Typecheck and build
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Chromium regression
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Measure optimized production dashboard
        working-directory: frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          text = Path('../.github/workflows/_temporary-dashboard-optimize.yml').read_text()
          marker = '      - name: Measure optimized production dashboard\n        working-directory: frontend\n        run: |\n'
          start = text.index(marker) + len(marker)
          end = text.index('      - uses: actions/upload-artifact@v4', start)
          Path('/tmp/measure-dashboard-opt.sh').write_text(textwrap.dedent(text[start:end]))
          PY
          bash /tmp/measure-dashboard-opt.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-optimization-after-v2
          path: dashboard-optimization-after.json
          if-no-files-found: error
      - name: Commit optimized sources and generated assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src frontend/public/data docs/assets/benchmarks
          git diff --cached --check
          git commit -m "perf: reduce dashboard bundle and collapsed DOM"
          git push origin HEAD:agent/benchmark-dashboard-optimization-audit
