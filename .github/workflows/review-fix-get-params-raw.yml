name: Review fix raw get_params

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply raw get_params repair
        run: python .github/review_fix_get_params_raw.py
      - name: Install validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[validation,formula]'
      - name: Run clone and estimator regressions
        run: |
          python -m pytest -q --tb=short \
            dev/tests/test_maintenance_024_025.py \
            dev/tests/test_legacy_sklearn_integration.py \
            dev/tests/test_second_full_review.py::TestEstimatorCloneAndFeatureSelectionBackend \
            dev/tests/test_unsupervised_tsne.py
      - name: Commit raw get_params repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add statgpu dev/tests/test_maintenance_024_025.py
          git commit -m 'fix: keep custom get_params on raw values'
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
