name: Agent final semantic validation patch

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/maintenance-0.2.4-0.2.5' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preserve Cox response validation semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("statgpu/_base.py")
          text = path.read_text(encoding="utf-8")
          old = '''                for name, value in bound.arguments.items():
                      if (
                          name in self._FINITE_PARAMETER_NAMES
                          and value is not None
                      ):
                          check_finite(value, name=name)
          '''
          new = '''                loss_value = getattr(self, "loss", "")
                  loss_name = str(getattr(loss_value, "name", loss_value)).lower()
                  for name, value in bound.arguments.items():
                      if name == "y" and loss_name in {"cox", "coxph", "cox_ph"}:
                          # Cox response matrices have stronger joint time/event
                          # contracts.  Preserve those model-specific errors and
                          # validate them before device selection in the model.
                          continue
                      if (
                          name in self._FINITE_PARAMETER_NAMES
                          and value is not None
                      ):
                          check_finite(value, name=name)
          '''
          if old not in text:
              raise SystemExit("finite-validation guard marker changed")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Install targeted environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation,formula]"

      - name: Run semantic regressions
        run: |
          python -m compileall -q statgpu
          python -m pytest -q --tb=short \
            dev/tests/test_pr80_cox_cv_split_lifecycle_contract.py::test_pickle_serializes_one_shot_splits_as_reusable_sequence \
            dev/tests/test_pr80_penalized_cox_cv_contracts.py::test_penalized_cox_cv_rejects_invalid_event_before_device_selection \
            dev/tests/test_maintenance_024_025.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add statgpu/_base.py statgpu/survival/_cox_cv_split_lifecycle_contract.py
          git commit -m "fix: preserve specialized validation and pickle contracts"
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
