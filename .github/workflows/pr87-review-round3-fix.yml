name: PR87 review round 3 fix

on:
  push:
    branches: [agent/maintenance-0.2.4-0.2.5]
    paths: [.github/workflows/pr87-review-round3-fix.yml]

permissions:
  contents: write

jobs:
  fix-test-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply round 3 fixes and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one anchor, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "statgpu/glm_core/_irls.py",
              '''    if backend == "torch":\n        import torch\n        return torch.tensor(arr, dtype=torch.float64, device=ref_tensor.device if ref_tensor is not None else "cpu")\n''',
              '''    if backend == "torch":\n        import torch\n\n        device = ref_tensor.device if ref_tensor is not None else "cpu"\n        if torch.is_tensor(arr):\n            return arr.to(dtype=torch.float64, device=device)\n        return torch.as_tensor(arr, dtype=torch.float64, device=device)\n''',
          )

          replace_once(
              "statgpu/glm_core/_validation.py",
              '''def validate_glm_sample_weight(sample_weight, n_samples, *, name="sample_weight"):\n    """Validate analytic sample weights without copying GPU arrays to NumPy."""\n    values = _as_native_array(sample_weight, name=name)\n''',
              '''def validate_glm_sample_weight(sample_weight, n_samples, *, name="sample_weight"):\n    """Validate analytic weights and normalize integral inputs to float64."""\n    values = _as_native_array(sample_weight, name=name)\n''',
          )
          replace_once(
              "statgpu/glm_core/_validation.py",
              '''    total = _safe_weight_sum(values)\n    if not np.isfinite(total) or total <= 0.0:\n        raise ValueError(f"{name} must have a finite positive sum")\n    return values\n''',
              '''    total = _safe_weight_sum(values)\n    if not np.isfinite(total) or total <= 0.0:\n        raise ValueError(f"{name} must have a finite positive sum")\n\n    # Returning integer weights would reintroduce wraparound in downstream\n    # objective normalizers that call ``sum()`` directly. Preserve device\n    # residency while promoting integral/bool weights once at validation.\n    kind = getattr(values.dtype, "kind", "")\n    if module.startswith("torch"):\n        import torch\n\n        if not torch.is_floating_point(values):\n            values = values.to(dtype=torch.float64)\n    elif kind in "biu":\n        if module.startswith("cupy"):\n            import cupy as cp\n\n            values = values.astype(cp.float64, copy=False)\n        else:\n            values = values.astype(np.float64, copy=False)\n    return values\n''',
          )

          replace_once(
              "statgpu/solvers/_utils.py",
              '''    if not np.isfinite(total) or total <= 0.0:\n        raise ValueError("sample_weight must have a finite positive sum")\n    return backend, xp, values\n''',
              '''    if not np.isfinite(total) or total <= 0.0:\n        raise ValueError("sample_weight must have a finite positive sum")\n    if backend == "torch":\n        import torch\n\n        if not torch.is_floating_point(values):\n            values = values.to(dtype=torch.float64)\n    elif getattr(values.dtype, "kind", "") in "biu":\n        values = values.astype(xp.float64, copy=False)\n    return backend, xp, values\n''',
          )

          test_path = Path("dev/tests/test_pr87_code_review_fix_cycle.py")
          text = test_path.read_text(encoding="utf-8")
          text = text.replace(
              "IRLSSolver(Gaussian(), max_iter=4, tol=1e-12).fit(",
              "IRLSSolver(Gaussian(), max_iter=5, tol=1e-12).fit(",
              1,
          )
          text += '''\n\ndef test_integral_glm_weights_are_promoted_before_downstream_normalization():\n    from statgpu.glm_core._validation import validate_glm_sample_weight\n\n    raw = np.full(5, 2**62, dtype=np.int64)\n    validated = validate_glm_sample_weight(raw, raw.size)\n    assert validated.dtype == np.float64\n    assert np.isfinite(validated.sum())\n    assert validated.sum() == pytest.approx(float(5 * 2**62), rel=1e-15)\n\n\ndef test_integral_solver_weights_are_promoted_before_uniform_checks():\n    from statgpu.solvers._utils import _validated_sample_weight\n\n    raw = np.full(5, 2**62, dtype=np.int64)\n    backend, _, validated = _validated_sample_weight(raw, raw.size)\n    assert backend == "numpy"\n    assert validated.dtype == np.float64\n    assert np.isfinite(validated.sum())\n\n\ndef test_weighted_glm_objective_with_integral_weights_stays_finite():\n    from statgpu.glm_core._logistic import LogisticLoss\n    from statgpu.glm_core._validation import validate_glm_sample_weight\n\n    X = np.column_stack([np.ones(4), np.arange(4.0)])\n    y = np.array([0.0, 0.0, 1.0, 1.0])\n    coef = np.array([-1.0, 0.5])\n    weights = validate_glm_sample_weight(\n        np.full(4, 2**62, dtype=np.int64), 4\n    )\n    value, gradient = LogisticLoss().fused_value_and_gradient(\n        X, y, coef, sample_weight=weights\n    )\n    assert np.isfinite(float(value))\n    assert np.isfinite(np.asarray(gradient)).all()\n\n\ndef test_torch_tensor_warm_start_does_not_use_copy_constructor_warning():\n    torch = pytest.importorskip("torch")\n    from statgpu.glm_core._family import Gaussian\n    from statgpu.glm_core._irls import IRLSSolver\n\n    X = torch.tensor(\n        [[1.0, -1.0], [1.0, 0.0], [1.0, 1.0]], dtype=torch.float64\n    )\n    y = torch.tensor([-1.0, 0.0, 1.0], dtype=torch.float64)\n    init = torch.zeros(2, dtype=torch.float32)\n    with pytest.warns(None) as captured:\n        params, _ = IRLSSolver(Gaussian(), max_iter=5, tol=1e-12).fit(\n            X, y, init_coef=init, backend="torch"\n        )\n    assert not any("copy construct from a tensor" in str(w.message) for w in captured)\n    assert params.dtype == torch.float64\n'''
          test_path.write_text(text, encoding="utf-8")
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation,formula]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run review-fix suite
        run: python -m pytest -q dev/tests/test_pr87_code_review_fix_cycle.py
      - name: Run adjacent weighted solver and GLM tests
        run: |
          python -m pytest -q \
            dev/tests/test_loss_penalty_solver_matrix.py \
            dev/tests/test_maintenance_024_025.py \
            -k "sample_weight or weighted or irls or logistic or overflow"
      - name: Static review gates
        run: |
          python -m compileall -q statgpu dev/tests/test_pr87_code_review_fix_cycle.py
          git diff --check
      - name: Commit fixes and self-delete
        shell: bash
        run: |
          rm .github/workflows/pr87-review-round3-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add statgpu dev/tests .github/workflows/pr87-review-round3-fix.yml
          git commit -m "fix: normalize validated weights and torch warm starts"
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
