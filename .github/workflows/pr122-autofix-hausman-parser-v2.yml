name: PR122 Hausman Parser Autofix V2

on:
  push:
    branches:
      - agent/panel-p1-stage-b-diagnostics
    paths:
      - .github/workflows/pr122-autofix-hausman-parser-v2.yml

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-b-diagnostics
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reuse parser patch payload
        run: |
          python - <<'PY'
          import base64
          import re
          from pathlib import Path
          carrier = Path('.github/workflows/pr122-autofix-hausman-parser.yml').read_text(encoding='utf-8')
          match = re.search(r"base64\.b64decode\('([^']+)'\)", carrier)
          if match is None:
              raise RuntimeError('parser patch payload not found')
          exec(base64.b64decode(match.group(1)), {})
          PY
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run targeted frontend evidence gates
        run: |
          python -m pytest -q dev/tests/test_panel_stage_b_frontend_source.py dev/tests/test_panel_stage_b_ready_review_regressions.py dev/tests/test_frontend_domain_coverage.py dev/tests/test_benchmark_catalog.py
          python -m compileall -q dev/benchmarks/frontend_data/parsers/panel_stage_b.py
          git diff --check
      - name: Commit parser fix and remove temporary carriers
        run: |
          rm .github/workflows/pr122-autofix-hausman-parser.yml
          rm .github/workflows/pr122-autofix-hausman-parser-v2.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: distinguish applicable Hausman frontend evidence'
          git push origin HEAD:agent/panel-p1-stage-b-diagnostics
