name: PR87 review fix batch v46

on:
  push:
    branches: [agent/maintenance-0.2.4-0.2.5]
    paths:
      - .github/workflows/pr87-review-fix-loop-v46.yml

permissions:
  contents: write

jobs:
  apply-review-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply backend dtype fixes
        run: python pr87_patch_v46.py
      - name: Install validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation,formula]"
      - name: Run targeted backend dtype tests
        run: |
          python -m py_compile \
            statgpu/backends/_array_ops.py \
            statgpu/solvers/_fista.py \
            statgpu/solvers/_fista_bb.py \
            statgpu/solvers/_newton.py \
            statgpu/solvers/_proximal_newton.py \
            dev/tests/test_maintenance_024_025.py
          python -m pytest \
            dev/tests/test_maintenance_024_025.py::test_numpy_backend_constructors_follow_floating_reference_dtype \
            dev/tests/test_maintenance_024_025.py::test_fista_family_warm_starts_follow_preprocessed_dtype \
            dev/tests/test_maintenance_024_025.py::test_proximal_newton_normalizes_weights_to_preprocessed_dtype \
            dev/tests/test_maintenance_024_025.py::test_solver_numpy_warm_starts_follow_torch_cpu_backend_dtype \
            dev/tests/test_maintenance_024_025.py::test_torch_cuda_proximal_newton_numpy_weights_stay_on_device \
            dev/tests/test_maintenance_024_025.py::test_cupy_proximal_newton_numpy_weights_stay_on_device \
            -q --tb=short
      - name: Run full CPU and documentation validation
        run: |
          python -m pytest dev/tests -q --tb=short
          python dev/validation/fix_docs_links.py --check
          python dev/validation/check_docs_contracts.py
      - name: Commit reviewed source fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f \
            pr87_patch_v45.py \
            pr87_patch_v46.py \
            .github/workflows/pr87-review-fix-loop-v45.yml \
            .github/workflows/pr87-review-fix-loop-v46.yml
          git add \
            statgpu/backends/_array_ops.py \
            statgpu/solvers/_fista.py \
            statgpu/solvers/_fista_bb.py \
            statgpu/solvers/_newton.py \
            statgpu/solvers/_proximal_newton.py \
            dev/tests/test_maintenance_024_025.py \
            CHANGELOG.md docs/en/changelog.md docs/cn/changelog.md
          git commit -m "fix: normalize iterative solver dtype contracts"
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
