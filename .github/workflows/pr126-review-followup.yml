name: PR126 guarded review follow-up

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - '.github/workflows/pr126-review-followup.yml'

permissions:
  contents: write

jobs:
  followup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install targeted dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pandas patsy
      - name: Apply exact reviewed fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected}, found {count}: {old!r}')
              p.write_text(text.replace(old, new, expected), encoding='utf-8')

          replace_exact(
              'statgpu/panel/_base.py',
              '''        self._check_is_fitted()\n        from statgpu.panel._formula import _formula_predict\n\n        X_data = _formula_predict(''',
              '''        self._check_is_fitted()\n        from statgpu.panel._formula import _formula_predict\n\n        # A formula-generated prediction matrix carries column identity through\n        # Patsy.  When the fitted formula had an intercept, _formula_predict()\n        # deterministically strips that intercept just as fit() did, so a slope\n        # column that happens to be constant on this prediction batch must not be\n        # mistaken for an explicitly supplied intercept.\n        formula_omitted_intercept = (\n            getattr(self, "_design_info", None) is not None\n            and hasattr(X, "columns")\n            and bool(getattr(self, "_formula_has_intercept", False))\n        )\n\n        X_data = _formula_predict(''',
          )
          replace_exact(
              'statgpu/panel/_base.py',
              '''            if int(X_arr.shape[1]) > 0:\n                delta = xp.abs(X_arr - float(omitted_constant_value))''',
              '''            if int(X_arr.shape[1]) > 0 and not formula_omitted_intercept:\n                delta = xp.abs(X_arr - float(omitted_constant_value))''',
          )

          old_guard = '''        if (\n            self._two_way_entity_components\n            and self._two_way_time_components\n            and entity_ids_np is not None\n            and time_ids_np is not None\n        ):\n            for entity_value, time_value in zip(entity_ids_np, time_ids_np):\n                entity_component = self._two_way_entity_components.get(entity_value)\n                time_component = self._two_way_time_components.get(time_value)\n                if (\n                    entity_component is not None\n                    and time_component is not None\n                    and entity_component != time_component\n                ):\n                    raise ValueError(\n                        "two-way fixed-effect prediction is not identified for "\n                        "entity/time labels from different disconnected incidence components"\n                    )\n'''
          new_guard = '''        if self._two_way_entity_components and self._two_way_time_components:\n            component_ids = set(self._two_way_entity_components.values()) | set(\n                self._two_way_time_components.values()\n            )\n            if len(component_ids) > 1:\n                n_rows = int(prediction.shape[0])\n                for row in range(n_rows):\n                    entity_value = None if entity_ids_np is None else entity_ids_np[row]\n                    time_value = None if time_ids_np is None else time_ids_np[row]\n                    entity_component = (\n                        None\n                        if entity_value is None\n                        else self._two_way_entity_components.get(entity_value)\n                    )\n                    time_component = (\n                        None\n                        if time_value is None\n                        else self._two_way_time_components.get(time_value)\n                    )\n                    # Both labels unknown preserves the historical zero-effect\n                    # fallback.  Once either stored FE is used, however, its\n                    # component-specific normalization is not identified unless\n                    # the other side is also known in the same component.\n                    if entity_component is None and time_component is None:\n                        continue\n                    if (\n                        entity_component is None\n                        or time_component is None\n                        or entity_component != time_component\n                    ):\n                        raise ValueError(\n                            "two-way fixed-effect prediction is not identified on a "\n                            "disconnected incidence graph unless known entity/time "\n                            "labels belong to the same component"\n                        )\n'''
          replace_exact('statgpu/panel/_fixed_effects.py', old_guard, new_guard)

          test_path = 'dev/tests/test_panel_stage_c_final_review_fixes.py'
          replace_exact(
              test_path,
              '''    with pytest.raises(ValueError, match="different disconnected incidence components"):\n        model.predict(\n            X[:1],\n            entity_ids=np.array([0]),\n            time_ids=np.array([2]),\n        )\n\n    # A not-yet-observed entity/time pair inside one connected component remains''',
              '''    with pytest.raises(ValueError, match="not identified on a disconnected incidence graph"):\n        model.predict(\n            X[:1],\n            entity_ids=np.array([0]),\n            time_ids=np.array([2]),\n        )\n    with pytest.raises(ValueError, match="not identified on a disconnected incidence graph"):\n        model.predict(X[:1], entity_ids=np.array([0]))\n    with pytest.raises(ValueError, match="not identified on a disconnected incidence graph"):\n        model.predict(X[:1], time_ids=np.array([0]))\n    with pytest.raises(ValueError, match="not identified on a disconnected incidence graph"):\n        model.predict(\n            X[:1],\n            entity_ids=np.array([0]),\n            time_ids=np.array([99]),\n        )\n    with pytest.raises(ValueError, match="not identified on a disconnected incidence graph"):\n        model.predict(\n            X[:1],\n            entity_ids=np.array([99]),\n            time_ids=np.array([0]),\n        )\n\n    # If both labels are unseen, no fitted fixed effect is used and the historical\n    # zero-effect fallback remains a well-defined linear prediction.\n    unknown_pair = model.predict(\n        X[:1], entity_ids=np.array([98]), time_ids=np.array([99])\n    )\n    assert np.all(np.isfinite(unknown_pair))\n\n    # A not-yet-observed entity/time pair inside one connected component remains''',
          )
          marker = '''\ndef test_unbalanced_two_way_prediction_uses_joint_fixed_effect_solution():\n'''
          formula_test = '''\ndef test_random_effects_formula_prediction_all_one_slope_is_not_intercept_ambiguous():\n    pd = pytest.importorskip("pandas")\n    pytest.importorskip("patsy")\n    rng = np.random.default_rng(2026081701)\n    entity = np.repeat(np.arange(10), 5)\n    x = rng.normal(size=entity.size)\n    alpha = np.repeat(rng.normal(scale=0.2, size=10), 5)\n    y = 0.6 + 0.8 * x + alpha + rng.normal(scale=0.08, size=entity.size)\n    data = pd.DataFrame({"y": y, "x": x, "entity": entity})\n    model = RandomEffects().fit(formula="y ~ x | entity", data=data)\n\n    new_data = pd.DataFrame({"x": np.ones(7, dtype=np.float64)})\n    actual = model.predict(new_data)\n    expected = np.full(7, model.coef_[0] + model.coef_[1], dtype=np.float64)\n    assert_allclose(actual, expected, rtol=0, atol=3e-12)\n\n'''
          replace_exact(test_path, marker, formula_test + marker)

          en_path = 'docs/en/models/panel.md'
          replace_exact(
              en_path,
              '''If the observed entity-time incidence graph is disconnected, a prediction combining known entity and time labels from different components is not identified and raises instead of adding arbitrary component normalizations.''',
              '''If the observed entity-time incidence graph is disconnected, a prediction that uses a stored fixed effect is identified only when both entity and time labels are known and belong to the same component; cross-component pairs and one-sided/known-plus-unknown effect combinations raise instead of exposing arbitrary component normalizations. If both labels are unseen, the historical zero-effect fallback remains the linear-only prediction.''',
          )
          cn_path = 'docs/cn/models/panel.md'
          replace_exact(
              cn_path,
              '''若已观察 entity-time incidence graph 不连通，则来自不同 component 的已知 entity/time label 组合不可识别，prediction 会明确报错，而不会把任意 component normalization 相加。''',
              '''若已观察 entity-time incidence graph 不连通，只要 prediction 使用了已拟合 fixed effect，就要求 entity/time 两侧都为已知 label 且属于同一 component；跨 component、单边 label、或“已知一侧 + 未知另一侧”的组合都会明确报错，避免暴露任意 component normalization。若两侧 label 都未见过，则仍保留历史 zero-effect fallback，仅返回 linear prediction。''',
          )
          PY
      - name: Run focused review regressions
        run: |
          python -m pytest \
            dev/tests/test_panel_stage_c_final_review_fixes.py \
            dev/tests/test_panel_formula.py \
            dev/tests/test_panel_stage_c_api_formula.py \
            -q --tb=short
      - name: Verify change scope and commit
        run: |
          python - <<'PY'
          import subprocess
          allowed = {
              'statgpu/panel/_base.py',
              'statgpu/panel/_fixed_effects.py',
              'dev/tests/test_panel_stage_c_final_review_fixes.py',
              'docs/en/models/panel.md',
              'docs/cn/models/panel.md',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          if changed != allowed:
              raise SystemExit(f'unexpected review-fix scope: {sorted(changed)}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add statgpu/panel/_base.py statgpu/panel/_fixed_effects.py \
            dev/tests/test_panel_stage_c_final_review_fixes.py \
            docs/en/models/panel.md docs/cn/models/panel.md
          git commit -m 'fix(panel): close prediction identifiability edge cases'
          git push origin HEAD:agent/panel-p1-stage-c-covariance
