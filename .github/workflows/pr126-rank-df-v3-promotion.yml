name: PR126 Rank-DF V3 Promotion

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - '.github/workflows/pr126-rank-df-v3-promotion.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply v3 immutable source registration
        run: |
          python dev/pr126_promote_rank_df_v3.py
          python dev/pr126_update_v3_catalog_contracts.py
      - name: Confirm historical parsers remain frozen
        run: |
          git diff --exit-code -- \
            dev/benchmarks/frontend_data/parsers/panel_stage_c.py \
            dev/benchmarks/frontend_data/parsers/panel_stage_c_rank_policy.py
      - name: Install benchmark validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest 'jsonschema[format]'
      - name: Run parser and catalog gates before generation
        run: |
          python -m pytest \
            dev/tests/test_panel_stage_c_frontend_source.py \
            dev/tests/test_benchmark_frontend_data.py \
            dev/tests/test_benchmark_catalog.py \
            dev/tests/test_benchmark_inventory_v2.py \
            dev/tests/test_frontend_contracts.py \
            dev/tests/test_frontend_domain_coverage.py \
            -q --tb=short
      - name: Regenerate canonical benchmark assets
        run: |
          python dev/benchmarks/generate_benchmark_data.py \
            --out frontend/public/data/benchmark_data.json \
            --report frontend/public/data/parse_report.json \
            --inventory-out frontend/public/data/source_inventory.json \
            --deterministic --strict-sources
      - name: Validate strict sources and generated assets
        run: |
          python dev/benchmarks/generate_benchmark_data.py --check --strict-sources
          python -m pytest \
            dev/tests/test_panel_stage_c_frontend_source.py \
            dev/tests/test_benchmark_frontend_data.py \
            dev/tests/test_benchmark_catalog.py \
            dev/tests/test_benchmark_inventory_v2.py \
            dev/tests/test_frontend_contracts.py \
            dev/tests/test_frontend_domain_coverage.py \
            -q --tb=short
          git diff --check
      - name: Commit promoted v3 source lineage
        run: |
          rm dev/pr126_promote_rank_df_v3.py
          rm dev/pr126_update_v3_catalog_contracts.py
          rm .github/workflows/pr126-rank-df-v3-promotion.yml
          git config user.name "chatgpt-codex-connector"
          git config user.email "1144995+chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add \
            dev/benchmarks/frontend_data/parsers/panel_stage_c_rank_df.py \
            dev/benchmarks/frontend_data/parsers/__init__.py \
            dev/benchmarks/frontend_data/registry.py \
            dev/benchmarks/frontend_sources.json \
            dev/benchmarks/benchmark_coverage_matrix.json \
            dev/tests/test_panel_stage_c_frontend_source.py \
            dev/tests/test_benchmark_frontend_data.py \
            dev/tests/test_benchmark_catalog.py \
            dev/tests/test_benchmark_inventory_v2.py \
            dev/tests/test_frontend_domain_coverage.py \
            frontend/public/data \
            docs/assets/benchmarks
          git add -u \
            dev/pr126_promote_rank_df_v3.py \
            dev/pr126_update_v3_catalog_contracts.py \
            .github/workflows/pr126-rank-df-v3-promotion.yml
          git commit -m "bench: promote PR126 rank-df P100 evidence"
          git push origin HEAD:agent/panel-p1-stage-c-covariance
