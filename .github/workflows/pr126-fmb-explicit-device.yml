name: PR126 FMB explicit-device review fix

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - .github/workflows/pr126-fmb-explicit-device.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply review fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/cn/panel/fama-macbeth.md')
          text = p.read_text(encoding='utf-8')
          actual = '若显式指定的 GPU backend 不可用，`.fit()` 会直接报错，而不是切换到 CPU。'
          expected = '如果显式请求的 GPU 后端不可用，`.fit()` 会报错，而不会切换到 CPU。'
          if actual not in text:
              raise RuntimeError('Chinese staging anchor not found')
          p.write_text(text.replace(actual, expected, 1), encoding='utf-8')

          helper = Path('dev/validation/pr126_fmb_explicit_device_once.py')
          helper_text = helper.read_text(encoding='utf-8')
          guessed = "marker = '- **Fama-MacBeth exact-period eligibility**'"
          exact = "marker = '- Fixed `FamaMacBeth` period eligibility'"
          if guessed not in helper_text:
              raise RuntimeError('staging helper CHANGELOG marker assignment not found')
          helper.write_text(helper_text.replace(guessed, exact, 1), encoding='utf-8')
          PY
          python dev/validation/pr126_fmb_explicit_device_once.py
      - name: Install maintained CPU/Torch environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation,formula]" pytest
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.0.1" || python -m pip install "torch==2.0.1"
      - name: Run focused Fama-MacBeth contracts
        run: |
          python -m pytest \
            dev/tests/test_panel_pr126_fmb_exact_period.py \
            dev/tests/test_fama_macbeth_review_fixes.py \
            -q --tb=short
          python -m compileall -q statgpu/panel/_fama_macbeth.py dev/benchmarks/validate_fama_macbeth_review_fix_gpu.py
          git diff --check
      - name: Commit substantive fix only
        run: |
          git config user.name "statgpu-review-fix"
          git config user.email "actions@users.noreply.github.com"
          git add \
            statgpu/panel/_fama_macbeth.py \
            dev/tests/test_panel_pr126_fmb_exact_period.py \
            dev/benchmarks/validate_fama_macbeth_review_fix_gpu.py \
            docs/en/panel/fama-macbeth.md \
            docs/cn/panel/fama-macbeth.md \
            CHANGELOG.md
          git commit -m "fix: honor explicit Fama-MacBeth device requests"
          git push origin HEAD:agent/panel-p1-stage-c-covariance
