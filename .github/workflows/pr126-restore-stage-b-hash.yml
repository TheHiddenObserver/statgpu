name: PR126 restore Stage B source hash

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - '.github/workflows/pr126-restore-stage-b-hash.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - name: Restore immutable PR122 SHA-256 contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('dev/tests/test_panel_stage_b_frontend_source.py')
          text = path.read_text(encoding='utf-8')
          bad = '2056f836bfe2a708b3131becca42dbba15e519842c8bafb582000b19f81120bf'
          good = '2056f836bfe2a708b3131becca42dbba15e519762c8bafb582000b19f81120bf'
          if text.count(bad) != 1:
              raise RuntimeError('corrupted PR122 hash not found exactly once')
          path.write_text(text.replace(bad, good, 1), encoding='utf-8')
          PY
          python -m py_compile dev/tests/test_panel_stage_b_frontend_source.py
      - name: Commit repair and self-delete helper
        run: |
          rm .github/workflows/pr126-restore-stage-b-hash.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore immutable PR122 source hash'
          git push origin HEAD:agent/panel-p1-stage-c-covariance
