name: Panel Stage C Torch CPU

on:
  pull_request:
    branches: [master]
    paths:
      - 'statgpu/panel/**'
      - 'dev/tests/test_panel_stage_c_torch_cpu.py'
      - 'dev/tests/test_panel_stage_c_rank_deficient_matrix.py'
      - 'dev/tests/test_panel_stage_c_final_review_fixes.py'
      - '.github/workflows/panel-stage-c-torch-cpu.yml'
  push:
    branches: [master]
    paths:
      - 'statgpu/panel/**'
      - 'dev/tests/test_panel_stage_c_torch_cpu.py'
      - 'dev/tests/test_panel_stage_c_rank_deficient_matrix.py'
      - 'dev/tests/test_panel_stage_c_final_review_fixes.py'
      - '.github/workflows/panel-stage-c-torch-cpu.yml'

permissions:
  contents: read

jobs:
  torch-2-0-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install maintained Torch CPU environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" pytest
          python -m pip install "torch==2.0.1+cpu" --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Confirm maintained Torch version
        run: |
          python - <<'PY'
          import torch
          assert torch.__version__.startswith('2.0.1')
          assert not torch.cuda.is_available()
          print('torch', torch.__version__, 'device=cpu')
          PY
      - name: Run Stage C Torch CPU covariance parity
        run: |
          python -m pytest \
            dev/tests/test_panel_stage_c_torch_cpu.py \
            dev/tests/test_panel_stage_c_rank_deficient_matrix.py \
            dev/tests/test_panel_stage_c_final_review_fixes.py \
            -q --tb=short
