name: PR126 rank-policy canonical promotion retry

on:
  push:
    branches: [agent/panel-p1-stage-c-covariance]
    paths:
      - '.github/workflows/pr126-rank-policy-promote-retry.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Reuse reviewed promotion patch exactly
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/pr126-rank-policy-promote.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(workflow) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          block = workflow[start:end]
          indent = min(len(line) - len(line.lstrip()) for line in block if line.strip())
          code = '\n'.join(line[indent:] for line in block) + '\n'
          Path('/tmp/pr126_promote_patch.py').write_text(code, encoding='utf-8')
          PY
          python /tmp/pr126_promote_patch.py
      - name: Validate and regenerate canonical benchmark bundle
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e . pytest 'jsonschema[format]'
          python dev/benchmarks/generate_benchmark_data.py \
            --out frontend/public/data/benchmark_data.json \
            --report frontend/public/data/parse_report.json \
            --inventory-out frontend/public/data/source_inventory.json \
            --deterministic --strict-sources
          python -m pytest \
            dev/tests/test_panel_stage_c_frontend_source.py \
            dev/tests/test_benchmark_frontend_data.py \
            dev/tests/test_benchmark_catalog.py \
            dev/tests/test_benchmark_inventory_v2.py \
            dev/tests/test_frontend_domain_coverage.py -q
          python dev/benchmarks/generate_benchmark_data.py --check --strict-sources
          git diff --check
      - name: Build benchmark frontend
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npm ci
          npm run typecheck
          npm run build
      - name: Enforce exact-source applicability and commit promotion
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git diff --name-only 3dc7df19176f8fb881a8d37e9d75b4f75e71b058 -- 'statgpu/panel/**' 'dev/benchmarks/validate_panel_stage_c_gpu.py' 'dev/benchmarks/benchmark_panel_stage_c_covariance.py')"
          if [ -n "$forbidden" ]; then
            echo "Promotion changed numerical source or physical runners:" >&2
            printf '%s\n' "$forbidden" >&2
            exit 1
          fi
          rm -f .github/workflows/pr126-rank-policy-raw-audit.yml
          rm -f .github/workflows/pr126-rank-policy-promote.yml
          rm -f .github/workflows/pr126-rank-policy-promote-retry.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "benchmark: promote PR126 rank-policy P100 evidence"
          git push origin HEAD:agent/panel-p1-stage-c-covariance
