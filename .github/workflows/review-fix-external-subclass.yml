name: Review fix external subclass

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply-external-subclass-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply external subclass fix
        run: python .github/review_fix_external_subclass.py
      - name: Install validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[validation,formula]' pytest packaging
      - name: Run estimator type and compatibility gates
        run: |
          python -m pytest -q --tb=short \
            dev/tests/test_maintenance_024_025.py::test_current_sklearn_classifier_and_regressor_tags \
            dev/tests/test_legacy_sklearn_integration.py \
            dev/tests/test_second_full_review.py::TestEstimatorCloneAndFeatureSelectionBackend::test_all_default_public_estimators_clone
      - name: Commit external subclass fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add statgpu/_base.py dev/tests/test_maintenance_024_025.py
          git commit -m 'fix: preserve estimator type for external subclasses'
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
