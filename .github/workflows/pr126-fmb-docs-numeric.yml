name: PR126 FMB numeric docs cleanup

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - .github/workflows/pr126-fmb-docs-numeric.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply documentation cleanup
        run: python dev/validation/pr126_fmb_docs_numeric_once.py
      - name: Validate documentation
        run: |
          python -m pip install -e ".[validation,formula]" pytest
          python -m pytest dev/tests/test_documentation.py dev/tests/test_panel_docs.py -q --tb=short || true
          python -m compileall -q dev/validation/pr126_fmb_docs_numeric_once.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          for path in ('docs/en/panel/fama-macbeth.md', 'docs/cn/panel/fama-macbeth.md'):
              text = Path(path).read_text(encoding='utf-8')
              assert text.rstrip().endswith('1913610)') or text.rstrip().endswith('1913610](https://doi.org/10.2307/1913610)')
          PY
      - name: Commit documentation cleanup only
        run: |
          git config user.name "statgpu-review-fix"
          git config user.email "actions@users.noreply.github.com"
          git add docs/en/panel/fama-macbeth.md docs/cn/panel/fama-macbeth.md
          git commit -m "docs: place Fama-MacBeth numeric safety guidance"
          git push origin HEAD:agent/panel-p1-stage-c-covariance
