name: PR126 solver contract test fix once

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - .github/workflows/pr126-solver-contract-test-fix.yml

permissions:
  contents: write

jobs:
  fix-test-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply stale test-contract fix
        run: python dev/validation/pr126_solver_contract_test_fix_once.py

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation,formula]"

      - name: Run focused review gates
        run: |
          python -m pytest -q dev/tests/test_panel_stage_c_edge_contracts.py
          python -m pytest -q dev/tests/test_panel_stage_c_full_rank_conditioning.py
          python -m pytest -q dev/tests/test_panel_stage_c_inference_guard.py
          git diff --check

      - name: Commit test-contract fix and remove staging helpers
        run: |
          rm .github/workflows/pr126-solver-contract-test-fix.yml
          rm dev/validation/pr126_solver_contract_test_fix_once.py
          git config user.name "statgpu-review-fix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "test: align panel solver contract with stable SVD policy"
          git push origin HEAD:agent/panel-p1-stage-c-covariance
