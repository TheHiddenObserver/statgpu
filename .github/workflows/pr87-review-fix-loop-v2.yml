name: PR87 review fix batch v2

on:
  push:
    branches: [agent/maintenance-0.2.4-0.2.5]
    paths:
      - .github/workflows/pr87-review-fix-loop-v2.yml

permissions:
  contents: write

jobs:
  apply-review-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reapply reviewed patch and repair test/workflow contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          bootstrap = Path('.github/workflows/pr87-review-fix-loop.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          start = bootstrap.index(start_marker) + len(start_marker)
          end = bootstrap.index("\n          PY\n", start)
          patch_program = textwrap.dedent(bootstrap[start:end])
          exec(compile(patch_program, '<pr87-bootstrap>', 'exec'), {})

          def replace_once(path, old, new):
              path = Path(path)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise RuntimeError(f'patch anchor not found in {path}: {old!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'dev/tests/test_core_contracts.py',
              '''    assert parent.set_params(child__value=7) is parent\n    assert child.value == 7\n    assert parent.get_params(deep=True)["child__value"] == 7\n''',
              '''    assert parent.set_params(child__value=7) is parent\n    assert child.value == 1\n    assert parent.child is not child\n    assert parent.get_params(deep=True)["child__value"] == 7\n''',
          )

          replace_once(
              'dev/tests/test_maintenance_024_025.py',
              '        assert np.isfinite(np.asarray(model.coef_)).all()\n',
              '        assert np.isfinite(np.asarray(_to_numpy(model.coef_))).all()\n',
          )

          matrix_expression = '$' + '{{ matrix.sklearn_spec }}'
          workflow = textwrap.dedent('''\
          name: Maintenance compatibility

          on:
            push:
              branches: [master]
            pull_request:
              branches: [master]

          permissions:
            contents: read

          jobs:
            sklearn-compatibility:
              runs-on: ubuntu-latest
              strategy:
                fail-fast: false
                matrix:
                  sklearn_spec:
                    - scikit-learn==1.2.2
                    - scikit-learn==1.3.2
                    - scikit-learn
              steps:
                - uses: actions/checkout@v4

                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.11"

                - name: Install compatibility environment
                  run: |
                    python -m pip install --upgrade pip
                    python -m pip install "numpy<2" scipy pytest packaging pandas patsy "__SKLEARN_SPEC__"
                    python -m pip install -e . --no-deps

                - name: Run maintenance regressions
                  run: |
                    python -m pytest \\
                      dev/tests/test_maintenance_024_025.py \\
                      dev/tests/test_legacy_sklearn_integration.py \\
                      dev/tests/test_second_full_review.py::TestEstimatorCloneAndFeatureSelectionBackend::test_all_default_public_estimators_clone \\
                      -q --tb=short
          ''').replace('__SKLEARN_SPEC__', matrix_expression)
          Path('.github/workflows/maintenance-compatibility.yml').write_text(workflow, encoding='utf-8')

          # Validate generated Python and YAML-adjacent invariants before pytest.
          compile(Path('dev/benchmarks/benchmark_torch_compile_maintenance.py').read_text(encoding='utf-8'),
                  'benchmark_torch_compile_maintenance.py', 'exec')
          compatibility = Path('.github/workflows/maintenance-compatibility.yml').read_text(encoding='utf-8')
          assert 'matrix.sklearn_spec' in compatibility
          assert 'matrix.sklearn-spec' not in compatibility
          assert '""' not in compatibility
          PY

      - name: Install targeted validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" scipy pytest packaging "scikit-learn==1.3.2" pandas patsy joblib
          python -m pip install -e . --no-deps

      - name: Run targeted CPU review-fix tests
        run: |
          python -m pytest \
            dev/tests/test_maintenance_024_025.py \
            dev/tests/test_core_contracts.py::test_set_params_rejects_unknown_and_supports_nested_estimators \
            -q --tb=short

      - name: Remove temporary workflows, commit, and push
        shell: bash
        run: |
          rm .github/workflows/pr87-review-fix-loop.yml
          rm .github/workflows/pr87-review-fix-loop-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: address PR87 independent review findings"
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
