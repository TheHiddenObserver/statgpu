name: Review fix finite refresh

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply finite validation refresh
        run: python .github/review_fix_finite_refresh.py
      - name: Install validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[validation,formula]'
      - name: Run finite and compatibility gates
        run: |
          python -m pytest -q --tb=short \
            dev/tests/test_maintenance_024_025.py \
            dev/tests/test_panel_formula.py \
            dev/tests/test_ridge_weighted_consistency.py \
            dev/tests/test_legacy_sklearn_integration.py \
            dev/tests/test_pr80_group_input_contract.py
      - name: Run structural audit
        run: python .github/review_audit_round1.py
      - name: Commit finite refresh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add statgpu/_base.py statgpu/__init__.py statgpu/feature_selection/_knockoff.py dev/tests/test_maintenance_024_025.py
          git commit -m 'fix: refresh public finite validation guards'
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
