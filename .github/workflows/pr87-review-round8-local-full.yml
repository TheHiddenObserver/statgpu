name: PR87 review round 8 local full

on:
  push:
    branches: [agent/maintenance-0.2.4-0.2.5]
    paths: [.github/workflows/pr87-review-round8-local-full.yml]

permissions:
  contents: write

jobs:
  local-full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Close documentation and reset-state findings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one anchor, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'statgpu/linear_model/wrappers/_logistic.py',
              '''            "_accuracy_gpu",\n            "converged_",\n''',
              '''            "_accuracy_gpu",\n            "_accuracy",\n            "converged_",\n''',
          )
          replace_once(
              'statgpu/glm_core/_irls.py',
              '''    penalty_matrix : array, optional\n        Additional penalty matrix to add to the normal equations.\n        Shape must be (n_features, n_features). When provided, the\n        normal equations become: X'WX + ridge_alpha*I + penalty_matrix.\n''',
              '''    penalty_matrix : array, optional\n        Real, finite, symmetric positive-semidefinite quadratic penalty\n        with shape ``(n_features, n_features)``. When provided, the normal\n        equations become ``X'WX + ridge_alpha*I + penalty_matrix`` and the\n        line-search objective includes ``0.5 * beta' penalty_matrix beta``.\n''',
          )

          en = Path('docs/en/changelog.md')
          en_text = en.read_text(encoding='utf-8')
          en_anchor = '# Changelog\n\n'
          en_bullets = (
              '- Completed the code-review fix cycle for scalar GLM runtime contracts: '
              'direct LogisticRegression now validates strict 0/1 labels and fit controls, '
              'clears stale refit state, reports non-convergence, and preserves analytic-weight '
              'behavior across NumPy, CuPy, and Torch.\n\n'
              '- Corrected arbitrary-link Binomial IRLS, backend-native warm starts, and '
              'quadratic-penalty validation; penalized CV now permits only explicit numerical '
              'fallbacks and reports generic scoring or solver-estimated Lipschitz paths.\n\n'
          )
          if en_anchor not in en_text:
              raise RuntimeError('English changelog anchor missing')
          en_text = en_text.replace(en_anchor, en_anchor + en_bullets, 1)
          en_text = en_text.replace('Last updated: 2026-08-05', 'Last updated: 2026-08-06', 1)
          en.write_text(en_text, encoding='utf-8')

          cn = Path('docs/cn/changelog.md')
          cn_text = cn.read_text(encoding='utf-8')
          cn_anchor = '# Changelog\n\n'
          cn_bullets = (
              '- 完成标量 GLM 运行时契约的 code-review 修复循环：直接 LogisticRegression '
              '现在严格验证 0/1 标签与拟合控制参数，失败重拟合会清除旧状态，未收敛会显式告警，'
              '并在 NumPy、CuPy 与 Torch 上保持一致的解析权重语义。\n\n'
              '- 修正任意 link 的 Binomial IRLS、后端原生 warm start 与二次惩罚矩阵校验；'
              '惩罚 CV 仅允许明确的数值降级，并对 generic scoring 或 solver 自估 Lipschitz 路径给出可见告警。\n\n'
          )
          if cn_anchor not in cn_text:
              raise RuntimeError('Chinese changelog anchor missing')
          cn_text = cn_text.replace(cn_anchor, cn_anchor + cn_bullets, 1)
          cn_text = cn_text.replace('最后更新：2026-08-05', '最后更新：2026-08-06', 1)
          cn.write_text(cn_text, encoding='utf-8')

          test_path = Path('dev/tests/test_pr87_code_review_fix_cycle.py')
          text = test_path.read_text(encoding='utf-8')
          text = text.replace(
              '''    assert model._y is None\n    with pytest.raises(RuntimeError, match="fitted"):\n''',
              '''    assert model._y is None\n    assert model._accuracy is None\n    with pytest.raises(RuntimeError, match="fitted"):\n''',
              1,
          )
          text += '''\n\ndef test_logistic_failed_refit_clears_gpu_accuracy_shadow():\n    model, X, _ = _fitted_logistic_fixture()\n    model._accuracy = 0.875\n    with pytest.raises(ValueError, match="binary y"):\n        model.fit(X, np.array([0.0, 0.0, 0.5, 1.0, 1.0, 1.0]))\n    assert model._accuracy is None\n'''
          test_path.write_text(text, encoding='utf-8')
          PY
      - name: Install full validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation,formula]"
          python -m pip install ruff
      - name: Run complete CPU test tree
        run: python -m pytest dev/tests -q --tb=short
      - name: Run documentation contracts
        shell: bash
        run: |
          python dev/validation/fix_docs_links.py --check
          python dev/validation/check_docs_contracts.py
      - name: Run compile and high-signal static gates
        shell: bash
        run: |
          python -m compileall -q statgpu dev/validation dev/benchmarks
          ruff check \
            statgpu/_base.py \
            statgpu/glm_core/_irls.py \
            statgpu/glm_core/_family.py \
            statgpu/glm_core/_validation.py \
            statgpu/linear_model/wrappers/_logistic.py \
            statgpu/linear_model/penalized/_penalized_cv.py \
            --select F821,E9,F63,F7,F82
          git diff --check
          python -m pytest --collect-only -q >/dev/null
      - name: Commit local-full validated closure and self-delete
        shell: bash
        run: |
          rm .github/workflows/pr87-review-round8-local-full.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add statgpu dev/tests docs .github/workflows/pr87-review-round8-local-full.yml
          git commit -m "fix: close PR87 local review gates"
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
