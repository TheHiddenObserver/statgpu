name: PR126 projected-risk backend coverage

on:
  push:
    branches: [agent/panel-p1-stage-c-covariance]

permissions:
  contents: write

jobs:
  apply-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install focused validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" pytest
          python -m pip install "torch==2.0.1+cpu" --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Apply projected-risk backend coverage
        run: python dev/validation/pr126_projection_risk_coverage.py
      - name: Run targeted backend and physical-runner checks
        run: |
          python -m pytest \
            dev/tests/test_panel_two_way_demean_scale.py \
            dev/tests/test_panel_stage_c_torch_cpu.py \
            dev/tests/test_panel_stage_c_physical_runner_contract.py \
            -q --tb=short
          python -m compileall -q statgpu dev/benchmarks dev/tests
          git diff --check
      - name: Remove temporary review scaffolding
        run: |
          rm dev/validation/pr126_projection_risk_coverage.py
          rm .github/workflows/pr126-projection-risk-review.yml
          git diff --check
      - name: Commit validated coverage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "test: cover projection-created panel reduction risk"
          git push origin HEAD:agent/panel-p1-stage-c-covariance
