name: PR126 covariance restore review

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  apply-validate-commit:
    if: github.event.pull_request.number == 126
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install maintained Torch CPU environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" pytest
          python -m pip install "torch==2.0.1+cpu" --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Apply covariance restore fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('dev/validation/pr126_fix_covariance_restore_product.py')
          text = p.read_text(encoding='utf-8')
          old = '''    return xp.ldexp(mantissa, exponent)\\n\\n\\ndef _restore_coordinate_covariance'''
          new = '''    zero = mantissa == 0.0\\n    underflow = exponent < -1073\\n    overflow = exponent > 1024\\n    if getattr(xp, "__name__", "") == "torch":\\n        safe_exponent = xp.clamp(exponent, min=-1073, max=1024)\\n        pow_fn = xp.pow\\n    else:\\n        safe_exponent = xp.clip(exponent, -1073, 1024)\\n        pow_fn = xp.power\\n    first_exponent = safe_exponent // 2\\n    second_exponent = safe_exponent - first_exponent\\n    base = xp.full_like(mantissa, 2.0)\\n    result = mantissa * pow_fn(base, first_exponent)\\n    result = result * pow_fn(base, second_exponent)\\n    result = xp.where(zero | underflow, xp.zeros_like(result), result)\\n    infinity = xp.full_like(result, float("inf"))\\n    signed_infinity = xp.where(mantissa < 0.0, -infinity, infinity)\\n    return xp.where(overflow & (~zero), signed_infinity, result)\\n\\n\\ndef _restore_coordinate_covariance'''
          if old not in text:
              raise SystemExit('ldexp staging anchor not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python dev/validation/pr126_fix_covariance_restore_product.py
      - name: Run targeted review gates
        run: |
          python -m pytest \
            dev/tests/test_panel_stage_c_covariance.py \
            dev/tests/test_panel_stage_b_torch_cpu.py \
            dev/tests/test_panel_stage_c_final_review_fixes.py \
            dev/tests/test_panel_stage_c_physical_runner_contract.py \
            -q --tb=short
          python -m compileall -q statgpu dev/benchmarks dev/tests
          git diff --check
      - name: Remove temporary review scaffolding
        run: |
          rm -f dev/validation/pr126_fix_covariance_restore_product.py
          rm -f .github/workflows/pr126-covariance-restore-review.yml
          git diff --check
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: restore covariance scales without transient range loss"
          git push origin HEAD:agent/panel-p1-stage-c-covariance
