name: Review infrastructure cleanup

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-0.2.4-0.2.5
          fetch-depth: 0
      - name: Remove temporary review infrastructure
        run: |
          git rm -f --ignore-unmatch \
            .github/review_audit_round1.py \
            .github/review_constructor_map.py \
            .github/review_fix_constructor_contract.py \
            .github/review_fix_constructor_contract_v2.py \
            .github/review_fix_constructor_contract_v3.py \
            .github/review_fix_constructor_contract_v4.py \
            .github/review_fix_constructor_regressions.py \
            .github/review_fix_constructor_regressions_minimal.py \
            .github/review_fix_constructor_regressions_v2.py \
            .github/review_fix_constructor_regressions_v3.py \
            .github/review_fix_finite_refresh.py \
            .github/review_fix_round1.py \
            .github/review_fix_round1_v2.py \
            .github/workflows/review-audit-round1.yml \
            .github/workflows/review-constructor-map.yml \
            .github/workflows/review-fix-finite-refresh.yml \
            .github/workflows/review-cleanup.yml
          git diff --check
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'chore: remove temporary review infrastructure'
          git push origin HEAD:agent/maintenance-0.2.4-0.2.5
