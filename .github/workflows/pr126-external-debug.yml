name: PR126 estimator external debug

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance
    paths:
      - '.github/workflows/pr126-external-debug.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . 'linearmodels==7.0' 'statsmodels==0.14.6' pytest
      - name: Run cases and record output
        run: |
          python - <<'PY'
          import json, subprocess
          tests = [
              'test_pooled_dk_estimator_matches_linearmodels_full_integration',
              'test_pooled_group_debiased_cluster_estimator_matches_linearmodels',
              'test_one_way_panel_dk_matches_linearmodels_effect_df_integration',
              'test_two_way_panel_dk_matches_linearmodels_effect_df_integration',
          ]
          out = {}
          for name in tests:
              p = subprocess.run(
                  ['python','-m','pytest',f'dev/tests/test_panel_stage_c_linearmodels_estimators.py::{name}','-q','--tb=long'],
                  text=True, capture_output=True,
              )
              out[name] = {
                  'returncode': p.returncode,
                  'stdout_tail': p.stdout[-12000:],
                  'stderr_tail': p.stderr[-4000:],
              }
          with open('dev/reviews/pr126_external_debug.json','w',encoding='utf-8') as f:
              json.dump(out,f,indent=2)
              f.write('\n')
          PY
      - name: Commit debug output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dev/reviews/pr126_external_debug.json
          git commit -m 'ci: record PR126 external debug output'
          git push origin HEAD:agent/panel-p1-stage-c-covariance
