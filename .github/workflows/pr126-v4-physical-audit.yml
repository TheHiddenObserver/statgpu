name: PR126 v4 physical evidence audit

on:
  push:
    branches: [agent/panel-p1-stage-c-covariance]
    paths:
      - 'dev/pr126_v4_physical_audit.py'
      - '.github/workflows/pr126-v4-physical-audit.yml'

permissions:
  contents: write

jobs:
  physical-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - name: Audit exact physical artifacts
        run: python dev/pr126_v4_physical_audit.py
      - name: Static audit helper check
        run: |
          python -m py_compile dev/pr126_v4_physical_audit.py
          git diff --check
      - name: Remove temporary audit helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr126-v4-physical-audit.yml dev/pr126_v4_physical_audit.py
          git diff --cached --check
          git commit -m 'chore: complete PR126 v4 physical evidence audit'
          git push origin HEAD:agent/panel-p1-stage-c-covariance
