name: PR126 signed component reduction fix

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

# This staging-only workflow applies the reviewed production patch, validates the
# order-sensitive Torch 2.0 path twice, and removes itself before the final commit.
jobs:
  apply-validate-commit:
    if: github.event.pull_request.number == 126
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-c-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install maintained Torch CPU environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" pytest
          python -m pip install "torch==2.0.1+cpu" --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Apply sign-separated component reduction fix
        run: python dev/validation/pr126_signed_component_fix.py
      - name: Run order-sensitive and Stage-C regressions
        run: |
          python -m pytest dev/tests/test_panel_stage_b_torch_cpu.py -q --tb=short
          python -m pytest dev/tests/test_panel_stage_b_torch_cpu.py -q --tb=short
          python -m pytest \
            dev/tests/test_panel_stage_c_edge_contracts.py \
            dev/tests/test_panel_stage_c_torch_cpu.py \
            dev/tests/test_panel_stage_c_covariance.py \
            dev/tests/test_panel_stage_c_physical_runner_contract.py \
            -q --tb=short
          python -m compileall -q statgpu dev/benchmarks dev/tests
          git diff --check
      - name: Remove temporary review diagnostics and workflows
        run: |
          rm -f dev/validation/pr126_signed_component_fix.py
          rm -f .github/workflows/pr126-signed-component-fix.yml
          rm -f .github/workflows/pr126-third-tier-order-diagnostic.yml
          rm -f dev/validation/results/pr126_third_tier_torch_diagnostic.txt
          rm -f dev/validation/results/pr126_third_tier_order_diagnostic.txt
          rmdir dev/validation/results 2>/dev/null || true
          git diff --check
      - name: Commit validated production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: stabilize signed two-way component reductions"
          git push origin HEAD:agent/panel-p1-stage-c-covariance
