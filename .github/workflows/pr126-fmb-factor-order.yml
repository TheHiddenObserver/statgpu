name: PR126 FMB factor-order review gate

on:
  push:
    branches:
      - agent/panel-p1-stage-c-covariance

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Apply review fix
        run: python dev/validation/pr126_fmb_factor_order_once.py
      - name: Install maintained focused environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" scipy pandas patsy pytest
          python -m pip install "torch==2.0.1+cpu" --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Run focused numerical and inference contracts
        run: |
          python -m pytest \
            dev/tests/test_fama_macbeth_batched_solver.py \
            dev/tests/test_fama_macbeth_review_fixes.py \
            dev/tests/test_fama_macbeth_inference_matrix.py \
            dev/tests/test_panel_stage_b_fit_statistics.py \
            dev/tests/test_panel_stage_c_full_rank_conditioning.py \
            -q --tb=short
          python -m py_compile statgpu/panel/_linalg.py statgpu/panel/_fama_macbeth.py dev/benchmarks/validate_fama_macbeth_review_fix_gpu.py
          git diff --check
      - name: Commit substantive review fix only
        run: |
          git config user.name "Ziqian Lin"
          git config user.email "51812297+TheHiddenObserver@users.noreply.github.com"
          git add \
            statgpu/panel/_linalg.py \
            statgpu/panel/_fama_macbeth.py \
            dev/tests/test_fama_macbeth_batched_solver.py \
            dev/tests/test_fama_macbeth_review_fixes.py \
            dev/benchmarks/validate_fama_macbeth_review_fix_gpu.py
          if git diff --cached --quiet; then
            echo "No substantive changes to commit"
          else
            git commit -m "fix: stabilize panel factor ordering"
            git push origin HEAD:agent/panel-p1-stage-c-covariance
          fi
