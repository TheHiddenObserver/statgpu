name: PR122 Pending Changelog Sync V3

on:
  push:
    branches:
      - agent/panel-p1-stage-b-diagnostics
    paths:
      - .github/workflows/pr122-sync-pending-changelog-v3.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panel-p1-stage-b-diagnostics
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update EN/CN changelog status
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          updates = {
              "docs/en/changelog.md": {
                  "> Last updated: 2026-08-08<br>": "> Last updated: 2026-08-09<br>",
                  "- Added `dev/benchmarks/validate_panel_stage_b_gpu.py` as the exact-head physical correctness/provenance gate.": "- Added `dev/benchmarks/validate_panel_stage_b_gpu.py` as the exact-head physical correctness/provenance gate. The previously accepted P100 artifacts at numerical implementation `a57efcea29b0e87ecb89865c5a6902d5773812c6` remain immutable historical evidence: CuPy and Torch each passed all 17 estimator cases with requested-backend provenance and no fallback, while the focused disconnected two-way FE artifact validated the df=1 inference boundary to machine precision. The four Hausman parameterizations per backend in that run were all correctly structured `applicable=false` cases, so they validate applicability/reason parity but do not physically exercise an applicable Hausman statistic/p-value/df path.",
                  "- Promoted the exact-head raw artifact `results/pr122_p100/panel_stage_b_gpu_validation_faa95ce7.json`": "- A Ready-for-review audit reopened the physical gate for that coverage gap. The current runner adds a deterministic 48-observation, one-slope, nonzero-entity-effect fitted FE/RE fixture that is stably Hausman-applicable on the hosted NumPy reference and requires each CuPy/Torch physical backend to match FE/RE coefficients, diagnostic covariance, Hausman statistic, p-value, and df. The historical `panel_stage_b_pr122_p100_20260809.json` remains an immutable 42-row record of the earlier run; final PR #122 acceptance now requires a fresh exact-head P100 run followed by a new 44-row canonical source and regenerated frontend assets. Current hard exit: `PARTIAL_REMOTE_PENDING`.",
              },
              "docs/cn/changelog.md": {
                  "> 最后更新：2026-08-08<br>": "> 最后更新：2026-08-09<br>",
                  "- 新增 `dev/benchmarks/validate_panel_stage_b_gpu.py` 作为 exact-head physical correctness/provenance gate。": "- 新增 `dev/benchmarks/validate_panel_stage_b_gpu.py` 作为 exact-head physical correctness/provenance gate。此前在数值实现 `a57efcea29b0e87ecb89865c5a6902d5773812c6` 上接受的 P100 artifact 继续作为不可变的历史证据保留：CuPy 与 Torch 各自通过全部 17 个 estimator case，requested/executed backend 一致且无 fallback；focused disconnected two-way FE artifact 也把 df=1 inference boundary 验证到机器精度。该运行中每个 backend 的 4 个 Hausman parameterization 都是正确的结构化 `applicable=false` case，因此它们验证了 applicability/reason parity，但没有在物理 GPU 上执行 applicable Hausman 的 statistic/p-value/df 路径。",
                  "- 已将 exact-head raw artifact `results/pr122_p100/panel_stage_b_gpu_validation_faa95ce7.json`": "- Ready-for-review 审计因此重新打开 physical gate。当前 runner 新增一个确定性的 48-observation、one-slope、nonzero-entity-effect fitted FE/RE fixture；它在 hosted NumPy reference 上稳定为 Hausman applicable，并要求每个 CuPy/Torch 物理 backend 对 FE/RE coefficient、diagnostic covariance、Hausman statistic、p-value 和 df 与 NumPy 做一致性验证。历史 `panel_stage_b_pr122_p100_20260809.json` 继续作为此前运行的不可变 42-row 记录；PR #122 的最终接受现在要求新的 exact-head P100 run，随后生成新的 44-row canonical source 并刷新 frontend assets。当前 hard exit：`PARTIAL_REMOTE_PENDING`。",
              },
          }

          for filename, replacements in updates.items():
              path = Path(filename)
              lines = path.read_text(encoding="utf-8").splitlines()
              used = {key: False for key in replacements}
              out = []
              for line in lines:
                  replaced = False
                  for prefix, new_line in replacements.items():
                      if line.startswith(prefix):
                          out.append(new_line)
                          used[prefix] = True
                          replaced = True
                          break
                  if not replaced:
                      out.append(line)
              missing = [key for key, seen in used.items() if not seen]
              if missing:
                  raise RuntimeError(f"{filename}: replacement anchors not found: {missing}")
              path.write_text("\n".join(out) + "\n", encoding="utf-8")
          PY
      - name: Validate changelog diff
        run: |
          git diff --check
          git diff -- docs/en/changelog.md docs/cn/changelog.md
      - name: Commit changelog sync and remove temporary workflows
        run: |
          rm .github/workflows/pr122-sync-pending-changelog.yml
          rm .github/workflows/pr122-sync-pending-changelog-v2.yml
          rm .github/workflows/pr122-sync-pending-changelog-v3.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: mark PR122 applicable Hausman physical gate pending'
          git push origin HEAD:agent/panel-p1-stage-b-diagnostics
